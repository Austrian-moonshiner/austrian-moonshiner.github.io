<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tower Defense</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 20% 20%, #173b55 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #321750 0%, transparent 35%),
        #080d16;

    overflow-x: hidden;
}

/* =========================
   HEADER
========================= */

header {
    text-align: center;
    padding: 18px 10px 8px;
}

header h1 {
    margin: 0;
    font-size: clamp(28px, 6vw, 46px);
    letter-spacing: 3px;

    background: linear-gradient(
        90deg,
        #00eaff,
        #ffffff,
        #8d7aff
    );

    -webkit-background-clip: text;
    color: transparent;

    text-shadow: 0 0 25px rgba(0,220,255,.35);
}

header p {
    margin: 5px 0 0;
    color: #8fa8bd;
}

/* =========================
   STATUS
========================= */

#status {
    width: min(1100px, 95vw);
    margin: 12px auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.stat {
    padding: 12px;

    background: rgba(20,31,48,.85);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.25),
        inset 0 0 20px rgba(255,255,255,.02);

    text-align: center;
}

.stat-icon {
    font-size: 21px;
}

.stat-value {
    display: block;
    margin-top: 3px;
    font-size: 20px;
    font-weight: bold;
}

/* =========================
   GAME AREA
========================= */

#gameWrapper {
    width: min(1100px, 95vw);
    margin: 15px auto;
}

#game {
    position: relative;

    width: 100%;
    aspect-ratio: 16 / 9;

    min-height: 430px;

    overflow: hidden;

    border-radius: 22px;
    border: 2px solid #1bdcff;

    background:
        radial-gradient(
            circle at 50% 50%,
            #132f31,
            #0a171e
        );

    box-shadow:
        0 0 35px rgba(0,220,255,.15),
        inset 0 0 60px rgba(0,0,0,.5);
}

/* Grid */

#game::before {
    content: "";

    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(0,220,255,.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,220,255,.055) 1px,
            transparent 1px
        );

    background-size: 35px 35px;

    pointer-events: none;
}

/* =========================
   SVG WEG
========================= */

#map {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

/*
   EIN einziger Pfad.

   Start links unten
   → rechts
   → oben
   → links
   → unten
   → rechts zum Ziel
*/

#roadOuter {
    fill: none;
    stroke: #05080d;
    stroke-width: 92;
    stroke-linecap: round;
    stroke-linejoin: round;
}

#road {
    fill: none;
    stroke: #53606a;
    stroke-width: 76;
    stroke-linecap: round;
    stroke-linejoin: round;
}

#roadInner {
    fill: none;
    stroke: #65727b;
    stroke-width: 4;
    stroke-dasharray: 14 12;
    stroke-linecap: round;
}

/* =========================
   START / ZIEL
========================= */

.marker {
    position: absolute;

    padding: 9px 14px;

    border-radius: 12px;

    font-weight: bold;
    font-size: 14px;

    backdrop-filter: blur(8px);

    z-index: 20;
}

#startMarker {
    left: 8px;
    bottom: 15%;
    background: rgba(0,190,100,.85);
    border: 1px solid #35ff9a;
    box-shadow: 0 0 18px rgba(0,255,140,.3);
}

#finishMarker {
    right: 8px;
    top: 15%;
    background: rgba(220,30,60,.85);
    border: 1px solid #ff6680;
    box-shadow: 0 0 18px rgba(255,30,70,.3);
}

/* =========================
   ENEMY
========================= */

.enemy {
    position: absolute;

    width: 32px;
    height: 32px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffb1b1,
            #ff263d 45%,
            #760014
        );

    border: 2px solid #ffb4bc;

    box-shadow:
        0 0 16px rgba(255,30,60,.8);

    z-index: 15;
}

.enemy.fast {
    width: 27px;
    height: 27px;

    background:
        radial-gradient(
            circle,
            #fff59a,
            #ff9d00 50%,
            #9c3900
        );

    box-shadow:
        0 0 16px rgba(255,170,0,.8);
}

.enemy.tank {
    width: 43px;
    height: 43px;

    background:
        radial-gradient(
            circle at 30% 25%,
            #e8caff,
            #8b3dff 50%,
            #360078
        );

    border-color: #dcbcff;

    box-shadow:
        0 0 20px rgba(145,60,255,.8);
}

.enemyBoss {
    width: 58px;
    height: 58px;

    background:
        radial-gradient(
            circle,
            #ffffff,
            #ff4081 35%,
            #7b003c
        );

    box-shadow:
        0 0 30px #ff4081;
}

/* Lebensbalken */

.hp {
    position: absolute;

    width: 48px;
    height: 5px;

    top: -10px;
    left: 50%;

    transform: translateX(-50%);

    background: #111;

    border-radius: 5px;

    overflow: hidden;
}

.hpBar {
    height: 100%;
    width: 100%;

    background: #21ff75;
}

/* =========================
   TOWER
========================= */

.tower {
    position: absolute;

    width: 58px;
    height: 58px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;

    cursor: pointer;

    z-index: 25;

    border: 3px solid white;

    transition: .15s;
}

.tower:hover {
    transform:
        translate(-50%, -50%)
        scale(1.08);
}

.tower.selected {
    box-shadow:
        0 0 0 3px #fff200,
        0 0 25px #fff200;
}

/* Tower Arten */

.tower.basic {
    background:
        radial-gradient(circle, #65f7ff, #006eff);
    box-shadow:
        0 0 18px #00cfff;
}

.tower.rapid {
    background:
        radial-gradient(circle, #a6ff9a, #00a83b);
    box-shadow:
        0 0 18px #00ff73;
}

.tower.sniper {
    background:
        radial-gradient(circle, #ff9b9b, #d00028);
    box-shadow:
        0 0 18px #ff1744;
}

.tower.cannon {
    background:
        radial-gradient(circle, #ffc46b, #ff6d00);
    box-shadow:
        0 0 18px #ff7600;
}

/* =========================
   REICHWEITE
========================= */

.range {
    position: absolute;

    transform: translate(-50%, -50%);

    border: 2px solid rgba(255,235,0,.45);

    background: rgba(255,235,0,.06);

    border-radius: 50%;

    pointer-events: none;

    z-index: 5;
}

/* =========================
   GESCHOSS
========================= */

.bullet {
    position: absolute;

    width: 9px;
    height: 9px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 8px #00eaff,
        0 0 15px #00eaff;

    z-index: 30;
}

/* =========================
   SHOP
========================= */

#shop {
    width: min(1100px, 95vw);

    margin: 12px auto;

    padding: 14px;

    background: rgba(15,24,38,.9);

    border: 1px solid rgba(255,255,255,.1);

    border-radius: 18px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.3);
}

.shopTitle {
    margin-bottom: 10px;

    color: #9db4c8;
    font-size: 14px;
    font-weight: bold;
}

.shopButtons {
    display: flex;

    justify-content: center;
    flex-wrap: wrap;

    gap: 10px;
}

button {
    border: 0;

    padding: 13px 17px;

    border-radius: 13px;

    color: white;

    font-weight: bold;
    font-size: 14px;

    cursor: pointer;

    transition: .15s;

    box-shadow:
        0 5px 15px rgba(0,0,0,.25);
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.15);
}

button:active {
    transform: scale(.96);
}

.shopBasic {
    background: linear-gradient(135deg,#007cff,#00c8ff);
}

.shopRapid {
    background: linear-gradient(135deg,#009c48,#00e66b);
}

.shopSniper {
    background: linear-gradient(135deg,#b8002f,#ff3155);
}

.shopCannon {
    background: linear-gradient(135deg,#d95100,#ff9d00);
}

/* =========================
   CONTROLS
========================= */

#controls {
    width: min(1100px,95vw);

    margin: 10px auto 25px;

    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
}

#nextWave {
    background:
        linear-gradient(135deg,#00a85a,#00d98b);

    min-width: 190px;
}

#upgrade {
    background:
        linear-gradient(135deg,#6935d8,#9a5cff);
}

#sell {
    background:
        linear-gradient(135deg,#c44d00,#ff7900);
}

#restart {
    background:
        linear-gradient(135deg,#394957,#596979);
}

/* =========================
   MESSAGE
========================= */

#message {
    min-height: 24px;

    text-align: center;

    color: #ffe96b;

    font-weight: bold;
}

/* =========================
   GAME OVER
========================= */

#gameOver {
    display: none;

    position: fixed;
    inset: 0;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.78);

    backdrop-filter: blur(6px);

    z-index: 100;
}

.gameOverBox {
    width: min(380px,90vw);

    padding: 30px;

    text-align: center;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #152336,
            #0c121c
        );

    border: 2px solid #ff3155;

    box-shadow:
        0 0 40px rgba(255,30,70,.35);
}

.gameOverBox h2 {
    font-size: 34px;
    margin-top: 0;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    #status {
        grid-template-columns: repeat(2,1fr);
    }

    #game {
        min-height: 300px;
        aspect-ratio: 4 / 3;
    }

    .tower {
        width: 46px;
        height: 46px;
        font-size: 19px;
    }

    .enemy {
        width: 27px;
        height: 27px;
    }

    .enemy.tank {
        width: 36px;
        height: 36px;
    }

    .enemyBoss {
        width: 48px;
        height: 48px;
    }

    button {
        padding: 11px 13px;
    }
}

</style>
</head>

<body>

<header>

    <h1>⚡ TOWER DEFENSE</h1>

    <p>Verteidige deine Basis gegen die Gegner!</p>

</header>

<!-- STATUS -->

<div id="status">

    <div class="stat">
        <span class="stat-icon">💰</span>
        Geld
        <span class="stat-value" id="money">350</span>
    </div>

    <div class="stat">
        <span class="stat-icon">❤️</span>
        Leben
        <span class="stat-value" id="lives">20</span>
    </div>

    <div class="stat">
        <span class="stat-icon">🌊</span>
        Welle
        <span class="stat-value" id="wave">0</span>
    </div>

    <div class="stat">
        <span class="stat-icon">👾</span>
        Gegner
        <span class="stat-value" id="enemyCount">0</span>
    </div>

</div>

<div id="message">
    Baue deine Verteidigung und starte die erste Welle!
</div>

<!-- SPIEL -->

<div id="gameWrapper">

<div id="game">

    <!-- EIN EINZIGER DURCHGÄNGIGER WEG -->

    <svg id="map"
         viewBox="0 0 1000 560"
         preserveAspectRatio="none">

        <path
            id="roadOuter"
            d="
            M 20 455
            L 170 455
            L 170 105
            L 820 105
            L 820 455
            L 450 455
            "
        />

        <path
            id="road"
            d="
            M 20 455
            L 170 455
            L 170 105
            L 820 105
            L 820 455
            L 450 455
            "
        />

        <path
            id="roadInner"
            d="
            M 20 455
            L 170 455
            L 170 105
            L 820 105
            L 820 455
            L 450 455
            "
        />

    </svg>

    <div id="startMarker" class="marker">
        ▶ START
    </div>

    <div id="finishMarker" class="marker">
        🏁 ZIEL
    </div>

</div>

</div>

<!-- SHOP -->

<div id="shop">

    <div class="shopTitle">
        🏗️ VERTEIDIGUNG BAUEN
    </div>

    <div class="shopButtons">

        <button
            class="shopBasic"
            onclick="buyTower('basic')">
            🔵 Plasma-Turm<br>
            $100
        </button>

        <button
            class="shopRapid"
            onclick="buyTower('rapid')">
            🟢 Schnellfeuer<br>
            $150
        </button>

        <button
            class="shopSniper"
            onclick="buyTower('sniper')">
            🔴 Sniper<br>
            $200
        </button>

        <button
            class="shopCannon"
            onclick="buyTower('cannon')">
            🟠 Kanone<br>
            $250
        </button>

    </div>

</div>

<!-- CONTROLS -->

<div id="controls">

    <button id="nextWave"
            onclick="startWave()">
        ▶ NÄCHSTE WELLE
    </button>

    <button id="upgrade"
            onclick="upgradeTower()">
        ⬆ UPGRADE
    </button>

    <button id="sell"
            onclick="sellTower()">
        💰 VERKAUFEN
    </button>

    <button id="restart"
            onclick="location.reload()">
        🔄 NEUSTART
    </button>

</div>

<!-- GAME OVER -->

<div id="gameOver">

    <div class="gameOverBox">

        <h2>💀 GAME OVER</h2>

        <p>
            Deine Verteidigung wurde überwältigt.
        </p>

        <button
            id="restartGame"
            onclick="location.reload()">
            🔄 NOCHMAL SPIELEN
        </button>

    </div>

</div>


<script>

/* =====================================
   SPIEL
===================================== */

const game = document.getElementById("game");

let money = 350;
let lives = 20;
let wave = 0;

let enemies = [];
let towers = [];

let selectedTower = null;

let waveRunning = false;
let spawning = false;
let spawnRemaining = 0;


/* =====================================
   DER WEG

   Diese Koordinaten sind identisch
   mit dem SVG-Weg.

   Dadurch gibt es keine Lücken.
===================================== */

const path = [

    {x:20,  y:455},

    {x:170, y:455},

    {x:170, y:105},

    {x:820, y:105},

    {x:820, y:455},

    {x:450, y:455}

];


/* =====================================
   UI
===================================== */

function updateUI() {

    document.getElementById("money")
        .textContent = Math.floor(money);

    document.getElementById("lives")
        .textContent = lives;

    document.getElementById("wave")
        .textContent = wave;

    document.getElementById("enemyCount")
        .textContent = enemies.length;
}


function showMessage(text) {

    document.getElementById("message")
        .textContent = text;
}


/* =====================================
   KOORDINATEN UMRECHNEN

   SVG = 1000 x 560

   Das Spielfeld kann unterschiedlich
   groß sein.

   Deshalb werden die Koordinaten
   automatisch angepasst.
===================================== */

function mapX(x) {

    return x / 1000 * game.clientWidth;
}


function mapY(y) {

    return y / 560 * game.clientHeight;
}


/* =====================================
   WEGPOSITION
===================================== */

function getPathPosition(distance) {

    let remaining = distance;

    for (
        let i = 0;
        i < path.length - 1;
        i++
    ) {

        const a = path[i];
        const b = path[i + 1];

        const dx = b.x - a.x;
        const dy = b.y - a.y;

        const length =
            Math.sqrt(dx*dx + dy*dy);

        if (remaining <= length) {

            const ratio =
                remaining / length;

            return {

                x:
                    a.x +
                    dx * ratio,

                y:
                    a.y +
                    dy * ratio
            };
        }

        remaining -= length;
    }

    return path[path.length - 1];
}


/* =====================================
   GEGNER ERSTELLEN
===================================== */

function createEnemy() {

    const element =
        document.createElement("div");

    element.className = "enemy";

    let type = "normal";

    let hp =
        100 +
        wave * 25;

    let speed =
        45 +
        wave * 2;


    /* Schneller Gegner */

    if (
        wave >= 3 &&
        Math.random() < .25
    ) {

        type = "fast";

        element.classList.add("fast");

        hp *= .65;

        speed *= 1.7;
    }


    /* Tank */

    if (
        wave >= 5 &&
        Math.random() < .15
    ) {

        type = "tank";

        element.classList.add("tank");

        hp *= 3;

        speed *= .55;
    }


    /* Boss */

    if (
        wave >= 8 &&
        spawnRemaining === 1
    ) {

        type = "boss";

        element.className =
            "enemy enemyBoss";

        hp *= 8;

        speed *= .45;
    }


    const hpContainer =
        document.createElement("div");

    hpContainer.className = "hp";


    const hpBar =
        document.createElement("div");

    hpBar.className = "hpBar";

    hpContainer.appendChild(hpBar);

    element.appendChild(hpContainer);

    game.appendChild(element);


    const start =
        getPathPosition(0);


    enemies.push({

        element: element,

        distance: 0,

        hp: hp,

        maxHp: hp,

        speed: speed,

        type: type,

        progress: 0

    });


    updateUI();
}


/* =====================================
   WELLE
===================================== */

function startWave() {

    if (waveRunning) {

        showMessage(
            "⚠️ Die aktuelle Welle läuft noch!"
        );

        return;
    }


    wave++;

    waveRunning = true;

    spawning = true;

    spawnRemaining =
        5 + wave * 2;


    showMessage(
        "🌊 Welle " +
        wave +
        " beginnt!"
    );


    spawnEnemyTimer();
}


/* =====================================
   GEGNER SPAWN
===================================== */

function spawnEnemyTimer() {

    if (!spawning) return;

    createEnemy();

    spawnRemaining--;


    if (spawnRemaining <= 0) {

        spawning = false;

        return;
    }


    setTimeout(
        spawnEnemyTimer,
        650
    );
}


/* =====================================
   GEGNER BEWEGEN
===================================== */

let lastTime =
    performance.now();


function gameLoop(time) {

    const delta =
        Math.min(
            (time - lastTime) / 1000,
            .05
        );

    lastTime = time;


    /* Gegner */

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy = enemies[i];

        enemy.distance +=
            enemy.speed * delta;


        /*
           Gesamte Weglänge berechnen
        */

        let totalLength = 0;

        for (
            let p = 0;
            p < path.length - 1;
            p++
        ) {

            const dx =
                path[p+1].x -
                path[p].x;

            const dy =
                path[p+1].y -
                path[p].y;

            totalLength +=
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );
        }


        /* Ziel erreicht */

        if (
            enemy.distance >=
            totalLength
        ) {

            enemy.element.remove();

            enemies.splice(i,1);

            lives--;

            showMessage(
                "💔 Ein Gegner hat deine Basis erreicht!"
            );

            if (lives <= 0) {

                gameOver();

                return;
            }

            updateUI();

            continue;
        }


        const position =
            getPathPosition(
                enemy.distance
            );


        const x =
            mapX(position.x);

        const y =
            mapY(position.y);


        enemy.element.style.left =
            x + "px";

        enemy.element.style.top =
            y + "px";


        const bar =
            enemy.element
                .querySelector(".hpBar");


        bar.style.width =
            Math.max(
                0,
                enemy.hp /
                enemy.maxHp *
                100
            ) + "%";


        enemy.progress =
            enemy.distance /
            totalLength;
    }


    /* Türme */

    updateTowers(delta);


    /* Welle beendet */

    if (
        waveRunning &&
        !spawning &&
        enemies.length === 0
    ) {

        waveRunning = false;

        const reward =
            75 +
            wave * 15;

        money += reward;

        showMessage(
            "🏆 Welle geschafft! +" +
            reward +
            " Geld"
        );

        updateUI();
    }


    updateUI();

    requestAnimationFrame(gameLoop);
}


requestAnimationFrame(gameLoop);


/* =====================================
   TURM KAUFEN
===================================== */

function buyTower(type) {

    const prices = {

        basic: 100,

        rapid: 150,

        sniper: 200,

        cannon: 250

    };


    if (
        money <
        prices[type]
    ) {

        showMessage(
            "❌ Nicht genug Geld!"
        );

        return;
    }


    money -=
        prices[type];


    /*
       Turmpositionen werden zufällig
       neben dem Weg platziert.

       Danach prüfen wir, ob die Position
       ausreichend Abstand zum Weg hat.
    */

    let x;
    let y;

    let valid = false;


    while (!valid) {

        x =
            Math.random() *
            (game.clientWidth - 80) +
            40;

        y =
            Math.random() *
            (game.clientHeight - 80) +
            40;


        valid = true;


        /*
           Abstand zum Weg prüfen
        */

        const svgX =
            x /
            game.clientWidth *
            1000;

        const svgY =
            y /
            game.clientHeight *
            560;


        /*
           Wir verhindern Platzierung
           zu nahe an den einzelnen
           Wegabschnitten.
        */

        if (
            svgX > 110 &&
            svgX < 230 &&
            svgY > 60 &&
            svgY < 500
        ) {
            valid = false;
        }


        if (
            svgY > 55 &&
            svgY < 155
        ) {
            valid = false;
        }


        if (
            svgX > 760 &&
            svgX < 880 &&
            svgY > 60 &&
            svgY < 500
        ) {
            valid = false;
        }


        if (
            svgY > 410
        ) {
            valid = false;
        }
    }


    const element =
        document.createElement("div");


    element.className =
        "tower " +
        type;


    const icons = {

        basic: "🔵",

        rapid: "🟢",

        sniper: "🔴",

        cannon: "🟠"

    };


    element.textContent =
        icons[type];


    element.style.left =
        x + "px";

    element.style.top =
        y + "px";


    game.appendChild(element);


    const tower = {

        element: element,

        x: x,

        y: y,

        type: type,

        level: 1,

        cooldown: 0

    };


    towers.push(tower);


    element.addEventListener(
        "click",
        function(e) {

            e.stopPropagation();

            selectTower(tower);

        }
    );


    updateUI();
}


/* =====================================
   TURM AUSWÄHLEN
===================================== */

function selectTower(tower) {

    if (selectedTower) {

        selectedTower.element
            .classList
            .remove("selected");

        removeRange();
    }


    selectedTower = tower;


    tower.element
        .classList
        .add("selected");


    showRange(tower);


    showMessage(
        "Turm Level " +
        tower.level +
        " ausgewählt"
    );
}


/* =====================================
   REICHWEITE
===================================== */

function getStats(tower) {

    let range = 125;
    let damage = 22;
    let cooldown = .65;


    if (
        tower.type === "rapid"
    ) {

        range = 115;
        damage = 11;
        cooldown = .25;
    }


    if (
        tower.type === "sniper"
    ) {

        range = 280;
        damage = 70;
        cooldown = 1.5;
    }


    if (
        tower.type === "cannon"
    ) {

        range = 150;
        damage = 42;
        cooldown = 1;
    }


    range +=
        tower.level * 12;

    damage +=
        tower.level * 9;


    return {

        range,
        damage,
        cooldown

    };
}


function showRange(tower) {

    removeRange();


    const stats =
        getStats(tower);


    const range =
        document.createElement("div");


    range.className =
        "range";


    range.style.width =
        stats.range * 2 + "px";

    range.style.height =
        stats.range * 2 + "px";


    range.style.left =
        tower.x + "px";

    range.style.top =
        tower.y + "px";


    range.id =
        "currentRange";


    game.appendChild(range);
}


function removeRange() {

    const range =
        document.getElementById(
            "currentRange"
        );

    if (range) {
        range.remove();
    }
}


/* =====================================
   TÜRME AKTUALISIEREN
===================================== */

function updateTowers(delta) {

    towers.forEach(
        tower => {

        tower.cooldown -= delta;


        if (
            tower.cooldown > 0
        ) {
            return;
        }


        const stats =
            getStats(tower);


        let target = null;

        let furthest = -1;


        enemies.forEach(
            enemy => {

            const position =
                getPathPosition(
                    enemy.distance
                );


            const enemyX =
                mapX(position.x);

            const enemyY =
                mapY(position.y);


            const dx =
                enemyX -
                tower.x;

            const dy =
                enemyY -
                tower.y;


            const distance =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            if (
                distance <=
                stats.range &&
                enemy.progress >
                furthest
            ) {

                furthest =
                    enemy.progress;

                target =
                    enemy;
            }

        });


        if (target) {

            shoot(
                tower,
                target,
                stats.damage
            );

            tower.cooldown =
                stats.cooldown;
        }

    });
}


/* =====================================
   SCHIESSEN
===================================== */

function shoot(
    tower,
    target,
    damage
) {

    const bullet =
        document.createElement("div");


    bullet.className =
        "bullet";


    game.appendChild(
        bullet
    );


    let x =
        tower.x;

    let y =
        tower.y;


    const interval =
        setInterval(
            () => {

            if (
                !enemies.includes(
                    target
                )
            ) {

                clearInterval(
                    interval
                );

                bullet.remove();

                return;
            }


            const position =
                getPathPosition(
                    target.distance
                );


            const targetX =
                mapX(position.x);

            const targetY =
                mapY(position.y);


            const dx =
                targetX - x;

            const dy =
                targetY - y;


            const distance =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            if (
                distance < 9
            ) {

                clearInterval(
                    interval
                );

                bullet.remove();


                target.hp -=
                    damage;


                if (
                    target.hp <= 0
                ) {

                    const index =
                        enemies.indexOf(
                            target
                        );


                    if (index !== -1) {

                        target.element.remove();

                        enemies.splice(
                            index,
                            1
                        );

                        money +=
                            target.type === "boss"
                                ? 100
                                : 15;
                    }

                    updateUI();
                }

                return;
            }


            const speed = 12;


            x +=
                dx /
                distance *
                speed;

            y +=
                dy /
                distance *
                speed;


            bullet.style.left =
                x + "px";

            bullet.style.top =
                y + "px";

        },
        20
    );
}


/* =====================================
   UPGRADE
===================================== */

function upgradeTower() {

    if (!selectedTower) {

        showMessage(
            "⚠️ Wähle zuerst einen Turm!"
        );

        return;
    }


    const cost =
        selectedTower.level *
        120;


    if (
        money < cost
    ) {

        showMessage(
            "❌ Nicht genug Geld!"
        );

        return;
    }


    money -= cost;

    selectedTower.level++;


    selectedTower.element.style.transform =
        "translate(-50%, -50%) scale(" +
        (1 +
        selectedTower.level *
        .05) +
        ")";


    showRange(
        selectedTower
    );


    showMessage(
        "⬆ Turm auf Level " +
        selectedTower.level +
        " verbessert!"
    );


    updateUI();
}


/* =====================================
   VERKAUFEN
===================================== */

function sellTower() {

    if (!selectedTower) {

        showMessage(
            "⚠️ Wähle zuerst einen Turm!"
        );

        return;
    }


    const index =
        towers.indexOf(
            selectedTower
        );


    if (index === -1) {
        return;
    }


    money +=
        50 +
        selectedTower.level *
        45;


    selectedTower.element.remove();


    towers.splice(
        index,
        1
    );


    selectedTower =
        null;


    removeRange();


    showMessage(
        "💰 Turm verkauft!"
    );


    updateUI();
}


/* =====================================
   SPIELFELD KLICK
===================================== */

game.addEventListener(
    "click",
    function() {

        if (selectedTower) {

            selectedTower.element
                .classList
                .remove("selected");

            selectedTower =
                null;

            removeRange();
        }

    }
);


/* =====================================
   GAME OVER
===================================== */

function gameOver() {

    waveRunning =
        false;

    spawning =
        false;


    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";
}


/* =====================================
   START
===================================== */

updateUI();

</script>
