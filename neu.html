<!DOCTYPE html>
<html lang="de">
<head>

<title>Battle Ages</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#20170f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

body{
    display:flex;
    justify-content:center;
}

#game{
    width:100%;
    max-width:1450px;
    min-height:100vh;
    background:#241a12;
    box-shadow:0 0 40px rgba(0,0,0,.7);
}

/* =========================
   TOP BAR
========================= */

.topbar{
    height:72px;
    background:
        linear-gradient(#65452b,#3b2819);
    border-bottom:4px solid #1c130c;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 14px;
    position:relative;
    z-index:10;
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:2px;
    color:#f4d58a;
    text-shadow:
        2px 2px #25160b,
        -1px -1px #9b6c32;
}

.logo small{
    display:block;
    font-size:10px;
    letter-spacing:3px;
    color:#d4b273;
}

.stats{
    display:flex;
    align-items:center;
    gap:12px;
}

.stat{
    min-width:105px;
    background:#2b1d12;
    border:2px solid #806039;
    border-radius:7px;
    padding:7px 12px;
    text-align:center;
    box-shadow:inset 0 1px rgba(255,255,255,.1);
}

.stat-label{
    font-size:10px;
    color:#c8ad7c;
    text-transform:uppercase;
}

.stat-value{
    font-size:20px;
    font-weight:bold;
    color:#fff0b0;
}

#gold{
    color:#ffd84d;
}

/* =========================
   BATTLEFIELD
========================= */

#arena{
    width:100%;
    position:relative;
    background:#6ea8c7;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    background:#76aec8;
}

/* =========================
   BOTTOM CONTROL
========================= */

#controls{
    background:
        linear-gradient(#59402a,#2d1e13);
    border-top:5px solid #17100a;
    padding:10px;
    min-height:170px;
}

.control-inner{
    max-width:1250px;
    margin:auto;
}

.unit-row{
    display:flex;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
}

.unit-btn{
    width:132px;
    min-height:105px;
    background:
        linear-gradient(#80603b,#4b321e);
    border:3px solid #a98552;
    border-radius:8px;
    color:white;
    cursor:pointer;
    position:relative;
    box-shadow:
        0 4px 0 #1a1008,
        inset 0 1px rgba(255,255,255,.18);
    transition:.08s;
    overflow:hidden;
}

.unit-btn:hover{
    filter:brightness(1.12);
}

.unit-btn:active{
    transform:translateY(3px);
    box-shadow:
        0 1px 0 #1a1008,
        inset 0 1px rgba(255,255,255,.15);
}

.unit-btn.locked{
    opacity:.38;
    filter:grayscale(.8);
}

.unit-icon{
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:39px;
    text-shadow:2px 2px 2px #000;
}

.unit-name{
    font-size:13px;
    font-weight:bold;
}

.unit-cost{
    margin-top:4px;
    color:#ffd84d;
    font-weight:bold;
    font-size:12px;
}

.bottom-row{
    margin-top:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.action-btn{
    min-width:145px;
    padding:12px 18px;
    border-radius:7px;
    border:3px solid #987242;
    background:linear-gradient(#755332,#3d2817);
    color:#fff2c2;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 0 #180e07;
}

.action-btn:hover{
    filter:brightness(1.12);
}

.action-btn:active{
    transform:translateY(2px);
}

#ageButton{
    background:
        linear-gradient(#9d763b,#5c3b1e);
    border-color:#d0a65d;
    color:#ffe8a1;
}

#pauseButton{
    min-width:90px;
}

#message{
    margin-top:8px;
    min-height:20px;
    text-align:center;
    color:#d8c49b;
    font-size:13px;
}

/* =========================
   RESULT SCREEN
========================= */

#result{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,9,4,.78);
    z-index:100;
    align-items:center;
    justify-content:center;
}

.result-box{
    width:min(460px,90vw);
    background:
        linear-gradient(#68492d,#2f1d10);
    border:5px solid #b28a51;
    border-radius:12px;
    box-shadow:
        0 15px 50px rgba(0,0,0,.8),
        inset 0 1px rgba(255,255,255,.2);
    padding:30px;
    text-align:center;
}

.result-title{
    font-size:42px;
    font-weight:900;
    color:#f7d988;
    text-shadow:3px 3px #241309;
}

.result-text{
    margin:18px 0;
    color:#ead9b5;
    font-size:16px;
}

@media(max-width:800px){

    .topbar{
        height:62px;
        padding:5px 8px;
    }

    .logo{
        font-size:18px;
    }

    .logo small{
        font-size:8px;
    }

    .stats{
        gap:5px;
    }

    .stat{

        padding:4px;
    }

    .stat-value{
        font-size:15px;
    }

    .unit-btn{
        width:105px;
        min-height:92px;
    }

    .unit-icon{
        height:45px;
        font-size:31px;
    }

    .unit-name{
        font-size:11px;
    }
}
</style>

/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}

function dist(a,b){
    return Math.abs(a-b);
}

function random(min,max){
    return Math.random()*(max-min)+min;
}

function formatNumber(n){
    return Math.floor(n).toLocaleString("de-DE");
}

/* =========================================================
   UI
========================================================= */

function updateUI(){

    document.getElementById("gold").textContent =
        formatNumber(gold);

    document.getElementById("income").textContent =
        AGES[currentAge].income;

    document.getElementById("age").textContent =
        AGES[currentAge].short;

    buildUnitButtons();

    const ageButton =
        document.getElementById("ageButton");

    if(currentAge < AGES.length-1){

        const cost =
            AGES[currentAge+1].cost;

        ageButton.textContent =
            "⬆ AUFSTIEG • " + formatNumber(cost) + " G";

        ageButton.disabled =
            gold < cost;

    }else{

        ageButton.textContent =
            "MAXIMALES ZEITALTER";

        ageButton.disabled = true;
    }
}

function buildUnitButtons(){

    const row =
        document.getElementById("unitRow");

    row.innerHTML="";

    AGES[currentAge].units.forEach((u,index)=>{

        const button =
            document.createElement("button");

        button.className="unit-btn";

        if(gold < u.cost){
            button.classList.add("locked");
        }

        button.innerHTML=`
            <div class="unit-icon">${u.icon}</div>
            <div class="unit-name">${u.name}</div>
            <div class="unit-cost">💰 ${u.cost}</div>
        `;

        button.onclick=()=>{
            spawnPlayer(index);
        };

        row.appendChild(button);
    });
}

/* =========================================================
   EINHEITEN ERSTELLEN
========================================================= */

function createUnit(side, data, age, index){

    const isPlayer =
        side==="player";

    return {

        id:
            Math.random().toString(36).slice(2),

        side,

        age,

        typeIndex:index,

        name:data.name,

        icon:data.icon,

        hp:data.hp,

        maxHp:data.hp,

        damage:data.damage,

        range:data.range,

        speed:data.speed,

        attackSpeed:data.attackSpeed,

        attackTimer:random(0,.5),

        x:isPlayer
            ? 145
            : 1255,

        y:430,

        baseY:430,

        dir:isPlayer?1:-1,

        type:data.type,

        weapon:data.weapon,

        shield:data.shield||false,

        armor:data.armor||false,

        cavalry:data.cavalry||false,

        walkTime:random(0,10),

        attackAnim:0,

        hitAnim:0,

        deathAnim:0,

        dead:false,

        target:null,

        seed:random(0,100)

    };
}

/* =========================================================
   SPIELER
========================================================= */

function spawnPlayer(index){

    if(gameOver || !gameRunning)
        return;

    const data =
        AGES[currentAge].units[index];

    if(gold < data.cost){

        showMessage(
            "Nicht genug Gold!"
        );

        return;
    }

    gold -= data.cost;

    units.push(
        createUnit(
            "player",
            data,
            currentAge,
            index
        )
    );

    showMessage(
        data.name + " wurde ausgebildet."
    );

    updateUI();
}

/* =========================================================
   FEIND KI
========================================================= */

function enemySpawn(){

    if(gameOver)
        return;

    const possible=[];

    for(
        let i=0;
        i<AGES[currentAge].units.length;
        i++
    ){

        const u =
            AGES[currentAge].units[i];

        if(enemyGold >= u.cost)
            possible.push(i);
    }

    if(!possible.length)
        return;

    let index =
        possible[
            Math.floor(
                Math.random()*possible.length
            )
        ];

    /*
       Etwas intelligente Auswahl:
       Gegner bevorzugt gelegentlich
       stärkere Einheiten.
    */

    if(Math.random()<.35){

        let best=possible[0];

        for(const i of possible){

            if(
                AGES[currentAge].units[i].damage >
                AGES[currentAge].units[best].damage
            ){
                best=i;
            }
        }

        index=best;
    }

    const data =
        AGES[currentAge].units[index];

    enemyGold -= data.cost;

    const unit =
        createUnit(
            "enemy",
            data,
            currentAge,
            index
        );

    units.push(unit);
}

/* =========================================================
   ZEITALTER DES GEGNERS
========================================================= */

function enemyAgeUp(){

    if(currentAge >= AGES.length-1)
        return;

    const next =
        AGES[currentAge+1];

    if(enemyGold >= next.cost){

        enemyGold -= next.cost;

        enemyCurrentAge++;

        showMessage(
            "Der Gegner ist in das " +
            AGES[enemyCurrentAge].name +
            " aufgestiegen!"
        );
    }
}

let enemyCurrentAge=0;

/* =========================================================
   ZEITALTER AUFSTIEG SPIELER
========================================================= */

document
.getElementById("ageButton")
.addEventListener("click",()=>{

    if(currentAge>=AGES.length-1)
        return;

    const next =
        AGES[currentAge+1];

    if(gold < next.cost){

        showMessage(
            "Du brauchst " +
            next.cost +
            " Gold für den Aufstieg."
        );

        return;
    }

    gold -= next.cost;

    currentAge++;

    showMessage(
        "NEUES ZEITALTER: " +
        AGES[currentAge].name
    );

    updateUI();
});

/* =========================================================
   NÄCHSTE EINHEITEN / TARGETS
========================================================= */

function findTarget(unit){

    let best=null;
    let bestDist=Infinity;

    for(const other of units){

        if(
            other.dead ||
            other.side===unit.side
        )
            continue;

        const d =
            Math.abs(
                other.x-unit.x
            );

        if(d<bestDist){

            bestDist=d;
            best=other;
        }
    }

    return best;
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(gameOver)
        return;

    /* Einkommen */

    incomeTimer += dt;

    if(incomeTimer >= 1){

        incomeTimer -= 1;

        gold += AGES[currentAge].income;

        enemyGold +=
            AGES[enemyCurrentAge].income;
    }

    /* Gegnerproduktion */

    enemyTimer += dt;

    const enemyInterval =
        Math.max(
            1.8,
            4.2-currentAge*.25
        );

    if(enemyTimer >= enemyInterval){

        enemyTimer=0;

        enemySpawn();

        if(
            enemyCurrentAge <
            currentAge &&
            Math.random()<.04
        ){
            enemyAgeUp();
        }
    }

    /* Einheiten */

    for(const unit of units){

        if(unit.dead){

            unit.deathAnim += dt;

            continue;
        }

        unit.walkTime +=
            dt*(unit.speed*7);

        unit.attackTimer += dt;

        unit.attackAnim =
            Math.max(
                0,
                unit.attackAnim-dt*5
            );

        unit.hitAnim =
            Math.max(
                0,
                unit.hitAnim-dt*5
            );

        const target =
            findTarget(unit);

        unit.target=target;

        let targetX;

        if(target){

            targetX=target.x;

            const distance =
                Math.abs(
                    target.x-unit.x
                );

            /*
               Nahkampf
            */

            if(
                distance <= unit.range
            ){

                if(
                    unit.attackTimer >=
                    unit.attackSpeed
                ){

                    unit.attackTimer=0;

                    performAttack(
                        unit,
                        target
                    );
                }

            }else{

                moveUnit(unit,target);
            }

        }else{

            /*
               Keine gegnerische Einheit:
               auf gegnerische Basis zulaufen.
            */

            const base =
                unit.side==="player"
                    ? enemyBase
                    : playerBase;

            const distance =
                Math.abs(
                    base.x-unit.x
                );

            if(distance <= unit.range){

                if(
                    unit.attackTimer >=
                    unit.attackSpeed
                ){

                    unit.attackTimer=0;

                    attackBase(unit,base);
                }

            }else{

                moveTowardBase(
                    unit,
                    base
                );
            }
        }

        /*
           Position begrenzen
        */

        unit.x =
            clamp(
                unit.x,
                100,
                1300
            );
    }

    removeDead();

    updateFrontline();

    checkVictory();
}

/* =========================================================
   BEWEGUNG
========================================================= */

function moveUnit(unit,target){

    const dir =
        unit.side==="player"
            ? 1
            : -1;

    /*
       Kleine Distanz zum Ziel,
       damit Einheiten nicht ineinander laufen.
    */

    const stopDistance =
        Math.max(
            unit.range*.72,
            35
        );

    if(
        Math.abs(
            target.x-unit.x
        ) > stopDistance
    ){

        unit.x +=
            dir*
            unit.speed*
            60/60;
    }

    unit.y =
        unit.baseY +
        Math.sin(unit.walkTime*2.2)*2;
}

function moveTowardBase(unit,base){

    const dir =
        unit.side==="player"
            ? 1
            : -1;

    unit.x +=
        dir*
        unit.speed;

    unit.y =
        unit.baseY +
        Math.sin(unit.walkTime*2.2)*2;
}

/* =========================================================
   ANGRIFF
========================================================= */

function performAttack(attacker,target){

    attacker.attackAnim=1;

    if(
        attacker.type==="ranged"
    ){

        createProjectile(
            attacker,
            target
        );

    }else{

        dealDamage(
            attacker,
            target,
            attacker.damage
        );

        createHitEffect(
            target.x,
            target.y-35,
            "⚔"
        );
    }
}

function attackBase(unit,base){

    unit.attackAnim=1;

    if(
        unit.type==="ranged"
    ){

        createBaseProjectile(
            unit,
            base
        );

    }else{

        base.hp -=
            unit.damage;

        createHitEffect(
            base.x,
            base.y-100,
            "💥"
        );
    }
}

/* =========================================================
   SCHADEN
========================================================= */

function dealDamage(attacker,target,damage){

    let finalDamage=damage;

    if(target.armor){
        finalDamage *= .88;
    }

    target.hp -= finalDamage;

    target.hitAnim=1;

    createHitEffect(
        target.x,
        target.y-38,
        "✦"
    );

    if(target.hp <= 0){

        target.hp=0;

        target.dead=true;

        createHitEffect(
            target.x,
            target.y-25,
            "★"
        );
    }
}

/* =========================================================
   GESCHOSSE
========================================================= */

function createProjectile(attacker,target){

    projectiles.push({

        x:attacker.x,
        y:attacker.y-45,

        target,

        speed:
            attacker.weapon==="sniper"
                ? 10
                : 7,

        damage:attacker.damage,

        side:attacker.side,

        weapon:attacker.weapon,

        active:true

    });
}

function createBaseProjectile(unit,base){

    projectiles.push({

        x:unit.x,
        y:unit.y-45,

        base,

        speed:
            unit.weapon==="rocket"
                ? 6
                : 8,

        damage:unit.damage,

        side:unit.side,

        weapon:unit.weapon,

        active:true

    });
}

function updateProjectiles(dt){

    for(const p of projectiles){

        if(!p.active)
            continue;

        if(p.target){

            if(p.target.dead){

                p.active=false;
                continue;
            }

            const dx =
                p.target.x-p.x;

            const dy =
                (p.target.y-35)-p.y;

            const length =
                Math.sqrt(dx*dx+dy*dy);

            if(length < p.speed*2){

                dealDamage(
                    {
                        damage:p.damage
                    },
                    p.target,
                    p.damage
                );

                createHitEffect(
                    p.target.x,
                    p.target.y-35,
                    p.weapon==="rocket"
                        ? "💥"
                        : "✦"
                );

                p.active=false;

            }else{

                p.x +=
                    dx/length*
                    p.speed;

                p.y +=
                    dy/length*
                    p.speed;
            }

        }else if(p.base){

            const dx =
                p.base.x-p.x;

            const dy =
                (p.base.y-90)-p.y;

            const length =
                Math.sqrt(dx*dx+dy*dy);

            if(length < p.speed*2){

                p.base.hp -=
                    p.damage;

                createHitEffect(
                    p.base.x,
                    p.base.y-80,
                    "💥"
                );

                p.active=false;

            }else{

                p.x +=
                    dx/length*
                    p.speed;

                p.y +=
                    dy/length*
                    p.speed;
            }
        }
    }

    projectiles =
        projectiles.filter(
            p=>p.active
        );
}

/* =========================================================
   EFFEKTE
========================================================= */

function createHitEffect(x,y,text){

    effects.push({

        x,
        y,

        text,

        life:0.55,
        maxLife:.55,

        vy:-30
    });
}

function updateEffects(dt){

    for(const e of effects){

        e.life -= dt;

        e.y +=
            e.vy*dt;
    }

    effects =
        effects.filter(
            e=>e.life>0
        );
}

/* =========================================================
   DEAD UNITS
========================================================= */

function removeDead(){

    units =
        units.filter(
            u =>
                !u.dead ||
                u.deathAnim<1.2
        );
}

/* =========================================================
   FRONTLINIE
========================================================= */

function updateFrontline(){

    /*
       Die Frontlinie entsteht aus den
       Positionen der stärksten Einheiten.
       Das gibt dem Kampf mehr Gefühl
       eines echten Vorstoßes.
    */

    const players =
        units.filter(
            u=>u.side==="player"&&!u.dead
        );

    const enemies =
        units.filter(
            u=>u.side==="enemy"&&!u.dead
        );

    if(
        players.length &&
        enemies.length
    ){

        const p =
            players.reduce(
                (a,b)=>a+b.x,
                0
            )/players.length;

        const e =
            enemies.reduce(
                (a,b)=>a+b.x,
                0
            )/enemies.length;

        /*
           leichte Gruppenbewegung,
           aber niemals hartes Teleportieren.
        */

        if(p > e+80){

            for(const u of enemies){

                if(
                    u.x > e+100
                ){
                    u.x -= .08;
                }
            }

        }else if(e > p+80){

            for(const u of players){

                if(
                    u.x < p-100
                ){
                    u.x += .08;
                }
            }
        }
    }
}

        [...units].sort(

        );

    for(const unit of sorted){

    drawProjectiles();

    drawEffects();

}

/* =========================================================
   UNIT DRAWING
========================================================= */

function drawUnit(unit){

    const age =
        AGES[unit.age];

    const colors =
        age.colors;

    let alpha=1;

    if(unit.dead){

        alpha =
            Math.max(
                0,
                1-unit.deathAnim
            );
    }

    ctx.save();

    ctx.globalAlpha=alpha;

    const bob =
        unit.dead
            ? unit.deathAnim*12
            : Math.sin(unit.walkTime*2)*2;

    ctx.translate(
        unit.x,
        unit.y+bob
    );

    if(unit.side==="enemy"){
        ctx.scale(-1,1);
    }

    /*
       Schatten
    */

    ctx.fillStyle=
        "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        7,
        unit.cavalry?26:18,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Trefferblinken
    */

    if(unit.hitAnim>0){

        ctx.globalAlpha=
            .5+
            Math.sin(unit.hitAnim*30)*.5;
    }

    if(unit.cavalry){

        drawHorse();

        drawHumanBody(
            unit,
            colors,
            0,
            -30
        );

    }else{

        drawHumanBody(
            unit,
            colors,
            0,
            0
        );
    }

    /*
       HP-Leiste
    */

    if(!unit.dead){

        drawHPBar(
            0,
            -73,
            46,
            unit.hp/unit.maxHp,
            unit.side==="player"
                ? "#48a74e"
                : "#c94b45"
        );
    }

    ctx.restore();
}

function drawHumanBody(

    ctx.beginPath();

    ctx.moveTo(
        ox-5,
        oy+32

        ox-7+legSwing,

    ctx.moveTo(
        ox+5,
        oy+32
    );

    ctx.lineTo(
        ox+7-legSwing,
        oy+57
    );

    ctx.stroke();

    /*
       Körper
    */

    ctx.fillStyle=
        colors.main;

    ctx.beginPath();

    ctx.roundRect(
        ox-13,
        oy+5,
        26,
        36,
        7
    );

    ctx.fill();

    /*
       Rüstung
    */

    if(unit.armor){

        ctx.strokeStyle=
            colors.light;

        ctx.lineWidth=4;

        ctx.strokeRect(
            ox-11,
            oy+9,

       Kopf
    */

    ctx.beginPath();

    ctx.arc(
        ox,

        0,

    );

       Helm
    */

        );

            y+18
        );

        ctx.lineTo(
            x+42,
            y+8
        );

        ctx.stroke();

        if(unit.weapon==="sniper"){

            ctx.strokeStyle="#111";
            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.moveTo(
                x+25,
                y+5
            );

            ctx.lineTo(
                x+39,
                y+5
            );

            ctx.stroke();
        }

    }else if(unit.weapon==="mg"){

        ctx.strokeStyle="#222";
        ctx.lineWidth=9;

        ctx.beginPath();

        ctx.moveTo(
            x+4,
            y+17
        );

        ctx.lineTo(
            x+43,
            y+12
        );

        ctx.stroke();

        ctx.strokeStyle="#777";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.moveTo(
            x+20,
            y+25
        );

        ctx.lineTo(
            x+28,
            y+42
        );

        ctx.stroke();

    }else if(unit.weapon==="rocket"){

        ctx.strokeStyle="#333";
        ctx.lineWidth=9;

        ctx.beginPath();

        ctx.moveTo(
            x+2,
            y+15
        );

        ctx.lineTo(
            x+38,
            y+2
        );

        ctx.stroke();

        ctx.fillStyle="#b9b9ae";

        ctx.beginPath();

        ctx.moveTo(
            x+38,
            y+2
        );

        ctx.lineTo(
            x+49,
            y
        );

        ctx.lineTo(
            x+39,
            y+8
        );

        ctx.closePath();

        ctx.fill();
    }
}

function drawHorse(){

    /*
       Einfaches eigenes Pferd-Sprite
    */

    ctx.fillStyle="#684a31";

    ctx.beginPath();

    ctx.ellipse(
        0,
        12,
        30,
        17,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillRect(
        18,
        -8,
        13,
        28
    );

    ctx.beginPath();

    ctx.arc(
        29,
        -11,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#382417";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(-18,20);
    ctx.lineTo(-20,42);

    ctx.moveTo(-5,22);
    ctx.lineTo(-7,43);

    ctx.moveTo(15,22);
    ctx.lineTo(13,42);

    ctx.stroke();
}

/* =========================================================
   PROJECTILES DRAW
========================================================= */

function drawProjectiles(){

    for(const p of projectiles){

        ctx.save();

        if(p.weapon==="rocket"){

            ctx.fillStyle="#bfc2b7";

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                6,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#ef8a32";

            ctx.beginPath();

            ctx.moveTo(
                p.x-7,
                p.y
            );

            ctx.lineTo(
                p.x-20,
                p.y-5
            );

            ctx.lineTo(
                p.x-20,
                p.y+5
            );

            ctx.closePath();

            ctx.fill();

        }else{

            ctx.fillStyle=
                p.weapon==="sniper"
                    ? "#fff0a2"
                    : "#f3d26d";

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.weapon==="sniper"
                    ? 4
                    : 3,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        ctx.restore();
    }
}

/* =========================================================
   EFFECTS
========================================================= */

function drawEffects(){

    for(const e of effects){

        ctx.save();

        ctx.globalAlpha =
            e.life/e.maxLife;

        ctx.textAlign="center";

        ctx.font=
            "bold 25px Arial";

        ctx.fillStyle="#ffe8a0";

        ctx.fillText(
            e.text,
            e.x,
            e.y
        );

        ctx.restore();
    }
}

/* =========================================================
   FRONTLINE DRAW
========================================================= */

function drawFrontline(){

    const players =
        units.filter(
            u=>u.side==="player"&&!u.dead
        );

    const enemies =
        units.filter(
            u=>u.side==="enemy"&&!u.dead
        );

    if(
        !players.length ||
        !enemies.length
    )
        return;

    const p =
        players.reduce(
            (a,b)=>a+b.x,
            0
        )/players.length;

    const e =
        enemies.reduce(
            (a,b)=>a+b.x,
            0
        )/enemies.length;

    const line =
        (p+e)/2;

    ctx.save();

    ctx.globalAlpha=.18;

    ctx.strokeStyle="#f7df9b";
    ctx.lineWidth=2;

    ctx.setLineDash([10,10]);

    ctx.beginPath();

    ctx.moveTo(
        line,
        425
    );

    ctx.lineTo(
        line,
        560
    );

    ctx.stroke();

    ctx.restore();
}

/* =========================================================
   HP BAR
========================================================= */

function drawHPBar(
    x,
    y,
    width,
    percent,
    color
){

    percent =
        clamp(
            percent,
            0,
            1
        );

    ctx.fillStyle=
        "rgba(0,0,0,.75)";

    ctx.fillRect(
        x-width/2,
        y,
        width,
        7
    );

    ctx.fillStyle=color;

    ctx.fillRect(
        x-width/2+1,
        y+1,
        (width-2)*percent,
        5
    );
}

/* =========================================================
   SPIELENDE
========================================================= */

function checkVictory(){

    if(playerBase.hp<=0){

        endGame(
            false
        );

        return;
    }

    if(enemyBase.hp<=0){

        endGame(
            true
        );
    }
}

function endGame(playerWon){

    if(gameOver)
        return;

    gameOver=true;
    gameRunning=false;

    const result =
        document.getElementById("result");

    result.style.display="flex";

    document.getElementById(
        "resultTitle"
    ).textContent =
        playerWon
            ? "SIEG!"
            : "NIEDERLAGE";

    document.getElementById(
        "resultText"
    ).textContent =
        playerWon
            ? "Deine Armee hat die gegnerische Festung erobert!"
            : "Deine Festung wurde überwältigt. Sammle Gold und versuche es erneut!";
}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=0;

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=3;
}

/* =========================================================
   PAUSE
========================================================= */

document
.getElementById("pauseButton")
.addEventListener(
    "click",
    togglePause
);

function togglePause(){

    if(gameOver)
        return;

    gameRunning=!gameRunning;

    document.getElementById(
        "pauseButton"
    ).textContent =
        gameRunning
            ? "⏸ PAUSE"
            : "▶ WEITER";

    showMessage(
        gameRunning
            ? "Die Schlacht geht weiter!"
            : "Spiel pausiert."
    );
}

/* =========================================================
   RESTART
========================================================= */

document
.getElementById("restartButton")
.addEventListener(
    "click",
    restartGame
);

function restartGame(){

    gold=500;

    enemyGold=500;

    currentAge=0;

    enemyCurrentAge=0;

    incomeTimer=0;

    enemyTimer=0;

    playerBase.hp=
        playerBase.maxHp;

    enemyBase.hp=
        enemyBase.maxHp;

    units=[];

    projectiles=[];

    effects=[];

    gameOver=false;

    gameRunning=true;

    document.getElementById(
        "result"
    ).style.display="none";

    document.getElementById(
        "pauseButton"
    ).textContent="⏸ PAUSE";

    showMessage(
        "Neue Schlacht begonnen!"
    );

    updateUI();
}

/* =========================================================
   TASTATUR
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="1")
            spawnPlayer(0);

        if(e.key==="2")
            spawnPlayer(1);

        if(e.key==="3")
            spawnPlayer(2);

        if(e.code==="Space"){

            e.preventDefault();

            togglePause();
        }

        if(
            e.key.toLowerCase()==="u"
        ){

            document
            .getElementById(
                "ageButton"
            )
            .click();
        }
    }
);

/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now){

    const dt =
        Math.min(
            .05,
            (now-lastTime)/1000
        );

    lastTime=now;

    if(gameRunning){

        update(dt);

        updateProjectiles(dt);

        updateEffects(dt);
    }

    draw();

    requestAnimationFrame(
        gameLoop
    );
}

/* =========================================================
   START
========================================================= */

updateUI();

requestAnimationFrame(
    gameLoop
);

</script>
