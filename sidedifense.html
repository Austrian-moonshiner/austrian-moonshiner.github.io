<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Ages</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#10151a;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
}

#game{
    width:100%;
    max-width:1400px;
    min-height:100vh;
    background:#172027;
    overflow:hidden;
    position:relative;
}

/* =========================================================
   TOPBAR
========================================================= */

#topbar{
    height:72px;
    background:linear-gradient(#293840,#151e23);
    border-bottom:2px solid #53646c;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 16px;
    position:relative;
    z-index:50;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
}

.logo small{
    display:block;
    color:#92a1a8;
    font-size:10px;
    letter-spacing:3px;
}

.stats{
    display:flex;
    gap:8px;
}

.stat{
    min-width:82px;
    padding:7px 10px;
    text-align:center;
    background:#0e1519;
    border:1px solid #405159;
    border-radius:7px;
}

.stat span{
    display:block;
    font-size:10px;
    color:#92a1a8;
}

.stat b{
    font-size:17px;
}

/* =========================================================
   SCHLACHTFELD
========================================================= */

#battlefield{
    height:520px;
    position:relative;
    overflow:hidden;
    background:#5d685e;
}

#sky{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:225px;
    background:linear-gradient(#203b4c,#70847f);
}

.cloud{
    position:absolute;
    height:32px;
    width:130px;
    background:rgba(255,255,255,.13);
    border-radius:50px;
}

.c1{
    left:12%;
    top:45px;
}

.c2{
    left:57%;
    top:75px;
    width:190px;
}

.c3{
    left:78%;
    top:30px;
    width:100px;
}

#ground{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:180px;
    background:
        repeating-linear-gradient(
            0deg,
            #4e584f 0,
            #4e584f 18px,
            #414a43 19px,
            #414a43 20px
        );
    border-top:7px solid #303932;
}

#road{
    position:absolute;
    left:0;
    right:0;
    bottom:92px;
    height:92px;
    background:#343a37;
    border-top:5px solid #69716a;
    border-bottom:5px solid #202624;
}

#road:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:40px;
    height:5px;
    background:repeating-linear-gradient(
        90deg,
        #b8af76 0,
        #b8af76 45px,
        transparent 45px,
        transparent 85px
    );
}

/* =========================================================
   BASIS
========================================================= */

.base{
    position:absolute;
    width:145px;
    height:190px;
    bottom:170px;
    z-index:15;
}

#playerBase{
    left:12px;
}

#enemyBase{
    right:12px;
}

.tower{
    position:absolute;
    bottom:0;
    width:115px;
    height:160px;
    background:linear-gradient(
        90deg,
        #293338,
        #596970,
        #2b3438
    );
    border:4px solid #20272b;
}

#playerBase .tower{
    left:0;
}

#enemyBase .tower{
    right:0;
    background:linear-gradient(
        90deg,
        #3b2d2d,
        #765454,
        #3c2e2e
    );
}

.tower:before{
    content:"";
    position:absolute;
    top:-10px;
    left:-7px;
    width:121px;
    height:25px;
    background:#252d30;
    border:3px solid #14191b;
}

.tower:after{
    content:"";
    position:absolute;
    top:50px;
    left:17px;
    width:72px;
    height:78px;
    background:
        linear-gradient(
            90deg,
            transparent 30%,
            rgba(0,0,0,.3) 31%,
            rgba(0,0,0,.3) 68%,
            transparent 69%
        );
    border:3px solid rgba(20,25,27,.45);
}

.flag{
    position:absolute;
    left:58px;
    top:-35px;
    height:48px;
    width:4px;
    background:#20272a;
}

.flag:after{
    content:"";
    position:absolute;
    left:3px;
    top:0;
    width:38px;
    height:20px;
    background:#6f8590;
    clip-path:polygon(0 0,100% 18%,78% 100%,0 100%);
}

#enemyBase .flag:after{
    background:#925a5a;
}

.hpbar{
    position:absolute;
    left:0;
    top:-52px;
    width:145px;
    height:15px;
    background:#101315;
    border:2px solid #171b1c;
}

.hpfill{
    height:100%;
    width:100%;
    background:#57b557;
    transition:.15s;
}

/* =========================================================
   EINHEITEN
========================================================= */

#units{
    position:absolute;
    inset:0;
    z-index:20;
}

.unit{
    position:absolute;
    width:64px;
    height:85px;
    transform:translateX(-50%);
    pointer-events:none;
}

.unitHP{
    position:absolute;
    left:8px;
    top:0;
    width:48px;
    height:7px;
    background:#101315;
    border:1px solid #1b2022;
    z-index:20;
}

.unitHP div{
    width:100%;
    height:100%;
    background:#59b65a;
}

.enemy .unitHP div{
    background:#c45b5b;
}

/* Kopf */

.head{
    position:absolute;
    width:19px;
    height:19px;
    left:23px;
    top:13px;
    border-radius:50%;
    background:#c18c64;
    border:2px solid #30241c;
    z-index:7;
}

/* Hals */

.neck{
    position:absolute;
    left:28px;
    top:29px;
    width:10px;
    height:8px;
    background:#b77e5a;
}

/* Körper */

.body{
    position:absolute;
    left:18px;
    top:34px;
    width:28px;
    height:32px;
    border-radius:6px 6px 4px 4px;
    border:2px solid #1d2528;
    z-index:5;
}

.player .body{
    background:#526f80;
}

.enemy .body{
    background:#8b4c4c;
}

/* Beine */

.leg{
    position:absolute;
    top:63px;
    width:9px;
    height:20px;
    background:#242b2d;
    border-radius:2px;
}

.leg.left{
    left:21px;
}

.leg.right{
    left:35px;
}

/* =========================================================
   SCHWERTKÄMPFER
========================================================= */

.sword{
    position:absolute;
    left:42px;
    top:28px;
    width:7px;
    height:38px;
    background:#d3d8d8;
    border:1px solid #727979;
    transform:rotate(28deg);
    transform-origin:bottom;
    z-index:9;
}

.sword:before{
    content:"";
    position:absolute;
    left:-7px;
    bottom:5px;
    width:19px;
    height:5px;
    background:#754d32;
    border:1px solid #34271d;
}

.shield{
    position:absolute;
    left:5px;
    top:39px;
    width:22px;
    height:28px;
    background:#65777d;
    border:3px solid #242c30;
    clip-path:polygon(
        0 0,
        100% 0,
        100% 70%,
        50% 100%,
        0 70%
    );
    z-index:8;
}

.player .shield{
    background:#5e7d8b;
}

.enemy .shield{
    background:#784949;
}

/* =========================================================
   BOGENSCHÜTZE
========================================================= */

.archer .body{
    background:#667347;
}

.enemy.archer .body{
    background:#744c43;
}

.bow{
    position:absolute;
    left:39px;
    top:28px;
    width:28px;
    height:42px;
    border-right:4px solid #9b6a3e;
    border-radius:50%;
    transform:rotate(-8deg);
    z-index:10;
}

.bow:after{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:28px;
    height:42px;
    border-right:1px solid #ddd;
}

.arrowHeld{
    position:absolute;
    left:34px;
    top:47px;
    width:38px;
    height:3px;
    background:#c7a46c;
    transform:rotate(-12deg);
    z-index:11;
}

.arrowHeld:after{
    content:"";
    position:absolute;
    right:-7px;
    top:-3px;
    border-left:8px solid #d8d8d8;
    border-top:4px solid transparent;
    border-bottom:4px solid transparent;
}

.archer .head:after{
    content:"";
    position:absolute;
    left:-2px;
    top:-3px;
    width:23px;
    height:7px;
    background:#657347;
    border-radius:8px 8px 2px 2px;
}

/* =========================================================
   SCHWERE EINHEIT
========================================================= */

.heavy .body{
    left:14px;
    width:36px;
    height:40px;
    top:30px;
    background:#50595b;
    border:3px solid #252c2e;
}

.heavy .head{
    width:22px;
    height:19px;
    left:21px;
    background:#9b765c;
}

.heavy .helmet{
    position:absolute;
    left:19px;
    top:9px;
    width:27px;
    height:13px;
    background:#454e50;
    border:2px solid #202628;
    border-radius:12px 12px 3px 3px;
    z-index:9;
}

.hammer{
    position:absolute;
    left:42px;
    top:28px;
    width:6px;
    height:43px;
    background:#684b32;
    transform:rotate(25deg);
    z-index:10;
}

.hammer:after{
    content:"";
    position:absolute;
    left:-8px;
    top:-4px;
    width:21px;
    height:13px;
    background:#3e4546;
    border:2px solid #202526;
}

/* =========================================================
   PROJEKTILE
========================================================= */

.arrowProjectile{
    position:absolute;
    width:32px;
    height:3px;
    background:#d1a76a;
    z-index:40;
    transform-origin:left center;
}

.arrowProjectile:after{
    content:"";
    position:absolute;
    right:-7px;
    top:-3px;
    border-left:8px solid #d7d7d7;
    border-top:4px solid transparent;
    border-bottom:4px solid transparent;
}

.bulletProjectile{
    position:absolute;
    width:9px;
    height:5px;
    border-radius:50%;
    background:#f0d77b;
    box-shadow:0 0 7px #fff0a0;
    z-index:40;
}

/* =========================================================
   TREFFER-EFFEKT
========================================================= */

.hitEffect{
    position:absolute;
    width:22px;
    height:22px;
    border:3px solid #f1d16a;
    border-radius:50%;
    z-index:45;
    animation:hit .25s forwards;
    pointer-events:none;
}

@keyframes hit{
    from{
        transform:scale(.3);
        opacity:1;
    }

    to{
        transform:scale(1.7);
        opacity:0;
    }
}

/* =========================================================
   STEUERUNG
========================================================= */

#controls{
    min-height:190px;
    background:linear-gradient(#202d34,#11191e);
    border-top:2px solid #465861;
    padding:12px;
    position:relative;
    z-index:50;
}

#ageInfo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

#ageName{
    font-size:21px;
    font-weight:900;
}

#ageDescription{
    color:#98a7ad;
    font-size:12px;
}

#buttons{
    display:flex;
    gap:8px;
    overflow-x:auto;
}

.unitButton{
    min-width:140px;
    height:86px;
    position:relative;
    padding:8px;
    text-align:left;
    color:white;
    background:linear-gradient(#3b4e57,#202c32);
    border:2px solid #596e77;
    border-radius:8px;
    cursor:pointer;
}

.unitButton:hover{
    background:linear-gradient(#485d67,#293a42);
}

.unitButton.locked{
    opacity:.4;
}

.unitButton .symbol{
    float:left;
    font-size:29px;
    margin-right:7px;
}

.unitButton strong{
    font-size:13px;
}

.unitButton small{
    display:block;
    margin-top:4px;
    color:#a9b6ba;
}

.cost{
    position:absolute;
    right:7px;
    bottom:6px;
    color:#e6c85b;
    font-weight:bold;
}

.controlBtn{
    background:#283a43;
    border:2px solid #536a74;
    color:#fff;
    padding:9px 16px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.controlBtn:hover{
    background:#38505a;
}

.controlBtn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

#specialRow{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:10px;
}

#ageButton{
    color:#f1d776;
    border-color:#927b43;
}

/* =========================================================
   MELDUNG
========================================================= */

#message{
    position:absolute;
    left:50%;
    top:85px;
    transform:translateX(-50%);
    background:rgba(8,12,15,.92);
    border:1px solid #697a81;
    border-radius:8px;
    padding:10px 20px;
    z-index:100;
    opacity:0;
    transition:.2s;
    pointer-events:none;
}

#message.show{
    opacity:1;
}

/* =========================================================
   ENDSCREEN
========================================================= */

#overlay{
    position:absolute;
    inset:0;
    background:rgba(3,7,9,.9);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:200;
}

#overlay.show{
    display:flex;
}

.result{
    width:min(500px,90%);
    text-align:center;
    background:#1c292f;
    border:2px solid #596e77;
    border-radius:12px;
    padding:35px;
}

.result h1{
    margin:0 0 12px;
    font-size:42px;
}

.result p{
    color:#adb9bd;
}

.result button{
    padding:13px 30px;
    background:#405963;
    border:2px solid #6c828b;
    border-radius:8px;
    color:white;
    font-size:17px;
    cursor:pointer;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    #topbar{
        height:105px;
        flex-direction:column;
        gap:7px;
    }

    .logo{
        text-align:center;
    }

    .stats{
        width:100%;
        justify-content:center;
    }

    .stat{
        min-width:68px;
        padding:5px;
    }

    .stat b{
        font-size:14px;
    }

    #battlefield{
        height:470px;
    }

    #controls{
        min-height:215px;
    }

    .base{
        transform:scale(.82);
        transform-origin:bottom;
    }

    .unit{
        transform:translateX(-50%) scale(.9);
    }

    #specialRow{
        flex-wrap:wrap;
    }
}
</style>
</head>

<body>

<div id="game">

<!-- =====================================================
     HEADER
===================================================== -->

<div id="topbar">

    <div class="logo">
        BATTLE AGES
        <small>BASE DEFENSE COMMAND</small>
    </div>

    <div class="stats">

        <div class="stat">
            <span>Gold</span>
            <b id="gold">500</b>
        </div>

        <div class="stat">
            <span>Basis</span>
            <b id="playerHPText">1000</b>
        </div>

        <div class="stat">
            <span>Feind</span>
            <b id="enemyHPText">1000</b>
        </div>

        <div class="stat">
            <span>Welle</span>
            <b id="wave">1</b>
        </div>

    </div>

</div>


<!-- =====================================================
     BATTLEFIELD
===================================================== -->

<div id="battlefield">

    <div id="sky">

        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>

    </div>

    <div id="ground"></div>

    <div id="road"></div>


    <!-- PLAYER BASE -->

    <div id="playerBase" class="base">

        <div class="hpbar">
            <div id="playerHPFill" class="hpfill"></div>
        </div>

        <div class="flag"></div>

        <div class="tower"></div>

    </div>


    <!-- ENEMY BASE -->

    <div id="enemyBase" class="base">

        <div class="hpbar">
            <div id="enemyHPFill" class="hpfill"></div>
        </div>

        <div class="flag"></div>

        <div class="tower"></div>

    </div>


    <div id="units"></div>

    <div id="message"></div>

</div>


<!-- =====================================================
     CONTROL PANEL
===================================================== -->

<div id="controls">

    <div id="ageInfo">

        <div>

            <div id="ageName">
                STEINZEIT
            </div>

            <div id="ageDescription">
                Primitive Krieger bilden den Anfang deiner Armee.
            </div>

        </div>

        <button id="ageButton" class="controlBtn">
            NÄCHSTES ZEITALTER

    </div>


    <div id="buttons"></div>


    <div id="specialRow">

        <button
            id="specialButton"
            class="controlBtn">
            💥 ARTILLERIESCHLAG
        </button>

        <button
            id="saveButton"
            class="controlBtn">
            💾 SPEICHERN
        </button>

        <button
            id="resetButton"
            class="controlBtn">
            ↻ NEUES SPIEL
        </button>

    </div>

</div>


<!-- =====================================================
     ENDSCREEN
===================================================== -->

<div id="overlay">

    <div class="result">

        <h1 id="resultTitle">
            SIEG!
        </h1>

        <p id="resultText"></p>

        <button onclick="newGame()">
            NEUE SCHLACHT
        </button>

    </div>

</div>

</div>

            damage:185,
            speed:34,
            range:350,
            attackSpeed:.65,
            type:"warrior"
        },

        {
            name:"Energie-Schütze",
            symbol:"🎯",
            cost:1400,
            hp:430,
            damage:270,
            speed:30,
            range:450,
            attackSpeed:1.1,
            type:"archer"
        },

        {
            name:"Kampfroboter",
            symbol:"🤖",
            cost:2200,
            hp:1850,
            damage:350,
            speed:15,
            range:65,
            attackSpeed:1.2,
            type:"heavy"
        }

    ]
}

];


/* =========================================================
   EINHEIT ERZEUGEN
========================================================= */

function createUnit(team,data){

    const element =
        document.createElement("div");

    element.className =
        "unit " +
        team + " " +
        data.type;

    /* Kopf und Körper */

    element.innerHTML = `

        <div class="unitHP">
            <div></div>
        </div>

        <div class="head"></div>
        <div class="neck"></div>

        <div class="body"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

    `;


    /* zusätzliche Ausstattung */

    if(data.type==="warrior"){

        element.innerHTML += `
            <div class="shield"></div>
            <div class="sword"></div>
        `;

    }


    if(data.type==="archer"){

        element.innerHTML += `
            <div class="bow"></div>
            <div class="arrowHeld"></div>
        `;

    }


    if(data.type==="heavy"){

        element.innerHTML += `
            <div class="helmet"></div>
            <div class="hammer"></div>
        `;

    }


    unitsContainer.appendChild(element);


    const width =
        battlefield.clientWidth;


    const unit = {

        id:
            Date.now()+Math.random(),

        team,

        x:
            team==="player"
            ? 145
            : width-145,

        y:335,

        hp:data.hp,

        maxHP:data.hp,

        damage:data.damage,

        speed:data.speed,

        range:data.range,

        attackSpeed:data.attackSpeed,

        attackTimer:Math.random(),

        type:data.type,

        reward:data.reward || 0,

        element

    };


    units.push(unit);

    return unit;
}


/* =========================================================
   SPIELER EINHEIT KAUFEN
========================================================= */

function buyUnit(index){

    if(!gameRunning)
        return;

    const data =
        ages[age].units[index];


    if(gold < data.cost){

        showMessage(
            "Nicht genug Gold!"
        );

        return;
    }


    gold -= data.cost;

    createUnit(
        "player",
        data
    );

    updateUI();
}


/* =========================================================
   GEGNER
========================================================= */

const enemyTypes = [

{
    name:"Krieger",
    hp:130,
    damage:16,
    speed:23,
    range:48,
    attackSpeed:1.2,
    reward:35,
    type:"warrior"
},

{
    name:"Bogenschütze",
    hp:100,
    damage:25,
    speed:18,
    range:230,
    attackSpeed:1.7,
    reward:55,
    type:"archer"
},

{
    name:"Elite",
    hp:320,
    damage:40,
    speed:15,
    range:52,
    attackSpeed:1.4,
    reward:90,
    type:"heavy"
},

{
    name:"Belagerer",
    hp:680,
    damage:85,
    speed:8,
    range:300,
    attackSpeed:2.8,
    reward:180,
    type:"heavy"
}

];


function spawnEnemy(){

    const available = [];

    available.push(
        enemyTypes[0]
    );

    if(wave>=3)
        available.push(
            enemyTypes[1]
        );

    if(wave>=6)
        available.push(
            enemyTypes[2]
        );

    if(wave>=10)
        available.push(
            enemyTypes[3]
        );


    let data =
        available[
            Math.floor(
                Math.random()*
                available.length
            )
        ];


    data = {...data};


    const multiplier =
        1+(wave-1)*.09;


    data.hp *= multiplier;

    data.damage *=
        1+(wave-1)*.045;


    createUnit(
        "enemy",
        data
    );
}


/* =========================================================
   ZIEL FINDEN
========================================================= */

function findTarget(unit){

    const candidates =
        units.filter(
            other =>
                other.team!==unit.team &&
                other.hp>0
        );


    if(!candidates.length)
        return null;


    candidates.sort(
        (a,b)=>
            Math.abs(a.x-unit.x) -
            Math.abs(b.x-unit.x)
    );


    const target =
        candidates[0];


    if(
        Math.abs(
            target.x-unit.x
        ) <= unit.range
    ){

        return target;
    }


    return null;
}


/* =========================================================
   ANGRIFF
========================================================= */

function attackUnit(
    attacker,
    target
){

    attacker.attackTimer =
        attacker.attackSpeed;


    if(
        attacker.type==="archer"
    ){

        createArrow(
            attacker,
            target
        );

    }else{

        target.hp -=
            attacker.damage;

        createHitEffect(
            target.x,
            340
        );

    }

}


/* =========================================================
   PFEIL
========================================================= */

function createArrow(
    attacker,
    target
){

    const arrow =
        document.createElement("div");

    arrow.className =
        "arrowProjectile";


    battlefield.appendChild(
        arrow
    );


    projectiles.push({

        type:"arrow",

        x:attacker.x,

        y:325,

        target,

        damage:attacker.damage,

        speed:430,

        element:arrow,

        dead:false

    });

}


/* =========================================================
   TREFFER
========================================================= */

function createHitEffect(
    x,
    y
){

    const effect =
        document.createElement("div");

    effect.className =
        "hitEffect";

    effect.style.left =
        x+"px";

    effect.style.top =
        y+"px";

    battlefield.appendChild(
        effect
    );


    setTimeout(
        ()=>{
            effect.remove();
        },
        300
    );
}


/* =========================================================
   PROJEKTILE UPDATE
========================================================= */

function updateProjectiles(dt){

    projectiles.forEach(
        projectile => {

            if(
                !projectile.target ||
                projectile.target.hp<=0
            ){

                projectile.element.remove();

                projectile.dead=true;

                return;
            }


            const dx =
                projectile.target.x -
                projectile.x;

            const dy =
                340 -
                projectile.y;


            const distance =
                Math.sqrt(
                    dx*dx+dy*dy
                );


            if(distance<15){

                projectile.target.hp -=
                    projectile.damage;


                createHitEffect(
                    projectile.target.x,
                    335
                );


                projectile.element.remove();

                projectile.dead=true;

                return;
            }


            projectile.x +=
                dx/distance *
                projectile.speed *
                dt;


            projectile.y +=
                dy/distance *
                projectile.speed *
                dt;


            projectile.element.style.left =
                projectile.x+"px";

            projectile.element.style.top =
                projectile.y+"px";


            const angle =
                Math.atan2(
                    dy,
                    dx
                ) *
                180 /
                Math.PI;


            projectile.element.style.transform =
                `rotate(${angle}deg)`;

        }
    );


    projectiles =
        projectiles.filter(
            p=>!p.dead
        );
}


/* =========================================================
   EINHEITEN UPDATE
========================================================= */

function updateUnits(dt){

    units.forEach(
        unit => {

            if(unit.hp<=0)
                return;


            unit.attackTimer -= dt;


            const target =
                findTarget(unit);


            if(target){

                if(
                    unit.attackTimer<=0
                ){

                    attackUnit(
                        unit,
                        target
                    );

                }

            }else{

                if(
                    unit.team==="player"
                ){

                    unit.x +=
                        unit.speed*dt;


                    if(
                        unit.x >=
                        battlefield.clientWidth-135
                    ){

                        enemyHP -=
                            unit.damage *
                            dt *
                            .7;

                    }

                }else{

                    unit.x -=
                        unit.speed*dt;


                    if(
                        unit.x <= 135
                    ){

                        playerHP -=
                            unit.damage *
                            dt *
                            .7;

                    }

                }

            }


            unit.element.style.left =
                unit.x+"px";


            unit.element.style.top =
                unit.y+"px";


            const hp =
                Math.max(
                    0,
                    unit.hp/
                    unit.maxHP*
                    100
                );


            unit.element
                .querySelector(
                    ".unitHP div"
                )
                .style.width =
                    hp+"%";

        }
    );


    removeDeadUnits();
}


/* =========================================================
   TOTE EINHEITEN
========================================================= */

function removeDeadUnits(){

    units.forEach(
        unit => {

            if(
                unit.hp<=0 &&
                !unit.dead
            ){

                unit.dead=true;

                unit.element.remove();


                if(
                    unit.team==="enemy"
                ){

                    gold +=
                        unit.reward;


                    showMessage(
                        "+"+
                        unit.reward+
                        " Gold"
                    );

                }

            }

        }
    );


    units =
        units.filter(
            u=>!u.dead
        );
}


/* =========================================================
   GEGNER SPAWN
========================================================= */

function updateEnemySpawning(dt){

    enemySpawnTimer += dt;


    const interval =
        Math.max(
            1.15,
            4.2-wave*.11
        );


    if(
        enemySpawnTimer >=
        interval
    ){

        enemySpawnTimer=0;


        const amount =
            wave>=12 &&
            Math.random()<.25
            ? 2
            : 1;


        for(
            let i=0;
            i<amount;
            i++
        ){

            spawnEnemy();

        }

    }
}


/* =========================================================
   GOLD
========================================================= */

function updateGold(dt){

    passiveGoldTimer += dt;


    if(
        passiveGoldTimer>=1
    ){

        passiveGoldTimer=0;


        gold +=
            8+
            age*3;

    }

}


/* =========================================================
   WELLEN
========================================================= */

function updateWave(dt){

    waveTimer += dt;


    if(
        waveTimer>=25
    ){

        waveTimer=0;

        wave++;


        showMessage(
            "WELLE "+
            wave+
            " BEGINNT!"
        );

    }

}


/* =========================================================
   SPEZIALANGRIFF
========================================================= */

function specialAttack(){

    if(!gameRunning)
        return;


    if(specialCooldown>0){

        showMessage(
            "Spezialangriff lädt noch!"
        );

        return;
    }


    const enemies =
        units.filter(
            u=>
                u.team==="enemy"
        );


    if(!enemies.length){

        showMessage(
            "Keine Gegner im Zielgebiet."
        );

        return;
    }


    enemies.forEach(
        enemy => {

            enemy.hp -=
                240;

        }
    );


    specialCooldown=15;


    showMessage(
        "💥 ARTILLERIESCHLAG!"
    );


    const button =
        document.getElementById(
            "specialButton"
        );


    button.disabled=true;


    setTimeout(
        ()=>{
            if(gameRunning)
                button.disabled=false;
        },
        15000
    );
}


/* =========================================================
   ZEITALTER
========================================================= */

function nextAge(){

    if(
        age>=ages.length-1
    )
        return;


    const cost =
        ages[age].upgradeCost;


    if(gold<cost){

        showMessage(
            "Du brauchst "+
            cost+
            " Gold."
        );

        return;
    }


    gold -= cost;

    age++;


    showMessage(
        "NEUES ZEITALTER: "+
        ages[age].name
    );


    updateUI();
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    document.getElementById(
        "gold"
    ).textContent =
        Math.floor(gold);


    document.getElementById(
        "wave"
    ).textContent =
        wave;


    document.getElementById(
        "playerHPText"
    ).textContent =
        Math.max(
            0,
            Math.floor(playerHP)
        );


    document.getElementById(
        "enemyHPText"
    ).textContent =
        Math.max(
            0,
            Math.floor(enemyHP)
        );


    document.getElementById(
        "playerHPFill"
    ).style.width =
        Math.max(
            0,
            playerHP/1000*100
        )+"%";


    document.getElementById(
        "enemyHPFill"
    ).style.width =
        Math.max(
            0,
            enemyHP/1000*100
        )+"%";


    document.getElementById(
        "ageName"
    ).textContent =
        ages[age].name;


    document.getElementById(
        "ageDescription"
    ).textContent =
        ages[age].description;


    renderUnitButtons();
}


/* =========================================================
   EINHEIT BUTTONS
========================================================= */

function renderUnitButtons(){

    buttonsContainer.innerHTML="";


    ages[age].units.forEach(
        (unit,index)=>{

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "unitButton";


            if(gold<unit.cost)
                button.classList.add(
                    "locked"
                );


            button.innerHTML = `

                <span class="symbol">
                    ${unit.symbol}
                </span>

                <strong>
                    ${unit.name}
                </strong>

                <small>
                    HP ${unit.hp}<br>
                    Schaden ${unit.damage}
                </small>

                <span class="cost">
                    💰 ${unit.cost}
                </span>

            `;


            button.onclick =
                ()=>{
                    buyUnit(index);
                };


            buttonsContainer.appendChild(
                button
            );

        }
    );


    const ageButton =
        document.getElementById(
            "ageButton"
        );


    ageButton.disabled =
        age>=ages.length-1 ||
        gold<
        ages[age].upgradeCost;
}


/* =========================================================
   MELDUNG
========================================================= */

let messageTimeout;


function showMessage(text){

    message.textContent=text;

    message.classList.add(
        "show"
    );


    clearTimeout(
        messageTimeout
    );


    messageTimeout =
        setTimeout(
            ()=>{
                message.classList.remove(
                    "show"
                );
            },
            1800
        );
}


/* =========================================================
   SPIEL ENDE
========================================================= */

function checkGameEnd(){

    if(enemyHP<=0){

        enemyHP=0;

        endGame(
            true,
            "Die feindliche Basis wurde zerstört."
        );

    }


    if(playerHP<=0){

        playerHP=0;

        endGame(
            false,
            "Deine Basis wurde überrannt."
        );

    }

}


function endGame(
    win,
    text
){

    gameRunning=false;


    document.getElementById(
        "resultTitle"
    ).textContent =
        win
        ? "SIEG!"
        : "NIEDERLAGE";


    document.getElementById(
        "resultText"
    ).textContent =
        text+
        " Erreichte Welle: "+
        wave+
        " | Zeitalter: "+
        ages[age].name;


    document.getElementById(
        "overlay"
    ).classList.add(
        "show"
    );
}


/* =========================================================
   NEUES SPIEL
========================================================= */

function newGame(){

    units.forEach(
        unit=>{
            unit.element.remove();
        }
    );


    projectiles.forEach(
        projectile=>{
            projectile.element.remove();
        }
    );


    units=[];
    projectiles=[];


    gold=500;

    playerHP=1000;

    enemyHP=1000;

    age=0;

    wave=1;


    enemySpawnTimer=0;

    passiveGoldTimer=0;

    waveTimer=0;

    specialCooldown=0;


    gameRunning=true;


    document.getElementById(
        "overlay"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "specialButton"
    ).disabled=false;


    updateUI();
}


/* =========================================================
   SPEICHERN
========================================================= */

function saveGame(){

    const saveData={

        gold,
        playerHP,
        enemyHP,
        age,
        wave

    };


    localStorage.setItem(
        "battleAgesSave",
        JSON.stringify(
            saveData
        )
    );


    showMessage(
        "Spiel gespeichert!"
    );
}


/* =========================================================
   LADEN
========================================================= */

function loadGame(){

    const saved =
        localStorage.getItem(
            "battleAgesSave"
        );


    if(!saved)
        return;


    try{

        const data =
            JSON.parse(
                saved
            );


        gold =
            data.gold ??
            500;


        playerHP =
            data.playerHP ??
            1000;


        enemyHP =
            data.enemyHP ??
            1000;


        age =
            data.age ??
            0;


        wave =
            data.wave ??
            1;

    }catch(error){

        console.log(
            "Speicherstand konnte nicht geladen werden."
        );

    }

}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "ageButton"
).onclick =
    nextAge;


document.getElementById(
    "specialButton"
).onclick =
    specialAttack;


document.getElementById(
    "saveButton"
).onclick =
    saveGame;


document.getElementById(
    "resetButton"
).onclick =
    newGame;


/* =========================================================
   TASTATUR
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(event.key==="1")
            buyUnit(0);

        if(event.key==="2")
            buyUnit(1);

        if(event.key==="3")
            buyUnit(2);

        if(
            event.key.toLowerCase()==="q"
        )
            specialAttack();

        if(
            event.key.toLowerCase()==="e"
        )
            nextAge();

    }
);


/* =========================================================
   HAUPTSCHLEIFE
========================================================= */

function gameLoop(now){

    const dt =
        Math.min(
            .05,
            (now-lastTime)/1000
        );


    lastTime=now;


    if(gameRunning){

        updateGold(dt);

        updateEnemySpawning(dt);

        updateWave(dt);

        updateUnits(dt);

        updateProjectiles(dt);

        checkGameEnd();

        updateUI();

    }


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   START
========================================================= */

loadGame();

updateUI();

requestAnimationFrame(
    gameLoop
);

</script>
