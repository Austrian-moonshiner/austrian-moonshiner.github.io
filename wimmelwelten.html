<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4fbff}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07283a}button{font:inherit;cursor:pointer;touch-action:manipulation}#game{display:block;width:100vw;height:100dvh;touch-action:none;cursor:grab}#game:active{cursor:grabbing}.top{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:9px;align-items:center;pointer-events:none;z-index:2}.top>*{pointer-events:auto}.pill,.btn{background:#062e48dc;border:2px solid #ffffff43;color:#fff;border-radius:16px;box-shadow:0 7px 25px #001a2b75}.pill{padding:9px 13px;font-size:13px;backdrop-filter:blur(8px)}.pill b{display:block;font-size:16px}.btn{padding:11px 13px;font-weight:800}.btn:hover{background:#145778}.spacer{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,#06253ff7,#07324ae8);border-top:2px solid #7df3ff4e;padding:9px 12px max(13px,env(safe-area-inset-bottom));z-index:2;box-shadow:0 -12px 40px #00233755}.bottomhead{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:7px}.progress{height:8px;background:#173e54;border-radius:30px;overflow:hidden;max-width:250px;flex:1}.progress>div{height:100%;background:linear-gradient(90deg,#36e8ac,#f6df66);width:0%;transition:width .25s}.targets{display:flex;overflow-x:auto;gap:9px;scrollbar-width:thin;scrollbar-color:#7ad8ef transparent;padding-bottom:3px}.target{flex:0 0 76px;min-height:76px;background:#ffffff14;border:1px solid #ffffff30;color:#fff;border-radius:14px;position:relative;display:grid;place-items:center;padding:4px}.target .emoji{font-size:34px;filter:drop-shadow(0 3px 3px #0005)}.target small{font-size:10px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.target.found{opacity:.42;background:#1db88738}.target.found:after{content:'✓';position:absolute;font-size:35px;color:#86ffbb;text-shadow:0 2px 6px #002}.modalwrap{position:fixed;in </style></head><body>
<canvas id="game" aria-label="Interaktive Wimmelbildkarte"></canvas>
<div class="top"><button class="btn" id="menuBtn" aria-label="Kartenmenü">☰</button><div class="pill"><b id="levelTitle">Wimmelwelten</b><span id="levelDetail">Suchabenteuer</span></div><div class="spacer"></div><div class="pill">⭐ <b id="scoreText">0</b></div><button class="btn" id="hintBtn" title="Tipp zeigen">💡 <span id="hintsText">3</span></button></div>
<div class="zoom"><button class="btn" id="plus" aria-label="Vergrößern">+</button><button class="btn" id="minus" aria-label="Verkleinern">−</button><button class="btn" id="home" aria-label="Karte zentrieren">⌖</button></div>
<div class="bottom"><div class="bottomhead"><span id="missionText">Finde die versteckten Dinge</span><div class="progress"><div id="progbar"></div></div><span id="countText">0 / 0</span></div><div class="targets" id="targets"></div></div>
<div class="modalwrap" id="startOverlay"><div class="modal"><h1>🌈 Wimmelwelten</h1><p>Entdecke riesige, lebendige Wimmelbilder. Auf jeder Runde verstecken sich die Gegenstände an neuen Orten.</p><div class="maps" id="mapGrid"></div><p class="help">👆 Tippen zum Suchen · 👆↔ Ziehen zum Bewegen · 🔎 Vergrößern mit +/− oder zwei Fingern</p><button class="primary" id="continueBtn">Spiel starten ▶</button></div></div>
<div class="modalwrap hide" id="winOverlay"><div class="modal"><h1>🎉 Geschafft!</h1><p id="winText"></p><button class="primary" id="nextBtn">Nächstes Level ▶</button><p><button class="btn" id="backBtn">Zur Kartenauswahl</button></p></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const MAPS=[
 {name:'Ozeanwelt',icon:'🐠',color1:'#57d7ea',color2:'#0672bd',ground:'#137ba1',items:[['🐚','Muschel'],['🦀','Krabbe'],['🐙','Oktopus'],['⭐','Seestern'],['🐢','Schildkröte'],['🦈','Hai'],['🐠','Tropenfisch'],['🐡','Kugelfisch'],['🪼','Qualle'],['🦑','Kalmar'],['🦪','Perle'],['🧜‍♀️','Meerjungfrau'],['⚓','Anker'],['🪸','Koralle'],['🪙','Goldmünze'],['🧭','Kompass'],['🐬','Delfin'],['🦞','Hummer'],['🪣','Eimer'],['🐳','Wal'],['🦭','Robbe'],['🛟','Rettungsring'],['🚢','Schiff'],['💎','Edelstein']]},
 {name:'Zauberwald',icon:'🌳',color1:'#bbef9a',color2:'#28774c',ground:'#477d39',items:[['🍄','Pilz'],['🦊','Fuchs'],['🦉','Eule'],['🐿️','Eichhörnchen'],['🦋','Schmetterling'],['🐸','Frosch'],['🦌','Hirsch'],['🌻','Sonnenblume'],['🐝','Biene'],['🐞','Marienkäfer'],['🐌','Schnecke'],['🦔','Igel'],['🪵','Holz'],['🍓','Erdbeere'],['🧺','Korb'],['🗝️','Schlüssel'],['🪄','Zauberstab'],['💎','Kristall'],['🍎','Apfel'],['🐇','Hase'],['🌰','Kastanie'],['🐻','Bär'],['🦜','Papagei'],['🧚','Fee']]},
 {name:'Bunte Stadt',icon:'🏘️',color1:'#a5efff',color2:'#75bde2',ground:'#e7be83',items:[['🚲','Fahrrad'],['🐈','Katze'],['🐕','Hund'],['🎈','Ballon'],['🛴','Roller'],['🚕','Taxi'],['🧸','Teddy'],['🍦','Eis'],['📮','Briefkasten'],['🧢','Kappe'],['🎸','Gitarre'],['🎁','Geschenk'],['🪁','Drachen'],['🥨','Brezel'],['📷','Kamera'],['🚦','Ampel'],['🦆','Ente'],['🌂','Schirm'],['⚽','Fußball'],['🛹','Skateboard'],['🍩','Donut'],['🧁','Cupcake'],['🚗','Auto'],['🌷','Tulpe']]},
 {name:'Weltraum',icon:'🚀',color1:'#223774',color2:'#0a1033',ground:'#313a78',items:[['🪐','Planet'],['🚀','Rakete'],['👽','Alien'],['🛸','UFO'],['⭐','Stern'],['🌙','Mond'],['☄️','Komet'],['🛰️','Satellit'],['👨‍🚀','Astronaut'],['🔭','Teleskop'],['💫','Sternenstaub'],['🤖','Roboter'],['🔋','Batterie'],['📡','Antenne'],['🧲','Magnet'],['💎','Weltraumkristall'],['🪨','Meteor'],['🌎','Erde'],['🔮','Kugel'],['🪐','Ringplanet'],['⚙️','Zahnrad'],['🧪','Probe'],['🌟','Leuchtstern'],['🎯','Zielscheibe']]}
];
const W=2400,H=1700,STAGES=4,saveKey='wimmelwelten_v3';let data;try{data=JSON.parse(localStorage.getItem(saveKey))||{unlocked:1,score:0}}catch(e){data={unlocked:1,score:0}}
let mapIdx=0,stage=0,things=[],decor=[],particles=[],found=0,hints=3,cam={x:0,y:0,zoom:1},view={w:innerWidth,h:innerHeight},drag=null,helpSpot=null,flash=[],time=0,playing=false,anim=0,pinch=null;
const depth=MAPS.length*STAGES;
function save(){try{localStorage.setItem(saveKey,JSON.stringify(data))}catch(e){}}
function makeArt(){let m=MAPS[mapIdx];decor=[];for(let i=0;i<175;i++){decor.push({x:rnd(-50,W+50),y:rnd(-50,H+50),s:rnd(14,90),kind:i%8,phase:rnd(0,7),tone:rnd(0,1)})}particles=Array.from({length:95},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(2,11),speed:rnd(5,26),phase:rnd(0,6)}));
let entries=m.items.map((it,i)=>({...{icon:it[0],name:it[1],index:i}}));let used=new Set;const amount=8+stage*2;things=[];
function place(entry,target){for(let tries=0;tries<250;tries++){let x=rnd(95,W-95),y=rnd(90,H-90);if(things.some(t=>Math.hypot(t.x-x,t.y-y)<98))continue;things.push({...entry,x,y,size:rnd(37,54),phase:rnd(0,7),target,found:false});return}things.push({...entry,x:rnd(90,W-90),y:rnd(90,H-90),size:45,phase:0,target,found:false})}
for(let i=0;i<amount;i++){let n;do{n=Math.floor(rnd(0,entries.length))}while(used.has(n));used.add(n);place(entries[n],true)}
for(let i=0;i<72;i++){place(entries[Math.floor(rnd(0,entries.length))],false)}
}
function stageName(){return `${MAPS[mapIdx].name} · Level ${stage+1}`}
function begin(idx=mapIdx,s=stage){mapIdx=idx;stage=s;playing=true;found=0;hints=3;helpSpot=null;makeArt();$('startOverlay').classList.add('hide');$('winOverlay').classList.add('hide');$('levelTitle').textContent=MAPS[mapIdx].name;$('levelDetail').textContent=`Level ${stage+1} von ${STAGES}`;$('scoreText').textContent=data.score;$('hintsText').textContent=hints;$('missionText').textContent='Finde diese Gegenstände';center();updateUI()}
function updateUI(){const ts=things.filter(t=>t.target),foundN=ts.filter(t=>t.found).length;found=foundN;$('countText').textContent=`${foundN} / ${ts.length}`;$('progbar').style.width=`${100*foundN/ts.length}%`;$('targets').innerHTML='';ts.forEach(t=>{const b=document.createElement('button');b.className='target'+(t.found?' found':'');b.innerHTML=`<span class="emoji">${t.icon}</span><small>${t.name}</small>`;b.title=t.name;b.onclick=()=>{if(!t.found)announce(`Gesucht: ${t.name}`)};$('targets').appendChild(b)})}
function fit(){let rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);view.w=rect.width;view.h=rect.height;canvas.width=Math.round(view.w*dpr);canvas.height=Math.round(view.h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);constrain()}
function visibleH(){return Math.max(145,view.h-115)}
function center(){cam.zoom=clamp(Math.min(view.w/W,visibleH()/H)*2.5,.5,1.18);cam.x=(W-view.w/cam.zoom)/2;cam.y=(H-visibleH()/cam.zoom)/2;constrain()}
function constrain(){let vw=view.w/cam.zoom,vh=view.h/cam.zoom;cam.x=vw>=W?(W-vw)/2:clamp(cam.x,0,W-vw);cam.y=vh>=H?(H-vh)/2:clamp(cam.y,0,H-vh)}
function zoomBy(mult,sx=view.w/2,sy=visibleH()/2){let x=cam.x+sx/cam.zoom,y=cam.y+sy/cam.zoom;cam.zoom=clamp(cam.zoom*mult,.35,2.3);cam.x=x-sx/cam.zoom;cam.y=y-sy/cam.zoom;constrain()}
function screenToWorld(x,y){return{x:cam.x+x/cam.zoom,y:cam.y+y/cam.zoom}}
function roundBox(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function decorDraw(d,t){let{x,y,s,kind,phase}=d;let wave=Math.sin(t*1.2+phase)*s*.1;ctx.save();ctx.translate(x,y);if(mapIdx===0){if(kind<3){ellipse(0,s*.33,s*.8,s*.25,'#003e7888');for(let i=-2;i<=2;i++){ctx.strokeStyle=['#66da8c','#ffacb8','#c081df'][kind];ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,s*.2);ctx.quadraticCurveTo(i*s*.2+wave,-s*.5,i*s*.22+wave,-s*(.8+Math.abs(i)*.05));ctx.stroke()}}else if(kind===3||kind===4){for(let k=0;k<8;k++){let a=k*Math.PI/4;ellipse(Math.cos(a)*s*.23,Math.sin(a)*s*.15,s*.3,s*.15,kind===3?'#ffab9b':'#9e82df')}ellipse(0,0,s*.25,s*.17,'#f6c68d')}else{ellipse(0,0,s*.8,s*.4,kind===5?'#1171ad':'#125587');ctx.strokeStyle='#78c9de88';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,s*.37,0,Math.PI*1.5);ctx.stroke()}}
else if(mapIdx===1){if(kind<5){ctx.fillStyle='#704b36';roundBox(-s*.09,0,s*.18,s*.8,8);ctx.fill();for(let j=0;j<4;j++)ellipse((j%2?1:-1)*s*.2,(-.16+j*.17)*s,s*.53,s*.36,['#377e46','#528b3f','#77a73c'][kind%3]);}else{ellipse(0,s*.28,s*.4,s*.13,'#356d37');for(let j=0;j<5;j++)ellipse(Math.cos(j*6)*s*.3,Math.sin(j*2)*s*.28,s*.12,s*.12,['#f7ba51','#ef7ba4','#9cd5fa'][kind%3])}}
else if(mapIdx===2){if(kind<5){ctx.fillStyle=['#d89776','#a9d6d0','#f4d078','#9aa6de','#df9dab'][kind];roundBox(-s*.6,-s*.8,s*1.2,s*1.45,7);ctx.fill();ctx.fillStyle='#fff0d5';for(let k=0;k<6;k++)ctx.fillRect(-s*.45+(k%3)*s*.34,-s*.65+Math.floor(k/3)*s*.55,s*.22,s*.3);ctx.fillStyle='#855d65';ctx.beginPath();ctx.moveTo(-s*.65,-s*.8);ctx.lineTo(0,-s*1.18);ctx.lineTo(s*.65,-s*.8);ctx.closePath();ctx.fill()}else{ellipse(0,0,s*.85,s*.3,'#c0a27e');ellipse(0,-s*.2,s*.23,s*.23,'#7ccda2')}}
else{if(kind<4){ellipse(0,0,s*.65,s*.5,['#786abb','#ad83ab','#496eb2','#7a79bc'][kind]);ellipse(s*.1,-s*.1,s*.23,s*.19,'#25336366');ellipse(-s*.27,s*.15,s*.12,s*.11,'#20265b66')}else{ctx.strokeStyle='#b9d8ff74';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,s*.8,s*.25,Math.PI/5,0,Math.PI*2);ctx.stroke();ellipse(0,0,s*.4,s*.4,'#5d82be')}}ctx.restore()}
function draw(t){if(!view.w)return;let m=MAPS[mapIdx],gradient=ctx.createLinearGradient(0,0,0,view.h);gradient.addColorStop(0,m.color1);gradient.addColorStop(1,m.color2);ctx.fillStyle=gradient;ctx.fillRect(0,0,view.w,view.h);
ctx.save();ctx.scale(cam.zoom,cam.zoom);ctx.translate(-cam.x,-cam.y);
// world base
let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,m.color1);bg.addColorStop(1,m.color2);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
if(mapIdx===0){for(let i=0;i<16;i++){let y=100+i*110;ctx.beginPath();for(let x=0;x<=W;x+=20){let yy=y+15*Math.sin(x/140+i*.91+t*.25)+10*Math.sin(x/37+i);if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.strokeStyle=i%2?'#ffffff26':'#cefff036';ctx.lineWidth=10;ctx.stroke()}for(let i=0;i<17;i++){ellipse(100+i*145,H-60+Math.sin(i*2)*30,190,100,'#1376a5')}}
if(mapIdx===1){for(let i=0;i<22;i++){ellipse(i*120,160+40*Math.sin(i*1.3),110,130,'#1f665353')}}
if(mapIdx===2){ctx.fillStyle='#b6a0a0';for(let i=0;i<8;i++)ctx.fillRect(0,i*220+90,W,42);for(let i=0;i<9;i++)ctx.fillRect(i*270+70,0,45,H);ctx.strokeStyle='#ffffffbb';ctx.lineWidth=4;ctx.setLineDash([24,24]);for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(0,i*220+111);ctx.lineTo(W,i*220+111);ctx.stroke()}ctx.setLineDash([])}
if(mapIdx===3){for(let i=0;i<260;i++){let x=(i*127.19)%W,y=(i*317.87)%H;ellipse(x,y,(i%4===0?3:1.5),2,`rgba(255,255,255,${.3+.4*Math.sin(t*1.7+i)**2})`)}}
decor.forEach(d=>decorDraw(d,t));
if(mapIdx===0){particles.forEach(p=>{let yy=(p.y-t*p.speed+H*10)%H,xx=p.x+Math.sin(t+p.phase)*10;ctx.strokeStyle='#e5ffff7c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(xx,yy,p.r,0,Math.PI*2);ctx.stroke()})}else if(mapIdx===1){particles.forEach(p=>ellipse(p.x+Math.sin(t+p.phase)*18,(p.y-t*p.speed*.18+H*10)%H,2.5,2.5,'#ffef9c99'))}
things.forEach(o=>{if(o.found)return;let bob=Math.sin(t*1.1+o.phase)*(mapIdx===0?7:3),sz=o.size;ctx.save();ctx.translate(o.x,o.y+bob);ctx.rotate(Math.sin(t*.55+o.phase)*.035);ellipse(0,sz*.42,sz*.58,sz*.16,'#00334838');ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${sz*1.6}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;ctx.shadowColor='#06334c55';ctx.shadowBlur=5;ctx.fillText(o.icon,0,0);ctx.shadowBlur=0;ctx.restore()});
if(helpSpot&&helpSpot.until>t){let r=55+13*Math.sin(t*6);ctx.strokeStyle='#ffe970';ctx.lineWidth=7;ctx.beginPath();ctx.arc(helpSpot.x,helpSpot.y,r,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(helpSpot.x,helpSpot.y,r+9,0,Math.PI*2);ctx.stroke()}
flash=flash.filter(f=>t-f.t<.7);flash.forEach(f=>{ctx.strokeStyle=f.good?'#a4ffc9':'#fff0b8';ctx.lineWidth=6*(1-(t-f.t)/.7);ctx.beginPath();ctx.arc(f.x,f.y,15+(t-f.t)*80,0,Math.PI*2);ctx.stroke()});ctx.restore();
// border around level
requestAnimationFrame(loop)}
function loop(ms){time=ms/1000;draw(time)}
function announce(text){document.querySelectorAll('.toast').forEach(n=>n.remove());let x=document.createElement('div');x.className='toast';x.textContent=text;document.body.appendChild(x);setTimeout(()=>x.remove(),980)}
function showHint(o,free=false){if(!playing)return;if(!free&&hints<1){announce('Keine Tipps mehr übrig');return}if(!free){hints--;$('hintsText').textContent=hints}helpSpot={x:o.x,y:o.y,until:time+3.6};let sx=(o.x-cam.x)*cam.zoom,sy=(o.y-cam.y)*cam.zoom;if(sx<80||sx>view.w-80||sy<80||sy>visibleH()-85){cam.x=o.x-view.w/(2*cam.zoom);cam.y=o.y-visibleH()/(2*cam.zoom);constrain()}announce(free?`🔎 Suche: ${o.name}`:'💡 Hier ist ein Gegenstand!')}
function findAt(px,py){if(!playing)return;let p=screenToWorld(px,py);let hits=things.filter(o=>!o.found&&Math.hypot((o.x-p.x),(o.y-p.y))<Math.max(40,o.size*.95)).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));let o=hits[0];if(!o){flash.push({x:p.x,y:p.y,t:time,good:false});return}if(!o.target){flash.push({x:p.x,y:p.y,t:time,good:false});announce('Dieses Objekt wird nicht gesucht');return}o.found=true;flash.push({x:o.x,y:o.y,t:time,good:true});data.score+=100+(stage+1)*25;save();$('scoreText').textContent=data.score;updateUI();announce(`✅ ${o.name} gefunden! +${100+(stage+1)*25}`);if(found===8+stage*2){playing=false;let next=mapIdx*STAGES+stage+2;data.unlocked=Math.max(data.unlocked,Math.min(depth,next));save();setTimeout(()=>{$('winText').textContent=`${stageName()} abgeschlossen! Du hast alle ${found} Dinge entdeckt und ${data.score} Punkte gesammelt.`;$('nextBtn').textContent=next<=depth?'Nächstes Level ▶':'Noch einmal spielen ↻';$('winOverlay').classList.remove('hide')},850)}}
function grid(){let html='';MAPS.forEach((m,i)=>{let n=i*STAGES+1,unlocked=data.unlocked>=n;html+=`<button class="map" data-map="${i}" ${unlocked?'':'disabled'}><span>${m.icon}</span><strong>${m.name}</strong><small>${unlocked?`Level 1–${STAGES} · ${Math.min(STAGES,Math.max(0,data.unlocked-n+1))} freigeschaltet`:'🔒 Erst vorige Welt abschließen'}</small></button>`});$('mapGrid').innerHTML=html;document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{const i=+b.dataset.map;let s=clamp(data.unlocked-i*STAGES-1,0,STAGES-1);begin(i,s)})}
function menu(){grid();$('startOverlay').classList.remove('hide')}
$('menuBtn').onclick=menu;$('continueBtn').onclick=()=>{let n=clamp(data.unlocked-1,0,depth-1);begin(Math.floor(n/STAGES),n%STAGES)};$('backBtn').onclick=()=>{$('winOverlay').classList.add('hide');menu()};$('nextBtn').onclick=()=>{let n=mapIdx*STAGES+stage+1;if(n>=depth)n=0;begin(Math.floor(n/STAGES),n%STAGES)};$('hintBtn').onclick=()=>{let a=things.filter(t=>t.target&&!t.found);if(a.length)showHint(a[Math.floor(Math.random()*a.length)])};$('plus').onclick=()=>zoomBy(1.3);$('minus').onclick=()=>zoomBy(1/1.3);$('home').onclick=center;
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;canvas.setPointerCapture(e.pointerId);const p={id:e.pointerId,x:e.clientX,y:e.clientY};if(!drag)drag={id:p.id,x:p.x,y:p.y,startX:p.x,startY:p.y,moved:false};else if(!pinch){pinch={id:p.id,x:p.x,y:p.y};drag.moved=true}});
canvas.addEventListener('pointermove',e=>{if(pinch&&e.pointerId===pinch.id){let dist=Math.hypot(pinch.x-drag.x,pinch.y-drag.y),dist2=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);if(dist>15)zoomBy(dist2/dist,(e.clientX+drag.x)/2,(e.clientY+drag.y)/2);pinch.x=e.clientX;pinch.y=e.clientY;return}if(!drag||e.pointerId!==drag.id)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>9)drag.moved=true;cam.x-=dx/cam.zoom;cam.y-=dy/cam.zoom;constrain();drag.x=e.clientX;drag.y=e.clientY});
function endPointer(e){if(pinch&&e.pointerId===pinch.id){pinch=null;return}if(drag&&e.pointerId===drag.id){if(!drag.moved&&!pinch&&e.clientY<view.h-106)findAt(e.clientX,e.clientY);drag=null;pinch=null}}canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',()=>{drag=null;pinch=null});canvas.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});window.addEventListener('resize',()=>{fit();constrain()});document.addEventListener('keydown',e=>{if(e.key==='Escape')menu();if(e.key==='+')zoomBy(1.25);if(e.key==='-')zoomBy(.8)});fit();grid();requestAnimationFrame(loop);
})();
</script></body></html>
