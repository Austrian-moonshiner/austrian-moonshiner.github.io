<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Battle Ages</title>

<style>

/* =========================================================
   GRUNDLAGEN
   ========================================================= */

*{
    box-sizing:border-box;
    user-select:none;
}

body{
    margin:0;
    background:#070a0d;
    color:#e8edf2;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

#game{
    max-width:1500px;
    margin:auto;
}


/* =========================================================
   STARTSCREEN
   ========================================================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(90,120,140,.2),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #030507,
            #111a20,
            #030507
        );
}

.startBox{
    width:min(700px,100%);

    padding:35px 25px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #18232c,
            #0b1116
        );

    border:2px solid #43535f;

    border-radius:14px;

    box-shadow:
        0 0 30px rgba(0,0,0,.8),
        inset 0 0 25px rgba(0,0,0,.5);
}

.startTitle{
    font-size:42px;
    font-weight:bold;

    letter-spacing:3px;

    color:#e9f1f5;

    text-shadow:
        0 0 10px rgba(100,180,220,.4);
}

.startSubtitle{
    margin-top:8px;
    margin-bottom:30px;

    color:#9daab3;

    font-size:15px;
}

.difficultyTitle{
    font-size:18px;

    margin-bottom:15px;

    color:#dce5ea;
}

.difficultyButtons{
    display:flex;

    gap:14px;

    justify-content:center;

    flex-wrap:wrap;
}

.difficultyButton{
    width:180px;
    min-height:125px;

    border-radius:10px;

    background:
        linear-gradient(
            #27343d,
            #151d23
        );

    border:2px solid #465660;

    color:white;

    cursor:pointer;

    transition:.2s;

    padding:15px;
}

.difficultyButton:hover{
    transform:translateY(-4px);

    background:
        linear-gradient(
            #344650,
            #1a252c
        );
}

.difficultyButton .icon{
    font-size:30px;

    display:block;

    margin-bottom:8px;
}

.difficultyButton strong{
    display:block;

    font-size:18px;

    margin-bottom:7px;
}

.difficultyButton small{
    display:block;

    color:#aeb8be;

    line-height:1.35;
}

.easy:hover{
    border-color:#58c878;

    box-shadow:
        0 0 18px rgba(88,200,120,.25);
}

.medium:hover{
    border-color:#d4b94f;

    box-shadow:
        0 0 18px rgba(212,185,79,.25);
}

.hard:hover{
    border-color:#d75a4e;

    box-shadow:
        0 0 18px rgba(215,90,78,.25);
}

.hidden{
    display:none !important;
}


/* =========================================================
   HUD
   ========================================================= */

#hud{
    background:
        linear-gradient(
            #171e26,
            #0c1117
        );

    border-bottom:2px solid #394652;

    padding:10px;

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:8px;

    position:relative;

    z-index:50;
}

.stat{
    background:#111820;

    border:1px solid #3d4a55;

    border-radius:6px;

    padding:8px 12px;

    min-width:105px;

    text-align:center;

    box-shadow:
        inset 0 0 10px #000;
}

.stat small{
    display:block;

    color:#8e9aa5;

    font-size:11px;
}

.stat b{
    font-size:17px;
}


/* =========================================================
   SCHWIERIGKEIT IM HUD
   ========================================================= */

#difficultyDisplay{
    color:#e4d36a;
}


/* =========================================================
   SCHLACHTFELD
   ========================================================= */

#battlefield{
    position:relative;

    height:540px;

    overflow:hidden;

    border-bottom:4px solid #111;

    transition:
        background 1s ease;
}


/* =========================================================
   HIMMEL
   ========================================================= */

.sky{
    position:absolute;

    inset:0 0 42% 0;

    transition:
        background 1s ease;

    z-index:0;
}


/* =========================================================
   BODEN
   ========================================================= */

.ground{
    position:absolute;

    left:0;
    right:0;

    bottom:0;

    height:43%;

    transition:
        background 1s ease;

    z-index:1;
}


/* =========================================================
   STRASSE
   ========================================================= */

.road{
    position:absolute;

    left:0;
    right:0;

    bottom:65px;

    height:105px;

    transition:
        background 1s ease,
        border-color 1s ease;

    z-index:3;
}

.roadLine{
    position:absolute;

    left:0;
    right:0;

    top:48px;

    height:4px;

    transition:
        background 1s ease;
}


/* =========================================================
   EPOCHEN-HINTERGRÜNDE
   ========================================================= */

/* ---------------------------------------------------------
   STEINZEIT
   --------------------------------------------------------- */

#battlefield.age0 .sky{

    background:
        radial-gradient(
            circle at 70% 18%,
            rgba(255,230,160,.22),
            transparent 18%
        ),
        linear-gradient(
            #526b70,
            #91a09b
        );
}

#battlefield.age0 .ground{

    background:
        radial-gradient(
            ellipse at 15% 45%,
            #59604c 0 8%,
            transparent 9%
        ),
        radial-gradient(
            ellipse at 75% 55%,
            #4b5544 0 7%,
            transparent 8%
        ),
        repeating-linear-gradient(
            0deg,
            #384032 0,
            #384032 8px,
            #2e362c 9px,
            #2e362c 17px
        );
}

#battlefield.age0 .road{

    background:
        repeating-linear-gradient(
            0deg,
            #625d51 0,
            #625d51 15px,
            #575247 16px,
            #575247 30px
        );

    border-top:3px solid #3a3932;
    border-bottom:3px solid #36352f;
}

#battlefield.age0 .roadLine{

    background:
        repeating-linear-gradient(
            90deg,
            #c4aa67 0,
            #c4aa67 40px,
            transparent 40px,
            transparent 90px
        );
}


/* ---------------------------------------------------------
   MITTELALTER
   --------------------------------------------------------- */

#battlefield.age1 .sky{

    background:
        radial-gradient(
            circle at 72% 17%,
            rgba(255,215,150,.18),
            transparent 20%
        ),
        linear-gradient(
            #354b57,
            #73817e
        );
}

#battlefield.age1 .ground{

    background:
        radial-gradient(
            ellipse at 12% 40%,
            #556247 0 8%,
            transparent 9%
        ),
        radial-gradient(
            ellipse at 82% 50%,
            #4a573f 0 7%,
            transparent 8%
        ),
        repeating-linear-gradient(
            0deg,
            #35422e 0,
            #35422e 7px,
            #2c3829 8px,
            #2c3829 15px
        );
}

#battlefield.age1 .road{

    background:
        repeating-linear-gradient(
            0deg,
            #66605a 0,
            #66605a 18px,
            #57524d 19px,
            #57524d 36px
        );

    border-top:3px solid #403d39;
    border-bottom:3px solid #373531;
}

#battlefield.age1 .roadLine{

    background:
        repeating-linear-gradient(
            90deg,
            #8e8062 0,
            #8e8062 45px,
            transparent 45px,
            transparent 90px
        );
}


/* ---------------------------------------------------------
   INDUSTRIEZEITALTER
   --------------------------------------------------------- */

#battlefield.age2 .sky{

    background:
        radial-gradient(
            circle at 65% 20%,
            rgba(210,180,120,.13),
            transparent 22%
        ),
        linear-gradient(
            #39434a,
            #687076
        );
}

#battlefield.age2 .ground{

    background:
        repeating-linear-gradient(
            0deg,
            #2b302e 0,
            #2b302e 8px,
            #242927 9px,
            #242927 16px
        );
}

#battlefield.age2 .road{

    background:
        repeating-linear-gradient(
            0deg,
            #404447 0,
            #404447 15px,
            #373b3d 16px,
            #373b3d 30px
        );

    border-top:3px solid #292c2e;
    border-bottom:3px solid #25282a;
}

#battlefield.age2 .roadLine{

    background:
        repeating-linear-gradient(
            90deg,
            #d2b95d 0,
            #d2b95d 50px,
            transparent 50px,
            transparent 100px
        );
}


/* ---------------------------------------------------------
   MODERNES ZEITALTER
   --------------------------------------------------------- */

#battlefield.age3 .sky{

    background:
        radial-gradient(
            circle at 78% 17%,
            rgba(100,190,255,.2),
            transparent 23%
        ),
        linear-gradient(
            #182f46,
            #567b91
        );
}

#battlefield.age3 .ground{

    background:
        repeating-linear-gradient(
            0deg,
            #252d31 0,
            #252d31 8px,
            #1e2529 9px,
            #1e2529 16px
        );
}

#battlefield.age3 .road{

    background:
        linear-gradient(
            #373c40,
            #292e32
        );

    border-top:3px solid #191d20;
    border-bottom:3px solid #171a1c;
}

#battlefield.age3 .roadLine{

    background:
        repeating-linear-gradient(
            90deg,
            #e4c950 0,
            #e4c950 55px,
            transparent 55px,
            transparent 110px
        );
}


/* ---------------------------------------------------------
   ZUKUNFT
   --------------------------------------------------------- */

#battlefield.age4 .sky{

    background:
        radial-gradient(
            circle at 70% 20%,
            rgba(0,255,255,.22),
            transparent 22%
        ),
        radial-gradient(
            circle at 25% 25%,
            rgba(150,0,255,.18),
            transparent 25%
        ),
        linear-gradient(
            #070b1c,
            #18204a
        );
}

#battlefield.age4 .ground{

    background:
        repeating-linear-gradient(
            0deg,
            #101622 0,
            #101622 8px,
            #0a1019 9px,
            #0a1019 16px
        );
}

#battlefield.age4 .road{

    background:
        linear-gradient(
            #151c2c,
            #0c111c
        );

    border-top:3px solid #243b57;
    border-bottom:3px solid #1c2d42;

    box-shadow:
        inset 0 0 20px rgba(0,220,255,.12);
}

#battlefield.age4 .roadLine{

    background:
        repeating-linear-gradient(
            90deg,
            #32e7ff 0,
            #32e7ff 50px,
            transparent 50px,
            transparent 100px
        );

    box-shadow:
        0 0 8px rgba(40,220,255,.7);
}


/* =========================================================
   GEBÄUDE
   ========================================================= */

.building{
    position:absolute;

    bottom:170px;

    width:105px;
    height:130px;

    background:#333b40;

    border:3px solid #20272b;

    box-shadow:
        7px 8px 0 rgba(0,0,0,.25);

    z-index:2;

    transition:
        background 1s ease,
        border-color 1s ease,
        box-shadow 1s ease;
}

.building:before{
    content:"";

    position:absolute;

    left:-8px;
    right:-8px;

    top:-17px;

    height:20px;

    background:#252c30;

    transform:skewX(-25deg);

    transition:
        background 1s ease;
}

.window{
    position:absolute;

    width:20px;
    height:25px;

    background:#1b2429;

    border:2px solid #56616a;

    transition:
        background 1s ease,
        border-color 1s ease;
}

.window:nth-child(1){
    left:15px;
    top:20px;
}

.window:nth-child(2){
    right:15px;
    top:20px;
}

.window:nth-child(3){
    left:15px;
    top:65px;
}

.window:nth-child(4){
    right:15px;
    top:65px;
}

.b1{
    left:22%;
    height:120px;
}

.b2{
    left:31%;
    height:95px;
}

.b3{
    right:28%;
    height:115px;
}

.b4{
    right:19%;
    height:140px;
}


/* =========================================================
   STEINZEIT-GEBÄUDE
   ========================================================= */

.age0 .building{

    background:
        linear-gradient(
            135deg,
            #756b55,
            #4f4a3d
        );

    border-color:#37352d;

    border-radius:18px 18px 5px 5px;

    box-shadow:
        7px 8px 0 rgba(0,0,0,.3);
}

.age0 .building:before{

    background:
        linear-gradient(
            135deg,
            #403d33,
            #655945
        );

    height:28px;

    top:-20px;
}

.age0 .window{

    background:#171814;

    border-color:#736b55;

    border-radius:50%;
}


/* =========================================================
   MITTELALTER-GEBÄUDE
   ========================================================= */

.age1 .building{

    background:
        repeating-linear-gradient(
            0deg,
            #68645a 0,
            #68645a 14px,
            #4c4a44 15px,
            #4c4a44 18px
        );

    border-color:#292a27;

    box-shadow:
        8px 9px 0 rgba(0,0,0,.4);
}

.age1 .building:before{

    background:
        linear-gradient(
            135deg,
            #292720,
            #4a4030
        );

    height:30px;

    top:-23px;
}

.age1 .window{

    background:#18252a;

    border-color:#8b7850;

    box-shadow:
        inset 0 0 8px rgba(255,190,70,.25);
}


/* =========================================================
   BURGTÜRME IM MITTELALTER
   ========================================================= */

.age1 .b1,
.age1 .b4{

    width:125px;

    border-radius:5px;

    background:
        repeating-linear-gradient(
            90deg,
            #706b61 0,
            #706b61 18px,
            #4c4b47 19px,
            #4c4b47 23px
        );
}

.age1 .b1:after,
.age1 .b4:after{

    content:"";

    position:absolute;

    left:-8px;
    right:-8px;

    top:-20px;

    height:18px;

    background:
        repeating-linear-gradient(
            90deg,
            #55524b 0,
            #55524b 18px,
            transparent 18px,
            transparent 30px
        );

    border-top:3px solid #272723;
}


/* =========================================================
   INDUSTRIE-GEBÄUDE
   ========================================================= */

.age2 .building{

    background:
        linear-gradient(
            90deg,
            #4a5053,
            #303538
        );

    border-color:#202427;

    box-shadow:
        8px 8px 0 rgba(0,0,0,.45);
}

.age2 .building:before{

    background:#24282a;

    height:20px;

    top:-18px;

    transform:none;
}

.age2 .window{

    background:#17252b;

    border-color:#69767a;
}

.age2 .b1:after,
.age2 .b3:after{

    content:"";

    position:absolute;

    width:24px;
    height:75px;

    right:-32px;

    bottom:0;

    background:
        linear-gradient(
            90deg,
            #393d3f,
            #202325
        );

    border:3px solid #171a1c;

    border-radius:12px 12px 2px 2px;
}


/* =========================================================
   MODERNE GEBÄUDE
   ========================================================= */

.age3 .building{

    background:
        linear-gradient(
            90deg,
            #394957,
            #24313c
        );

    border-color:#15202a;

    box-shadow:
        8px 8px 0 rgba(0,0,0,.5);
}

.age3 .building:before{

    background:
        linear-gradient(
            90deg,
            #1c2731,
            #304452
        );

    height:15px;

    top:-15px;

    transform:none;
}

.age3 .window{

    background:#173849;

    border-color:#4d7183;

    box-shadow:
        inset 0 0 8px rgba(70,190,255,.25);
}

.age3 .b1{
    height:150px;
}

.age3 .b2{
    height:180px;
}

.age3 .b3{
    height:160px;
}

.age3 .b4{
    height:200px;
}


/* =========================================================
   ZUKUNFTS-GEBÄUDE
   ========================================================= */

.age4 .building{

    background:
        linear-gradient(
            135deg,
            #18253c,
            #0b1124
        );

    border-color:#254e69;

    box-shadow:
        0 0 15px rgba(0,220,255,.15),
        8px 8px 0 rgba(0,0,0,.5);
}

.age4 .building:before{

    background:
        linear-gradient(
            90deg,
            #112638,
            #1d173c
        );

    height:12px;

    top:-12px;

    transform:none;
}

.age4 .window{

    background:#092536;

    border-color:#1fd7ee;

    box-shadow:
        0 0 7px rgba(20,220,255,.4);
}

.age4 .b1{
    height:170px;
}

.age4 .b2{
    height:210px;
}

.age4 .b3{
    height:190px;
}

.age4 .b4{
    height:230px;
}


/* =========================================================
   ZUKUNFTS-NEONLICHTER
   ========================================================= */

.age4 .building:after{

    content:"";

    position:absolute;

    left:8px;
    right:8px;

    bottom:8px;

    height:3px;

    background:#24e6ff;

    box-shadow:
        0 0 8px #24e6ff,
        0 -25px 0 rgba(160,50,255,.7);

    opacity:.8;
}


/* =========================================================
   BASEN
   ========================================================= */

.base{
    position:absolute;

    bottom:145px;

    width:105px;
    height:185px;

    z-index:20;
}

.playerBase{
    left:15px;
}

.enemyBase{
    right:15px;
}

.baseWall{
    position:absolute;

    bottom:0;
    left:0;

    width:100%;
    height:145px;

    background:
        repeating-linear-gradient(
            90deg,
            #59636a 0,
            #59636a 25px,
            #343c42 25px,
            #343c42 29px
        );

    border:4px solid #20272c;

    transition:
        background 1s ease,
        border-color 1s ease;
}

.baseRoof{
    position:absolute;

    bottom:138px;
    left:-12px;

    width:129px;
    height:30px;

    background:#252d32;

    border:4px solid #171d21;

    transform:skewX(-25deg);

    transition:
        background 1s ease,
        border-color 1s ease;
}

.baseFlag{
    position:absolute;

    top:-45px;
    left:48px;

    width:4px;
    height:48px;

    background:#171c20;
}

.baseFlag:after{
    content:"";

    position:absolute;

    top:0;
    left:4px;

    width:32px;
    height:18px;

    background:#667b85;

    clip-path:
        polygon(
            0 0,
            100% 20%,
            70% 100%,
            0 80%
        );
}

.enemyBase .baseFlag:after{
    background:#8a493d;
}

.baseGun{
    position:absolute;

    bottom:105px;
    left:35px;

    width:38px;
    height:18px;

    background:#151b1f;

    border:3px solid #39444b;

    border-radius:50%;
}

.baseGun:after{
    content:"";

    position:absolute;

    width:42px;
    height:8px;

    right:-32px;
    top:2px;

    background:#11161a;
}

.enemyBase .baseGun{
    transform:scaleX(-1);
}


/* =========================================================
   EPOCHEN-BASEN
   ========================================================= */

.age0 .baseWall{

    background:
        repeating-linear-gradient(
            90deg,
            #756b58 0,
            #756b58 22px,
            #504b3f 23px,
            #504b3f 28px
        );

    border-color:#34332c;
}

.age0 .baseRoof{

    background:#403b31;

    border-color:#282720;
}


.age1 .baseWall{

    background:
        repeating-linear-gradient(
            90deg,
            #777269 0,
            #777269 23px,
            #4a4944 24px,
            #4a4944 29px
        );

    border-color:#2b2b28;
}

.age1 .baseRoof{

    background:#403b32;

    border-color:#25231e;
}


.age2 .baseWall{

    background:
        repeating-linear-gradient(
            90deg,
            #555b5e 0,
            #555b5e 24px,
            #292e31 25px,
            #292e31 29px
        );

    border-color:#202326;
}

.age2 .baseRoof{

    background:#25292b;

    border-color:#15181a;
}


.age3 .baseWall{

    background:
        linear-gradient(
            90deg,
            #455967,
            #263642
        );

    border-color:#14212b;
}

.age3 .baseRoof{

    background:#1e2b35;

    border-color:#10181e;
}


.age4 .baseWall{

    background:
        linear-gradient(
            90deg,
            #182d42,
            #0b1425
        );

    border-color:#1b5874;

    box-shadow:
        0 0 15px rgba(0,220,255,.15);
}

.age4 .baseRoof{

    background:
        linear-gradient(
            90deg,
            #13283d,
            #281644
        );

    border-color:#1c6a88;

    box-shadow:
        0 0 12px rgba(0,220,255,.2);
}


/* =========================================================
   EINHEITEN
   ========================================================= */

.unit{
    position:absolute;

    width:46px;
    height:70px;

    z-index:30;

    transform:
        translate(-50%,-100%);
}

.unit .head{
    position:absolute;

    left:13px;
    top:2px;

    width:21px;
    height:21px;

    background:#c58e68;

    border-radius:50%;

    border:2px solid #20262b;
}

.unit .body{
    position:absolute;

    left:10px;
    top:22px;

    width:27px;
    height:31px;

    background:#56656d;

    border:2px solid #20262b;

    border-radius:4px;
}

.unit .leg{
    position:absolute;

    top:51px;

    width:8px;
    height:18px;

    background:#22292d;

    border-radius:3px;
}

.unit .leg.l{
    left:12px;
}

.unit .leg.r{
    right:12px;
}

.unit .shield{
    position:absolute;

    left:-1px;
    top:26px;

    width:17px;
    height:25px;

    background:#4d6875;

    border:2px solid #172027;

    border-radius:4px;
}

.unit .sword{

function createUnit(

    player=true
){

    const data=
        ages[age].units[type];

    const unit={

        id:Math.random(),

        type:type,

        player:player,

        hp:data.hp,

        maxHP:data.hp,

        x:
            player
            ? 115
            : battlefield.clientWidth-115,

        y:350,

        target:null,

        lastAttack:0,

        dead:false

    };

    units.push(unit);

    renderUnit(unit);

}


/* =========================================================
   EINHEIT RENDERN
   ========================================================= */

function renderUnit(unit){

    if(unit.el)
        return;

    const el=
        document.createElement(
            "div"
        );

    el.className=
        "unit " +
        unit.type;

    el.innerHTML=`

        <div class="head"></div>

        <div class="body"></div>

        <div class="leg l"></div>

        <div class="leg r"></div>

        ${
            unit.type==="warrior"
            ?
            '<div class="shield"></div><div class="sword"></div>'
            :
            ''
        }

        ${
            unit.type==="archer"
            ?
            '<div class="bow"></div><div class="arrowHeld"></div>'
            :
            ''
        }

        ${
            unit.type==="heavy"
            ?
            '<div class="hammer"></div>'
            :
            ''
        }

    `;

    battlefield.appendChild(el);

    unit.el=el;

    updateUnitVisual(unit);

}


/* =========================================================
   EINHEIT VISUALISIEREN
   ========================================================= */

function updateUnitVisual(unit){

    if(!unit.el)
        return;

    unit.el.style.left=
        unit.x+"px";

    unit.el.style.top=
        unit.y+"px";

    if(unit.player){

        unit.el.style.transform=
            "translate(-50%,-100%) scaleX(1)";

    }else{

        unit.el.style.transform=
            "translate(-50%,-100%) scaleX(-1)";

    }

}


/* =========================================================
   EINHEIT KAUFEN
   ========================================================= */

function buyUnit(type){

    if(
        gameOver ||
        !gameStarted
    )
        return;

    const data=
        ages[age].units[type];

    if(gold<data.cost){

        messageEl.textContent=
            "Nicht genug Gold für diese Einheit!";

        return;

    }

    gold-=data.cost;

    createUnit(
        type,
        true
    );

    messageEl.textContent=
        data.name+
        " wurde eingesetzt.";

    updateHUD();

}


/* =========================================================
   ZIEL SUCHEN
   ========================================================= */

function findTarget(unit){

    let best=null;

    let bestDistance=Infinity;

    for(
        const other of units
    ){

        if(other.dead)
            continue;

        if(
            other.player===
            unit.player
        )
            continue;

        const distance=
            Math.abs(
                other.x-unit.x
            );

        if(
            distance<
            bestDistance
        ){

            bestDistance=
                distance;

            best=other;

        }

    }

    return best;

}


/* =========================================================
   ANGREIFEN
   ========================================================= */

function attackUnit(
    attacker,
    target
){

    const now=
        performance.now();

    const data=
        ages[age].units[
            attacker.type
        ];

    if(
        now-attacker.lastAttack<
        data.cooldown
    )
        return;

    attacker.lastAttack=
        now;

    if(
        attacker.type===
        "archer"
    ){

        createArrow(
            attacker,
            target
        );

    }else{

        target.hp-=
            data.damage;

        createHit(
            target.x,
            target.y
        );

        if(
            target.hp<=0
        ){

            killUnit(
                target,
                attacker
            );

        }

    }

}


/* =========================================================
   EINHEIT TÖTEN
   ========================================================= */

function killUnit(
    target,
    killer
){

    if(target.dead)
        return;

    target.dead=true;

    if(target.el)
        target.el.remove();

    if(killer.player){

        let reward;

        if(
            target.type===
            "warrior"
        )
            reward=50;

        else if(
            target.type===
            "archer"
        )
            reward=65;

        else
            reward=110;


        if(
            difficulty===
            difficulties.easy
        )
            reward*=1.15;


        if(
            difficulty===
            difficulties.hard
        )
            reward*=1.25;


        gold+=reward;

        messageEl.textContent=
            "Feind besiegt! +" +
            Math.floor(reward) +
            " Gold";

    }

}


/* =========================================================
   PFEIL
   ========================================================= */

function createArrow(
    attacker,
    target
){

    const arrow={

        x:attacker.x,

        y:attacker.y-38,

        target:target,

        damage:
            ages[age].units.archer.damage,

        speed:8,

        player:
            attacker.player,

        el:
            document.createElement(
                "div"
            )

    };

    arrow.el.className=
        "projectile";

    battlefield.appendChild(
        arrow.el
    );

    projectiles.push(
        arrow
    );

}


/* =========================================================
   KANONENPROJEKTIL
   ========================================================= */

function createCannonProjectile(
    x,
    y,
    target,
    damage
){

    const p={

        x:x,

        y:y,

        target:target,

        damage:damage,

        speed:9,

        el:
            document.createElement(
                "div"
            )

    };

    p.el.className=
        "cannonProjectile";

    battlefield.appendChild(
        p.el
    );

    projectiles.push(p);

}


/* =========================================================
   PROJEKTILE AKTUALISIEREN
   ========================================================= */

function updateProjectiles(){

    for(
        let i=
        projectiles.length-1;
        i>=0;
        i--
    ){

        const p=
            projectiles[i];

        if(
            !p.target ||
            p.target.dead
        ){

            p.el.remove();

            projectiles.splice(
                i,
                1
            );

            continue;
        }

        const dx=
            p.target.x-p.x;

        const dy=
            (
                p.target.y-35
            )-
            p.y;

        const distance=
            Math.sqrt(
                dx*dx+
                dy*dy
            );

        if(
            distance<
            p.speed+4
        ){

            if(
                p.target.hp !==
                undefined
            ){

                p.target.hp-=
                    p.damage;

                createHit(
                    p.target.x,
                    p.target.y
                );

                if(
                    p.target.hp<=0
                ){

                    killUnit(
                        p.target,
                        {
                            player:
                                !p.target.player
                        }
                    );

                }

            }

            p.el.remove();

            projectiles.splice(
                i,
                1
            );

            continue;
        }

        p.x+=
            dx/distance*
            p.speed;

        p.y+=
            dy/distance*
            p.speed;

        p.el.style.left=
            p.x+"px";

        p.el.style.top=
            p.y+"px";

        if(
            p.el.classList.contains(
                "projectile"
            )
        ){

            p.el.style.transform=
                "rotate("+
                Math.atan2(
                    dy,
                    dx
                )+
                "rad)";

        }

    }

}


/* =========================================================
   TREFFER
   ========================================================= */

function createHit(
    x,
    y
){

    const hit=
        document.createElement(
            "div"
        );

    hit.className=
        "hit";

    hit.style.left=
        (x-9)+"px";

    hit.style.top=
        (y-45)+"px";

    battlefield.appendChild(
        hit
    );

    setTimeout(
        ()=>{
            hit.remove();
        },
        250
    );

}


/* =========================================================
   BASISVERTEIDIGUNG
   ========================================================= */

function baseDefense(){

    const now=
        performance.now();


    /* FEINDBASIS */

    if(
        now-enemyBaseTimer>
        1450
    ){

        enemyBaseTimer=
            now;

        let target=null;

        let closest=Infinity;

        for(
            const u of units
        ){

            if(
                u.dead ||
                !u.player
            )
                continue;

            const d=
                Math.abs(
                    u.x-
                    (
                        battlefield.clientWidth-80
                    )
                );

            if(d<closest){

                closest=d;

                target=u;

            }

        }

        if(target){

            const damage=
                (
                    32+
                    age*7+
                    Math.floor(
                        wave/8
                    )*4
                )*
                difficulty.enemyDamage;

            createCannonProjectile(
                battlefield.clientWidth-70,
                330,
                target,
                damage
            );

        }

    }


    /* SPIELERBASIS */

    if(
        now-playerBaseTimer>
        1250
    ){

        playerBaseTimer=
            now;

        let target=null;

        let closest=Infinity;

        for(
            const u of units
        ){

            if(
                u.dead ||
                u.player
            )
                continue;

            const d=u.x;

            if(d<closest){

                closest=d;

                target=u;

            }

        }

        if(target){

            createCannonProjectile(
                75,
                330,
                target,
                ages[age].baseDamage
            );

        }

    }

}


/* =========================================================
   EINHEITEN AKTUALISIEREN
   ========================================================= */

function updateUnits(){

    const now=
        performance.now();

    const playerBaseX=95;

    const enemyBaseX=
        battlefield.clientWidth-95;

    for(
        const unit of units
    ){

        if(unit.dead)
            continue;

        const data=
            ages[age].units[
                unit.type
            ];

        unit.target=
            findTarget(unit);

        if(unit.target){

            const distance=
                Math.abs(
                    unit.target.x-
                    unit.x
                );

            if(
                distance<=
                data.range
            ){

                attackUnit(
                    unit,
                    unit.target
                );

            }else{

                moveUnit(unit);

            }

        }else{

            const baseDistance=
                unit.player
                ?
                enemyBaseX-unit.x
                :
                unit.x-playerBaseX;

            if(
                baseDistance<=
                data.range+20
            ){

                if(
                    now-unit.lastAttack>
                    data.cooldown
                ){

                    unit.lastAttack=
                        now;

                    if(unit.player){

                        enemyHP-=
                            data.baseDamage;

                    }else{

                        playerHP-=
                            data.baseDamage*
                            .7*
                            difficulty.enemyDamage;

                    }

                    createHit(
                        unit.player
                        ?
                        enemyBaseX
                        :
                        playerBaseX,
                        330
                    );

                }

            }else{

                moveUnit(unit);

            }

        }

        updateUnitVisual(unit);

    }

}


/* =========================================================
   EINHEIT BEWEGEN
   ========================================================= */

function moveUnit(unit){

    const speed=
        ages[age].units[
            unit.type
        ].speed;

    if(unit.player){

        unit.x+=speed;

        unit.x=
            Math.min(
                unit.x,
                battlefield.clientWidth-120
            );

    }else{

        unit.x-=speed;

        unit.x=
            Math.max(
                unit.x,
                120
            );

    }

}


/* =========================================================
   TOTE EINHEITEN ENTFERNEN
   ========================================================= */

function removeDeadUnits(){

    units=
        units.filter(
            u=>!u.dead
        );

}


/* =========================================================
   WELLE STARTEN
   ========================================================= */

function startWave(){

    if(
        gameOver ||
        !gameStarted
    )
        return;

    if(waveRunning){

        messageEl.textContent=
            "Diese Welle läuft bereits!";

        return;

    }

    waveRunning=true;

    spawnedWaveEnemies=0;


    let baseCount;


    if(wave<=3){

        baseCount=
            3+wave;

    }else if(wave<=8){

        baseCount=
            5+
            Math.floor(
                wave*.5
            );

    }else{

        baseCount=
            6+
            Math.floor(
                wave*.65
            );

    }


    currentWaveEnemies=
        Math.max(
            2,
            Math.round(
                baseCount*
                difficulty.enemyCount
            )
        );


    enemySpawnTimer=0;


    messageEl.textContent=
        "Welle "+
        wave+
        " beginnt!";

}


/* =========================================================
   GEGNER SPAWNEN
   ========================================================= */

function spawnEnemy(){

    let type;

    const r=
        Math.random();


    if(wave<4){

        type=
            r<.65
            ?
            "warrior"
            :
            "archer";

    }else if(wave<10){

        type=
            r<.55
            ?
            "warrior"
            :
            r<.85
            ?
            "archer"
            :
            "heavy";

    }else{

        type=
            r<.45
            ?
            "warrior"
            :
            r<.75
            ?
            "archer"
            :
            "heavy";

    }


    const base=
        ages[age].units[type];


    const scaling=
        (
            1+
            Math.max(
                0,
                wave-5
            )*.045
        )*
        difficulty.enemyHP;


    const unit={

        id:Math.random(),

        type:type,

        player:false,

        hp:
            base.hp*
            scaling,

        maxHP:
            base.hp*
            scaling,

        x:
            battlefield.clientWidth-115,

        y:350,

        target:null,

        lastAttack:0,

        dead:false

    };


    units.push(unit);

    renderUnit(unit);

    spawnedWaveEnemies++;

}


/* =========================================================
   BOSS
   ========================================================= */

function spawnBoss(){

    const base=
        ages[age].units.heavy;


    const boss={

        id:Math.random(),

        type:"heavy",

        player:false,

        hp:
            base.hp*
            5*
            difficulty.enemyHP,

        maxHP:
            base.hp*
            5*
            difficulty.enemyHP,

        x:
            battlefield.clientWidth-115,

        y:350,

        target:null,

        lastAttack:0,

        dead:false

    };


    units.push(boss);

    renderUnit(boss);


    messageEl.textContent=
        "⚠️ BOSS-EINHEIT ANGRIFF!";

}


/* =========================================================
   ARTILLERIE
   ========================================================= */

function artillery(){

    if(
        gameOver ||
        !gameStarted
    )
        return;

    const cost=250;


    if(gold<cost){

        messageEl.textContent=
            "Artillerie kostet "+
            cost+
            " Gold.";

        return;

    }


    gold-=cost;


    const targets=
        units.filter(
            u=>
                !u.player &&
                !u.dead
        );


    for(
        const enemy of targets
    ){

        enemy.hp-=
            (
                180+
                age*55
            )*
            difficulty.artilleryDamage;


        createExplosion(
            enemy.x,
            enemy.y
        );


        if(enemy.hp<=0){

            killUnit(
                enemy,
                {
                    player:true
                }
            );

        }

    }


    messageEl.textContent=
        "💥 Artillerieschlag ausgeführt!";

    updateHUD();

}


/* =========================================================
   EXPLOSION
   ========================================================= */

function createExplosion(
    x,
    y
){

    const explosion=
        document.createElement(
            "div"
        );

    explosion.className=
        "explosion";

    explosion.style.left=
        (x-15)+"px";

    explosion.style.top=
        (y-45)+"px";

    battlefield.appendChild(
        explosion
    );

    setTimeout(
        ()=>{
            explosion.remove();
        },
        350
    );

}


/* =========================================================
   ZEITALTER-UPGRADE
   ========================================================= */

function upgradeAge(){

    if(
        !gameStarted ||
        gameOver
    )
        return;


    if(
        age>=
        ages.length-1
    ){

        messageEl.textContent=
            "Du bist bereits im höchsten Zeitalter!";

        return;

    }


    const nextAge=
        age+1;


    let cost;


    if(nextAge===1)
        cost=1300;

    else if(nextAge===2)
        cost=3200;

    else if(nextAge===3)
        cost=6500;

    else
        cost=11000;


    const requirements={

        1:5,

        2:12,

        3:20,

        4:45

    };


    const requiredWave=
        requirements[
            nextAge
        ];


    if(
        wave<
        requiredWave
    ){

        messageEl.textContent=
            "Zeitalter noch gesperrt! "+
            "Benötigt: Welle "+
            requiredWave;

        return;

    }


    if(gold<cost){

        messageEl.textContent=
            "Du brauchst "+
            cost+
            " Gold für "+
            ages[nextAge].name;

        return;

    }


    gold-=cost;

    age=nextAge;


    /* WICHTIG:
       Hintergrund und Gebäude wechseln */

    updateAgeVisual();


    messageEl.textContent=
        "⬆️ Neues Zeitalter: "+
        ages[age].name;


    updateButtons();

    updateHUD();

}


/* =========================================================
   GOLD
   ========================================================= */

function generateGold(delta){

    if(!difficulty)
        return;


    goldTimer+=delta;


    if(
        goldTimer>=
        1000
    ){

        const seconds=
            Math.floor(
                goldTimer/1000
            );


        const income=
            ages[age].income*
            difficulty.incomeMultiplier;


        gold+=
            income*
            seconds;


        goldTimer-=
            seconds*1000;

    }

}


/* =========================================================
   SPEICHERN
   ========================================================= */

function saveGame(){

    if(!gameStarted)
        return;


    const difficultyKey=
        Object.keys(
            difficulties
        ).find(
            key=>
                difficulties[key]===
                difficulty
        );


    const save={

        gold:gold,

        playerHP:playerHP,

        enemyHP:enemyHP,

        age:age,

        wave:wave,

        difficulty:
            difficultyKey

    };


    localStorage.setItem(
        "battleAgesSave",
        JSON.stringify(save)
    );


    messageEl.textContent=
        "💾 Spiel gespeichert.";

}


/* =========================================================
   LADEN
   ========================================================= */

function loadGame(){

    const data=
        localStorage.getItem(
            "battleAgesSave"
        );


    if(!data){

        messageEl.textContent=
            "Kein gespeichertes Spiel gefunden.";

        return;

    }


    const save=
        JSON.parse(data);


    gold=
        save.gold ??
        1200;


    playerHP=
        save.playerHP ??
        5000;


    enemyHP=
        save.enemyHP ??
        5000;


    age=
        save.age ??
        0;


    wave=
        save.wave ??
        1;


    const savedDifficulty=
        save.difficulty ??
        "medium";


    difficulty=
        difficulties[
            savedDifficulty
        ];


    gameStarted=true;


    startScreen.classList.add(
        "hidden"
    );


    gameEl.classList.remove(
        "hidden"
    );


    updateAgeVisual();


    messageEl.textContent=
        "📂 Spiel geladen: "+
        difficulty.name;


    updateButtons();

    updateHUD();

}


/* =========================================================
   GAME OVER
   ========================================================= */

function checkGameOver(){

    if(enemyHP<=0){

        enemyHP=0;

        gameOver=true;

        messageEl.textContent=
            "🏆 SIEG! Die feindliche Basis wurde zerstört!";

    }


    if(playerHP<=0){

        playerHP=0;

        gameOver=true;

        messageEl.textContent=
            "💀 NIEDERLAGE! Deine Basis wurde zerstört.";

    }

}


/* =========================================================
   NEUSTART
   ========================================================= */

function restartGame(){

    location.reload();

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function gameLoop(time){

    const delta=
        time-lastTime;

    lastTime=time;


    if(
        !gameOver &&
        gameStarted
    ){

        generateGold(delta);


        waveTimer-=
            delta/1000;


        if(
            waveTimer<=0
        ){

            if(!waveRunning){

                startWave();

            }

        }


        if(waveRunning){

            enemySpawnTimer-=
                delta;


            if(
                enemySpawnTimer<=0 &&
                spawnedWaveEnemies<
                currentWaveEnemies
            ){

                spawnEnemy();


                const baseSpawn=
                    Math.max(
                        700,
                        1250-
                        wave*12
                    );


                enemySpawnTimer=
                    baseSpawn/
                    difficulty.spawnSpeed;

            }


            if(
                spawnedWaveEnemies>=
                currentWaveEnemies
            ){

                waveRunning=false;


                if(
                    wave%10===0
                ){

                    spawnBoss();

                }


                wave++;


                const normalTime=
                    Math.max(
                        18,
                        31-
                        wave*.30
                    );


                waveTimer=
                    normalTime*
                    difficulty.waveTime;


                messageEl.textContent=
                    "Welle abgeschlossen! "+
                    "Nächste Welle in "+
                    Math.ceil(
                        waveTimer
                    )+
                    " Sekunden.";

            }

        }


        updateUnits();

        updateProjectiles();

        baseDefense();

        removeDeadUnits();

        checkGameOver();

        updateHUD();

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   TASTATUR
   ========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            !gameStarted ||
            gameOver
        )
            return;


        if(e.key==="1")
            buyUnit("warrior");


        if(e.key==="2")
            buyUnit("archer");


        if(e.key==="3")
            buyUnit("heavy");


        if(e.key==="4")
            startWave();


        if(e.key==="5")
            artillery();

    }
);


/* =========================================================
   GAME LOOP START
   ========================================================= */

requestAnimationFrame(
    gameLoop
);

</script>
