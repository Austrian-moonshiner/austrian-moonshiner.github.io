<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Bird Blasters</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #79cfff;
}

#gameWrapper {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

#topBar {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 10;
    pointer-events: none;
}

.info {
    background: rgba(0,0,0,.62);
    color: white;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
}

#buttons {
    position: absolute;
    top: 55px;
    right: 10px;
    z-index: 20;

    display: flex;
    gap: 7px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 9px 13px;

    background: rgba(0,0,0,.65);
    color: white;

    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.94);
}

#hint {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);

    background: rgba(0,0,0,.42);
    color: white;

    padding: 7px 12px;
    border-radius: 10px;

    font-size: 13px;
    pointer-events: none;
    text-align: center;
}

#message {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    width: min(420px,90%);

    background: rgba(0,0,0,.86);
    color: white;

    border-radius: 20px;
    padding: 25px;

    text-align: center;

    display: none;

    z-index: 50;

    box-shadow:
        0 10px 35px rgba(0,0,0,.4);
}

#message h1 {
    margin-top: 0;
}

#message button {
    background: #ffc928;
    color: #222;
    font-size: 16px;
    padding: 12px 22px;
}

@media(max-width:600px) {

    .info {
        font-size: 11px;
        padding: 7px 8px;
    }

    button {
        font-size: 11px;
        padding: 7px 9px;
    }

    #hint {
        font-size: 11px;
    }
}

</style>
</head>

<body>

<div id="gameWrapper">

<canvas id="game"></canvas>

<div id="topBar">

    <div class="info" id="levelText">
        Level 1
    </div>

    <div class="info" id="scoreText">
        Punkte: 0
    </div>

    <div class="info" id="birdsText">
        Vögel: 3
    </div>

</div>

<div id="buttons">

    <button id="restartBtn">
        ↻ Neustart
    </button>

    <button id="nextBtn">
        ▶ Nächstes Level
    </button>

</div>

<div id="hint">
    Vogel zurückziehen → loslassen → weit fliegen!
</div>

<div id="message">

    <h1 id="messageTitle">
        Level geschafft!
    </h1>

    <p id="messageText"></p>

    <button id="messageButton">
        Weiter
    </button>

</div>

</div>

<script>

"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 1200;
let H = 700;

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        Math.min(window.devicePixelRatio || 1, 2);

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    W = rect.width;
    H = rect.height;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

/* =========================================================
   PHYSIK
========================================================= */

/*
   Die wichtigsten Werte wurden gegenüber
   der alten Version deutlich erhöht.
*/

const GRAVITY = 620;

/*
   Je höher POWER_MULTIPLIER,
   desto weiter fliegt der Vogel.
*/
const POWER_MULTIPLIER = 8.5;

/*
   Maximale Entfernung,
   um die die Schleuder gezogen werden kann.
*/
const MAX_PULL = 155;

const GROUND_HEIGHT = 80;

/* =========================================================
   SPIELDATEN
========================================================= */

let currentLevel = 1;

let score = 0;

let birds = [];

let currentBird = null;

let objects = [];

let enemies = [];

let particles = [];

let dragging = false;

let levelFinished = false;

let gameRunning = true;

let lastTime = 0;

/* =========================================================
   SCHLEUDER
========================================================= */

const sling = {

    x: 150,

    y: 400
};

/* =========================================================
   LEVEL GENERATOR
========================================================= */

function generateLevel(level) {

    const difficulty =
        Math.min(level, 20);

    const structureCount =
        4 + Math.floor(difficulty * 0.65);

    const enemyCount =
        Math.min(
            2 + Math.floor(difficulty * 0.45),
            11
        );

    const birdCount =
        Math.min(
            3 + Math.floor(difficulty / 3),
            8
        );

    const generatedObjects = [];

    const generatedEnemies = [];

    const baseX = 720;

    /*
       Gebäude werden mit zunehmendem Level
       höher und breiter.
    */

    const width =
        280 + difficulty * 12;

    const height =
        110 + difficulty * 8;

    /*
       Fundament
    */

    generatedObjects.push({
        x: baseX,
        y: H - GROUND_HEIGHT - 25,
        w: width,
        h: 25,
        type: "stone"
    });

    /*
       Vertikale Säulen
    */

    const columns =
        Math.min(
            2 + Math.floor(difficulty / 2),
            5
        );

    for (let i = 0; i < columns; i++) {

        const x =
            baseX +
            20 +
            i *
            ((width - 40) /
             Math.max(columns - 1,1));

        generatedObjects.push({

            x: x - 15,

            y:
                H -
                GROUND_HEIGHT -
                height,

            w: 30,

            h: height,

            type:
                i % 2 === 0
                ? "wood"
                : "stone"
        });
    }

    /*
       Querbalken
    */

    const floors =
        Math.min(
            1 +
            Math.floor(difficulty / 3),
            4
        );

    for (let floor = 0;
         floor < floors;
         floor++) {

        const y =
            H -
            GROUND_HEIGHT -
            height -
            floor * 90;

        generatedObjects.push({

            x: baseX - 20,

            y: y,

            w: width + 40,

            h: 28,

            type:
                floor % 2 === 0
                ? "wood"
                : "stone"
        });
    }

    /*
       Zusätzliche kleinere Blöcke
    */

    const extras =
        Math.min(
            difficulty,
            10
        );

    for (let i = 0; i < extras; i++) {

        generatedObjects.push({

            x:
                baseX +
                random(
                    10,
                    width - 45
                ),

            y:
                H -
                GROUND_HEIGHT -
                height -
                random(
                    20,
                    100 +
                    difficulty * 5
                ),

            w:
                random(35,70),

            h:
                random(35,70),

            type:
                Math.random() > .5
                ? "wood"
                : "stone"
        });
    }

    /*
       Gegner
    */

    for (let i = 0;
         i < enemyCount;
         i++) {

        const x =
            baseX +
            random(
                25,
                width - 25
            );

        const y =
            H -
            GROUND_HEIGHT -
            random(
                55,
                height +
                floors * 80
            );

        generatedEnemies.push({

            x: x,

            y: y,

            radius: 20,

            alive: true,

            vx: 0,

            vy: 0
        });
    }

    return {

        birds:
            birdCount,

        objects:
            generatedObjects,

        enemies:
            generatedEnemies
    };
}

/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(max,value)
    );
}

function random(
    min,
    max
) {

    return Math.random() *
        (max - min) +
        min;
}

function distance(
    x1,
    y1,
    x2,
    y2
) {

    return Math.hypot(
        x2-x1,
        y2-y1
    );
}

/* =========================================================
   LEVEL LADEN
========================================================= */

function loadLevel(level) {

    currentLevel = level;

    const data =
        generateLevel(level);

    objects =
        data.objects.map(o => ({

            ...o,

            vx: 0,

            vy: 0,

            health:
                o.type === "stone"
                ? 2
                : 1,

            alive: true
        }));

    enemies =
        data.enemies.map(e => ({

            ...e,

            alive: true
        }));

    birds = [];

    for (
        let i = 0;
        i < data.birds;
        i++
    ) {

        birds.push({

            x: sling.x,

            y: sling.y,

            radius: 22,

            launched: false,

            active: false,

            vx: 0,

            vy: 0,

            abilityUsed: false,

            type:
                i % 3 === 0
                ? "power"
                : i % 3 === 1
                ? "speed"
                : "normal"
        });
    }

    currentBird = null;

    dragging = false;

    levelFinished = false;

    gameRunning = true;

    hideMessage();

    updateUI();
}

/* =========================================================
   NÄCHSTEN VOGEL
========================================================= */

function prepareNextBird() {

    if (levelFinished)
        return;

    const bird =
        birds.find(
            b =>
                !b.launched &&
                !b.active
        );

    if (!bird) {

        checkLevelState();

        return;
    }

    bird.x = sling.x;

    bird.y = sling.y;

    bird.active = true;

    currentBird = bird;
}

/* =========================================================
   SCHLEUDER ZEICHNEN
========================================================= */

function drawSling() {

    const y = sling.y;

    ctx.save();

    ctx.lineWidth = 15;

    ctx.lineCap = "round";

    ctx.strokeStyle =
        "#613b20";

    /*
       Stangen
    */

    ctx.beginPath();

    ctx.moveTo(
        sling.x - 13,
        y + 50
    );

    ctx.lineTo(
        sling.x - 10,
        y - 50
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        sling.x + 14,
        y + 50
    );

    ctx.lineTo(
        sling.x + 7,
        y - 50
    );

    ctx.stroke();

    /*
       Gummiband
    */

    if (
        currentBird &&
        dragging
    ) {

        ctx.strokeStyle =
            "#392416";

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(
            sling.x - 10,
            y - 40
        );

        ctx.lineTo(
            currentBird.x,
            currentBird.y
        );

        ctx.lineTo(
            sling.x + 7,
            y - 40
        );

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   VOGEL ZEICHNEN
========================================================= */

function drawBird(bird) {

    if (!bird)
        return;

    if (
        !bird.active &&
        !bird.launched
    )
        return;

    ctx.save();

    ctx.translate(
        bird.x,
        bird.y
    );

    /*
       Geschwindigkeit beeinflusst
       die Drehung.
    */

    if (bird.launched) {

        ctx.rotate(
            Math.atan2(
                bird.vy,
                bird.vx
            )
        );
    }

    let bodyColor =
        "#e74732";

    if (
        bird.type === "speed"
    ) {
        bodyColor =
            "#3e91ff";
    }

    if (
        bird.type === "power"
    ) {
        bodyColor =
            "#9b45d1";
    }

    /*
       Körper
    */

    ctx.fillStyle =
        bodyColor;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        bird.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       Bauch
    */

    ctx.fillStyle =
        "#f5c69d";

    ctx.beginPath();

    ctx.arc(
        4,
        8,
        11,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       Augen
    */

    ctx.fillStyle =
        "white";

    ctx.beginPath();

    ctx.arc(
        -7,
        -7,
        7,
        0,
        Math.PI * 2
    );

    ctx.arc(
        7,
        -7,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
        "#222";

    ctx.beginPath();

    ctx.arc(
        -6,
        -6,
        3,
        0,
        Math.PI * 2
    );

    ctx.arc(
        6,
        -6,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       Schnabel
    */

    ctx.fillStyle =
        "#ffad27";

    ctx.beginPath();

    ctx.moveTo(
        0,
        -1
    );

    ctx.lineTo(
        19,
        5
    );

    ctx.lineTo(
        0,
        12
    );

    ctx.closePath();

    ctx.fill();

    /*
       Federn
    */

    ctx.fillStyle =
        bodyColor;

    ctx.beginPath();

    ctx.moveTo(
        -5,
        -19
    );

    ctx.lineTo(
        -11,
        -34
    );

    ctx.lineTo(
        -1,
        -24
    );

    ctx.lineTo(
        8,
        -35
    );

    ctx.lineTo(
        8,
        -18
    );

    ctx.closePath();

    ctx.fill();

    /*
       Spezialtyp Symbol
    */

    if (
        bird.type === "power"
    ) {

        ctx.fillStyle =
            "rgba(255,255,255,.8)";

        ctx.font =
            "bold 12px Arial";

        ctx.fillText(
            "P",
            -4,
            5
        );
    }

    if (
        bird.type === "speed"
    ) {

        ctx.fillStyle =
            "rgba(255,255,255,.8)";

        ctx.font =
            "bold 12px Arial";

        ctx.fillText(
            "S",
            -4,
            5
        );
    }

    ctx.restore();
}

/* =========================================================
   GEGNER ZEICHNEN
========================================================= */

function drawEnemy(enemy) {

    if (!enemy.alive)
        return;

    ctx.save();

    ctx.translate(
        enemy.x,
        enemy.y
    );

    ctx.fillStyle =
        "#78a938";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        enemy.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       Ohren
    */

    ctx.fillStyle =
        "#668f2d";

    ctx.beginPath();

    ctx.arc(
        -14,
        -15,
        8,
        0,
        Math.PI * 2
    );

    ctx.arc(
        14,
        -15,
        8,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       Augen
    */

    ctx.fillStyle =
        "white";

    ctx.beginPath();

    ctx.arc(
        -7,
        -5,
        6,
        0,
        Math.PI * 2
    );

    ctx.arc(
        7,
        -5,
        6,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
        "#222";

    ctx.beginPath();

    ctx.arc(
        -6,
        -5,
        2.5,
        0,
        Math.PI * 2
    );

    ctx.arc(
        6,
        -5,
        2.5,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       Nase
    */

    ctx.fillStyle =
        "#466c24";

    ctx.beginPath();

    ctx.arc(
        0,
        5,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       Mund
    */

    ctx.strokeStyle =
        "#304d18";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.arc(
        0,
        4,
        10,
        .2,
        Math.PI - .2
    );

    ctx.stroke();

    ctx.restore();
}

/* =========================================================
   OBJEKTE ZEICHNEN
========================================================= */

function drawObject(o) {

    if (!o.alive)
        return;

    ctx.save();

    ctx.translate(
        o.x + o.w / 2,
        o.y + o.h / 2
    );

    ctx.fillStyle =
        o.type === "stone"
        ? "#858585"
        : "#b8783c";

    ctx.strokeStyle =
        o.type === "stone"
        ? "#555"
        : "#70451f";

    ctx.lineWidth = 3;

    ctx.fillRect(
        -o.w / 2,
        -o.h / 2,
        o.w,
        o.h
    );

    ctx.strokeRect(
        -o.w / 2,
        -o.h / 2,
        o.w,
        o.h
    );

    if (
        o.type === "wood"
    ) {

        ctx.strokeStyle =
            "rgba(80,40,10,.4)";

        for (
            let y = -o.h / 2 + 12;
            y < o.h / 2;
            y += 18
        ) {

            ctx.beginPath();

            ctx.moveTo(
                -o.w / 2 + 4,
                y
            );

            ctx.lineTo(
                o.w / 2 - 4,
                y
            );

            ctx.stroke();
        }
    }

    if (
        o.type === "stone"
    ) {

        ctx.strokeStyle =
            "rgba(40,40,40,.3)";

        ctx.beginPath();

        ctx.moveTo(
            -o.w / 3,
            -o.h / 5
        );

        ctx.lineTo(
            0,
            0
        );

        ctx.lineTo(
            o.w / 3,
            -o.h / 5
        );

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   TRAJEKTORIE
========================================================= */

function drawTrajectory() {

    if (
        !dragging ||
        !currentBird
    )
        return;

    const dx =
        sling.x -
        currentBird.x;

    const dy =
        sling.y -
        currentBird.y;

    const power =
        POWER_MULTIPLIER;

    let vx =
        dx * power;

    let vy =
        dy * power;

    let x =
        currentBird.x;

    let y =
        currentBird.y;

    ctx.fillStyle =
        "rgba(255,255,255,.65)";

    /*
       deutlich längere Vorschau
    */

    for (
        let i = 0;
        i < 70;
        i++
    ) {

        x += vx * .035;

        y += vy * .035;

        vy +=
            GRAVITY * .035;

        if (
            i % 3 === 0
        ) {

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }
}

/* =========================================================
   PARTIKEL
========================================================= */

function createParticles(
    x,
    y,
    amount
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        particles.push({

            x: x,

            y: y,

            vx:
                random(-300,300),

            vy:
                random(-350,50),

            life:
                random(.4,.9),

            size:
                random(3,7)
        });
    }
}

function updateParticles(dt) {

    for (
        const p of particles
    ) {

        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;

        p.vy +=
            GRAVITY * dt;

        p.life -= dt;
    }

    particles =
        particles.filter(
            p => p.life > 0
        );
}

function drawParticles() {

    for (
        const p of particles
    ) {

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            "#d89542";

        ctx.fillRect(
            p.x - p.size/2,
            p.y - p.size/2,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha = 1;
}

/* =========================================================
   HINTERGRUND
========================================================= */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#66c5ff"
    );

    gradient.addColorStop(
        1,
        "#e0f6ff"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
       Wolken
    */

    ctx.fillStyle =
        "rgba(255,255,255,.7)";

    drawCloud(
        250,
        120,
        1
    );

    drawCloud(
        550,
        180,
        .7
    );

    drawCloud(
        900,
        100,
        .8
    );

    /*
       Hügel
    */

    ctx.fillStyle =
        "#78b45a";

    ctx.beginPath();

    ctx.moveTo(
        0,
        H - GROUND_HEIGHT
    );

    ctx.quadraticCurveTo(
        W*.25,
        H-160,
        W*.5,
        H-GROUND_HEIGHT
    );

    ctx.quadraticCurveTo(
        W*.75,
        H-140,
        W,
        H-GROUND_HEIGHT
    );

    ctx.closePath();

    ctx.fill();

    /*
       Boden
    */

    ctx.fillStyle =
        "#62a946";

    ctx.fillRect(
        0,
        H-GROUND_HEIGHT,
        W,
        GROUND_HEIGHT
    );

    ctx.fillStyle =
        "#4b8435";

    ctx.fillRect(
        0,
        H-GROUND_HEIGHT,
        W,
        10
    );
}

function drawCloud(
    x,
    y,
    scale
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        scale
    );

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        28,
        0,
        Math.PI*2
    );

    ctx.arc(
        30,
        -10,
        35,
        0,
        Math.PI*2
    );

    ctx.arc(
        65,
        0,
        27,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}

/* =========================================================
   BIRD PHYSIK
========================================================= */

function updateBird(
    bird,
    dt
) {

    if (
        !bird ||
        !bird.launched
    )
        return;

    /*
       Geschwindigkeitstypen
    */

    let gravity =
        GRAVITY;

    if (
        bird.type === "speed"
    ) {

        gravity =
            GRAVITY * .82;
    }

    if (
        bird.type === "power"
    ) {

        gravity =
            GRAVITY * 1.05;
    }

    bird.vy +=
        gravity * dt;

    bird.x +=
        bird.vx * dt;

    bird.y +=
        bird.vy * dt;

    /*
       Luftreibung
    */

    bird.vx *=
        Math.pow(.999,dt*60);

    /*
       Boden
    */

    const ground =
        H -
        GROUND_HEIGHT -
        bird.radius;

    if (
        bird.y > ground
    ) {

        bird.y = ground;

        if (
            Math.abs(
                bird.vy
            ) > 100
        ) {

            bird.vy *= -.32;

            bird.vx *= .68;

        } else {

            bird.vy = 0;

            bird.vx *= .91;
        }
    }
}

/* =========================================================
   OBJEKT PHYSIK
========================================================= */

function updateObjects(dt) {

    for (
        const o of objects
    ) {

        if (!o.alive)
            continue;

        o.vy +=
            GRAVITY * dt;

        o.x +=
            o.vx * dt;

        o.y +=
            o.vy * dt;

        o.vx *=
            Math.pow(.97,dt*60);

        const ground =
            H -
            GROUND_HEIGHT;

        if (
            o.y + o.h >
            ground
        ) {

            o.y =
                ground - o.h;

            if (
                Math.abs(
                    o.vy
                ) > 100
            ) {

                o.vy *= -.18;

            } else {

                o.vy = 0;
            }

            o.vx *= .7;
        }
    }
}

/* =========================================================
   KOLLISION
========================================================= */

function circleRectCollision(
    circle,
    rect
) {

    const closestX =
        clamp(
            circle.x,
            rect.x,
            rect.x + rect.w
        );

    const closestY =
        clamp(
            circle.y,
            rect.y,
            rect.y + rect.h
        );

    const dx =
        circle.x -
        closestX;

    const dy =
        circle.y -
        closestY;

    return (
        Math.hypot(dx,dy)
        <
        circle.radius
    );
}

/* =========================================================
   KOLLISIONEN BEARBEITEN
========================================================= */

function handleCollisions() {

    if (
        !currentBird ||
        !currentBird.launched
    )
        return;

    /*
       Objekt-Kollision
    */

    for (
        const o of objects
    ) {

        if (!o.alive)
            continue;

        if (
            circleRectCollision(
                currentBird,
                o
            )
        ) {

            const speed =
                Math.hypot(
                    currentBird.vx,
                    currentBird.vy
                );

            if (
                speed > 150
            ) {

                let damage =
                    1;

                /*
                   Power-Vogel macht
                   mehr Schaden.
                */

                if (
                    currentBird.type ===
                    "power"
                ) {

                    damage = 2;
                }

                /*
                   sehr schneller Treffer
                */

                if (
                    speed > 700
                ) {

                    damage++;
                }

                o.health -=
                    damage;

                o.vx +=
                    currentBird.vx *
                    .055;

                o.vy +=
                    currentBird.vy *
                    .055;

                currentBird.vx *=
                    .55;

                currentBird.vy *=
                    .55;

                createParticles(
                    currentBird.x,
                    currentBird.y,
                    12
                );

                if (
                    o.health <= 0
                ) {

                    o.alive = false;

                    score +=
                        o.type ===
                        "stone"
                        ? 150
                        : 100;

                    createParticles(
                        o.x + o.w/2,
                        o.y + o.h/2,
                        20
                    );

                    updateUI();
                }
            }
        }
    }

    /*
       Gegner
    */

    for (
        const enemy of enemies
    ) {

        if (!enemy.alive)
            continue;

        const d =
            distance(
                currentBird.x,
                currentBird.y,
                enemy.x,
                enemy.y
            );

        if (
            d <
            currentBird.radius +
            enemy.radius
        ) {

            const speed =
                Math.hypot(
                    currentBird.vx,
                    currentBird.vy
                );

            if (
                speed > 120
            ) {

                enemy.alive =
                    false;

                score += 500;

                createParticles(
                    enemy.x,
                    enemy.y,
                    25
                );

                currentBird.vx *= .6;

                currentBird.vy *= .6;

                updateUI();
            }
        }
    }
}

/* =========================================================
   SPEZIALFÄHIGKEIT
========================================================= */

function activateAbility() {

    if (
        !currentBird ||
        !currentBird.launched ||
        currentBird.abilityUsed
    )
        return;

    currentBird.abilityUsed =
        true;

    /*
       Speed-Vogel:
       kurzer Geschwindigkeitsschub
    */

    if (
        currentBird.type === "speed"
    ) {

        currentBird.vx *= 1.8;

        currentBird.vy *= .75;
    }

    /*
       Power-Vogel:
       Explosion
    */

    else if (
        currentBird.type === "power"
    ) {

        const radius = 115;

        createParticles(
            currentBird.x,
            currentBird.y,
            45
        );

        for (
            const enemy of enemies
        ) {

            if (!enemy.alive)
                continue;

            const d =
                distance(
                    currentBird.x,
                    currentBird.y,
                    enemy.x,
                    enemy.y
                );

            if (
                d < radius
            ) {

                enemy.alive =
                    false;

                score += 500;
            }
        }

        for (
            const o of objects
        ) {

            if (!o.alive)
                continue;

            const ox =
                o.x + o.w/2;

            const oy =
                o.y + o.h/2;

            const d =
                distance(
                    currentBird.x,
                    currentBird.y,
                    ox,
                    oy
                );

            if (
                d < radius
            ) {

                o.health -= 2;

                if (
                    o.health <= 0
                ) {

                    o.alive =
                        false;

                    score +=
                        o.type ===
                        "stone"
                        ? 150
                        : 100;
                }
            }
        }

        updateUI();
    }

    /*
       Normaler Vogel:
       kleiner Schub
    */

    else {

        currentBird.vx *= 1.25;
        currentBird.vy *= .88;
    }
}

/* =========================================================
   VOGEL FERTIG
========================================================= */

function checkBirdFinished() {

    if (
        !currentBird ||
        !currentBird.launched
    )
        return;

    const speed =
        Math.hypot(
            currentBird.vx,
            currentBird.vy
        );

    const outside =
        currentBird.x >
            W + 150 ||

        currentBird.x <
            -150 ||

        currentBird.y >
            H + 150;

    const stopped =
        speed < 25 &&
        currentBird.y >
            H-GROUND_HEIGHT-70;

    if (
        outside ||
        stopped
    ) {

        currentBird.active =
            false;

        currentBird.launched =
            true;

        currentBird = null;

        prepareNextBird();
    }
}

/* =========================================================
   LEVELSTATUS
========================================================= */

function checkLevelState() {

    const remainingEnemies =
        enemies.filter(
            e => e.alive
        ).length;

    if (
        remainingEnemies === 0
    ) {

        finishLevel(true);

        return;
    }

    const remainingBirds =
        birds.filter(
            b =>
                !b.launched &&
                !b.active
        ).length;

    if (
        remainingBirds === 0 &&
        !currentBird
    ) {

        finishLevel(false);
    }
}

/* =========================================================
   LEVEL BEENDET
========================================================= */

function finishLevel(success) {

    if (
        levelFinished
    )
        return;

    levelFinished =
        true;

    gameRunning =
        false;

    if (success) {

        const unused =
            birds.filter(
                b => !b.launched
            ).length;

        const bonus =
            unused * 250;

        score += bonus;

        let stars = 1;

        if (
            unused >= 2
        )
            stars = 2;

        if (
            unused >= 4
        )
            stars = 3;

        document.getElementById(
            "messageTitle"
        ).textContent =
            "Level geschafft! 🎉";

        document.getElementById(
            "messageText"
        ).innerHTML =

            "Punkte: <strong>" +
            score +
            "</strong><br><br>" +

            "Bonus: +" +
            bonus +
            "<br><br>" +

            "Bewertung: " +
            "⭐".repeat(stars);

        document.getElementById(
            "messageButton"
        ).textContent =

            currentLevel < 20
            ? "Nächstes Level"
            : "Nochmal von vorne";

    } else {

        document.getElementById(
            "messageTitle"
        ).textContent =
            "Nicht geschafft!";

        document.getElementById(
            "messageText"
        ).innerHTML =

            "Die Grunzer haben überlebt.<br><br>" +
            "Dieses Mal war die Schleuder wohl etwas zu freundlich.";

        document.getElementById(
            "messageButton"
        ).textContent =
            "Nochmal versuchen";
    }

    document.getElementById(
        "message"
    ).style.display =
        "block";

    updateUI();
}

/* =========================================================
   UI
========================================================= */

function updateUI() {

    document.getElementById(
        "levelText"
    ).textContent =
        "Level " +
        currentLevel;

    document.getElementById(
        "scoreText"
    ).textContent =
        "Punkte: " +
        score;

    document.getElementById(
        "birdsText"
    ).textContent =
        "Vögel: " +
        birds.filter(
            b => !b.launched
        ).length;
}

function hideMessage() {

    document.getElementById(
        "message"
    ).style.display =
        "none";
}

/* =========================================================
   POINTER
========================================================= */

function getPointerPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    let x;
    let y;

    if (
        event.touches &&
        event.touches.length
    ) {

        x =
            event.touches[0].clientX -
            rect.left;

        y =
            event.touches[0].clientY -
            rect.top;

    } else {

        x =
            event.clientX -
            rect.left;

        y =
            event.clientY -
            rect.top;
    }

    return {
        x,
        y
    };
}

/* =========================================================
   DRAG START
========================================================= */

function pointerDown(event) {

    if (
        !gameRunning ||
        !currentBird ||
        currentBird.launched
    )
        return;

    const p =
        getPointerPosition(event);

    const d =
        distance(
            p.x,
            p.y,
            currentBird.x,
            currentBird.y
        );

    if (
        d < 55
    ) {

        dragging = true;

        event.preventDefault();
    }
}

/* =========================================================
   DRAG
========================================================= */

function pointerMove(event) {

    if (
        !dragging ||
        !currentBird
    )
        return;

    const p =
        getPointerPosition(event);

    let dx =
        p.x -
        sling.x;

    let dy =
        p.y -
        sling.y;

    /*
       Maximale Zugweite
    */

    const len =
        Math.hypot(
            dx,
            dy
        );

    if (
        len > MAX_PULL
    ) {

        dx =
            dx / len *
            MAX_PULL;

        dy =
            dy / len *
            MAX_PULL;
    }

    /*
       Vogel soll überwiegend
       hinter der Schleuder bleiben.
    */

    dx =
        Math.min(
            dx,
            20
        );

    currentBird.x =
        sling.x + dx;

    currentBird.y =
        sling.y + dy;

    event.preventDefault();
}

/* =========================================================
   LOSLASSEN
========================================================= */

function pointerUp(event) {

    /*
       Falls kein Vogel gezogen wurde
    */

    if (
        !dragging ||
        !currentBird
    )
        return;

    dragging = false;

    const dx =
        sling.x -
        currentBird.x;

    const dy =
        sling.y -
        currentBird.y;

    /*
       HIER steckt die entscheidende
       Änderung gegenüber der alten Version.

       Durch POWER_MULTIPLIER = 8.5
       wird wesentlich mehr Geschwindigkeit
       erzeugt.
    */

    let multiplier =
        POWER_MULTIPLIER;

    /*
       Geschwindigkeitstypen
    */

    if (
        currentBird.type === "speed"
    ) {

        multiplier *= 1.18;
    }

    if (
        currentBird.type === "power"
    ) {

        multiplier *= .95;
    }

    currentBird.vx =
        dx * multiplier;

    currentBird.vy =
        dy * multiplier;

    currentBird.launched =
        true;

    currentBird.active =
        true;

    score += 50;

    updateUI();

    event.preventDefault();
}

/* =========================================================
   EVENT HANDLER
========================================================= */

canvas.addEventListener(
    "mousedown",
    pointerDown
);

canvas.addEventListener(
    "mousemove",
    pointerMove
);

window.addEventListener(
    "mouseup",
    pointerUp
);

canvas.addEventListener(
    "touchstart",
    pointerDown,
    {
        passive:false
    }
);

canvas.addEventListener(
    "touchmove",
    pointerMove,
    {
        passive:false
    }
);

window.addEventListener(
    "touchend",
    pointerUp,
    {
        passive:false
    }
);

/*
   Spezialfähigkeit:
   Klick während des Fluges.
*/

canvas.addEventListener(
    "click",
    function(event) {

        if (
            !dragging &&
            currentBird &&
            currentBird.launched
        ) {

            activateAbility();
        }
    }
);

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "restartBtn"
).addEventListener(
    "click",
    function() {

        loadLevel(
            currentLevel
        );

        prepareNextBird();
    }
);

document.getElementById(
    "nextBtn"
).addEventListener(
    "click",
    function() {

        if (
            currentLevel < 20
        ) {

            loadLevel(
                currentLevel + 1
            );

            prepareNextBird();

        } else {

            score = 0;

            loadLevel(1);

            prepareNextBird();
        }
    }
);

document.getElementById(
    "messageButton"
).addEventListener(
    "click",
    function() {

        if (
            levelFinished &&
            enemies.every(
                e => !e.alive
            )
        ) {

            if (
                currentLevel < 20
            ) {

                loadLevel(
                    currentLevel + 1
                );

                prepareNextBird();

            } else {

                score = 0;

                loadLevel(1);

                prepareNextBird();
            }

        } else {

            loadLevel(
                currentLevel
            );

            prepareNextBird();
        }
    }
);

/* =========================================================
   UPDATE
========================================================= */

function update(dt) {

    if (!gameRunning) {

        updateParticles(dt);

        return;
    }

    if (
        currentBird &&
        currentBird.launched
    ) {

        updateBird(
            currentBird,
            dt
        );

        handleCollisions();

        checkBirdFinished();
    }

    updateObjects(dt);

    updateParticles(dt);

    checkLevelState();
}

/* =========================================================
   DRAW
========================================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    sling.y =
        Math.min(
            H -
            GROUND_HEIGHT -
            70,

            H * .72
        );

    drawSling();

    drawTrajectory();

    for (
        const o of objects
    ) {

        drawObject(o);
    }

    for (
        const enemy of enemies
    ) {

        drawEnemy(enemy);
    }

    for (
        const bird of birds
    ) {

        if (
            bird.active
        ) {

            drawBird(bird);
        }
    }

    drawParticles();
}

/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(timestamp) {

    if (!lastTime)
        lastTime =
            timestamp;

    let dt =
        (timestamp -
         lastTime) / 1000;

    dt =
        Math.min(
            dt,
            .033
        );

    lastTime =
        timestamp;

    update(dt);

    draw();

    requestAnimationFrame(
        gameLoop
    );
}

/* =========================================================
   START
========================================================= */

resizeCanvas();

loadLevel(1);

prepareNextBird();

requestAnimationFrame(
    gameLoop
);

</script>
