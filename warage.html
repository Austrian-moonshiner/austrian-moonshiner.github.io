<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>Battle Ages - Warfront</title>

<style>

*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#05070b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

#game{
    width:100%;
    max-width:1500px;
    margin:auto;
    min-height:100vh;
    background:#080c12;
}

/* HEADER */

.header{
    min-height:74px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 18px;
    background:
        linear-gradient(
            180deg,
            #101923,
            #080d13
        );
    border-bottom:1px solid #253845;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:3px;
    color:#51dcff;
    text-shadow:
        0 0 10px rgba(50,210,255,.55);
}

.logo small{
    display:block;
    font-size:9px;
    letter-spacing:4px;
    color:#718591;
    margin-top:3px;
}

.stats{
    display:flex;
    gap:9px;
    align-items:center;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.stat{
    min-width:85px;
    padding:7px 12px;
    text-align:center;
    border:1px solid #284252;
    border-radius:7px;
    background:#09131b;
}

.stat span{
    display:block;
    font-size:9px;
    color:#708692;
    letter-spacing:1px;
}

.stat strong{
    display:block;
    margin-top:2px;
    font-size:17px;
    color:#ffd85a;
}

.age{
    min-width:125px;
}

.age strong{
    color:#54ddff;
    font-size:13px;
}

/* GAME AREA */

#arena{
    position:relative;
    width:100%;
    height:500px;
    overflow:hidden;
    background:#0b151d;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* CONTROLS */

.controls{
    padding:14px;
    background:
        linear-gradient(
            180deg,
            #0b141c,
            #060a0f
        );
    border-top:1px solid #203440;
}

.sectionTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:9px;
}

.sectionTitle b{
    font-size:13px;
    letter-spacing:1px;
    color:#61ddff;
}

.sectionTitle span{
    font-size:10px;
    color:#687c87;
}

.units{
    display:grid;
    grid-template-columns:
        repeat(5,minmax(130px,1fr));
    gap:8px;
}

.unitButton{
    min-height:92px;
    position:relative;
    padding:9px;
    text-align:left;
    color:#eaf7fb;
    border:1px solid #294554;
    border-radius:8px;
    background:
        linear-gradient(
            145deg,
            #10222d,
            #091219
        );
    transition:.12s;
}

.unitButton:hover{
    border-color:#54ddff;
    transform:translateY(-2px);
}

.unitButton:active{
    transform:translateY(1px);
}

.unitButton.locked{
    opacity:.38;
}

.unitButton.disabled{
    opacity:.45;
}

.unitNumber{
    position:absolute;
    top:7px;
    right:8px;
    color:#566d79;
    font-size:10px;
}

.unitIcon{
    float:left;
    width:40px;
    height:54px;
    margin-right:8px;
    position:relative;
}

.iconHead{
    position:absolute;
    left:11px;
    top:3px;
    width:17px;
    height:17px;
    border-radius:50%;
    background:#b77e58;
    border:2px solid #202c31;
}

.iconBody{
    position:absolute;
    left:8px;
    top:20px;
    width:24px;
    height:31px;
    border-radius:7px 7px 3px 3px;
    background:#536b76;
    border:2px solid #8aa5ae;
}

.unitName{
    font-weight:bold;
    font-size:12px;
    padding-right:10px;
}

.unitInfo{
    margin-top:5px;
    font-size:9px;
    line-height:1.5;
    color:#78909c;
}

.unitCost{
    position:absolute;
    right:8px;
    bottom:7px;
    color:#ffd95a;
    font-size:11px;
    font-weight:bold;
}

.bottomControls{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.controlButton{
    flex:1;
    min-height:46px;
    border-radius:7px;
    border:1px solid #2b4c5c;
    background:#0b1720;
    color:#eaf8fc;
    font-weight:bold;
}

.controlButton:hover{
    border-color:#55dcff;
}

.controlButton.ageUp{
    border-color:#c89b35;
    background:
        linear-gradient(
            180deg,
            #49370d,
            #241b08
        );
    color:#ffe59a;
}

.controlButton.start{
    border-color:#39d99b;
    color:#a4ffda;
}

/* LOG */

.log{
    height:74px;
    margin-top:10px;
    padding:7px;
    overflow:hidden;
    border:1px solid #1d3541;
    border-radius:6px;
    background:#05090d;
    font-family:monospace;
    font-size:9px;
    color:#718791;
}

.log div{
    margin-bottom:2px;
}

.log .good{
    color:#54e0a0;
}

.log .bad{
    color:#ff6a70;
}

.log .info{
    color:#63d9ff;
}

/* RESULT */

#result{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(4px);
}

.resultBox{
    width:min(420px,90%);
    padding:32px;
    text-align:center;
    border:1px solid #3c6375;
    border-radius:12px;
    background:
        linear-gradient(
            145deg,
            #10222d,
            #060b10
        );
    box-shadow:
        0 0 50px rgba(0,0,0,.7);
}

.resultBox h1{
    margin:0;
    font-size:40px;
    color:#59e2ff;
}

.resultBox p{
    color:#92a5ad;
    line-height:1.5;
}

.resultBox button{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:1px solid #49dfff;
    border-radius:7px;
    background:#09384a;
    color:#fff;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:850px){

    .header{
        flex-direction:column;
        gap:9px;
    }

    .stats{
        width:100%;
        justify-content:center;
    }

    #arena{
        height:430px;
    }

    .units{
        grid-template-columns:
            repeat(2,1fr);
    }
}

@media(max-width:480px){

    .logo{
        font-size:19px;
    }

    .stat{
        min-width:70px;
        padding:6px;
    }

    .stat strong{
        font-size:14px;
    }

    #arena{
        height:400px;
    }

    .units{
        grid-template-columns:1fr;
    }

    .unitButton{
        min-height:75px;
    }
}

</style>
</head>

<body>

<div id="game">

<header class="header">

    <div class="logo">
        BATTLE AGES
        <small>WARFRONT</small>
    </div>

    <div class="stats">

        <div class="stat">
            <span>GOLD</span>
            <strong id="gold">500</strong>
        </div>

        <div class="stat">
            <span>EINKOMMEN</span>
            <strong id="income">+10/s</strong>
        </div>

        <div class="stat">
            <span>DEINE BASIS</span>
            <strong id="playerHP">1000</strong>
        </div>

        <div class="stat age">
            <span>ZEITALTER</span>
            <strong id="ageName">
                STEINZEIT
            </strong>
        </div>

    </div>

</header>


<main id="arena">

    <canvas id="canvas"></canvas>

</main>


<section class="controls">

    <div class="sectionTitle">
        <b>EINHEITEN</b>
        <span id="unitMessage">
            Wähle eine Einheit für deine Armee
        </span>
    </div>

    <div
        class="units"
        id="unitButtons">
    </div>

    <div class="bottomControls">

        <button
            class="controlButton start"
            id="pause">
            ⏸ PAUSE
        </button>

        <button
            class="controlButton ageUp"
            id="ageUp">
            ZEITALTER
        </button>

        <button
            class="controlButton"
            id="restart">
            ↻ NEUSTART
        </button>

    </div>

    <div
        class="log"
        id="log">
    </div>

</section>

</div>


<div id="result">

    <div class="resultBox">

        <h1 id="resultTitle">
            SIEG
        </h1>

        <p id="resultText">
            Die gegnerische Basis wurde zerstört.
        </p>

        <button id="resultRestart">
            NEUES SPIEL
        </button>

    </div>

</div>


<script>

/* ============================================================
   BATTLE AGES
   Eigenständiges 2D-Side-Strategy-Spiel
============================================================ */


/* ============================================================
   CANVAS
============================================================ */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W = 1200;
let H = 500;

function resize(){

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        rect.width;

    H =
        rect.height;

    canvas.width =
        W*dpr;

    canvas.height =
        H*dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* ============================================================
   ZEITALTER
============================================================ */

const AGES = [

{
    name:"STEINZEIT",
    cost:0,
    income:10,

    units:[
        {
            name:"Keulenkrieger",

            hp:150,

        },

        },
        {

        }
    ]
},

{

    units:[
        {

        },

        },
        {

        }
    ]
},

{

    cost:1400,
    income:21,

    units:[
        {
            name:"Ritter",
            cost:260,
            hp:450,
            damage:70,
            speed:29,
            range:42,
            cooldown:.95,
            ranged:false
        },
        {
            name:"Armbrustschütze",
            cost:300,
            hp:150,
            damage:82,
            speed:22,
            range:205,
            cooldown:1.5,
            ranged:true
        },
        {
            name:"Paladin",
            cost:390,
            hp:600,
            damage:105,
            speed:24,
            range:45,
            cooldown:1.1,
            ranged:false
        }
    ]
},

{
    name:"INDUSTRIEZEITALTER",
    cost:3000,
    income:29,

    units:[
        {
            name:"Infanterist",
            cost:420,
            hp:500,
            damage:88,
            speed:31,
            range:42,
            cooldown:.75,
            ranged:false
        },
        {
            name:"Gewehrschütze",
            cost:480,
            hp:230,
            damage:115,
            speed:29,
            range:230,
            cooldown:1.0,
            ranged:true
        },
        {
            name:"Maschinengewehr",
            cost:650,
            hp:420,
            damage:55,
            speed:20,
            range:240,
            cooldown:.32,
            ranged:true
        }
    ]
},

{
    name:"MODERNE ÄRA",
    cost:6000,
    income:40,

    units:[
        {
            name:"Sturmsoldat",
            cost:700,
            hp:650,
            damage:130,
            speed:34,
            range:48,
            cooldown:.65,
            ranged:false
        },
        {
            name:"Scharfschütze",
            cost:850,
            hp:250,
            damage:250,
            speed:22,
            range:330,
            cooldown:2.2,
            ranged:true
        },
        {
            name:"Raketenwerfer",
            cost:1100,
            hp:500,
            damage:360,
            speed:17,
            range:300,
            cooldown:3,
            ranged:true
        }
    ]
}

];


/* ============================================================
   SPIELSTATUS
============================================================ */

let gold = 500;

let playerBaseHP = 1000;
let enemyBaseHP = 1000;

let age = 0;

let units = [];
let projectiles = [];
let effects = [];

let nextUnitId = 1;

let paused = false;
let gameOver = false;

let goldTimer = 0;
let enemyTimer = 0;

let enemyGold = 450;

let lastTime =
    performance.now();


/* ============================================================
   BASEN
============================================================ */

const playerBase = {

    x:0,

    width:110,

    hp:1000,
    maxHP:1000
};

const enemyBase = {

    x:0,

    width:110,

    hp:1000,
    maxHP:1000
};


/* ============================================================
   LOG
============================================================ */

const logElement =
    document.getElementById("log");

function log(text,type="info"){

    const line =
        document.createElement("div");

    line.className =
        type;

    const time =
        new Date()
            .toLocaleTimeString(
                "de-DE",
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            );

    line.textContent =
        "["+time+"] "+text;

    logElement.prepend(line);

    while(
        logElement.children.length > 7
    ){

        logElement.lastChild.remove();
    }
}


/* ============================================================
   UI
============================================================ */

function updateUI(){

    document.getElementById(
        "gold"
    ).textContent =
        Math.floor(gold);

    document.getElementById(
        "income"
    ).textContent =
        "+" +
        AGES[age].income +
        "/s";

    document.getElementById(
        "playerHP"
    ).textContent =
        Math.max(
            0,
            Math.floor(playerBaseHP)
        );

    document.getElementById(
        "ageName"
    ).textContent =
        AGES[age].name;

    createButtons();
}


/* ============================================================
   EINHEITEN BUTTONS
============================================================ */

function createButtons(){

    const container =
        document.getElementById(
            "unitButtons"
        );

    container.innerHTML = "";

    AGES[age].units.forEach(
        (u,i)=>{

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "unitButton";

            const affordable =
                gold >= u.cost;

            if(!affordable){
                button.classList.add(
                    "disabled"
                );
            }

            button.innerHTML = `

                <span class="unitNumber">
                    ${i+1}
                </span>

                <div class="unitIcon">

                    <div class="iconHead"></div>

                    <div class="iconBody"></div>

                </div>

                <div class="unitName">
                    ${u.name}
                </div>

                <div class="unitInfo">

                    ❤️ ${u.hp}
                    &nbsp;
                    ⚔️ ${u.damage}
                    <br>

                    ${u.ranged
                        ? "🏹 Fernkampf"
                        : "⚔ Nahkampf"}

                </div>

                <div class="unitCost">
                    🪙 ${u.cost}
                </div>
            `;

            button.onclick =
                ()=>{
                    buyUnit(i);
                };

            container.appendChild(
                button
            );
        }
    );

    updateAgeButton();
}


/* ============================================================
   EINHEIT KAUFEN
============================================================ */

function buyUnit(index){

    if(gameOver)
        return;

    const data =
        AGES[age].units[index];

    if(gold < data.cost){

        log(
            "Nicht genug Gold für " +
            data.name,
            "bad"
        );

        return;
    }

    gold -=
        data.cost;

    spawnUnit(
        "player",
        data
    );

    log(
        data.name +
        " betritt das Schlachtfeld.",
        "good"
    );

    updateUI();
}


/* ============================================================
   GEGNER
============================================================ */

function enemyProduce(){

    enemyGold +=
        AGES[age].income;

    if(
        enemyGold < 50
    )
        return;

    const list =
        AGES[age].units;

    let possible =
        list.filter(
            u =>
                u.cost <= enemyGold
        );

    if(!possible.length)
        return;

    /*
      KI-Verhalten:
      gelegentlich starke Einheit,
      ansonsten zufällige Auswahl.
    */

    let chosen;

    if(
        Math.random() < .30
    ){

        chosen =
            possible[
                possible.length-1
            ];

    }else{

        chosen =
            possible[
                Math.floor(
                    Math.random() *
                    possible.length
                )
            ];
    }

    enemyGold -=
        chosen.cost;

    spawnUnit(
        "enemy",
        chosen
    );

    log(
        "Feind produziert " +
        chosen.name + ".",
        "bad"
    );
}


/* ============================================================
   EINHEIT ERSTELLEN
============================================================ */

function spawnUnit(
    side,
    data
){

    const unit = {

        id:nextUnitId++,

        side,

        data,

        x:
            side === "player"
            ? 145
            : W-145,

        y:
            0,

        hp:data.hp,

        maxHP:data.hp,

        attackTimer:
            Math.random()*.5,

        anim:
            Math.random()*10,

        alive:true,

        target:null
    };

    units.push(unit);

    return unit;
}


/* ============================================================
   EINHEITEN POSITIONEN
============================================================ */

function arrangeUnits(){

    const player =
        units.filter(
            u =>
                u.alive &&
                u.side==="player"
        );

    const enemy =
        units.filter(
            u =>
                u.alive &&
                u.side==="enemy"
        );

    function arrange(list){

        list.forEach(
            (u,i)=>{

                const row =
                    i % 3;

                const depth =
                    Math.floor(i/3);

                u.y =
                    H-130-
                    row*32-
                    depth*5;
            }
        );
    }

    arrange(player);
    arrange(enemy);
}


/* ============================================================
   ZIEL FINDEN
============================================================ */

function findTarget(unit){

    let closest = null;
    let best = Infinity;

    for(
        const other of units
    ){

        if(
            !other.alive ||
            other.side === unit.side
        )
            continue;

        const distance =
            Math.abs(
                other.x-unit.x
            );

        if(
            distance < best
        ){

            best = distance;
            closest = other;
        }
    }

    return closest;
}


/* ============================================================
   UPDATE EINHEITEN
============================================================ */

function updateUnits(dt){

    for(
        const unit of units
    ){

        if(!unit.alive)
            continue;

        unit.attackTimer -= dt;

        unit.anim +=
            dt*5;

        const target =
            findTarget(unit);

        unit.target =
            target;

        if(target){

            const distance =
                Math.abs(
                    target.x-unit.x
                );

            if(
                distance <=
                unit.data.range
            ){

                if(
                    unit.attackTimer <= 0
                ){

                    attack(
                        unit,
                        target
                    );
                }

            }else{

                move(
                    unit,
                    dt
                );
            }

        }else{

            move(
                unit,
                dt
            );

            if(
                unit.side==="player" &&
                unit.x >=
                W-155
            ){

                attackBase(
                    unit,
                    "enemy"
                );
            }

            if(
                unit.side==="enemy" &&
                unit.x <=
                155
            ){

                attackBase(
                    unit,
                    "player"
                );
            }
        }
    }
}


/* ============================================================
   BEWEGUNG
============================================================ */

function move(unit,dt){

    const direction =
        unit.side==="player"
        ? 1
        : -1;

    unit.x +=
        direction *
        unit.data.speed *
        dt;

    unit.x =
        Math.max(
            130,
            Math.min(
                W-130,
                unit.x
            )
        );
}


/* ============================================================
   ANGRIFF
============================================================ */

function attack(
    attacker,
    target
){

    attacker.attackTimer =
        attacker.data.cooldown;

    if(
        attacker.data.ranged
    ){

        createProjectile(
            attacker,
            target
        );

    }else{

        damageUnit(
            target,
            attacker.data.damage
        );

        createHitEffect(
            target.x,
            target.y
        );
    }
}


/* ============================================================
   SCHADEN
============================================================ */

function damageUnit(
    target,
    damage
){

    target.hp -=
        damage;

    createDamageText(
        target.x,
        target.y-50,
        damage
    );

    if(
        target.hp <= 0
    ){

        killUnit(target);
    }
}


/* ============================================================
   EINHEIT TÖTEN
============================================================ */

function killUnit(unit){

    if(!unit.alive)
        return;

    unit.alive = false;

    effects.push({
        type:"death",
        x:unit.x,
        y:unit.y,
        timer:.5
    });

    if(
        unit.side==="enemy"
    ){

        gold +=
            Math.floor(
                unit.data.cost*.25
            );
    }
}


/* ============================================================
   BASIS ANGRIFF
============================================================ */

function attackBase(
    unit,
    target
){

    if(
        unit.attackTimer > 0
    )
        return;

    unit.attackTimer =
        unit.data.cooldown;

    const damage =
        unit.data.damage;

    if(
        target==="enemy"
    ){

        enemyBaseHP -=
            damage;

        createDamageText(
            W-90,
            H-260,
            damage
        );

        createHitEffect(
            W-90,
            H-250
        );

    }else{

        playerBaseHP -=
            damage;

        createDamageText(
            90,
            H-260,
            damage
        );

        createHitEffect(
            90,
            H-250
        );
    }

    if(
        enemyBaseHP <= 0
    ){

        finish(
            true
        );
    }

    if(
        playerBaseHP <= 0
    ){

        finish(
            false
        );
    }
}


/* ============================================================
   PROJEKTILE
============================================================ */

function createProjectile(
    attacker,
    target
){

    projectiles.push({

        x:attacker.x,

        y:attacker.y-38,

        target,

        side:attacker.side,

        damage:
            attacker.data.damage,

        speed:
            attacker.data.ranged
            ? 430
            : 300
    });
}


function updateProjectiles(dt){

    for(
        let i=
            projectiles.length-1;
        i>=0;
        i--
    ){

        const p =
            projectiles[i];

        if(
            !p.target.alive
        ){

            projectiles.splice(
                i,
                1
            );

            continue;
        }

        const dx =
            p.target.x-p.x;

        const dy =
            (p.target.y-35)-p.y;

        const distance =
            Math.sqrt(
                dx*dx+
                dy*dy
            );

        if(
            distance < 14
        ){

            damageUnit(
                p.target,
                p.damage
            );

            createHitEffect(
                p.target.x,
                p.target.y-35
            );

            projectiles.splice(
                i,
                1
            );

            continue;
        }

        p.x +=
            dx/distance *
            p.speed *
            dt;

        p.y +=
            dy/distance *
            p.speed *
            dt;
    }
}


/* ============================================================
   EFFEKTE
============================================================ */

function createHitEffect(
    x,
    y
){

    effects.push({

        type:"hit",

        x,

        y,

        timer:.25
    });
}


function createDamageText(
    x,
    y,
    value
){

    effects.push({

        type:"damage",

        x,

        y,

        value,

        timer:.65
    });
}


function updateEffects(dt){

    for(
        let i=
            effects.length-1;
        i>=0;
        i--
    ){

        effects[i].timer -= dt;

        if(
            effects[i].timer <= 0
        ){

            effects.splice(
                i,
                1
            );
        }
    }
}


/* ============================================================
   ZEICHNEN
============================================================ */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    drawGround();

    drawBases();

    arrangeUnits();

    for(
        const unit of units
    ){

        if(
            unit.alive
        ){

            drawUnit(
                unit
            );
        }
    }

    drawProjectiles();

    drawEffects();

    drawBaseHealth();
}


/* ============================================================
   HINTERGRUND
============================================================ */

function drawBackground(){

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    sky.addColorStop(
        0,
        "#111e29"
    );

    sky.addColorStop(
        .55,
        "#0a141c"
    );

    sky.addColorStop(
        1,
        "#050a0e"
    );

    ctx.fillStyle =
        sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* Wolken */

    ctx.globalAlpha=.12;

    for(
        let i=0;
        i<7;
        i++
    ){

        ctx.fillStyle =
            "#6e9bad";

        ctx.beginPath();

        ctx.arc(
            i*190+80,
            90+(i%2)*35,
            35,
            0,
            Math.PI*2
        );

        ctx.arc(
            i*190+125,
            90+(i%2)*35,
            45,
            0,
            Math.PI*2
        );

        ctx.arc(
            i*190+175,
            90+(i%2)*35,
            30,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;


    /* Berge */

    ctx.fillStyle =
        "#101d24";

    ctx.beginPath();

    ctx.moveTo(0,H-170);

    for(
        let x=0;
        x<=W;
        x+=100
    ){

        ctx.lineTo(
            x,
            H-170-
            Math.sin(x*.008)*40-
            ((x/100)%3)*15
        );
    }

    ctx.lineTo(
        W,
        H
    );

    ctx.lineTo(
        0,
        H
    );

    ctx.fill();
}


/* ============================================================
   BODEN
============================================================ */

function drawGround(){

    const y =
        H-110;

    ctx.fillStyle =
        "#14272a";

    ctx.fillRect(
        0,
        y,
        W,
        110
    );

    ctx.fillStyle =
        "#29484a";

    ctx.fillRect(
        0,
        y,
        W,
        3
    );

    /* Kampfbahn */

    ctx.fillStyle =
        "#1b3437";

    ctx.fillRect(
        100,
        y+20,
        W-200,
        55
    );

    ctx.strokeStyle =
        "#31595a";

    ctx.lineWidth=2;

    ctx.strokeRect(
        100,
        y+20,
        W-200,
        55
    );


    /* Bodenlinien */

    ctx.strokeStyle =
        "rgba(100,180,180,.15)";

    ctx.lineWidth=1;

    for(
        let x=100;
        x<W-100;
        x+=65
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            y+25
        );

        ctx.lineTo(
            x+35,
            y+70
        );

        ctx.stroke();
    }
}


/* ============================================================
   BASEN
============================================================ */

function drawBases(){

    playerBase.x =
        25;

    enemyBase.x =
        W-135;


    drawBase(
        playerBase,
        false
    );

    drawBase(
        enemyBase,
        true
    );
}


function drawBase(
    base,
    enemy
){

    const x =
        base.x;

    const y =
        H-300;

    const w =
        110;

    const h =
        190;


    /* Schatten */

    ctx.fillStyle =
        "rgba(0,0,0,.45)";

    ctx.fillRect(
        x-8,
        H-115,
        w+16,
        15
    );


    /* Hauptturm */

    const tower =
        ctx.createLinearGradient(
            x,
            0,
            x+w,
            0
        );

    tower.addColorStop(
        0,
        enemy
        ? "#3a2227"
        : "#203945"
    );

    tower.addColorStop(
        .5,
        enemy
        ? "#654047"
        : "#405c67"
    );

    tower.addColorStop(
        1,
        enemy
        ? "#29191d"
        : "#182a34"
    );

    ctx.fillStyle =
        tower;

    ctx.fillRect(
        x,
        y,
        w,
        h
    );

    ctx.strokeStyle =
        enemy
        ? "#b35a60"
        : "#62c7df";

    ctx.lineWidth=3;

    ctx.strokeRect(
        x,
        y,
        w,
        h
    );


    /* Zinnen */

    ctx.fillStyle =
        enemy
        ? "#533138"
        : "#304b56";

    for(
        let i=0;
        i<5;
        i++
    ){

        ctx.fillRect(
            x-4+i*24,
            y-16,
            15,
            17
        );
    }


    /* Fenster */

    for(
        let row=0;
        row<3;
        row++
    ){

        for(
            let col=0;
            col<2;
            col++
        ){

            ctx.fillStyle =
                enemy
                ? "#ff4e58"
                : "#43ddff";

            ctx.shadowBlur=10;

            ctx.shadowColor =
                enemy
                ? "#ff3545"
                : "#32d9ff";

            ctx.fillRect(
                x+18+
                col*53,
                y+35+
                row*43,
                17,
                25
            );

            ctx.shadowBlur=0;
        }
    }


    /* Flagge */

    const flagX =
        x+w/2;

    ctx.fillStyle =
        "#a9bbc1";

    ctx.fillRect(
        flagX,
        y-55,
        3,
        55
    );

    ctx.fillStyle =
        enemy
        ? "#ff4550"
        : "#35dcff";

    ctx.beginPath();

    ctx.moveTo(
        flagX+3,
        y-53
    );

    ctx.lineTo(
        flagX+43,
        y-42
    );

    ctx.lineTo(
        flagX+3,
        y-30
    );

    ctx.closePath();

    ctx.fill();
}


/* ============================================================
   BASIS HP
============================================================ */

function drawBaseHealth(){

    drawBar(
        20,
        18,
        190,
        12,
        playerBaseHP,
        1000,
        "#35df9b"
    );

    drawBar(
        W-210,
        18,
        190,
        12,
        enemyBaseHP,
        1000,
        "#ff4d5b"
    );


    ctx.font =
        "bold 10px Arial";

    ctx.fillStyle =
        "#91a5ad";

    ctx.textAlign =
        "left";

    ctx.fillText(
        "DEINE BASIS",
        20,
        45
    );

    ctx.textAlign =
        "right";

    ctx.fillText(
        "FEINDLICHE BASIS",
        W-20,
        45
    );
}


function drawBar(
    x,
    y,
    w,
    h,
    value,
    max,
    color
){

    ctx.fillStyle =
        "#05080a";

    ctx.fillRect(
        x,
        y,
        w,
        h
    );

    ctx.fillStyle =
        color;

    ctx.fillRect(
        x,
        y,
        w*
        Math.max(
            0,
            value/max
        ),
        h
    );

    ctx.strokeStyle =
        "#51636a";

    ctx.strokeRect(
        x,
        y,
        w,
        h
    );
}


/* ============================================================
   EINHEIT ZEICHNEN
============================================================ */

function drawUnit(unit){

    const x =
        unit.x;

    const y =
        unit.y;

    const enemy =
        unit.side==="enemy";

    const direction =
        enemy
        ? -1
        : 1;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        direction,
        1
    );


    /* Schatten */

    ctx.fillStyle =
        "rgba(0,0,0,.45)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        4,
        17,
        5,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Laufanimation */

    const moving =
        !unit.target ||
        Math.abs(
            unit.target.x-unit.x
        ) >
        unit.data.range;

    const walk =
        moving
        ? Math.sin(unit.anim)*4
        : 0;


    /* Beine */

    ctx.strokeStyle =
        enemy
        ? "#b64c56"
        : "#53bfd6";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
        -6,
        -6
    );

    ctx.lineTo(
        -8+walk,
        15
    );

    ctx.moveTo(
        6,
        -6
    );

    ctx.lineTo(
        8-walk,
        15
    );

    ctx.stroke();


    /* Körper */

    ctx.fillStyle =
        enemy
        ? "#713a42"
        : "#345d69";

    ctx.fillRect(
        -12,
        -38,
        24,
        34
    );

    ctx.strokeStyle =
        enemy
        ? "#e16a70"
        : "#65d6ee";

    ctx.lineWidth=2;

    ctx.strokeRect(
        -12,
        -38,
        24,
        34
    );


    /* Kopf */

    ctx.fillStyle =
        "#b9815b";

    ctx.beginPath();

    ctx.arc(
        0,
        -49,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Helm */

    ctx.fillStyle =
        enemy
        ? "#47252a"
        : "#253e47";

    ctx.fillRect(
        -11,
        -58,
        22,
        8
    );


    /* Waffe */

    ctx.strokeStyle =
        "#202a2d";

    ctx.lineWidth=4;

    if(
        unit.data.ranged
    ){

        ctx.beginPath();

        ctx.moveTo(
            7,
            -29
        );

        ctx.lineTo(
            25,
            -39
        );

        ctx.stroke();

    }else{

        ctx.beginPath();

        ctx.moveTo(
            7,
            -30
        );

        ctx.lineTo(
            27,
            -46
        );

        ctx.stroke();
    }


    /* HP */

    const barW =
        38;

    ctx.fillStyle =
        "#070a0c";

    ctx.fillRect(
        -barW/2,
        -70,
        barW,
        5
    );

    ctx.fillStyle =
        "#42df9d";

    ctx.fillRect(
        -barW/2,
        -70,
        barW*
        Math.max(
            0,
            unit.hp/unit.maxHP
        ),
        5
    );

    ctx.restore();
}


/* ============================================================
   PROJEKTILE ZEICHNEN
============================================================ */

function drawProjectiles(){

    for(
        const p of projectiles
    ){

        ctx.save();

        ctx.translate(
            p.x,
            p.y
        );

        ctx.fillStyle =
            p.side==="enemy"
            ? "#ff5963"
            : "#ffe45a";

        ctx.shadowBlur=10;

        ctx.shadowColor =
            ctx.fillStyle;

        ctx.fillRect(
            -7,
            -2,
            14,
            4
        );

        ctx.restore();
    }
}


/* ============================================================
   EFFEKTE ZEICHNEN
============================================================ */

function drawEffects(){

    for(
        const e of effects
    ){

        if(
            e.type==="hit"
        ){

            const alpha =
                e.timer/.25;

            ctx.globalAlpha =
                alpha;

            ctx.strokeStyle =
                "#ffe36b";

            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                (1-alpha)*22,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.globalAlpha=1;
        }


        if(
            e.type==="damage"
        ){

            const progress =
                1-e.timer/.65;

            ctx.globalAlpha =
                1-progress;

            ctx.fillStyle =
                "#ffe15a";

            ctx.font =
                "bold 14px Arial";

            ctx.textAlign =
                "center";

            ctx.fillText(
                "-"+e.value,
                e.x,
                e.y-
                progress*35
            );

            ctx.globalAlpha=1;
        }


        if(
            e.type==="death"
        ){

            ctx.globalAlpha =
                e.timer/.5;

            ctx.fillStyle =
                "#8d9ba0";

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y-20,
                (1-e.timer/.5)*18,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.globalAlpha=1;
        }
    }
}


/* ============================================================
   ZEITALTER BUTTON
============================================================ */

function updateAgeButton(){

    const button =
        document.getElementById(
            "ageUp"
        );

    if(
        age >=
        AGES.length-1
    ){

        button.textContent =
            "✓ MAXIMALES ZEITALTER";

        return;
    }

    const next =
        AGES[age+1];

    button.textContent =
        "⬆ " +
        next.name +
        " · " +
        next.cost +
        " G";
}


/* ============================================================
   ZEITALTER AUFSTIEG
============================================================ */

function upgradeAge(){

    if(gameOver)
        return;

    if(
        age >=
        AGES.length-1
    ){

        log(
            "Du hast bereits das höchste Zeitalter erreicht.",
            "info"
        );

        return;
    }

    const next =
        AGES[age+1];

    if(
        gold < next.cost
    ){

        log(
            "Für den Aufstieg fehlen " +
            (next.cost-gold) +
            " Gold.",
            "bad"
        );

        return;
    }

    gold -=
        next.cost;

    age++;

    log(
        "ZEITALTER AUFGESTIEGEN: " +
        AGES[age].name,
        "good"
    );

    createButtons();
    updateUI();
}


/* ============================================================
   GEGNER ALTERT
============================================================ */

function enemyAgeUp(){

    if(
        age >=
        AGES.length-1
    )
        return;

    const next =
        AGES[age+1];

    if(
        enemyGold >
        next.cost*1.15 &&
        Math.random()<.01
    ){

        enemyGold -=
            next.cost;

        log(
            "Der Gegner erreicht " +
            next.name + ".",
            "bad"
        );
    }
}


/* ============================================================
   SPIEL ENDE
============================================================ */

function finish(
    playerWon
){

    if(gameOver)
        return;

    gameOver=true;

    const result =
        document.getElementById(
            "result"
        );

    const title =
        document.getElementById(
            "resultTitle"
        );

    const text =
        document.getElementById(
            "resultText"
        );

    result.style.display =
        "flex";

    if(playerWon){

        title.textContent =
            "SIEG";

        title.style.color =
            "#55e4a0";

        text.textContent =
            "Deine Armee hat die gegnerische Festung zerstört.";
    }else{

        title.textContent =
            "NIEDERLAGE";

        title.style.color =
            "#ff5965";

        text.textContent =
            "Deine Festung wurde zerstört.";
    }
}


/* ============================================================
   SPIEL LOOP
============================================================ */

function loop(now){

    let dt =
        (now-lastTime)/1000;

    lastTime =
        now;

    dt =
        Math.min(
            dt,
            .05
        );

    if(
        !paused &&
        !gameOver
    ){

        /* GOLD */

        goldTimer +=
            dt;

        if(
            goldTimer >= 1
        ){

            gold +=
                AGES[age].income;

            goldTimer -= 1;

            updateUI();
        }


        /* FEIND */

        enemyTimer +=
            dt;

        if(
            enemyTimer >= 2.4
        ){

            enemyTimer=0;

            enemyProduce();

            enemyAgeUp();
        }


        updateUnits(dt);

        updateProjectiles(dt);

        updateEffects(dt);
    }

    draw();

    requestAnimationFrame(
        loop
    );
}


/* ============================================================
   BUTTON EVENTS
============================================================ */

document
    .getElementById("pause")
    .onclick =
    ()=>{

        paused =
            !paused;

        document
            .getElementById(
                "pause"
            )
            .textContent =
            paused
            ? "▶ WEITER"
            : "⏸ PAUSE";

        log(
            paused
            ? "Kampf pausiert."
            : "Kampf fortgesetzt.",
            "info"
        );
    };


document
    .getElementById("ageUp")
    .onclick =
    upgradeAge;


document
    .getElementById("restart")
    .onclick =
    ()=>{
        location.reload();
    };


document
    .getElementById("resultRestart")
    .onclick =
    ()=>{
        location.reload();
    };


/* ============================================================
   TASTATUR
============================================================ */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="1")
            buyUnit(0);

        if(e.key==="2")
            buyUnit(1);

        if(e.key==="3")
            buyUnit(2);

        if(
            e.code==="Space"
        ){

            e.preventDefault();

            document
                .getElementById(
                    "pause"
                )
                .click();
        }

        if(
            e.key.toLowerCase()==="u"
        ){

            upgradeAge();
        }
    }
);


/* ============================================================
   START
============================================================ */

log(
    "Die Schlacht beginnt.",
    "info"
);

log(
    "Produziere Einheiten und dränge den Gegner zurück.",
    "info"
);

log(
    "Sammle Gold und entwickle dein Zeitalter weiter.",
    "info"
);

updateUI();

requestAnimationFrame(
    loop
);

</script>
