<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Defense</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    background: #101522;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
}

h1 {
    margin: 12px 0 5px;
    font-size: 28px;
}

#gameWrapper {
    width: 100%;
    max-width: 1050px;
    margin: auto;
}

#info {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px;
}

.infoBox {
    background: #202a3d;
    padding: 8px 14px;
    border-radius: 10px;
    min-width: 110px;
    font-weight: bold;
}

canvas {
    display: block;
    margin: 5px auto;
    background: #315d37;
    border: 3px solid #60708e;
    border-radius: 12px;
    width: 100%;
    max-width: 1000px;
    height: auto;
    touch-action: none;
}

#controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 10px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #2e3d59;
    color: white;
}

button:hover {
    background: #425574;
}

button:active {
    transform: scale(.96);
}

.towerButton {
    min-width: 145px;
}

.towerButton small {
    display: block;
    opacity: .75;
    margin-top: 3px;
}

#message {
    min-height: 28px;
    font-weight: bold;
    color: #ffd75a;
    padding: 4px;
}

#towerInfo {
    max-width: 650px;
    margin: 5px auto 15px;
    background: #1b2435;
    padding: 12px;
    border-radius: 12px;
    display: none;
}

@media(max-width:600px) {
    h1 {
        font-size: 23px;
    }

    button {
        padding: 10px 12px;
        font-size: 14px;
    }

    .towerButton {
        min-width: 125px;
    }
}
</style>
</head>

<body>

<div id="gameWrapper">

<h1>🏰 Tower Defense</h1>

<div id="info">
    <div class="infoBox">💰 Geld: <span id="money">250</span></div>
    <div class="infoBox">❤️ Leben: <span id="lives">20</span></div>
    <div class="infoBox">🌊 Welle: <span id="wave">0</span></div>
    <div class="infoBox">👾 Gegner: <span id="enemies">0</span></div>
    <div class="infoBox">🏆 Punkte: <span id="score">0</span></div>
</div>

<canvas id="game" width="1000" height="600"></canvas>

<div id="message">
    Wähle einen Turm und klicke auf eine freie Fläche.
</div>

<div id="controls">

    <button class="towerButton" onclick="selectTower('basic')">
        🏹 Bogenturm
        <small>$50</small>
    </button>

    <button class="towerButton" onclick="selectTower('cannon')">
        💣 Kanone
        <small>$100</small>
    </button>

    <button class="towerButton" onclick="selectTower('magic')">
        🔮 Magieturm
        <small>$150</small>
    </button>

    <button onclick="startWave()">🌊 Welle starten</button>

    <button onclick="togglePause()">⏸️ Pause</button>

    <button onclick="restartGame()">🔄 Neustart</button>

</div>

<div id="towerInfo"></div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const moneyEl = document.getElementById("money");
const livesEl = document.getElementById("lives");
const waveEl = document.getElementById("wave");
const enemiesEl = document.getElementById("enemies");
const scoreEl = document.getElementById("score");
const messageEl = document.getElementById("message");
const towerInfo = document.getElementById("towerInfo");

let money = 250;
let lives = 20;
let wave = 0;
let score = 0;

let enemies = [];
let towers = [];
let projectiles = [];

let selectedTower = null;
let waveRunning = false;
let paused = false;
let gameOver = false;

let spawnLeft = 0;
let spawnTimer = 0;

let selectedTowerObject = null;

const path = [
    {x: -30, y: 100},
    {x: 180, y: 100},
    {x: 180, y: 250},
    {x: 420, y: 250},
    {x: 420, y: 100},
    {x: 700, y: 100},
    {x: 700, y: 420},
    {x: 900, y: 420},
    {x: 1030, y: 420}
];

const towerTypes = {

    basic: {
        name: "Bogenturm",
        cost: 50,
        range: 125,
        damage: 15,
        fireRate: 650,
        color: "#55aaff"
    },

    cannon: {
        name: "Kanone",
        cost: 100,
        range: 110,
        damage: 38,
        fireRate: 1300,
        color: "#ff9f43"
    },

    magic: {
        name: "Magieturm",
        cost: 150,
        range: 155,
        damage: 25,
        fireRate: 450,
        color: "#c77dff"
    }
};

const enemyTypes = {

    normal: {
        hp: 80,
        speed: 1.15,
        reward: 15,
        radius: 13,
        color: "#e74c3c"
    },

    fast: {
        hp: 55,
        speed: 2.0,
        reward: 20,
        radius: 10,
        color: "#f1c40f"
    },

    tank: {
        hp: 260,
        speed: 0.65,
        reward: 40,
        radius: 18,
        color: "#8e44ad"
    },

    boss: {
        hp: 1000,
        speed: 0.42,
        reward: 150,
        radius: 27,
        color: "#17202a"
    }
};

function distance(a,b) {
    return Math.hypot(a.x-b.x, a.y-b.y);
}

function selectTower(type) {

    if(gameOver) return;

    selectedTower = type;

    messageEl.textContent =
        towerTypes[type].name +
        " ausgewählt. Klicke auf eine freie Fläche.";

}

canvas.addEventListener("click", function(e) {

    if(gameOver || paused) return;

    const rect = canvas.getBoundingClientRect();

    const x = (e.clientX - rect.left) *
              canvas.width / rect.width;

    const y = (e.clientY - rect.top) *
              canvas.height / rect.height;

    // Erst prüfen, ob bereits Turm angeklickt wurde
    for(let tower of towers) {

        if(Math.hypot(x-tower.x,y-tower.y) < 25) {

            selectedTowerObject = tower;
            selectedTower = null;

            showTowerInfo(tower);

            return;
        }
    }

    if(selectedTower) {

        placeTower(x,y,selectedTower);

    }

});

function placeTower(x,y,type) {

    const data = towerTypes[type];

    if(money < data.cost) {

        messageEl.textContent = "Nicht genug Geld!";
        return;

    }

    // Mindestabstand vom Weg
    for(let i=0;i<path.length-1;i++) {

        const a = path[i];
        const b = path[i+1];

        if(pointNearLine(x,y,a.x,a.y,b.x,b.y,42)) {

            messageEl.textContent =
                "Hier ist der Weg. Der Turm braucht etwas Abstand.";

            return;
        }
    }

    // Abstand zwischen Türmen
    for(let tower of towers) {

        if(distance({x,y},tower) < 50) {

            messageEl.textContent =
                "Die Türme stehen zu dicht zusammen.";

            return;
        }
    }

    money -= data.cost;

    towers.push({

        x:x,
        y:y,
        type:type,
        level:1,
        damage:data.damage,
        range:data.range,
        fireRate:data.fireRate,
        lastShot:0,
        totalSpent:data.cost
    });

    selectedTower = null;

    messageEl.textContent =
        data.name + " wurde gebaut.";

    updateUI();
}

function pointNearLine(px,py,x1,y1,x2,y2,limit) {

    const dx=x2-x1;
    const dy=y2-y1;

    const lenSq=dx*dx+dy*dy;

    let t=((px-x1)*dx+(py-y1)*dy)/lenSq;

    t=Math.max(0,Math.min(1,t));

    const x=x1+t*dx;
    const y=y1+t*dy;

    return Math.hypot(px-x,py-y)<limit;
}

function showTowerInfo(tower) {

    const data=towerTypes[tower.type];

    towerInfo.style.display="block";

    towerInfo.innerHTML=`
        <b>${data.name}</b><br>
        Level: ${tower.level}<br>
        Schaden: ${tower.damage}<br>
        Reichweite: ${Math.round(tower.range)}<br>
        <br>
        <button onclick="upgradeTower()">⬆️ Turm verbessern</button>
        <button onclick="sellTower()">💰 Verkaufen</button>
    `;
}

function upgradeTower() {

    const tower=selectedTowerObject;

    if(!tower) return;

    const cost=Math.floor(
        towerTypes[tower.type].cost *
        (0.8 + tower.level * 0.65)
    );

    if(money<cost) {

        messageEl.textContent =
            "Nicht genug Geld für das Upgrade.";

        return;
    }

    money-=cost;

    tower.level++;

    tower.damage=Math.round(tower.damage*1.35);
    tower.range+=12;
    tower.fireRate=Math.max(
        180,
        Math.round(tower.fireRate*0.9)
    );

    tower.totalSpent+=cost;

    messageEl.textContent =
        "Turm auf Level "+tower.level+" verbessert!";

    showTowerInfo(tower);
    updateUI();
}

function sellTower() {

    const tower=selectedTowerObject;

    if(!tower) return;

    money += Math.floor(tower.totalSpent*0.65);

    towers=towers.filter(t=>t!==tower);

    selectedTowerObject=null;

    towerInfo.style.display="none";

    messageEl.textContent="Turm verkauft.";

    updateUI();
}

function startWave() {

    if(gameOver || waveRunning) return;

    wave++;

    waveRunning=true;

    spawnLeft=8 + wave*3;

    spawnTimer=0;

    messageEl.textContent =
        "Welle "+wave+" beginnt!";

    updateUI();
}

function spawnEnemy() {

    let type="normal";

    const roll=Math.random();

    if(wave>=3 && roll<0.18)
        type="fast";

    if(wave>=5 && roll<0.10)
        type="tank";

    if(wave%10===0 && spawnLeft===1)
        type="boss";

    const data=enemyTypes[type];

    const multiplier=1+(wave-1)*0.11;

    enemies.push({

        type:type,

        x:path[0].x,
        y:path[0].y,

        pathIndex:0,

        hp:data.hp*multiplier,
        maxHp:data.hp*multiplier,

        speed:data.speed*(1+wave*0.012),

        reward:data.reward,

        radius:data.radius,

        color:data.color,

        progress:0
    });

    spawnLeft--;

}

function updateEnemies(dt) {

    for(let i=enemies.length-1;i>=0;i--) {

        const enemy=enemies[i];

        const target=path[enemy.pathIndex+1];

        if(!target) {

            lives--;

            enemies.splice(i,1);

            if(lives<=0) {

                endGame();

            }

            continue;
        }

        const dx=target.x-enemy.x;
        const dy=target.y-enemy.y;

        const dist=Math.hypot(dx,dy);

        const move=enemy.speed*dt/16.67;

        if(dist<=move) {

            enemy.x=target.x;
            enemy.y=target.y;
            enemy.pathIndex++;

        } else {

            enemy.x+=dx/dist*move;
            enemy.y+=dy/dist*move;

        }
    }

}

function updateTowers(now) {

    for(let tower of towers) {

        if(now-tower.lastShot<tower.fireRate)
            continue;

        let target=null;
        let bestProgress=-Infinity;

        for(let enemy of enemies) {

            const d=distance(tower,enemy);

            if(d<=tower.range &&
               enemy.progress>=bestProgress) {

                target=enemy;
                bestProgress=enemy.progress;
            }
        }

        if(target) {

            tower.lastShot=now;

            projectiles.push({

                x:tower.x,
                y:tower.y,

                target:target,

                damage:tower.damage,

                type:tower.type,

                speed:tower.type==="cannon"?7:10
            });
        }
    }
}

function updateProjectiles(dt) {

    for(let i=projectiles.length-1;i>=0;i--) {

        const p=projectiles[i];

        if(!enemies.includes(p.target)) {

            projectiles.splice(i,1);
            continue;
        }

        const dx=p.target.x-p.x;
        const dy=p.target.y-p.y;

        const dist=Math.hypot(dx,dy);

        const move=p.speed*dt/16.67;

        if(dist<=move+3) {

            hitEnemy(p.target,p.damage,p.type);

            projectiles.splice(i,1);

        } else {

            p.x+=dx/dist*move;
            p.y+=dy/dist*move;

        }
    }
}

function hitEnemy(enemy,damage,type) {

    enemy.hp-=damage;

    // Magie trifft zusätzlich einen kleinen Bereich
    if(type==="magic") {

        for(let other of enemies) {

            if(other!==enemy &&
               distance(enemy,other)<45) {

                other.hp-=damage*0.25;
            }
        }
    }

    if(enemy.hp<=0) {

        money+=enemy.reward;

        score+=enemy.reward*10;

        const index=enemies.indexOf(enemy);

        if(index!==-1)
            enemies.splice(index,1);
    }
}

function updateProgress() {

    for(let enemy of enemies) {

        let total=0;

        for(let i=0;i<enemy.pathIndex;i++) {

            total+=distance(path[i],path[i+1]);
        }

        const target=path[enemy.pathIndex+1];

        if(target) {

            total+=distance(
                path[enemy.pathIndex],
                {x:enemy.x,y:enemy.y}
            );
        }

        enemy.progress=total;
    }
}

function updateWave() {

    if(!waveRunning)
        return;

    if(spawnLeft>0) {

        spawnTimer--;

        if(spawnTimer<=0) {

            spawnEnemy();

            spawnTimer=
                Math.max(18,55-wave*1.5);
        }

    } else if(enemies.length===0) {

        waveRunning=false;

        const bonus=50+wave*10;

        money+=bonus;

        score+=bonus*5;

        messageEl.textContent=
            "Welle geschafft! Bonus: $"+bonus+
            ". Starte die nächste Welle.";

        updateUI();
    }
}

function drawBackground() {

    ctx.fillStyle="#376b3e";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Graslinien
    ctx.strokeStyle="rgba(255,255,255,.035)";
    ctx.lineWidth=1;

    for(let x=0;x<canvas.width;x+=40) {

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
    }

    for(let y=0;y<canvas.height;y+=40) {

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }

    // Weg
    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.strokeStyle="#6b4f36";
    ctx.lineWidth=70;

    ctx.beginPath();

    ctx.moveTo(path[0].x,path[0].y);

    for(let i=1;i<path.length;i++) {

        ctx.lineTo(path[i].x,path[i].y);
    }

    ctx.stroke();

    ctx.strokeStyle="#9a7650";
    ctx.lineWidth=58;

    ctx.beginPath();

    ctx.moveTo(path[0].x,path[0].y);

    for(let i=1;i<path.length;i++) {

        ctx.lineTo(path[i].x,path[i].y);
    }

    ctx.stroke();

}

function drawTowers() {

    for(let tower of towers) {

        const data=towerTypes[tower.type];

        // Reichweite
        if(tower===selectedTowerObject) {

            ctx.beginPath();
            ctx.arc(
                tower.x,
                tower.y,
                tower.range,
                0,
                Math.PI*2
            );

            ctx.fillStyle="rgba(255,255,255,.08)";
            ctx.fill();

            ctx.strokeStyle="rgba(255,255,255,.4)";
            ctx.stroke();
        }

        // Turm
        ctx.beginPath();

        ctx.arc(
            tower.x,
            tower.y,
            22,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#202938";
        ctx.fill();

        ctx.strokeStyle=data.color;
        ctx.lineWidth=4;
        ctx.stroke();

        // Kanone / Stab
        ctx.save();

        ctx.translate(tower.x,tower.y);

        ctx.rotate(
            tower.lastShot%360
        );

        ctx.fillStyle=data.color;

        ctx.fillRect(-5,-25,10,25);

        ctx.restore();

        // Level
        ctx.fillStyle="white";
        ctx.font="bold 12px Arial";
        ctx.textAlign="center";
        ctx.fillText(
            "Lv."+tower.level,
            tower.x,
            tower.y+38
        );
    }
}

function drawEnemies() {

    for(let enemy of enemies) {

        ctx.beginPath();

        ctx.arc(
            enemy.x,
            enemy.y,
            enemy.radius,
            0,
            Math.PI*2
        );

        ctx.fillStyle=enemy.color;
        ctx.fill();

        ctx.strokeStyle="#111";
        ctx.lineWidth=2;
        ctx.stroke();

        // Augen
        if(enemy.radius>=12) {

            ctx.fillStyle="white";

            ctx.beginPath();
            ctx.arc(
                enemy.x-5,
                enemy.y-3,
                3,
                0,
                Math.PI*2
            );
            ctx.fill();

            ctx.beginPath();
            ctx.arc(
                enemy.x+5,
                enemy.y-3,
                3,
                0,
                Math.PI*2
            );
            ctx.fill();
        }

        // Lebensbalken
        const width=enemy.radius*2.2;

        ctx.fillStyle="#222";

        ctx.fillRect(
            enemy.x-width/2,
            enemy.y-enemy.radius-10,
            width,
            5
        );

        ctx.fillStyle="#2ecc71";

        ctx.fillRect(
            enemy.x-width/2,
            enemy.y-enemy.radius-10,
            width*(enemy.hp/enemy.maxHp),
            5
        );
    }
}

function drawProjectiles() {

    for(let p of projectiles) {

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.type==="cannon"?6:4,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            towerTypes[p.type].color;

        ctx.fill();
    }
}

function drawStartEnd() {

    // Start
    ctx.fillStyle="#2ecc71";

    ctx.beginPath();
    ctx.arc(
        path[0].x+20,
        path[0].y,
        20,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle="white";
    ctx.font="bold 14px Arial";
    ctx.textAlign="center";
    ctx.fillText(
        "START",
        path[0].x+20,
        path[0].y+5
    );

    // Ziel
    ctx.fillStyle="#e74c3c";

    ctx.beginPath();
    ctx.arc(
        path[path.length-1].x-25,
        path[path.length-1].y,
        20,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle="white";
    ctx.fillText(
        "ZIEL",
        path[path.length-1].x-25,
        path[path.length-1].y+5
    );
}

function draw() {

    drawBackground();
    drawStartEnd();
    drawTowers();
    drawEnemies();
    drawProjectiles();

    if(paused && !gameOver) {

        ctx.fillStyle="rgba(0,0,0,.55)";
        ctx.fillRect(
            0,0,canvas.width,canvas.height
        );

        ctx.fillStyle="white";
        ctx.font="bold 48px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            "PAUSE",
            canvas.width/2,
            canvas.height/2
        );
    }

    if(gameOver) {

        ctx.fillStyle="rgba(0,0,0,.65)";
        ctx.fillRect(
            0,0,canvas.width,canvas.height
        );

        ctx.fillStyle="white";
        ctx.font="bold 48px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            "GAME OVER",
            canvas.width/2,
            canvas.height/2-30
        );

        ctx.font="bold 22px Arial";

        ctx.fillText(
            "Punkte: "+score,
            canvas.width/2,
            canvas.height/2+15
        );

        ctx.font="18px Arial";

        ctx.fillText(
            "Drücke Neustart",
            canvas.width/2,
            canvas.height/2+50
        );
    }
}

function updateUI() {

    moneyEl.textContent=Math.floor(money);
    livesEl.textContent=lives;
    waveEl.textContent=wave;
    enemiesEl.textContent=enemies.length;
    scoreEl.textContent=score;
}

function togglePause() {

    if(gameOver) return;

    paused=!paused;

    messageEl.textContent=
        paused ? "Spiel pausiert." : "Spiel läuft weiter.";

}

function endGame() {

    gameOver=true;
    waveRunning=false;

    messageEl.textContent=
        "Game Over! Deine Verteidigung wurde überrannt.";

    updateUI();
}

function restartGame() {

    money=250;
    lives=20;
    wave=0;
    score=0;

    enemies=[];
    towers=[];
    projectiles=[];

    selectedTower=null;
    selectedTowerObject=null;

    waveRunning=false;
    paused=false;
    gameOver=false;

    towerInfo.style.display="none";

    messageEl.textContent=
        "Neues Spiel gestartet. Baue deine Verteidigung.";

    updateUI();
}

let lastTime=performance.now();

function gameLoop(now) {

    const dt=Math.min(
        now-lastTime,
        40
    );

    lastTime=now;

    if(!paused && !gameOver) {

        updateWave();
        updateEnemies(dt);
        updateProgress();
        updateTowers(now);
        updateProjectiles(dt);
    }

    draw();

    updateUI();

    requestAnimationFrame(gameLoop);
}

updateUI();
requestAnimationFrame(gameLoop);

</script>

</body>
</html>
