<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age of War - Flash Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Arial Black', Gadget, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #game-wrapper {
            width: 900px;
            background: #111;
            border: 3px solid #444;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        /* Flash-Style Top Bar */
        #ui-top {
            display: grid;
            grid-template-columns: 180px 1fr 180px;
            background: linear-gradient(180deg, #1f2d42 0%, #0c1420 100%);
            padding: 8px 12px;
            border-bottom: 2px solid #3a4f6e;
            align-items: center;
        }

        .hud-box { font-size: 14px; text-shadow: 1px 1px 2px #000; }
        .gold-val { color: #ffd700; font-size: 18px; }
        .exp-val { color: #00ffcc; font-size: 14px; }
        .age-val { color: #ff9900; font-size: 16px; text-align: center; text-transform: uppercase; }

        canvas { display: block; background: #000; }

        /* Control Panel */
        #controls {
            background: #181d26;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            border-top: 2px solid #2c384a;
        }

        .btn {
            background: linear-gradient(180deg, #3a4b64 0%, #1e2837 100%);
            border: 1px solid #5a7090;
            color: white;
            padding: 6px 4px;
            border-radius: 4px;
            font-size: 10px;
            font-family: sans-serif;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 52px;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(180deg, #4d6384 0%, #29374c 100%);
            border-color: #00ccff;
        }

        .btn:disabled { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }
        .btn-special { background: linear-gradient(180deg, #8a1c1c 0%, #4a0d0d 100%); border-color: #ff4444; }
        .btn-special:hover:not(:disabled) { background: linear-gradient(180deg, #b32424 0%, #661212 100%); }

        .cost { color: #ffd700; font-size: 9px; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="ui-top">
        <div class="hud-box">
            <div>GOLD: <span id="gold-display" class="gold-val">175</span></div>
            <div>EXP: <span id="exp-display" class="exp-val">0</span></div>
        </div>
        <div id="age-display" class="age-val">Steinzeit</div>
        <div class="hud-box" style="text-align: right;">
            <button id="btn-special" class="btn btn-special" style="width:100%; height:36px;" onclick="useSpecial()">
                SPEZIALANGRIFF
            </button>
        </div>
    </div>

    <canvas id="gameCanvas" width="900" height="380"></canvas>

    <div id="controls">
        <button id="btn-u1" class="btn" onclick="spawnUnit(1)">
            <span id="name-u1">Keule</span>
            <span id="cost-u1" class="cost">15G</span>
        </button>
        <button id="btn-u2" class="btn" onclick="spawnUnit(2)">
            <span id="name-u2">Schleuder</span>
            <span id="cost-u2" class="cost">25G</span>
        </button>
        <button id="btn-u3" class="btn" onclick="spawnUnit(3)">
            <span id="name-u3">Dino-Reiter</span>
            <span id="cost-u3" class="cost">100G</span>
        </button>
        <button id="btn-turret" class="btn" onclick="buildTurret()">
            <span id="name-turret">Turm Bauen</span>
            <span id="cost-turret" class="cost">100G</span>
        </button>
        <button id="btn-slot" class="btn" onclick="buyTurretSlot()">
            <span>Turm-Slot</span>
            <span id="cost-slot" class="cost">200G</span>
        </button>
        <button id="btn-age" class="btn" onclick="evolveAge()">
            <span>EVOLVIEREN</span>
            <span id="cost-age" class="cost">400 EXP</span>
        </button>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game State
let gold = 175;
let exp = 0;
let age = 1; // 1: Steinzeit, 2: Ägypten, 3: Mittelalter, 4: Moderne, 5: Zukunft
let gameOver = false;
let specialCooldown = false;

const BASE_HP_MAX = 500;
const playerBase = { x: 50, hp: BASE_HP_MAX, slots: 1, turrets: [] };
const enemyBase = { x: 850, hp: BASE_HP_MAX, slots: 1, turrets: [] };

let playerUnits = [];
let enemyUnits = [];
let projectiles = [];
let particles = [];
let floatingTexts = [];

// Zeitalter-Daten
const AGE_DATA = {
    1: { name: "Steinzeit", bg: "#4a6332", expCost: 400, 
         u1: { name: "Keulenn Mann", cost: 15, hp: 50, dmg: 8, spd: 1.2, rng: 15, type: "m" },
         u2: { name: "Schleuderer", cost: 25, hp: 35, dmg: 12, spd: 1.0, rng: 110, type: "r" },
         u3: { name: "Dino-Reiter", cost: 100, hp: 160, dmg: 25, spd: 1.5, rng: 20, type: "m" },
         turret: { name: "Eier-Katapult", cost: 100, dmg: 15, rng: 180, rate: 2000 }
    },
    2: { name: "Altes Ägypten", bg: "#7a6328", expCost: 1500,
         u1: { name: "Speerkämpfer", cost: 50, hp: 120, dmg: 18, spd: 1.1, rng: 18, type: "m" },
         u2: { name: "Bogenschütze", cost: 75, hp: 80, dmg: 22, spd: 1.0, rng: 140, type: "r" },
         u3: { name: "Kriegswagen", cost: 220, hp: 300, dmg: 45, spd: 1.6, rng: 25, type: "m" },
         turret: { name: "Feuer-Katapult", cost: 250, dmg: 35, rng: 220, rate: 1800 }
    },
    3: { name: "Mittelalter", bg: "#324a5e", expCost: 4000,
         u1: { name: "Schwertkämpfer", cost: 120, hp: 250, dmg: 35, spd: 1.0, rng: 20, type: "m" },
         u2: { name: "Armbrust", cost: 180, hp: 140, dmg: 45, spd: 0.9, rng: 160, type: "r" },
         u3: { name: "Ritter", cost: 500, hp: 600, dmg: 85, spd: 1.4, rng: 25, type: "m" },
         turret: { name: "Balliste", cost: 500, dmg: 70, rng: 250, rate: 1500 }
    },
    4: { name: "Moderne", bg: "#3a3a3a", expCost: 10000,
         u1: { name: "Soldat", cost: 300, hp: 450, dmg: 60, spd: 1.1, rng: 120, type: "r" },
         u2: { name: "Grenadier", cost: 450, hp: 350, dmg: 110, spd: 0.8, rng: 100, type: "r" },
         u3: { name: "Panzer", cost: 1200, hp: 1400, dmg: 180, spd: 0.8, rng: 150, type: "r" },
         turret: { name: "MG-Nest", cost: 1000, dmg: 40, rng: 280, rate: 400 }
    },
    5: { name: "Zukunft", bg: "#1a0033", expCost: 0,
         u1: { name: "Laser-Cyborg", cost: 800, hp: 900, dmg: 120, spd: 1.2, rng: 140, type: "r" },
         u2: { name: "Mech-Walker", cost: 2000, hp: 2200, dmg: 280, spd: 0.7, rng: 180, type: "r" },
         u3: { name: "Goliath", cost: 5000, hp: 5000, dmg: 500, spd: 0.6, rng: 200, type: "r" },
         turret: { name: "Plasma-Turm", cost: 2500, dmg: 200, rng: 320, rate: 1000 }
    }
};

function updateUI() {
    document.getElementById("gold-display").innerText = Math.floor(gold);
    document.getElementById("exp-display").innerText = Math.floor(exp);
    
    const data = AGE_DATA[age];
    document.getElementById("age-display").innerText = data.name;

    document.getElementById("name-u1").innerText = data.u1.name;
    document.getElementById("cost-u1").innerText = data.u1.cost + "G";
    document.getElementById("btn-u1").disabled = gold < data.u1.cost;

    document.getElementById("name-u2").innerText = data.u2.name;
    document.getElementById("cost-u2").innerText = data.u2.cost + "G";
    document.getElementById("btn-u2").disabled = gold < data.u2.cost;

    document.getElementById("name-u3").innerText = data.u3.name;
    document.getElementById("cost-u3").innerText = data.u3.cost + "G";
    document.getElementById("btn-u3").disabled = gold < data.u3.cost;

    document.getElementById("name-turret").innerText = data.turret.name;
    document.getElementById("cost-turret").innerText = data.turret.cost + "G";
    document.getElementById("btn-turret").disabled = gold < data.turret.cost || playerBase.turrets.length >= playerBase.slots;

    document.getElementById("cost-slot").innerText = (playerBase.slots * 200) + "G";
    document.getElementById("btn-slot").disabled = gold < (playerBase.slots * 200) || playerBase.slots >= 3;

    const ageBtn = document.getElementById("btn-age");
    if (age < 5) {
        document.getElementById("cost-age").innerText = data.expCost + " EXP";
        ageBtn.disabled = exp < data.expCost;
    } else {
        document.getElementById("cost-age").innerText = "MAX";
        ageBtn.disabled = true;
    }
}

function spawnUnit(slot) {
    const config = AGE_DATA[age]["u" + slot];
    if (gold >= config.cost) {
        gold -= config.cost;
        playerUnits.push(createUnit(config, playerBase.x + 35, 1));
    }
}

function buildTurret() {
    const config = AGE_DATA[age].turret;
    if (gold >= config.cost && playerBase.turrets.length < playerBase.slots) {
        gold -= config.cost;
        playerBase.turrets.push({ ...config, lastShot: 0 });
    }
}

function buyTurretSlot() {
    const cost = playerBase.slots * 200;
    if (gold >= cost && playerBase.slots < 3) {
        gold -= cost;
        playerBase.slots++;
    }
}

function evolveAge() {
    if (age < 5 && exp >= AGE_DATA[age].expCost) {
        exp -= AGE_DATA[age].expCost;
        age++;
        playerBase.hp = Math.min(playerBase.hp + 150, BASE_HP_MAX);
        addText("ZEITALTER-AUFRÜSTUNG!", canvas.width / 2, 80, "#ff9900");
    }
}

function useSpecial() {
    if (specialCooldown) return;
    specialCooldown = true;
    document.getElementById("btn-special").disabled = true;

    addText("SPEZIALANGRIFF!", canvas.width / 2, 100, "#ff3333");

    // Meteoriten regen
    for (let i = 0; i < 12; i++) {
        setTimeout(() => {
            const rx = 200 + Math.random() * 600;
            projectiles.push({
                x: rx - 100, y: -20, targetX: rx, targetY: 300,
                vx: 4, vy: 8, dmg: 80 + age * 30, radius: 15, isSpecial: true
            });
        }, i * 150);
    }

    setTimeout(() => {
        specialCooldown = false;
        document.getElementById("btn-special").disabled = false;
    }, 20000); // 20s Cooldown
}

function createUnit(config, startX, team) {
    return {
        ...config,
        x: startX,
        y: 300,
        team: team,
        hp: config.hp,
        maxHp: config.hp,
        lastAttack: 0,
        anim: Math.random() * 10
    };
}

// KI Gegner Spawner
let aiTimer = 0;
function handleAI() {
    aiTimer++;
    if (aiTimer > 180) {
        aiTimer = 0;
        const slot = Math.floor(Math.random() * 3) + 1;
        const config = AGE_DATA[age]["u" + slot];
        enemyUnits.push(createUnit(config, enemyBase.x - 35, -1));
    }
}

// Particle & Text FX
function addParticles(x, y, color, count = 5) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.7) * 4,
            life: 1, color
        });
    }
}

function addText(text, x, y, color = "#fff") {
    floatingTexts.push({ text, x, y, life: 1, color });
}

// Main Game Loop
function update() {
    if (gameOver) return;

    gold += 0.08;
    handleAI();

    // Player & Enemy Units Logic
    playerUnits.forEach(u => updateUnit(u, enemyUnits, enemyBase));
    enemyUnits.forEach(u => updateUnit(u, playerUnits, playerBase));

    // Turret Attacks
    handleTurrets(playerBase, enemyUnits, 1);
    handleTurrets(enemyBase, playerUnits, -1);

    // Projectile Movement
    projectiles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.isSpecial) {
            if (p.y >= p.targetY) {
                addParticles(p.x, p.y, "#ff4400", 12);
                [...playerUnits, ...enemyUnits].forEach(u => {
                    if (Math.abs(u.x - p.x) < 50) u.hp -= p.dmg;
                });
                projectiles.splice(idx, 1);
            }
        } else if (Math.abs(p.x - p.targetX) < 10) {
            if (p.target) p.target.hp -= p.dmg;
            addParticles(p.x, p.y, "#ffff00", 4);
            projectiles.splice(idx, 1);
        }
    });

    // FX Decay
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
    });

    floatingTexts.forEach((ft, i) => {
        ft.y -= 0.5; ft.life -= 0.02;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    });

    // Clean Dead Units
    enemyUnits = enemyUnits.filter(e => {
        if (e.hp <= 0) {
            gold += e.cost * 0.7;
            exp += e.cost * 1.2;
            addText(`+${Math.floor(e.cost * 0.7)}G`, e.x, e.y - 15, "#ffd700");
            addParticles(e.x, e.y, "#cc0000", 8);
            return false;
        }
        return true;
    });

    playerUnits = playerUnits.filter(u => {
        if (u.hp <= 0) {
            addParticles(u.x, u.y, "#999999", 8);
            return false;
        }
        return true;
    });

    if (playerBase.hp <= 0 || enemyBase.hp <= 0) gameOver = true;

    updateUI();
}

function updateUnit(u, enemyList, enemyBaseObj) {
    u.anim += 0.1;
    let target = null;
    let minDist = u.rng;

    enemyList.forEach(e => {
        let dist = u.team === 1 ? (e.x - u.x) : (u.x - e.x);
        if (dist > 0 && dist <= minDist) {
            target = e;
            minDist = dist;
        }
    });

    if (!target) {
        let distBase = u.team === 1 ? (enemyBaseObj.x - u.x) : (u.x - enemyBaseObj.x);
        if (distBase <= u.rng) target = enemyBaseObj;
    }

    if (target) {
        if (Date.now() - u.lastAttack > 1000) {
            u.lastAttack = Date.now();
            if (u.type === "r") {
                projectiles.push({
                    x: u.x, y: u.y - 15, targetX: target.x || enemyBaseObj.x,
                    vx: u.team * 6, vy: -1, dmg: u.dmg, target: target
                });
            } else {
                target.hp -= u.dmg;
                addParticles(u.x + (u.team * 10), u.y - 10, "#ff0000", 3);
            }
        }
    } else {
        u.x += u.spd * u.team;
    }
}

function handleTurrets(base, enemyList, team) {
    base.turrets.forEach((t, i) => {
        if (Date.now() - t.lastShot > t.rate) {
            let target = enemyList.find(e => (team === 1 ? e.x > base.x && e.x - base.x < t.rng : base.x > e.x && base.x - e.x < t.rng));
            if (target) {
                t.lastShot = Date.now();
                projectiles.push({
                    x: base.x, y: 220 - (i * 30), targetX: target.x,
                    vx: team * 8, vy: -1, dmg: t.dmg, target: target
                });
            }
        }
    });
}

// Drawing Functions (Flash Style)
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Sky
    ctx.fillStyle = AGE_DATA[age].bg;
    ctx.fillRect(0, 0, canvas.width, 300);

    // Ground
    ctx.fillStyle = "#221408";
    ctx.fillRect(0, 300, canvas.width, 80);
    ctx.fillStyle = "#483118";
    ctx.fillRect(0, 300, canvas.width, 8);

    // Bases
    drawBase(playerBase.x, 300, 1, playerBase.hp, playerBase.slots, playerBase.turrets);
    drawBase(enemyBase.x, 300, -1, enemyBase.hp, enemyBase.slots, enemyBase.turrets);

    // Units
    playerUnits.forEach(u => drawUnit(u));
    enemyUnits.forEach(u => drawUnit(u));

    // Projectiles
    projectiles.forEach(p => {
        ctx.fillStyle = p.isSpecial ? "#ff3300" : "#ffff00";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius || 3, 0, Math.PI * 2);
        ctx.fill();
    });

    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1.0;
    });

    // Floating Text
    ctx.font = "bold 12px Arial";
    floatingTexts.forEach(ft => {
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = ft.life;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.globalAlpha = 1.0;
    });

    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 40px Arial";
        ctx.textAlign = "center";
        ctx.fillText(playerBase.hp > 0 ? "SIEG!" : "GAME OVER", canvas.width / 2, canvas.height / 2);
    }
}

function drawBase(x, groundY, team, hp, slots, turrets) {
    ctx.save();
    ctx.translate(x, groundY);

    // Basis Struktur (Zeitalter-spezifisch)
    ctx.fillStyle = team === 1 ? "#666" : "#442222";
    ctx.fillRect(-30 * team, -120, 40 * team, 120);

    // Turm-Slots & Turrets
    for (let i = 0; i < slots; i++) {
        let ty = -130 - (i * 25);
        ctx.fillStyle = "#333";
        ctx.fillRect(-25 * team, ty, 30 * team, 15);
        if (turrets[i]) {
            ctx.fillStyle = "#ffaa00";
            ctx.fillRect(-20 * team, ty - 5, 20 * team, 10);
        }
    }

    // HP-Balken
    ctx.fillStyle = "#000";
    ctx.fillRect(-40, -170, 80, 8);
    ctx.fillStyle = hp / BASE_HP_MAX > 0.3 ? "#00ff00" : "#ff0000";
    ctx.fillRect(-40, -170, (hp / BASE_HP_MAX) * 80, 8);

    ctx.restore();
}

function drawUnit(u) {
    ctx.save();
    ctx.translate(u.x, u.y);

    let bob = Math.sin(u.anim) * 2;

    // Körper
    ctx.fillStyle = u.team === 1 ? u.color || "#0088ff" : "#ff3333";
    ctx.fillRect(-8, -25 + bob, 16, 20);

    // Kopf
    ctx.fillStyle = "#ffcc99";
    ctx.beginPath();
    ctx.arc(0, -30 + bob, 6, 0, Math.PI * 2);
    ctx.fill();

    // HP Balken
    if (u.hp < u.maxHp) {
        ctx.fillStyle = "#000";
        ctx.fillRect(-10, -40, 20, 3);
        ctx.fillStyle = "#00ff00";
        ctx.fillRect(-10, -40, (u.hp / u.maxHp) * 20, 3);
    }

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
