<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Zombie Survival</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030607;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    touch-action:none;
}

#gameWrapper{
    position:fixed;
    inset:0;
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* =========================================================
   HUD
========================================================= */

#hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;

    z-index:20;
    pointer-events:none;
}

.hudLeft,
.hudRight{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.hudBox{
    min-width:125px;

    padding:8px 11px;

    border-radius:10px;

    background:rgba(2,12,12,.82);

    border:1px solid rgba(0,255,195,.4);

    box-shadow:
        0 0 15px rgba(0,255,195,.08),
        inset 0 0 12px rgba(0,255,195,.04);

    font-size:12px;
    font-weight:bold;
}

.hudValue{
    color:#00ffc3;
    font-size:16px;
    margin-left:4px;
}

.healthOuter{
    width:175px;
    height:12px;

    margin-top:5px;

    border-radius:20px;
    overflow:hidden;

    background:#180606;

    border:1px solid rgba(255,80,80,.4);
}

#healthBar{
    height:100%;
    width:100%;

    background:linear-gradient(
        90deg,
        #ff3030,
        #ff8800,
        #00ff9d
    );

    transition:width:.15s;
}

/* =========================================================
   PAUSE
========================================================= */

#pauseButton{
    position:absolute;

    top:12px;
    left:50%;

    transform:translateX(-50%);

    width:46px;
    height:40px;

    z-index:30;

    border-radius:10px;

    border:1px solid rgba(0,255,195,.45);

    background:rgba(2,12,12,.9);

    color:#00ffc3;

    font-size:18px;
    font-weight:bold;
}

/* =========================================================
   OVERLAYS
========================================================= */

.overlay{
    position:absolute;
    inset:0;

    z-index:50;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(0,255,195,.08),
            rgba(0,0,0,.92) 70%
        );

    backdrop-filter:blur(6px);
}

.panel{
    width:min(94%,560px);

    padding:28px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(7,20,22,.98),
            rgba(2,8,10,.98)
        );

    border:1px solid rgba(0,255,195,.4);

    box-shadow:
        0 0 35px rgba(0,255,195,.13);

    text-align:center;
}

.title{
    font-size:clamp(30px,7vw,54px);

    font-weight:900;

    color:#00ffc3;

    text-shadow:
        0 0 10px rgba(0,255,195,.6),
        0 0 30px rgba(0,255,195,.25);

    margin-bottom:10px;
}

.subtitle{
    color:#9eb4b3;

    font-size:14px;

    line-height:1.5;

    margin-bottom:24px;
}

/* =========================================================
   DIFFICULTY
========================================================= */

.difficultyTitle{
    font-size:14px;

    font-weight:bold;

    color:#d8eeee;

    margin-bottom:11px;
}

.difficultyButtons{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;

    margin-bottom:20px;
}

.diffButton{
    padding:12px 5px;

    border-radius:10px;

    border:1px solid rgba(0,255,195,.25);

    background:#081214;

    color:#b8cccc;

    font-weight:bold;
}

.diffButton.active{
    background:#07382f;

    color:#00ffc3;

    border-color:#00ffc3;

    box-shadow:
        0 0 15px rgba(0,255,195,.15);
}

.startButton,
.restartButton{
    width:100%;

    padding:14px;

    border-radius:11px;

    border:0;

    background:
        linear-gradient(
            135deg,
            #00ffc3,
            #00b88e
        );

    color:#00100c;

    font-size:15px;

    font-weight:900;
}

/* =========================================================
   UPGRADE SCREEN
========================================================= */

#upgradeScreen{
    display:none;
}

.upgradeTitle{
    font-size:34px;

    color:#00ffc3;

    font-weight:900;

    margin-bottom:5px;
}

.upgradeSubtitle{
    color:#a4bbbb;

    font-size:14px;

    margin-bottom:8px;
}

.pointsText{
    font-size:20px;

    font-weight:bold;

    color:#ffe56b;

    margin-bottom:18px;
}

.upgradeGrid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;
}

.upgradeButton{
    min-height:100px;

    padding:13px;

    border-radius:13px;

    border:1px solid rgba(0,255,195,.28);

    background:
        linear-gradient(
            145deg,
            #0a1a1c,
            #071012
        );

    color:white;

    cursor:pointer;

    transition:.15s;
}

.upgradeButton:hover{
    border-color:#00ffc3;

    transform:translateY(-2px);

    box-shadow:
        0 0 15px rgba(0,255,195,.1);
}

.upgradeIcon{
    font-size:27px;

    margin-bottom:5px;
}

.upgradeName{
    color:#00ffc3;

    font-size:14px;

    font-weight:bold;

    margin-bottom:4px;
}

.upgradeDescription{
    color:#9db1b0;

    font-size:11px;

    line-height:1.35;
}

.upgradeCost{
    margin-top:6px;

    color:#ffe56b;

    font-size:11px;

    font-weight:bold;
}

/* =========================================================
   RESULT
========================================================= */

.resultTitle{
    font-size:38px;

    font-weight:900;

    margin-bottom:12px;
}

.resultText{
    color:#a8bbbb;

    line-height:1.6;

    margin-bottom:22px;
}

/* =========================================================
   JOYSTICK
========================================================= */

#joystick{
    position:absolute;

    left:25px;
    bottom:28px;

    width:145px;
    height:145px;

    border-radius:50%;

    background:rgba(0,20,20,.38);

    border:
        2px solid
        rgba(0,255,195,.2);

    z-index:35;

    display:none;

    touch-action:none;
}

#joystickKnob{
    position:absolute;

    width:62px;
    height:62px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(0,255,195,.18);

    border:
        2px solid
        rgba(0,255,195,.55);

    box-shadow:
        0 0 20px
        rgba(0,255,195,.12);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

    #joystick{
        display:block;
    }

    .hudBox{
        min-width:100px;

        padding:6px 8px;

        font-size:10px;
    }

    .hudValue{
        font-size:14px;
    }

    .healthOuter{
        width:130px;
        height:10px;
    }

    #pauseButton{
        top:8px;
    }

    .panel{
        padding:22px;
    }

}

@media(max-width:520px){

    .upgradeGrid{
        gap:7px;
    }

    .upgradeButton{
        min-height:92px;

        padding:9px;
    }

    .upgradeIcon{
        font-size:23px;
    }

    .upgradeName{
        font-size:12px;
    }

    .upgradeDescription{
        font-size:9px;
    }

}

</style>

</head>

<body>

<div id="gameWrapper">

<canvas id="gameCanvas"></canvas>


<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

    <div class="hudLeft">

        <div class="hudBox">

            ❤️ Leben

            <div class="healthOuter">
                <div id="healthBar"></div>
            </div>

        </div>

        <div class="hudBox">

            Level:
            <span
                class="hudValue"
                id="levelDisplay">
                1 / 20
            </span>

        </div>

    </div>


    <div class="hudRight">

        <div class="hudBox">

            🧟 Zombies:
            <span
                class="hudValue"
                id="zombieDisplay">
                0
            </span>

        </div>

        <div class="hudBox">

            ☠ Kills:
            <span
                class="hudValue"
                id="killDisplay">
                0
            </span>

        </div>

    </div>

</div>


<button id="pauseButton">
    Ⅱ
</button>


<!-- =====================================================
     JOYSTICK
===================================================== -->

<div id="joystick">

    <div id="joystickKnob"></div>

</div>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div
    class="overlay"
    id="startScreen">

    <div class="panel">

        <div class="title">
            ZOMBIE SURVIVAL
        </div>

        <div class="subtitle">

            Überlebe 20 Level in einer
            riesigen Welt. Deine Waffe
            schießt automatisch.

        </div>

        <div class="difficultyTitle">
            SCHWIERIGKEIT
        </div>

        <div class="difficultyButtons">

            <button
                class="diffButton active"
                data-difficulty="easy">
                LEICHT
            </button>

            <button
                class="diffButton"
                data-difficulty="normal">
                MITTEL
            </button>

            <button
                class="diffButton"
                data-difficulty="hard">
                SCHWER
            </button>

        </div>

        <button
            class="startButton"
            id="startButton">

            SPIEL STARTEN

        </button>

    </div>

</div>


<!-- =====================================================
     UPGRADE SCREEN
===================================================== -->

<div
    class="overlay"
    id="upgradeScreen">

    <div class="panel">

        <div class="upgradeTitle">
            LEVEL GESCHAFFT!
        </div>

        <div class="upgradeSubtitle">
            Wähle ein Upgrade für deinen Charakter.
        </div>

        <div
            class="pointsText"
            id="pointsText">
            ⭐ 3 Punkte
        </div>

        <div class="upgradeGrid">

            <button
                class="upgradeButton"
                data-upgrade="fireRate">

                <div class="upgradeIcon">
                    🔫
                </div>

                <div class="upgradeName">
                    SCHNELLER FEUERN
                </div>

                <div class="upgradeDescription">
                    Verkürzt die Zeit zwischen
                    den Schüssen.
                </div>

                <div
                    class="upgradeCost"
                    id="cost-fireRate">
                    Kosten: 1 Punkt
                </div>

            </button>


            <button
                class="upgradeButton"
                data-upgrade="health">

                <div class="upgradeIcon">
                    ❤️
                </div>

                <div class="upgradeName">
                    MEHR LEBEN
                </div>

                <div class="upgradeDescription">
                    Erhöht deine maximale
                    Lebensenergie.
                </div>

                <div
                    class="upgradeCost"
                    id="cost-health">
                    Kosten: 1 Punkt
                </div>

            </button>


            <button
                class="upgradeButton"
                data-upgrade="damage">

                <div class="upgradeIcon">
                    💥
                </div>

                <div class="upgradeName">
                    MEHR SCHADEN
                </div>

                <div class="upgradeDescription">
                    Deine Geschosse verursachen
                    mehr Schaden.
                </div>

                <div
                    class="upgradeCost"
                    id="cost-damage">
                    Kosten: 1 Punkt
                </div>

            </button>


            <button
                class="upgradeButton"
                data-upgrade="speed">

                <div class="upgradeIcon">
                    🏃
                </div>

                <div class="upgradeName">
                    SCHNELLER LAUFEN
                </div>

                <div class="upgradeDescription">
                    Erhöht deine
                    Bewegungsgeschwindigkeit.
                </div>

                <div
                    class="upgradeCost"
                    id="cost-speed">
                    Kosten: 1 Punkt
                </div>

            </button>


            <button
                class="upgradeButton"
                data-upgrade="bulletSpeed">

                <div class="upgradeIcon">
                    ⚡
                </div>

                <div class="upgradeName">
                    SCHNELLERE GESCHOSSE
                </div>

                <div class="upgradeDescription">
                    Deine Geschosse fliegen
                    schneller zum Ziel.
                </div>

                <div
                    class="upgradeCost"
                    id="cost-bulletSpeed">
                    Kosten: 1 Punkt
                </div>

            </button>


            <button
                class="upgradeButton"
                data-upgrade="heal">

                <div class="upgradeIcon">
                    💚
                </div>

                <div class="upgradeName">
                    HEILUNG
                </div>

                <div class="upgradeDescription">
                    Stellt einen Teil deiner
                    Lebensenergie wieder her.
                </div>

                <div
                    class="upgradeCost"
                    id="cost-heal">
                    Kosten: 1 Punkt
                </div>

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     PAUSE
===================================================== -->

<div
    class="overlay"
    id="pauseScreen"
    style="display:none">

    <div class="panel">

        <div class="resultTitle">
            PAUSE
        </div>

        <div class="resultText">
            Das Spiel wurde pausiert.
        </div>

        <button
            class="restartButton"
            id="resumeButton">

            WEITERSPIELEN

        </button>

    </div>

</div>


<!-- =====================================================
     GAME OVER
===================================================== -->

<div
    class="overlay"
    id="gameOverScreen"
    style="display:none">

    <div class="panel">

        <div class="resultTitle">
            GAME OVER
        </div>

        <div
            class="resultText"
            id="gameOverText">

        </div>

        <button
            class="restartButton"
            id="restartButton">

            NOCHMAL SPIELEN

        </button>

    </div>

</div>


<!-- =====================================================
     WIN
===================================================== -->

<div
    class="overlay"
    id="winScreen"
    style="display:none">

    <div class="panel">

        <div
            class="resultTitle"
            style="color:#00ffc3">

            SIEG!

        </div>

        <div
            class="resultText"
            id="winText">

        </div>

        <button
            class="restartButton"
            id="winRestartButton">

            NOCHMAL SPIELEN

        </button>

    </div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

let dpr =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );

function resizeCanvas(){

    W = window.innerWidth;
    H = window.innerHeight;

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   WELT
========================================================= */

const WORLD = {

    width:5000,
    height:5000

};


/* =========================================================
   KAMERA
========================================================= */

const camera = {

    x:0,
    y:0

};


/* =========================================================
   SPIELER
========================================================= */

const player = {

    x:
        WORLD.width / 2,

    y:
        WORLD.height / 2,

    radius:21,

    speed:270,

    health:100,

    maxHealth:100,

    angle:0,

    shootCooldown:0,

    fireRate:0.55,

    damage:22,

    bulletSpeed:620

};


/* =========================================================
   UPGRADE SYSTEM
========================================================= */

let upgradePoints = 0;

const upgradeLevels = {

    fireRate:0,
    health:0,
    damage:0,
    speed:0,
    bulletSpeed:0,
    heal:0

};

function getUpgradeCost(type){

    const level =
        upgradeLevels[type];

    return 1 + Math.floor(level / 3);

}


function updateUpgradeScreen(){

    document
    .getElementById("pointsText")
    .textContent =
        "⭐ " +
        upgradePoints +
        " Punkte";

    const types = [
        "fireRate",
        "health",
        "damage",
        "speed",
        "bulletSpeed",
        "heal"
    ];

    for(const type of types){

        const cost =
            getUpgradeCost(type);

        document
        .getElementById(
            "cost-" + type
        )
        .textContent =
            "Kosten: " +
            cost +
            " Punkt" +
            (cost === 1 ? "" : "e");

    }

}


/* =========================================================
   UPGRADE AUSFÜHREN
========================================================= */

function buyUpgrade(type){

    const cost =
        getUpgradeCost(type);

    if(upgradePoints < cost){
        return;
    }

    upgradePoints -= cost;

    upgradeLevels[type]++;


    /* SCHNELLER FEUERN */

    if(type === "fireRate"){

        player.fireRate =
            Math.max(
                0.12,
                player.fireRate - 0.07
            );

    }


    /* MEHR LEBEN */

    if(type === "health"){

        player.maxHealth += 20;

        player.health += 20;

    }


    /* MEHR SCHADEN */

    if(type === "damage"){

        player.damage += 7;

    }


    /* SCHNELLER LAUFEN */

    if(type === "speed"){

        player.speed += 25;

    }


    /* SCHNELLERE GESCHOSSE */

    if(type === "bulletSpeed"){

        player.bulletSpeed += 80;

    }


    /* HEILUNG */

    if(type === "heal"){

        player.health =
            Math.min(
                player.maxHealth,
                player.health + 30
            );

    }

    updateUpgradeScreen();

    updateHUD();

}


/* =========================================================
   UPGRADE BUTTONS
========================================================= */

document
.querySelectorAll(".upgradeButton")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            buyUpgrade(
                button.dataset.upgrade
            );

            /*
             * Eine Auswahl kostet Punkte.
             * Sobald keine Punkte mehr vorhanden sind,
             * geht das Spiel automatisch weiter.
             */

            if(upgradePoints <= 0){

                closeUpgradeScreen();

            }

        }
    );

});


/* =========================================================
   SPIELSTATUS
========================================================= */

let gameRunning = false;

let paused = false;

let level = 1;

const MAX_LEVEL = 20;

let kills = 0;

let levelTime = 0;

const LEVEL_DURATION = 30000;

let spawnTimer = 0;


/* =========================================================
   SCHWIERIGKEIT
========================================================= */

const difficulties = {

    easy:{
        zombieSpeed:.78,
        damage:7,
        spawnMultiplier:.72,
        maxZombies:45
    },

    normal:{
        zombieSpeed:1,
        damage:10,
        spawnMultiplier:1,
        maxZombies:60
    },

    hard:{
        zombieSpeed:1.22,
        damage:14,
        spawnMultiplier:1.25,
        maxZombies:80
    }

};

let selectedDifficulty =
    "easy";


/* =========================================================
   ARRAYS
========================================================= */

const zombies = [];

const bullets = [];

const particles = [];

const decorations = [];


/* =========================================================
   DEKORATION
========================================================= */

function createDecorations(){

    decorations.length = 0;

    for(
        let i=0;
        i<420;
        i++
    ){

        decorations.push({

            x:
                60 +
                Math.random() *
                (WORLD.width-120),

            y:
                60 +
                Math.random() *
                (WORLD.height-120),

            type:
                Math.random()<.62
                ? "tree"
                : "rock",

            size:
                10 +
                Math.random()*18

        });

    }

}

createDecorations();


/* =========================================================
   KEYBOARD
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;

        if(
            [
                "arrowup",
                "arrowdown",
                "arrowleft",
                "arrowright",
                " "
            ].includes(
                e.key.toLowerCase()
            )
        ){

            e.preventDefault();

        }

        if(
            e.key.toLowerCase() === "p"
        ){

            togglePause();

        }

    }
);

window.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
    document.getElementById(
        "joystick"
    );

const joystickKnob =
    document.getElementById(
        "joystickKnob"
    );

let joystickActive = false;

let joystickX = 0;

let joystickY = 0;

let joystickPointerId = null;


function updateJoystick(e){

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width/2;

    const centerY =
        rect.top +
        rect.height/2;

    let dx =
        e.clientX-centerX;

    let dy =
        e.clientY-centerY;

    const maxDistance =
        rect.width*.29;

    const distance =
        Math.sqrt(
            dx*dx+
            dy*dy
        );

    if(distance>maxDistance){

        dx =
            dx/distance*
            maxDistance;

        dy =
            dy/distance*
            maxDistance;

    }

    joystickX =
        dx/maxDistance;

    joystickY =
        dy/maxDistance;

    joystickKnob.style.transform =
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;

}


joystick.addEventListener(
    "pointerdown",
    e => {

        joystickActive = true;

        joystickPointerId =
            e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(e);

    }
);


joystick.addEventListener(
    "pointermove",
    e => {

        if(
            !joystickActive ||
            e.pointerId !==
            joystickPointerId
        ){
            return;
        }

        updateJoystick(e);

    }
);


function resetJoystick(){

    joystickActive = false;

    joystickPointerId = null;

    joystickX = 0;

    joystickY = 0;

    joystickKnob.style.transform =
        "translate(-50%,-50%)";

}

joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


/* =========================================================
   SCHWIERIGKEIT
========================================================= */

document
.querySelectorAll(".diffButton")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(
                ".diffButton"
            )
            .forEach(b =>
                b.classList.remove(
                    "active"
                )
            );

            button.classList.add(
                "active"
            );

            selectedDifficulty =
                button.dataset.difficulty;

        }
    );

});

/* =========================================================
   SPIELER
========================================================= */

function updatePlayer(dt){

    let moveX = 0;

    let moveY = 0;

    if(
        keys["w"] ||
        keys["arrowup"]
    ){
        moveY--;
    }

    if(
        keys["s"] ||
        keys["arrowdown"]
    ){
        moveY++;
    }

    if(
        keys["a"] ||
        keys["arrowleft"]
    ){
        moveX--;
    }

    if(
        keys["d"] ||
        keys["arrowright"]
    ){
        moveX++;
    }

    if(joystickActive){

        moveX += joystickX;

        moveY += joystickY;

    }

    const length =
        Math.sqrt(
            moveX*moveX+
            moveY*moveY
        );

    if(length>0){

        moveX/=length;

        moveY/=length;

        player.x +=
            moveX*
            player.speed*
            dt;

        player.y +=
            moveY*
            player.speed*
            dt;

    }

    const margin = 35;

    player.x =
        Math.max(
            margin,
            Math.min(
                WORLD.width-margin,
                player.x
            )
        );

    player.y =
        Math.max(
            margin,
            Math.min(
                WORLD.height-margin,
                player.y
            )
        );

}


/* =========================================================
   KAMERA
========================================================= */

function updateCamera(dt){

    const maxX =
        Math.max(
            0,
            WORLD.width-W
        );

    const maxY =
        Math.max(
            0,
            WORLD.height-H
        );

    const targetX =
        player.x-W/2;

    const targetY =
        player.y-H/2;

    const smooth =
        Math.min(
            1,
            dt*8
        );

    camera.x +=
        (targetX-camera.x)*
        smooth;

    camera.y +=
        (targetY-camera.y)*
        smooth;

    camera.x =
        Math.max(
            0,
            Math.min(
                maxX,
                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                maxY,
                camera.y
            )
        );

}


/* =========================================================
   NÄCHSTER ZOMBIE
========================================================= */

function getNearestZombie(){

    let nearest = null;

    let nearestDistance =
        Infinity;

    for(const zombie of zombies){

        const dx =
            zombie.x-player.x;

        const dy =
            zombie.y-player.y;

        const distance =
            dx*dx+dy*dy;

        if(
            distance <
            nearestDistance
        ){

            nearestDistance =
                distance;

            nearest =
                zombie;

        }

    }

    return nearest;

}


/* =========================================================
   AUTOMATISCHE WAFFE
========================================================= */

function autoShoot(dt){

    player.shootCooldown -= dt;

    const target =
        getNearestZombie();

    if(!target){
        return;
    }

    const dx =
        target.x-player.x;

    const dy =
        target.y-player.y;

    player.angle =
        Math.atan2(
            dy,
            dx
        );

    if(
        player.shootCooldown<=0
    ){

        bullets.push({

            x:
                player.x+
                Math.cos(
                    player.angle
                )*27,

            y:
                player.y+
                Math.sin(
                    player.angle
                )*27,

            vx:
                Math.cos(
                    player.angle
                )*
                player.bulletSpeed,

            vy:
                Math.sin(
                    player.angle
                )*
                player.bulletSpeed,

            radius:5,

            life:2,

            damage:
                player.damage

        });

        player.shootCooldown =
            player.fireRate;

        createMuzzleParticles();

    }

}


/* =========================================================
   ZOMBIE SPAWN
========================================================= */

function spawnZombie(){

    const difficulty =
        difficulties[
            selectedDifficulty
        ];

    if(
        zombies.length >=
        difficulty.maxZombies
    ){
        return;
    }

    let x;

    let y;

    let valid = false;


    /*
     * WICHTIG:
     * Zombies kommen jetzt deutlich näher.
     *
     * Dadurch sieht man sie auch wirklich,
     * bevor die automatische Waffe sie erwischt.
     */

    const minDistance =
        Math.min(W,H)*.48;

    const maxDistance =
        Math.min(W,H)*.72;


    for(
        let attempt=0;
        attempt<30;
        attempt++
    ){

        const angle =
            Math.random()*
            Math.PI*2;

        const distance =
            minDistance+
            Math.random()*
            (maxDistance-minDistance);

        x =
            player.x+
            Math.cos(angle)*
            distance;

        y =
            player.y+
            Math.sin(angle)*
            distance;

        if(
            x>45 &&
            x<WORLD.width-45 &&
            y>45 &&
            y<WORLD.height-45
        ){

            valid = true;

            break;

        }

    }


    if(!valid){

        x =
            Math.max(
                45,
                Math.min(
                    WORLD.width-45,
                    player.x+
                    (Math.random()<.5?-1:1)*
                    minDistance
                )
            );

        y =
            Math.max(
                45,
                Math.min(
                    WORLD.height-45,
                    player.y+
                    (Math.random()<.5?-1:1)*
                    minDistance
                )
            );

    }


    /*
     * Zombies werden nicht mehr mit absurdem
     * Anfangsleben ausgestattet.
     */

    const health =
        42+
        level*7;


    zombies.push({

        x:x,

        y:y,

        radius:
            18+
            Math.random()*5,

        speed:
            (
                38+
                level*3
            )*
            difficulty.zombieSpeed*
            (
                .88+
                Math.random()*.2
            ),

        health:health,

        maxHealth:health,

        attackCooldown:0,

        wobble:
            Math.random()*
            Math.PI*2

    });

}


/* =========================================================
   ZOMBIES
========================================================= */

function updateZombies(dt){

    const difficulty =
        difficulties[
            selectedDifficulty
        ];

    for(
        let i=zombies.length-1;
        i>=0;
        i--
    ){

        const zombie =
            zombies[i];

        const dx =
            player.x-zombie.x;

        const dy =
            player.y-zombie.y;

        const distance =
            Math.sqrt(
                dx*dx+
                dy*dy
            );

        if(
            distance >
            player.radius+
            zombie.radius+
            3
        ){

            zombie.x +=
                dx/distance*
                zombie.speed*
                dt;

            zombie.y +=
                dy/distance*
                zombie.speed*
                dt;

        }
        else{

            zombie.attackCooldown -= dt;

            if(
                zombie.attackCooldown<=0
            ){

                player.health -=
                    difficulty.damage;

                zombie.attackCooldown =
                    .85;

                createHitParticles(
                    player.x,
                    player.y
                );

                if(
                    player.health<=0
                ){

                    player.health=0;

                    endGame();

                    return;

                }

            }

        }

        zombie.wobble +=
            dt*5;

    }

}


/* =========================================================
   BULLETS
========================================================= */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet =
            bullets[i];

        bullet.x +=
            bullet.vx*dt;

        bullet.y +=
            bullet.vy*dt;

        bullet.life -= dt;

        let hit = false;


        for(
            let j=zombies.length-1;
            j>=0;
            j--
        ){

            const zombie =
                zombies[j];

            const dx =
                bullet.x-zombie.x;

            const dy =
                bullet.y-zombie.y;

            const distance =
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );

            if(
                distance<
                bullet.radius+
                zombie.radius
            ){

                zombie.health -=
                    bullet.damage;

                createHitParticles(
                    bullet.x,
                    bullet.y
                );

                hit=true;


                if(
                    zombie.health<=0
                ){

                    kills++;

                    createDeathParticles(
                        zombie.x,
                        zombie.y
                    );

                    zombies.splice(
                        j,
                        1
                    );

                }

                break;

            }

        }


        if(
            hit ||
            bullet.life<=0 ||
            bullet.x<0 ||
            bullet.x>WORLD.width ||
            bullet.y<0 ||
            bullet.y>WORLD.height
        ){

            bullets.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   LEVEL
========================================================= */

function updateLevel(dt){

    levelTime += dt;

    if(
        levelTime>=
        LEVEL_DURATION
    ){

        levelTime=0;

        if(
            level<
            MAX_LEVEL
        ){

            level++;

            /*
             * Drei neue Punkte pro Level.
             */

            upgradePoints += 3;

            /*
             * Ein kleiner Teil der Zombies bleibt,
             * damit der Übergang nicht komplett leer ist.
             */

            showUpgradeScreen();

        }
        else{

            winGame();

        }

    }

}

    ){

/* =========================================================
   PARTIKEL
========================================================= */

function createMuzzleParticles(){

    for(
        let i=0;
        i<5;
        i++
    ){

        const angle =
            player.angle+
            (
                Math.random()-.5
            )*.6;

        const speed =
            70+
            Math.random()*90;

        particles.push({

            x:
                player.x+
                Math.cos(
                    player.angle
                )*28,

            y:
                player.y+
                Math.sin(
                    player.angle
                )*28,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            life:
                .2+
                Math.random()*.2,

            size:
                2+
                Math.random()*3

        });

    }

}


function createHitParticles(
    x,
    y
){

    for(
        let i=0;
        i<5;
        i++
    ){

        const angle =
            Math.random()*
            Math.PI*2;

        const speed =
            40+
            Math.random()*100;

        particles.push({

            x:x,
            y:y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            life:
                .3+
                Math.random()*.25,

            size:
                2+
                Math.random()*3

        });

    }

}


function createDeathParticles(
    x,
    y
){

    for(
        let i=0;
        i<12;
        i++
    ){

        const angle =
            Math.random()*
            Math.PI*2;

        const speed =
            50+
            Math.random()*130;

        particles.push({

            x:x,
            y:y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            life:
                .35+
                Math.random()*.4,

            size:
                2+
                Math.random()*4

        });

    }

}


function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];

        p.x +=
            p.vx*dt;

        p.y +=
            p.vy*dt;

        p.vx *= .96;

        p.vy *= .96;

        p.life -= dt;

        if(
            p.life<=0
        ){

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   WELT
========================================================= */

function drawWorld(){

    ctx.fillStyle =
        "#07100d";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle =
        "#091510";

    ctx.fillRect(
        -camera.x,
        -camera.y,
        WORLD.width,
        WORLD.height
    );


    const grid=100;

    ctx.strokeStyle =
        "rgba(0,255,170,.045)";

    ctx.lineWidth=1;

    const startX =
        Math.floor(
            camera.x/grid
        )*grid;

    const startY =
        Math.floor(
            camera.y/grid
        )*grid;


    for(
        let x=startX;
        x<=camera.x+W;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x-camera.x,
            0
        );

        ctx.lineTo(
            x-camera.x,
            H
        );

        ctx.stroke();

    }


    for(
        let y=startY;
        y<=camera.y+H;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y-camera.y
        );

        ctx.lineTo(
            W,
            y-camera.y
        );

        ctx.stroke();

    }


    for(
        const d of decorations
    ){

        const sx =
            d.x-camera.x;

        const sy =
            d.y-camera.y;

        if(
            sx<-50 ||
            sx>W+50 ||
            sy<-50 ||
            sy>H+50
        ){
            continue;
        }


        if(
            d.type==="tree"
        ){

            ctx.fillStyle =
                "rgba(9,52,38,.85)";

            ctx.beginPath();

            ctx.arc(
                sx,
                sy,
                d.size,
                0,
                Math.PI*2
            );

            ctx.fill();


            ctx.fillStyle =
                "rgba(65,100,65,.65)";

            ctx.beginPath();

            ctx.arc(
                sx-4,
                sy-5,
                d.size*.55,
                0,
                Math.PI*2
            );

            ctx.fill();

        }
        else{

            ctx.fillStyle =
                "rgba(65,75,70,.7)";

            ctx.beginPath();

            ctx.ellipse(
                sx,
                sy,
                d.size,
                d.size*.7,
                .3,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    ctx.strokeStyle =
        "rgba(0,255,195,.6)";

    ctx.lineWidth=4;

    ctx.strokeRect(
        -camera.x,
        -camera.y,
        WORLD.width,
        WORLD.height
    );

}


/* =========================================================
   ZIEL
========================================================= */

function drawTarget(){

    const target =
        getNearestZombie();

    if(!target){
        return;
    }

    const x =
        target.x-camera.x;

    const y =
        target.y-camera.y;

    const px =
        player.x-camera.x;

    const py =
        player.y-camera.y;


    /*
     * Die Zielhilfe wird jetzt schwächer dargestellt.
     * Dadurch sieht das Spiel nicht so aus,
     * als würde ein Laserstrahl alles verraten.
     */

    ctx.strokeStyle =
        "rgba(0,255,195,.08)";

    ctx.lineWidth=1;

    ctx.setLineDash([
        5,
        9
    ]);

    ctx.beginPath();

    ctx.moveTo(
        px,
        py
    );

    ctx.lineTo(
        x,
        y
    );

    ctx.stroke();

    ctx.setLineDash([]);


    ctx.strokeStyle =
        "rgba(255,90,90,.65)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        target.radius+7,
        0,
        Math.PI*2
    );

    ctx.stroke();

}

   SPIELER

    );

    )
    .textContent =
        zombies.length;


    const healthPercent =
        Math.max(
            0,
            Math.min(
                100,
                player.health/
                player.maxHealth*
                100
            )
        );

    document
    .getElementById(
        "healthBar"
    )
    .style.width =
        healthPercent+"%";

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

    gameRunning=false;

    paused=false;

    document
    .getElementById(
        "pauseScreen"
    )
    .style.display =
        "none";

    document
    .getElementById(
        "upgradeScreen"
    )
    .style.display =
        "none";

    document
    .getElementById(
        "gameOverScreen"
    )
    .style.display =
        "flex";


    document
    .getElementById(
        "gameOverText"
    )
    .textContent =
        "Du hast Level "+
        level+
        " erreicht und "+
        kills+
        " Zombies besiegt.";

}


/* =========================================================
   SIEG

function winGame(){

    gameRunning=false;

    .getElementById(
        "winScreen"
    )
    .style.display =

    .getElementById(

/* =========================================================
   RESTART
========================================================= */

document
.getElementById(
    "restartButton"
)
.addEventListener(
    "click",
    startGame
);


document
.getElementById(
    "winRestartButton"
)
.addEventListener(

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(
        !gameRunning ||
        paused
    ){
        return;
    }


    updatePlayer(dt);

    updateCamera(dt);


    updateLevel(dt);

    /*
     * Wenn gerade nach einem Level
     * das Upgrade-Fenster geöffnet wurde,
     * nicht weiter aktualisieren.
     */

    if(!gameRunning){
        return;
    }


    const difficulty =
        difficulties[
            selectedDifficulty
        ];


    spawnTimer -= dt;


    /*
     * Anfangs etwas mehr Zeit zwischen
     * den Zombies.
     *
     * Mit jedem Level wird es schneller.
     */

    const spawnInterval =
        Math.max(
            .42,
            (
                1.25-
                level*.025
            )/
            difficulty.spawnMultiplier
        );


    if(
        spawnTimer<=0
    ){

        spawnTimer =
            spawnInterval;


        let amount=1;


        if(
            level>=6 &&
            Math.random()<.22
        ){
            amount++;
        }


        if(
            level>=12 &&
            Math.random()<.25
        ){
            amount++;
        }


        for(
            let i=0;
            i<amount;
            i++
        ){

            spawnZombie();

        }

    }


    updateZombies(dt);


    if(!gameRunning){
        return;
    }


    autoShoot(dt);

    updateBullets(dt);

    updateParticles(dt);

    updateHUD();

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    drawWorld();

    drawTarget();

    drawBullets();

    drawZombies();

    drawParticles();

    drawPlayer();

}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


function gameLoop(now){

    let dt =
        (now-lastTime)/1000;

    lastTime=now;

    dt =
        Math.min(
            dt,
            .033
        );

    update(dt);

    draw();

    requestAnimationFrame(
        gameLoop
    );

}

requestAnimationFrame(
    gameLoop
);


/* =========================================================
   APP / TAB WECHSEL
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.hidden &&
            gameRunning &&
            !paused
        ){

            togglePause();

        }

    }
);
