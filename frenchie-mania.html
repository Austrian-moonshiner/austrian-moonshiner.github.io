<!DOCTYPE html>

<title>Frenchie Mania</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
}

header {
    text-align: center;
    padding: 15px;
    background: linear-gradient(135deg,#171717,#333);
    border-bottom: 3px solid #777;
}

header h1 {
    margin: 0;
    font-size: 34px;
}

header p {
    margin: 5px 0 0;
    opacity: .8;
}

#game {
    width: 100%;
    max-width: 1250px;
    margin: auto;
}

#info {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
    background: #1c1c1c;
}

.infoBox {
    background: #2b2b2b;
    border-radius: 10px;
    padding: 8px 15px;
    text-align: center;
    min-width: 110px;
}

.infoBox span {
    display: block;
    font-size: 12px;
    opacity: .7;
}

.infoBox strong {
    font-size: 18px;
}

#canvasContainer {
    position: relative;
    width: 100%;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #87ceeb;
    touch-action: none;
    cursor: crosshair;
}

#controls {
    background: #191919;
    text-align: center;
    padding: 12px;
}

button {
    padding: 10px 16px;
    margin: 4px;
    border: 0;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
    background: #eee;
    color: #111;
}

button:hover {
    transform: scale(1.04);
}

#levelPanel {
    display: none;
    background: #222;
    padding: 15px;
    text-align: center;
}

.levelButton {
    width: 58px;
    height: 52px;
    margin: 3px;
    padding: 3px;
    font-size: 13px;
}

.levelLocked {
    opacity: .35;
}

#message {
    position: fixed;
    z-index: 100;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    width: min(90%,430px);
    background: rgba(15,15,15,.97);
    border: 2px solid #777;
    border-radius: 20px;
    padding: 25px;
    text-align: center;
    display: none;
    box-shadow: 0 0 30px rgba(0,0,0,.8);
}

#message h2 {
    margin-top: 0;
    font-size: 30px;
}

#stars {
    font-size: 35px;
    margin: 12px;
}

#worldName {
    text-align: center;
    background: #151515;
    padding: 7px;
    font-weight: bold;
}

.small {
    font-size: 13px;
    opacity: .7;
}

</style>
</head>

<header>
    <h1>🐶 Frenchie Mania 🐶</h1>
    <p>70 Level voller Bulldoggen, Hindernisse und Chaos</p>
</header>

<div id="game">

    <div id="worldName">
        🌳 Garten
    </div>

    <div id="info">

        <div class="infoBox">
            <span>LEVEL</span>

        </div>

        <div class="infoBox">
            <span>PUNKTE</span>

        </div>

        <div class="infoBox">
            <span>ZIEL</span>

        </div>

        </div>

        <div class="infoBox">
            <span>STERNE</span>

        </div>

    </div>

    <div id="canvasContainer">

    </div>

    <div id="controls">

        <button onclick="restartLevel()">

            ◀ Zurück
        </button>

        <button onclick="nextLevel()">

</div>


<div id="message">

/* =========================================================
   LEVEL LADEN
   ========================================================= */

function loadLevel(number) {

    const data = levels[number - 1];

    if (!data) return;

    currentLevel = number;

    score = 0;

    shotsLeft = data.shots;

    blocks = data.blocks.map(b => ({
        ...b
    }));

    targets = data.targets.map(t => ({
        ...t
    }));

    particles = [];

    bulldogs = data.bulldogs.map(type => ({
        type:type,
        used:false
    }));

    currentBulldog = null;

    dragging = false;

    gameOver = false;
    levelFinished = false;

    document.getElementById("message")
        .style.display = "none";

    updateInterface();

    prepareNextBulldog();

}


/* =========================================================
   NÄCHSTE BULLDOGGE
   ========================================================= */

function prepareNextBulldog() {

    if (shotsLeft <= 0) {
        currentBulldog = null;
        return;
    }

    const available =
        bulldogs.find(b => !b.used);

    if (!available) {
        currentBulldog = null;
        return;
    }

    currentBulldog = {

        x:150,
        y:470,

        vx:0,
        vy:0,

        radius:27,

        type:available.type,

        active:false,

        used:false

    };

}

            34,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

    if (b.type === "tyson") {

        ctx.strokeStyle="#ff4444";
        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            34,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

    if (b.type === "coco") {

        ctx.fillStyle="#ffd83d";

        ctx.beginPath();

        ctx.arc(
            0,
            -52,
            7,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    if (b.type === "max") {

        ctx.strokeStyle="#ffffff";
        ctx.lineWidth=4;

        ctx.strokeRect(
            -29,
            -43,
            58,
            70
        );

    }

    ctx.restore();

}


/* =========================================================
   HINTERGRÜNDE
   ========================================================= */

function drawBackground(world) {

    ctx.fillStyle =
        world.sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* Garten */

    if (world.name === "Garten") {

        ctx.fillStyle="#4d923d";

        for(let i=0;i<8;i++) {

            ctx.beginPath();

            ctx.arc(
                80+i*160,
                480,
                65,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* Bauernhof */

    if (world.name === "Bauernhof") {

        ctx.fillStyle="#bd3535";

        ctx.fillRect(
            900,
            280,
            190,
            190
        );

        ctx.beginPath();

        ctx.moveTo(870,280);
        ctx.lineTo(995,190);
        ctx.lineTo(1120,280);

        ctx.fill();

    }


    /* Stadt */

    if (world.name === "Stadt") {

        ctx.fillStyle="#4b4b4b";

        for(let i=0;i<8;i++) {

            let height =
                130+(i*43)%230;

            ctx.fillRect(
                i*160,
                520-height,
                115,
                height
            );

        }

    }


    /* Strand */

    if (world.name === "Strand") {

        ctx.fillStyle="#34a9c5";

        ctx.fillRect(
            0,
            390,
            W,
            130
        );

        ctx.fillStyle="#dbb86c";

        for(let i=0;i<5;i++) {

            ctx.beginPath();

            ctx.arc(
                120+i*240,
                480,
                55,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* Wald */

    if (world.name === "Wald") {

        for(let i=0;i<10;i++) {

            ctx.fillStyle="#3d713d";

            ctx.fillRect(
                i*130+30,
                340,
                25,
                180
            );

            ctx.beginPath();

            ctx.arc(
                i*130+40,
                320,
                65,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* Berge */

    if (world.name === "Berge") {

        ctx.fillStyle="#707070";

        ctx.beginPath();

        ctx.moveTo(0,450);
        ctx.lineTo(190,170);
        ctx.lineTo(380,450);
        ctx.lineTo(620,120);
        ctx.lineTo(880,450);
        ctx.lineTo(1100,170);
        ctx.lineTo(1200,300);
        ctx.lineTo(1200,520);
        ctx.lineTo(0,520);

        ctx.fill();

    }


    /* Schnee */

    if (world.name === "Schnee") {

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            1030,
            100,
            55,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* Vulkan */

    if (world.name === "Vulkan") {

        ctx.fillStyle="#7d2720";

        ctx.beginPath();

        ctx.moveTo(750,520);
        ctx.lineTo(930,190);
        ctx.lineTo(1120,520);

        ctx.fill();

        ctx.fillStyle="#ff6b16";

        ctx.beginPath();

        ctx.arc(
            930,
            260,
            45,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* Nachtstadt */

    if (world.name === "Nachtstadt") {

        ctx.fillStyle="#fff";

        for(let i=0;i<80;i++) {

            ctx.fillRect(
                (i*73)%1200,
                (i*41)%350,
                3,
                3
            );

        }

        ctx.fillStyle="#333955";

        for(let i=0;i<8;i++) {

            ctx.fillRect(
                i*160,
                300-(i*23%120),
                110,
                220
            );

        }

    }


    /* Mondstation */

    if (world.name === "Mondstation") {

        ctx.fillStyle="#aaa";

        ctx.beginPath();

        ctx.arc(
            1000,
            150,
            110,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#111";

        for(let i=0;i<10;i++) {

            ctx.beginPath();

            ctx.arc(
                950+(i*37)%90,
                100+(i*29)%100,
                8,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* Boden */

    ctx.fillStyle =
        world.ground;

    ctx.fillRect(
        0,
        520,
        W,
        130
    );


    /* Schleuder */

    ctx.strokeStyle="#654321";
    ctx.lineWidth=9;

    ctx.beginPath();

    ctx.moveTo(125,515);
    ctx.lineTo(125,450);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(175,515);
    ctx.lineTo(175,450);

    ctx.stroke();

}


/* =========================================================
   BLÖCKE
   ========================================================= */

function drawBlock(b) {

    if (b.hp <= 0)
        return;

    let color="#a66b3f";

    if (b.type === "stone")
        color="#777";

    if (b.type === "ice")
        color="#9de6ff";

    if (b.hp >= 20)
        color="#555";

    ctx.fillStyle =
        color;

    ctx.fillRect(
        b.x,
        b.y,
        b.w,
        b.h
    );

    ctx.strokeStyle="#222";
    ctx.lineWidth=2;

    ctx.strokeRect(
        b.x,
        b.y,
        b.w,
        b.h
    );

    /* Rissanzeige */

    if (b.hp > 5) {

        ctx.strokeStyle =
            "rgba(255,255,255,.18)";

        ctx.beginPath();

        ctx.moveTo(
            b.x+10,
            b.y+10
        );

        ctx.lineTo(
            b.x+b.w-10,
            b.y+b.h-10
        );

        ctx.stroke();

    }

}


/* =========================================================
   ZIELE
   ========================================================= */

function drawTarget(t) {

    if (!t.alive)
        return;

    ctx.fillStyle="#ffd43b";

    ctx.beginPath();

    ctx.arc(
        t.x,
        t.y,
        t.r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#222";
    ctx.lineWidth=3;

    ctx.stroke();

    ctx.fillStyle="#222";

    ctx.beginPath();

    ctx.arc(
        t.x,
        t.y,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================================================
   ZIELEN
   ========================================================= */

function getPointerPosition(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (e.clientX - rect.left)
            * W / rect.width,

        y:
            (e.clientY - rect.top)
            * H / rect.height

    };

}


canvas.addEventListener(
    "pointerdown",
    startDrag
);

canvas.addEventListener(
    "pointermove",
    moveDrag
);

canvas.addEventListener(
    "pointerup",
    releaseDrag
);

canvas.addEventListener(
    "pointercancel",
    releaseDrag
);


function startDrag(e) {

    if (
        gameOver ||
        levelFinished ||
        !currentBulldog ||
        currentBulldog.active ||
        currentBulldog.used
    )
        return;

    const p =
        getPointerPosition(e);

    const distance =
        Math.hypot(
            p.x-currentBulldog.x,
            p.y-currentBulldog.y
        );

    if(distance < 55) {

        dragging=true;

        canvas.setPointerCapture(
            e.pointerId
        );

    }

}


function moveDrag(e) {

    if(!dragging)
        return;

    const p =
        getPointerPosition(e);

    let dx =
        p.x-150;

    let dy =
        p.y-470;

    const maxPull=130;

    const distance =
        Math.hypot(dx,dy);

    if(distance > maxPull) {

        dx =
            dx/distance*maxPull;

        dy =
            dy/distance*maxPull;

    }

    currentBulldog.x =
        150+dx;

    currentBulldog.y =
        470+dy;

}


function releaseDrag() {

    if(!dragging)
        return;

    dragging=false;

    if(!currentBulldog)
        return;

    currentBulldog.vx =
        (150-currentBulldog.x)
        *0.115;

    currentBulldog.vy =
        (470-currentBulldog.y)
        *0.115;

    currentBulldog.active=true;

    currentBulldog.used=true;

    shotsLeft--;

    const used =
        bulldogs.find(
            b => b.type === currentBulldog.type &&
                 !b.used
        );

    if(used)
        used.used=true;

    updateInterface();

}


/* =========================================================
   KOLLISION
   ========================================================= */

function circleRectCollision(circle,rect) {

    const closestX =
        Math.max(
            rect.x,
            Math.min(
                circle.x,
                rect.x+rect.w
            )
        );

    const closestY =
        Math.max(
            rect.y,
            Math.min(
                circle.y,
                rect.y+rect.h
            )
        );

    const dx =
        circle.x-closestX;

    const dy =
        circle.y-closestY;

    return (
        dx*dx+
        dy*dy
        <
        circle.radius*
        circle.radius
    );

}


/* =========================================================
   EXPLOSION
   ========================================================= */

function explosion(x,y,big=false) {

    const amount =
        big ? 35 : 15;

    for(let i=0;i<amount;i++) {

        particles.push({

            x:x,
            y:y,

            vx:
                (Math.random()-.5)
                * (big ? 10 : 6),

            vy:
                (Math.random()-.5)
                * (big ? 10 : 6),

            size:
                3+
                Math.random()*5,

            life:
                30+
                Math.random()*30

        });

    }

    cameraShake =
        big ? 10 : 5;

}


/* =========================================================
   PHYSIK
   ========================================================= */

function updatePhysics() {

    if(
        currentBulldog &&
        currentBulldog.active
    ) {

        let power =
            bulldogInfo[
                currentBulldog.type
            ].power;

        currentBulldog.vy +=
            0.34;

        currentBulldog.x +=
            currentBulldog.vx;

        currentBulldog.y +=
            currentBulldog.vy;


        /* Coco kann Flugbahn verändern */

        if(
            currentBulldog.type === "coco" &&
            currentBulldog.x > 650
        ) {

            currentBulldog.vy -=
                0.018 * power;

        }


        /* Max ist schwerer */

        if(
            currentBulldog.type === "max"
        ) {

            currentBulldog.vy +=
                0.08;

        }


        /* Ziel treffen */

        targets.forEach(t => {

            if(!t.alive)
                return;

            const d =
                Math.hypot(
                    currentBulldog.x-t.x,
                    currentBulldog.y-t.y
                );

            if(
                d <
                currentBulldog.radius+t.r
            ) {

                t.hp--;

                score +=
                    1000+
                    currentLevel*50;

                explosion(
                    t.x,
                    t.y,
                    true
                );

                if(t.hp <= 0) {

                    t.alive=false;

                    score +=
                        2500+
                        currentLevel*100;

                }

                /* Tyson / Coco / Max */

                if(
                    currentBulldog.type === "tyson" ||
                    currentBulldog.type === "max"
                ) {

                    blocks.forEach(b => {

                        if(b.hp <= 0)
                            return;

                        const bd =
                            Math.hypot(
                                currentBulldog.x -
                                (b.x+b.w/2),

                                currentBulldog.y -
                                (b.y+b.h/2)
                            );

                        if(bd < 150) {

                            b.hp -=
                                currentBulldog.type === "max"
                                ? 3
                                : 2;

                        }

                    });

                }

            }

        });


        /* Block treffen */

        blocks.forEach(b => {

            if(b.hp <= 0)
                return;

            if(
                circleRectCollision(
                    currentBulldog,
                    b
                )
            ) {

                b.hp -=
                    Math.max(
                        1,
                        Math.round(power)
                    );

                score +=
                    200+
                    currentLevel*15;

                explosion(
                    currentBulldog.x,
                    currentBulldog.y
                );

                /*
                   Geschwindigkeit reduzieren
                */

                currentBulldog.vx *=
                    -0.55;

                currentBulldog.vy *=
                    -0.55;

            }

        });


        /* Boden */

        if(
            currentBulldog.y >
            510
        ) {

            currentBulldog.y=510;

            currentBulldog.vy *=
                -0.35;

            currentBulldog.vx *=
                0.75;

            if(
                Math.abs(
                    currentBulldog.vx
                ) < .6 &&
                Math.abs(
                    currentBulldog.vy
                ) < .6
            ) {

                currentBulldog.active=false;

                nextShot();

            }

        }


        /* außerhalb */

        if(
            currentBulldog.x >
            W+100 ||
            currentBulldog.x <
            -100 ||
            currentBulldog.y >
            H+100
        ) {

            currentBulldog.active=false;

            nextShot();

        }

    }


    /* Partikel */

    particles.forEach(p => {

        p.x += p.vx;
        p.y += p.vy;

        p.vy += .12;

        p.life--;

    });

    particles =
        particles.filter(
            p => p.life > 0
        );


    if(cameraShake > 0)
        cameraShake *= .85;


    /* Sieg */

    const remaining =
        targets.filter(
            t => t.alive
        ).length;

    if(
        remaining === 0 &&
        !levelFinished
    ) {

        finishLevel();

    }

}


/* =========================================================
   NÄCHSTER SCHUSS
   ========================================================= */

function nextShot() {

    if(levelFinished)
        return;

    if(shotsLeft > 0) {

        prepareNextBulldog();

    }
    else {

        const remaining =
            targets.filter(
                t => t.alive
            ).length;

        if(remaining > 0) {

            loseLevel();

        }

    }

}


/* =========================================================
   LEVEL GEWONNEN
   ========================================================= */

function finishLevel() {

    levelFinished=true;

    let stars=1;

    const target =
        levels[currentLevel-1].target;

    if(score >= target)
        stars=2;

    if(score >= target*1.5)
        stars=3;


    if(
        !savedStars[currentLevel] ||
        stars >
        savedStars[currentLevel]
    ) {

        savedStars[currentLevel]=stars;

        localStorage.setItem(
            "frenchieStars",
            JSON.stringify(savedStars)
        );

    }


    if(
        currentLevel >= unlockedLevel
    ) {

        unlockedLevel =
            Math.min(
                70,
                currentLevel+1
            );

        localStorage.setItem(
            "frenchieUnlocked",
            unlockedLevel
        );

    }


    if(currentLevel === 70) {

        document.getElementById(
            "messageTitle"
        ).textContent =
            "🏆 FRENCHIE CHAMPION! 🏆";

        document.getElementById(
            "messageText"
        ).innerHTML =
            "<p>Du hast alle 70 Level geschafft!</p>" +
            "<p>Die Bulldoggen sind offiziell die Könige der Mondstation.</p>" +
            "<p><b>Endpunktzahl: "+
            score+
            "</b></p>";

    }
    else {

        document.getElementById(
            "messageTitle"
        ).textContent =
            "🎉 Level geschafft!";

        document.getElementById(
            "messageText"
        ).innerHTML =
            "<p>Punkte: <b>"+
            score+
            "</b></p>" +
            "<p>Levelziel: "+
            target+
            "</p>";

    }


    document.getElementById(
        "stars"
    ).textContent =
        "⭐".repeat(stars);


    document.getElementById(
        "message"
    ).style.display="block";

    updateInterface();

}


/* =========================================================
   LEVEL VERLOREN
   ========================================================= */

function loseLevel() {

    levelFinished=true;

    document.getElementById(
        "messageTitle"
    ).textContent =
        "🐶 Nicht geschafft!";

    document.getElementById(
        "messageText"
    ).innerHTML =
        "<p>Keine Bulldoggen mehr.</p>" +
        "<p>Du hast "+
        score+
        " Punkte erreicht.</p>";

    document.getElementById(
        "stars"
    ).textContent="";

    document.getElementById(
        "message"
    ).style.display="block";

}


/* =========================================================
   LEVEL NEUSTART
   ========================================================= */

function restartLevel() {

    loadLevel(
        currentLevel
    );

}


/* =========================================================
   NÄCHSTES LEVEL
   ========================================================= */

function nextLevel() {

    if(currentLevel >= 70)
        return;

    if(
        currentLevel+1 >
        unlockedLevel
    )
        return;

    loadLevel(
        currentLevel+1
    );

}


/* =========================================================
   VORHERIGES LEVEL
   ========================================================= */

function previousLevel() {

    if(currentLevel <= 1)
        return;

    loadLevel(
        currentLevel-1
    );

}


/* =========================================================
   LEVELAUSWAHL
   ========================================================= */

function toggleLevelPanel() {

    const panel =
        document.getElementById(
            "levelPanel"
        );

    if(
        panel.style.display === "block"
    ) {

        panel.style.display="none";

        return;

    }


    panel.innerHTML =
        "<h3>🗺️ Levelauswahl</h3>";


    for(let i=1;i<=70;i++) {

        const button =
            document.createElement(
                "button"
            );

        button.className=
            "levelButton";


        if(i > unlockedLevel) {

            button.classList.add(
                "levelLocked"
            );

            button.textContent =
                "🔒 "+i;

        }
        else {

            const stars =
                savedStars[i] || 0;

            button.innerHTML =
                i+
                "<br>"+
                "⭐".repeat(stars);

            button.onclick =
                function() {

                    loadLevel(i);

                    panel.style.display=
                        "none";

                };

        }

        panel.appendChild(
            button
        );

    }

    panel.style.display="block";

}


/* =========================================================
   BENUTZEROBERFLÄCHE
   ========================================================= */

function updateInterface() {

    const data =
        levels[currentLevel-1];

    const world =
        worlds[data.world];


    document.getElementById(
        "levelDisplay"
    ).textContent =
        currentLevel+
        " / 70";


    document.getElementById(
        "scoreDisplay"
    ).textContent =
        score;


    document.getElementById(
        "targetDisplay"
    ).textContent =
        data.target;


    document.getElementById(
        "shotsDisplay"
    ).textContent =
        shotsLeft;


    document.getElementById(
        "starsDisplay"
    ).textContent =
        savedStars[currentLevel] || 0;


    document.getElementById(
        "worldName"
    ).textContent =
        world.emoji+
        " "+
        world.name;

}


/* =========================================================
   ZEICHNEN
   ========================================================= */

function draw() {

    ctx.save();

    if(cameraShake > .5) {

        ctx.translate(
            (Math.random()-.5)*
            cameraShake,

            (Math.random()-.5)*
            cameraShake
        );

    }


    const data =
        levels[currentLevel-1];

    const world =
        worlds[data.world];


    drawBackground(world);


    blocks.forEach(
        drawBlock
    );


    targets.forEach(
        drawTarget
    );


    /* Schleuder-Linie */

    if(
        currentBulldog &&
        !currentBulldog.active &&
        !currentBulldog.used
    ) {

        ctx.strokeStyle=
            "rgba(255,255,255,.35)";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(
            150,
            470
        );

        ctx.lineTo(
            currentBulldog.x,
            currentBulldog.y
        );

        ctx.stroke();

    }


    drawBulldog(
        currentBulldog
    );


    particles.forEach(p => {

        ctx.fillStyle =
            "#ffd43b";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    });


    ctx.restore();

}


/* =========================================================
   HAUPTSCHLEIFE
   ========================================================= */

function gameLoop() {

    updatePhysics();

    draw();

    updateInterface();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START
   ========================================================= */

loadLevel(1);

gameLoop();

</script>
