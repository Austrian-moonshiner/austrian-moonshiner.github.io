<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Battle Ages</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    padding:0;
    background:#070b10;
    color:#eef4f7;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

body{
    min-height:100vh;
}

#game{
    max-width:1500px;
    margin:auto;
    background:#090d12;
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at 50% 20%,rgba(65,110,140,.25),transparent 35%),
        linear-gradient(135deg,#05080c,#101923 50%,#05080c);
}

.startBox{
    width:min(650px,100%);
    padding:35px 25px;
    text-align:center;
    background:
        linear-gradient(145deg,rgba(25,34,43,.98),rgba(8,13,18,.98));
    border:2px solid #566875;
    border-radius:16px;
    box-shadow:
        0 0 30px rgba(0,0,0,.8),
        inset 0 0 35px rgba(0,0,0,.5);
}

.startBox h1{
    margin:0 0 8px;
    font-size:42px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#dfe9ef;
    text-shadow:0 0 15px rgba(120,190,230,.35);
}

.startSubtitle{
    color:#8fa0ab;
    margin-bottom:30px;
}

.difficultyTitle{
    font-size:18px;
    font-weight:bold;
    margin-bottom:14px;
}

.difficultyButtons{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
}

.difficulty{
    flex:1;
    min-width:150px;
    padding:18px 12px;
    border-radius:10px;
    border:2px solid #465661;
    background:linear-gradient(#27343d,#151e25);
    color:#fff;
    cursor:pointer;
    transition:.2s;
}

.difficulty:hover{
    transform:translateY(-3px);
    border-color:#91a9b7;
}

.difficulty.selected{
    border-color:#d6e8f2;
    box-shadow:
        0 0 15px rgba(130,190,220,.35),
        inset 0 0 15px rgba(130,190,220,.12);
}

.difficulty b{
    display:block;
    font-size:20px;
    margin-bottom:7px;
}

.difficulty small{
    color:#aab6bd;
}

.easy.selected{
    border-color:#65c77a;
}

.medium.selected{
    border-color:#d0aa54;
}

.hard.selected{
    border-color:#d86458;
}

#startButton{
    width:100%;
    margin-top:28px;
    padding:16px;
    border:2px solid #718692;
    border-radius:10px;
    background:linear-gradient(#40545f,#202d35);
    color:#fff;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
}

#startButton:hover{
    background:linear-gradient(#526b78,#293941);
}

/* =========================================================
   HUD
========================================================= */

#hud{
    background:linear-gradient(#171f27,#0b1117);
    border-bottom:2px solid #3b4b56;
    padding:10px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    position:relative;
    z-index:50;
}

.stat{
    background:#101820;
    border:1px solid #3c4d58;
    border-radius:7px;
    padding:8px 12px;
    min-width:105px;
    text-align:center;
    box-shadow:inset 0 0 10px #000;
}

.stat small{
    display:block;
    color:#8998a3;
    font-size:11px;
}

.stat b{
    font-size:17px;
}

/* =========================================================
   BATTLEFIELD
========================================================= */

#battlefield{
    position:relative;
    height:540px;
    overflow:hidden;
    background:#25323a;
    border-bottom:4px solid #111;
}

/* =========================================================
   ENVIRONMENT
========================================================= */

#environment{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:1;
}

.sky{
    position:absolute;
    inset:0 0 42% 0;
    background:linear-gradient(#526572,#7b8d96);
}

.ground{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:43%;
    background:#303a30;
}

.terrainObject{
    position:absolute;
}

/* =========================================================
   STEINZEIT
========================================================= */

.env-stone .sky{
    background:
        radial-gradient(circle at 72% 18%,rgba(255,220,130,.22),transparent 17%),
        linear-gradient(#6d8790,#b0a083);
}

.env-stone .ground{
    background:
        repeating-linear-gradient(
            0deg,
            #4b4934 0,
            #4b4934 8px,
            #3c3c2d 9px,
            #3c3c2d 17px
        );
}

.stoneRock{
    width:90px;
    height:48px;
    background:#55534c;
    border:4px solid #353530;
    border-radius:55% 45% 25% 25%;
    box-shadow:inset 15px 8px 0 rgba(255,255,255,.06);
}

.stoneHut{
    width:100px;
    height:75px;
    background:#876947;
    border:4px solid #493a2b;
}

.stoneHut:before{
    content:"";
    position:absolute;
    left:-10px;
    top:-40px;
    width:112px;
    height:55px;
    background:#5b452f;
    border:4px solid #3b2d21;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.stoneHut:after{
    content:"";
    position:absolute;
    left:42px;
    bottom:0;
    width:20px;
    height:37px;
    background:#35291f;
}

.campfire{
    width:32px;
    height:32px;
    border-radius:50%;
    background:#ff9b31;
    box-shadow:0 0 25px #ff692e;
    animation:firePulse .7s infinite alternate;
}

@keyframes firePulse{
    from{transform:scale(.9);opacity:.8}
    to{transform:scale(1.12);opacity:1}
}

.campfire:before,
.campfire:after{
    content:"";
    position:absolute;
    width:38px;
    height:7px;
    top:13px;
    left:-3px;
    background:#553727;
    transform:rotate(25deg);
}

.campfire:after{
    transform:rotate(-25deg);
}

/* =========================================================
   MITTELALTER
========================================================= */

.env-medieval .sky{
    background:
        radial-gradient(circle at 75% 20%,rgba(220,225,220,.12),transparent 20%),
        linear-gradient(#526270,#71808a);
}

.env-medieval .ground{
    background:
        repeating-linear-gradient(
            0deg,
            #3d4438 0,
            #3d4438 8px,
            #343a31 9px,
            #343a31 17px
        );
}

.castle{
    position:absolute;
    bottom:125px;
    width:270px;
    height:175px;
    background:#74716b;
    border:5px solid #3b3a38;
}

.castle:before,
.castle:after{
    content:"";
    position:absolute;
    bottom:-5px;
    width:62px;
    height:225px;
    background:#696863;
    border:5px solid #363532;
}

.castle:before{
    left:-5px;
}

.castle:after{
    right:-5px;
}

.castleGate{
    position:absolute;
    left:105px;
    bottom:0;
    width:60px;
    height:90px;
    background:#292622;
    border:5px solid #403b34;
    border-radius:35px 35px 0 0;
}

.castleTowerRoof{
    position:absolute;
    top:-42px;
    left:0;
    width:62px;
    height:48px;
    background:#443a35;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.castleTowerRoof.right{
    left:auto;
    right:0;
}

.castleWindow{
    position:absolute;
    width:15px;
    height:30px;
    background:#202326;
    border:3px solid #9a9689;
    border-radius:50% 50% 0 0;
    top:35px;
}

.castleWindow.w1{left:20px}
.castleWindow.w2{right:20px}

.fachwerk{
    width:105px;
    height:100px;
    bottom:125px;
    background:#a57d55;
    border:5px solid #45372d;
}

.fachwerk:before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(45deg,transparent 45%,#45372d 46%,#45372d 53%,transparent 54%),
        linear-gradient(-45deg,transparent 45%,#45372d 46%,#45372d 53%,transparent 54%);
}

/* =========================================================
   INDUSTRIE
========================================================= */

.env-industrial .sky{
    background:
        radial-gradient(circle at 70% 25%,rgba(255,175,80,.12),transparent 20%),
        linear-gradient(#46535a,#70766f);
}

.env-industrial .ground{
    background:
        repeating-linear-gradient(
            0deg,
            #343632 0,
            #343632 9px,
            #292b29 10px,
            #292b29 18px
        );
}

.factory{
    bottom:125px;
    width:240px;
    height:145px;
    background:#4c5253;
    border:5px solid #292e30;
}

.factoryRoof{
    position:absolute;
    top:-25px;
    left:-5px;
    width:240px;
    height:28px;
    background:#353b3d;
    border:4px solid #252a2c;
}

.factoryWindow{
    position:absolute;
    top:35px;
    width:32px;
    height:40px;
    background:#263138;
    border:4px solid #6a777c;
}

.factoryWindow.w1{left:20px}
.factoryWindow.w2{left:70px}
.factoryWindow.w3{left:120px}
.factoryWindow.w4{left:170px}

.chimney{
    position:absolute;
    bottom:270px;
    width:35px;
    height:145px;
    background:#3b4041;
    border:4px solid #292d2f;
}

.chimney:after{
    content:"";
    position:absolute;
    left:-8px;
    top:-8px;
    width:47px;
    height:14px;
    background:#292d2f;
}

.smoke{
    position:absolute;
    width:55px;
    height:55px;
    border-radius:50%;
    background:rgba(80,82,80,.35);
    filter:blur(3px);
    animation:smokeMove 4s infinite ease-in-out;
}

@keyframes smokeMove{
    0%{transform:translate(0,0) scale(.8);opacity:.25}
    50%{transform:translate(15px,-25px) scale(1.15);opacity:.4}
    100%{transform:translate(-5px,-50px) scale(1.4);opacity:0}
}

/* =========================================================
   MODERN
========================================================= */

.env-modern .sky{
    background:
        linear-gradient(rgba(30,40,50,.2),rgba(30,40,50,.1)),
        linear-gradient(#344653,#6b7478);
}

.env-modern .ground{
    background:
        repeating-linear-gradient(
            0deg,
            #292d2e 0,
            #292d2e 10px,
            #222526 11px,
            #222526 20px
        );
}

.modernBuilding{
    bottom:125px;
    width:120px;
    height:185px;
    background:#697176;
    border:5px solid #343b3f;
}

.modernBuilding:before{
    content:"";
    position:absolute;
    inset:15px;
    background:
        repeating-linear-gradient(
            90deg,
            #202a30 0,
            #202a30 18px,
            transparent 18px,
            transparent 31px
        );
    opacity:.8;
}

.modernRoof{
    position:absolute;
    left:-5px;
    right:-5px;
    top:-20px;
    height:20px;
    background:#343c41;
    border:4px solid #242b2f;
}

.militaryVehicle{
    position:absolute;
    bottom:125px;
    width:120px;
    height:45px;
    background:#344139;
    border:4px solid #202821;
    border-radius:10px;
}

.militaryVehicle:before{
    content:"";
    position:absolute;
    left:35px;
    top:-28px;
    width:50px;
    height:30px;
    background:#3f4b42;
    border:4px solid #202821;
    border-radius:8px 8px 0 0;
}

.militaryVehicle:after{
    content:"";
    position:absolute;
    right:-50px;
    top:-20px;
    width:60px;
    height:8px;
    background:#202821;
}

/* =========================================================
   ZUKUNFT
========================================================= */

.env-future .sky{
    background:
        radial-gradient(circle at 75% 20%,rgba(100,210,255,.22),transparent 18%),
        linear-gradient(#101d32,#24314a);
}

.env-future .ground{
    background:
        repeating-linear-gradient(
            0deg,
            #17212b 0,
            #17212b 9px,
            #101820 10px,
            #101820 18px
        );
}

.futureBuilding{
    bottom:125px;
    width:130px;
    height:205px;
    background:
        linear-gradient(
            90deg,
            #202d3b,
            #33475b,
            #182431
        );
    border:3px solid #4a8ca8;
    box-shadow:0 0 18px rgba(65,190,255,.2);
}

.futureBuilding:before{
    content:"";
    position:absolute;
    inset:18px;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(55,210,255,.7) 0,
            rgba(55,210,255,.7) 3px,
            transparent 3px,
            transparent 28px
        );
}

.energyCore{
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    background:#53d8ff;
    border:5px solid #b5f3ff;
    box-shadow:
        0 0 15px #53d8ff,
        0 0 40px rgba(83,216,255,.6);
    animation:corePulse 1.2s infinite alternate;
}

@keyframes corePulse{
    from{transform:scale(.9);opacity:.7}
    to{transform:scale(1.1);opacity:1}
}

.futureTower{
    bottom:125px;
    width:45px;
    height:245px;
    background:#243746;
    border:3px solid #4a9ab7;
    box-shadow:0 0 15px rgba(50,190,255,.25);
}

/* =========================================================
   ROAD
========================================================= */

.road{
    position:absolute;
    left:0;
    right:0;
    bottom:65px;
    height:105px;
    background:#494b49;
    border-top:3px solid #252825;
    border-bottom:3px solid #242624;
    z-index:4;
}

.roadLine{
    position:absolute;
    left:0;
    right:0;
    top:48px;
    height:4px;
    background:repeating-linear-gradient(
        90deg,
        #b7a65e 0,
        #b7a65e 50px,
        transparent 50px,
        transparent 100px
    );
}

/* =========================================================
   BASES
========================================================= */

.base{
    position:absolute;
    bottom:145px;
    width:105px;
    height:185px;
    z-index:15;
}

.playerBase{
    left:15px;
}

.enemyBase{
    right:15px;
}

.baseWall{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:145px;
    background:
        repeating-linear-gradient(
            90deg,
            #59636a 0,
            #59636a 25px,
            #343c42 25px,
            #343c42 29px
        );
    border:4px solid #20272c;
}

.baseRoof{
    position:absolute;
    bottom:138px;
    left:-12px;
    width:129px;
    height:30px;
    background:#252d32;
    border:4px solid #171d21;
    transform:skewX(-25deg);
}

.baseFlag{
    position:absolute;
    top:-45px;
    left:48px;
    width:4px;
    height:48px;
    background:#171c20;
}

.baseFlag:after{
    content:"";
    position:absolute;
    top:0;
    left:4px;
    width:32px;
    height:18px;
    background:#667b85;
    clip-path:polygon(0 0,100% 20%,70% 100%,0 80%);
}

.enemyBase .baseFlag:after{
    background:#8a493d;
}

.baseGun{
    position:absolute;
    bottom:105px;
    left:35px;
    width:38px;
    height:18px;
    background:#151b1f;
    border:3px solid #39444b;
    border-radius:50%;
}

.baseGun:after{
    content:"";
    position:absolute;
    width:42px;
    height:8px;
    right:-32px;
    top:2px;
    background:#11161a;
}

.enemyBase .baseGun{
    transform:scaleX(-1);
}

/* =========================================================
   EINHEITEN GRUNDKÖRPER
========================================================= */

.unit{
    position:absolute;
    width:64px;
    height:82px;
    z-index:25;
    transform:translate(-50%,-100%);
    transform-origin:center bottom;
    pointer-events:none;
    transition:filter .12s;
}

.unit .head{
    position:absolute;
    left:21px;
    top:2px;
    width:22px;
    height:22px;
    background:#c58e68;
    border-radius:50%;
    border:2px solid #20262b;
    z-index:4;
}

.unit .body{
    position:absolute;
    left:17px;
    top:24px;
    width:31px;
    height:34px;
    background:#56656d;
    border:2px solid #20262b;
    border-radius:5px;
    z-index:3;
}

.unit .leg{
    position:absolute;
    top:54px;
    width:9px;
    height:23px;
    background:#22292d;
    border-radius:3px;
    transform-origin:top center;
    z-index:1;
}

.unit .leg.l{
    left:19px;
}

.unit .leg.r{
    left:37px;
}

.unit .shield{
    position:absolute;
    left:0;
    top:28px;
    width:20px;
    height:29px;
    background:#4d6875;
    border:2px solid #172027;
    border-radius:5px;
    z-index:5;
}

.unit .sword{
    position:absolute;
    right:0;
    top:23px;
    width:7px;
    height:35px;
    background:#ccd4d8;
    transform:rotate(30deg);
    border:1px solid #24292d;
    transform-origin:bottom center;
    z-index:5;
}

.unit .spear{
    position:absolute;
    right:-17px;
    top:17px;
    width:7px;
    height:50px;
    background:#69452d;
    transform:rotate(25deg);
    transform-origin:bottom center;
    z-index:5;
}

.unit .spear:after{
    content:"";
    position:absolute;
    left:-4px;
    top:-7px;
    width:13px;
    height:17px;
    background:#bfc5c8;
    clip-path:polygon(50% 0,100% 100%,50% 75%,0 100%);
}

.unit .bow{
    position:absolute;
    right:0;
    top:24px;
    width:28px;
    height:34px;
    border:3px solid #8d6239;
    border-left:0;
    border-radius:50%;
    z-index:5;
}

.unit .arrowHeld{
    position:absolute;
    right:-13px;
    top:37px;
    width:32px;
    height:2px;
    background:#d9d0b0;
    transform:rotate(-12deg);
    z-index:6;
}

.unit .hammer{
    position:absolute;
    right:-7px;
    top:18px;
    width:8px;
    height:43px;
    background:#765338;
    transform:rotate(25deg);
    transform-origin:bottom center;
    z-index:5;
}

.unit .hammer:after{
    content:"";
    position:absolute;
    left:-9px;
    top:-5px;
    width:25px;
    height:14px;
    background:#60676c;
    border:2px solid #24292d;
    border-radius:3px;
}

/* =========================================================
   STEINZEIT EINHEITEN
========================================================= */

.age-0 .body{
    background:#765338;
    border-color:#36291f;
}

.age-0 .head:after{
    content:"";
    position:absolute;
    left:0;
    top:-5px;
    width:18px;
    height:9px;
    background:#503b2c;
    border-radius:50%;
}

.age-0 .shield{
    background:#795331;
    border-color:#35261d;
}

.age-0 .spear{
    display:block;
}

.age-0 .warrior .sword{
    display:none;
}

.age-0 .archer .bow{
    border-color:#704a29;
}

.age-0 .heavy .hammer{
    background:#69472e;
}

.age-0 .heavy .hammer:after{
    background:#71695c;
}

/* =========================================================
   MITTELALTER EINHEITEN
========================================================= */

.age-1 .body{
    background:
        linear-gradient(90deg,#626b73,#a2a8ab,#555e65);
    border-color:#252b30;
    box-shadow:inset 0 0 5px rgba(255,255,255,.2);
}

.age-1 .head{
    background:#c58e68;
}

.age-1 .head:after{
    content:"";
    position:absolute;
    left:-3px;
    top:-6px;
    width:25px;
    height:10px;
    background:#555c62;
    border:2px solid #20262b;
    border-radius:50% 50% 3px 3px;
}

.age-1 .shield{
    background:
        linear-gradient(90deg,#713d31,#a55a40,#713d31);
    border-color:#29211f;
}

.age-1 .sword{
    background:#dfe5e8;
    box-shadow:0 0 3px rgba(255,255,255,.4);
}

.age-1 .heavy .hammer:after{
    background:#777b7d;
}

/* =========================================================
   INDUSTRIE EINHEITEN
========================================================= */

.age-2 .body{
    background:#39464c;
    border-color:#20282c;
}

.age-2 .head:after{
    content:"";
    position:absolute;
    left:-2px;
    top:-5px;
    width:25px;
    height:9px;
    background:#252d31;
    border:2px solid #20262b;
    border-radius:4px 4px 1px 1px;
}

.age-2 .shield{
    background:#3b4b51;
}

.age-2 .sword{
    display:none;
}

.age-2 .spear{
    display:none;
}

.age-2 .warrior:after{
    content:"";
    position:absolute;
    left:42px;
    top:34px;
    width:30px;
    height:6px;
    background:#181e21;
    border:2px solid #080b0d;
    transform:rotate(-12deg);
    z-index:7;
}

.age-2 .archer .bow{
    display:none;
}

.age-2 .archer:after{
    content:"";
    position:absolute;
    right:-13px;
    top:31px;
    width:35px;
    height:6px;
    background:#181e21;
    border:2px solid #090c0e;
    transform:rotate(-12deg);
    z-index:7;
}

.age-2 .heavy{
    width:76px;
}

.age-2 .heavy .body{
    left:13px;
    width:50px;
    height:35px;
    border-radius:7px;
    background:
        linear-gradient(#59646a,#30383d);

/* =========================================================
   LAUFANIMATION
========================================================= */

.unit.walking{
    animation:unitBob .34s infinite ease-in-out;
}

.unit.walking .leg.l{
    animation:legLeft .34s infinite alternate ease-in-out;
}

.unit.walking .leg.r{
    animation:legRight .34s infinite alternate ease-in-out;
}

@keyframes unitBob{
    0%,100%{
        margin-top:0;
    }
    50%{
        margin-top:-3px;
    }
}

@keyframes legLeft{
    from{transform:rotate(18deg)}
    to{transform:rotate(-18deg)}
}

@keyframes legRight{
    from{transform:rotate(-18deg)}
    to{transform:rotate(18deg)}
}

/* =========================================================
   ANGRIFFSANIMATION
========================================================= */

.unit.attacking{
    animation:attackBody .28s ease-in-out;
}

.unit.attacking .sword{
    animation:swordAttack .28s ease-in-out;
}

.unit.attacking .spear{
    animation:spearAttack .28s ease-in-out;
}

.unit.attacking .hammer{
    animation:hammerAttack .35s ease-in-out;
}

.unit.attacking:after{
    animation:weaponPulse .25s ease-out;
}

@keyframes attackBody{
    0%{margin-left:0}
    35%{margin-left:6px}
    100%{margin-left:0}
}

@keyframes swordAttack{
    0%{transform:rotate(30deg)}
    45%{transform:rotate(-55deg)}
    100%{transform:rotate(30deg)}
}

@keyframes spearAttack{
    0%{transform:rotate(25deg)}
    45%{transform:rotate(3deg) translateX(9px)}
    100%{transform:rotate(25deg)}
}

@keyframes hammerAttack{
    0%{transform:rotate(25deg)}
    45%{transform:rotate(-40deg)}
    100%{transform:rotate(25deg)}
}

@keyframes weaponPulse{
    0%{filter:brightness(1)}
    45%{filter:brightness(2)}
    100%{filter:brightness(1)}
}

/* =========================================================
   GETROFFEN
========================================================= */

.unit.hitFlash{
    animation:hitFlash .18s ease-in-out;
}

@keyframes hitFlash{
    0%{
        filter:brightness(1);
        transform:translate(-50%,-100%);
    }
    50%{
        filter:brightness(2.2);
        transform:translate(-53%,-100%);
    }
    100%{
        filter:brightness(1);
        transform:translate(-50%,-100%);
    }
}

/* =========================================================

========================================================= */

    height:3px;
    background:#d7c79e;
    transform-origin:left center;

}

/* =========================================================
   CONTROLS
========================================================= */

/* =========================================================

========================================================= */

.explosion{
    position:absolute;
    width:30px;
    height:30px;
    border-radius:50%;
    background:#ff9d3c;
    box-shadow:
        0 0 10px #ffcc66,
        0 0 25px #ff5e32;
    z-index:60;
    animation:explode .35s forwards;
}

.hit{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#eee;
    box-shadow:0 0 10px #fff;
    z-index:60;
    animation:hit .25s forwards;
}

@keyframes explode{
    from{

        opacity:1;
    }
    to{

        opacity:0;
    }
}

        opacity:1;
    }

        opacity:0;
    }
}

/* =========================================================
   EINHEITEN ERSTELLEN
========================================================= */

function createUnit(type,player=true){

    const data=ages[age].units[type];

    const unit={

        id:Math.random(),
        type:type,
        player:player,

        hp:data.hp,
        maxHP:data.hp,

        x:player
            ?115
            :battlefield.clientWidth-115,

        y:350,

        target:null,
        lastAttack:0,
        dead:false,

        state:"idle",
        attackUntil:0,
        hitUntil:0

    };

    units.push(unit);

    renderUnit(unit);
}

/* =========================================================
   EINHEIT MARKUP
========================================================= */

function getUnitMarkup(type){

    if(type==="warrior"){

        if(age===0){

            return `
                <div class="head"></div>
                <div class="body"></div>
                <div class="leg l"></div>
                <div class="leg r"></div>
                <div class="shield"></div>
                <div class="spear"></div>
            `;

        }

        if(age===1){

            return `
                <div class="head"></div>
                <div class="body"></div>
                <div class="leg l"></div>
                <div class="leg r"></div>
                <div class="shield"></div>
                <div class="sword"></div>
            `;

        }

        return `
            <div class="head"></div>
            <div class="body"></div>
            <div class="leg l"></div>
            <div class="leg r"></div>
        `;
    }

    if(type==="archer"){

        return `
            <div class="head"></div>
            <div class="body"></div>
            <div class="leg l"></div>
            <div class="leg r"></div>

            <div class="bow"></div>
            <div class="arrowHeld"></div>
        `;
    }

    return `
        <div class="head"></div>
        <div class="body"></div>
        <div class="leg l"></div>
        <div class="leg r"></div>
        <div class="hammer"></div>
    `;
}

/* =========================================================
   RENDER
========================================================= */

function renderUnit(unit){

    if(unit.el){

        unit.el.innerHTML=
            getUnitMarkup(unit.type);

        updateUnitClasses(unit);

        return;
    }

    const el=document.createElement("div");

    el.className=
        "unit "+
        unit.type+
        " age-"+
        age;

    el.innerHTML=
        getUnitMarkup(unit.type);

    battlefield.appendChild(el);

    unit.el=el;

    updateUnitClasses(unit);
    updateUnitVisual(unit);
}

/* =========================================================
   EINHEITEN-KLASSEN
========================================================= */

function updateUnitClasses(unit){

    if(!unit.el)
        return;

    unit.el.className=
        "unit "+
        unit.type+
        " age-"+
        age;

    if(unit.state==="walking")
        unit.el.classList.add("walking");

    if(unit.state==="attacking")
        unit.el.classList.add("attacking");

    if(performance.now()<unit.hitUntil)
        unit.el.classList.add("hitFlash");
}

/* =========================================================
   VISUAL
========================================================= */

function updateUnitVisual(unit){

    if(!unit.el)
        return;

    unit.el.style.left=
        unit.x+"px";

    unit.el.style.top=
        unit.y+"px";

    const flip=
        unit.player
        ?1
        :-1;

    const scale=
        unit.type==="heavy"
        ?1.02
        :1;

    unit.el.style.transform=
        "translate(-50%,-100%) scaleX("+
        flip+
        ") scale("+
        scale+
        ")";
}

/* =========================================================
   ANIMATION STATE
========================================================= */

function setUnitState(unit,state,duration=0){

    unit.state=state;

    if(duration>0){

        setTimeout(()=>{

            if(
                !unit.dead &&
                unit.state===state
            ){

                unit.state="idle";
                updateUnitClasses(unit);
            }

        },duration);
    }

    updateUnitClasses(unit);
}

/* =========================================================
   KAUFEN
========================================================= */

function buyUnit(type){

    if(!gameStarted || gameOver)
        return;

    const data=ages[age].units[type];

    if(gold<data.cost){

        messageEl.textContent=
            "Nicht genug Gold für diese Einheit!";

        return;
    }

    gold-=data.cost;

    createUnit(type,true);

    messageEl.textContent=
        data.name+
        " wurde eingesetzt.";

    updateHUD();
}

/* =========================================================
   TARGET
========================================================= */

function findTarget(unit){

    let best=null;
    let bestDistance=Infinity;

    for(const other of units){

        if(other.dead)
            continue;

        if(other.player===unit.player)
            continue;

        const distance=
            Math.abs(other.x-unit.x);

        if(distance<bestDistance){

            bestDistance=distance;
            best=other;
        }
    }

    return best;
}

/* =========================================================
   ANGRIFF
========================================================= */

function attackUnit(attacker,target){

    const now=performance.now();

    const data=
        ages[age].units[attacker.type];

    if(
        now-attacker.lastAttack<
        data.cooldown
    )
        return;

    attacker.lastAttack=now;

    setUnitState(
        attacker,
        "attacking",
        attacker.type==="heavy"
        ?380
        :300
    );

    if(attacker.type==="archer"){

        createArrow(
            attacker,
            target
        );

    }else{

        target.hp-=data.damage;

        flashUnit(target);

        createHit(
            target.x,
            target.y
        );

        if(target.hp<=0)
            killUnit(target,attacker);
    }
}

/* =========================================================
   TREFFER
========================================================= */

function flashUnit(unit){

    unit.hitUntil=
        performance.now()+180;

    updateUnitClasses(unit);
}

/* =========================================================
   KILL
========================================================= */

function killUnit(target,killer){

    if(target.dead)
        return;

    target.dead=true;

    if(target.el){

        target.el.style.transition=
            "transform .22s, opacity .22s";

        target.el.style.opacity="0";

        setTimeout(()=>{

            if(target.el)
                target.el.remove();

        },220);
    }

    if(killer.player){

        let reward;

        if(target.type==="warrior")
            reward=ages[age].units.warrior.reward;

        else if(target.type==="archer")
            reward=ages[age].units.archer.reward;

        else
            reward=ages[age].units.heavy.reward;

        gold+=reward;

        messageEl.textContent=
            "Feind besiegt! +"+
            reward+
            " Gold";
    }
}

/* =========================================================
   PFEIL
========================================================= */

function createArrow(attacker,target){

    const arrow={

        x:attacker.x,
        y:attacker.y-38,

        target:target,

        damage:
            ages[age].units.archer.damage,

        speed:8,

    battlefield.appendChild(

    );

/* =========================================================
   CANNON
========================================================= */

function createCannonProjectile(
    x,
    y,
    target,
    damage
){

    const p={

        x:x,
        y:y,
        target:target,
        damage:damage,
        speed:9,

        el:
            document.createElement("div")
    };

    p.el.className=
        "cannonProjectile";

    battlefield.appendChild(
        p.el
    );

    projectiles.push(p);
}

/* =========================================================
   PROJECTILES
========================================================= */

function updateProjectiles(){

    for(
        let i=projectiles.length-1;
        i>=0;
        i--
    ){

        const p=projectiles[i];

        if(
            !p.target ||
            p.target.dead
        ){

            p.el.remove();

            projectiles.splice(i,1);

            continue;
        }

        const dx=
            p.target.x-p.x;

        const dy=
            (p.target.y-35)-p.y;

        const distance=
            Math.sqrt(dx*dx+dy*dy);

        if(
            distance<
            p.speed+4
        ){

            if(
                p.target.hp!==undefined
            ){

                p.target.hp-=p.damage;

                flashUnit(p.target);

                createHit(
                    p.target.x,
                    p.target.y
                );

                if(
                    p.target.hp<=0
                ){

                    killUnit(
                        p.target,
                        {
                            player:
                                !p.target.player
                        }
                    );
                }
            }

            p.el.remove();

            projectiles.splice(i,1);

            continue;
        }

        p.x+=
            dx/distance*p.speed;

        p.y+=
            dy/distance*p.speed;

        p.el.style.left=
            p.x+"px";

        p.el.style.top=
            p.y+"px";

        if(
            p.el.classList.contains(
                "projectile"
            )
        ){

            p.el.style.transform=
                "rotate("+
                Math.atan2(dy,dx)+
                "rad)";
        }
    }
}

   HIT EFFECT
========================================================= */

function createHit(x,y){

    const hit=
        document.createElement("div");

    hit.className="hit";

    hit.style.left=

    );

/* =========================================================
   BASE DEFENSE
========================================================= */

function baseDefense(){

    const now=performance.now();

    if(
        now-enemyBaseTimer>
        1450
    ){

        enemyBaseTimer=now;

        let target=null;
        let closest=Infinity;

        for(const u of units){

            if(u.dead || !u.player)
                continue;

            const d=
                Math.abs(
                    u.x-
                    (
                        battlefield.clientWidth-80
                    )
                );

            if(d<closest){

                closest=d;
                target=u;
            }
        }

        if(target){

            const d=difficulties[difficulty];

            const damage=
                (
                    32+
                    age*7+
                    Math.floor(wave/8)*4
                )*
                d.enemyDamage;

            createCannonProjectile(
                battlefield.clientWidth-70,
                330,
                target,
                damage
            );
        }
    }

    if(
        now-playerBaseTimer>
        1250
    ){

        playerBaseTimer=now;

        let target=null;
        let closest=Infinity;

        for(const u of units){

            if(u.dead || u.player)
                continue;

            const d=u.x;

            if(d<closest){

                closest=d;
                target=u;
            }
        }

        if(target){

            createCannonProjectile(
                75,
                330,
                target,
                ages[age].baseDamage
            );
        }
    }
}

/* =========================================================
   UPDATE UNITS
========================================================= */

function updateUnits(){

    const now=performance.now();

    const playerBaseX=95;

    const enemyBaseX=
        battlefield.clientWidth-95;

    for(const unit of units){

        if(unit.dead)
            continue;

        const data=
            ages[age].units[
                unit.type
            ];

        unit.target=
            findTarget(unit);

        if(unit.target){

            const distance=
                Math.abs(
                    unit.target.x-
                    unit.x
                );

            if(distance<=data.range){

                if(unit.state!=="attacking")
                    setUnitState(unit,"idle");

                attackUnit(
                    unit,
                    unit.target
                );

            }else{

                if(unit.state!=="walking")
                    setUnitState(unit,"walking");

                moveUnit(unit);
            }

        }else{

            const baseDistance=
                unit.player
                ?
                enemyBaseX-unit.x
                :
                unit.x-playerBaseX;

            if(
                baseDistance<=
                data.range+20
            ){

                if(
                    now-unit.lastAttack>
                    data.cooldown
                ){

                    unit.lastAttack=now;

                    setUnitState(
                        unit,
                        "attacking",
                        300
                    );

                    if(unit.player){

                        enemyHP-=
                            data.baseDamage;

                    }else{

                        const d=
                            difficulties[difficulty];

                        playerHP-=
                            data.baseDamage*
                            .7*
                            d.enemyDamage;
                    }

                    createHit(
                        unit.player
                        ?enemyBaseX
                        :playerBaseX,
                        330
                    );
                }

            }else{

                if(unit.state!=="walking")
                    setUnitState(unit,"walking");

                moveUnit(unit);
            }
        }

        updateUnitVisual(unit);
    }
}

/* =========================================================
   MOVE
========================================================= */

function moveUnit(unit){

    const speed=
        ages[age].units[
            unit.type
        ].speed;

    if(unit.player){

        unit.x+=speed;

        unit.x=
            Math.min(
                unit.x,
                battlefield.clientWidth-120
            );

    }else{

        unit.x-=speed;

        unit.x=
            Math.max(
                unit.x,
                120
            );
    }
}

/* =========================================================
   WELLE
========================================================= */

function startWave(){

    if(!gameStarted || gameOver)
        return;

    if(waveRunning){

        messageEl.textContent=
            "Diese Welle läuft bereits!";

        return;
    }

    waveRunning=true;
    spawnedWaveEnemies=0;

    const d=difficulties[difficulty];

    let baseCount;

    if(wave<=3){

        baseCount=3+wave;

    }else if(wave<=8){

        baseCount=
            5+
            Math.floor(wave*.5);

    }else{

        baseCount=
            6+
            Math.floor(wave*.65);
    }

    currentWaveEnemies=
        Math.max(
            2,
            Math.round(
                baseCount*
                d.enemyCount
            )
        );

    enemySpawnTimer=0;

    messageEl.textContent=
        "Welle "+
        wave+
        " beginnt!";
}

/* =========================================================
   FEINDE
========================================================= */

function spawnEnemy(){

    let type;

    const r=Math.random();

    if(wave<4){

        type=
            r<.65
            ?"warrior"
            :"archer";

    }else if(wave<10){

        type=
            r<.55
            ?"warrior"
            :
            r<.85
            ?"archer"
            :"heavy";

    }else{

        type=
            r<.45
            ?"warrior"
            :
            r<.75
            ?"archer"
            :"heavy";
    }

    const base=
        ages[age].units[type];

    const d=
        difficulties[difficulty];

    const scaling=
        1+
        Math.max(
            0,
            wave-5
        )*
        d.waveScaling;

    const unit={

        id:Math.random(),

        type:type,

        player:false,

        hp:
            base.hp*
            scaling*
            d.enemyHP,

        maxHP:
            base.hp*
            scaling*
            d.enemyHP,

        x:
            battlefield.clientWidth-115,

        y:350,

        target:null,

        lastAttack:0,

        dead:false,

        state:"idle",
        attackUntil:0,
        hitUntil:0
    };

    units.push(unit);

    renderUnit(unit);

    spawnedWaveEnemies++;
}

/* =========================================================
   ARTILLERIE
========================================================= */

function artillery(){

    if(!gameStarted || gameOver)
        return;

    const cost=250;

    if(gold<cost){

        messageEl.textContent=
            "Artillerie kostet "+
            cost+
            " Gold.";

        return;
    }

    gold-=cost;

    const targets=
        units.filter(
            u=>
                !u.player &&
                !u.dead
        );

    for(const enemy of targets){

        enemy.hp-=
            180+
            age*55;

        createExplosion(
            enemy.x,
            enemy.y
        );

        flashUnit(enemy);

        if(enemy.hp<=0){

            killUnit(
                enemy,
                {player:true}
            );
        }
    }

    messageEl.textContent=
        "💥 Artillerieschlag ausgeführt!";

    updateHUD();
}

/* =========================================================
   ZEITALTER WECHSELN
========================================================= */

function upgradeAge(){

    if(!gameStarted || gameOver)
        return;

    if(age>=ages.length-1){

        messageEl.textContent=
            "Du bist bereits im höchsten Zeitalter!";

        return;
    }

    const nextAge=age+1;

    let cost;

    if(nextAge===1)
        cost=1100;
    else if(nextAge===2)
        cost=2700;
    else if(nextAge===3)
        cost=5200;
    else
        cost=8500;

    const requirements={
        1:5,
        2:12,
        3:20,
        4:35
    };

    const requiredWave=
        requirements[nextAge];

    if(wave<requiredWave){

        messageEl.textContent=
            "Zeitalter noch gesperrt! "+
            "Benötigt: Welle "+
            requiredWave;

        return;
    }

    if(gold<cost){

        messageEl.textContent=
            "Du brauchst "+
            cost+
            " Gold für "+
            ages[nextAge].name;

        return;
    }

    gold-=cost;

    age=nextAge;

    updateEnvironment();

    /*
       Alle vorhandenen Einheiten werden
       komplett neu aufgebaut.
    */

    for(const unit of units){

        if(
            unit.el &&
            !unit.dead
        ){

            unit.el.className=
                "unit "+
                unit.type+
                " age-"+
                age;

            unit.el.innerHTML=
                getUnitMarkup(unit.type);

            updateUnitClasses(unit);
        }
    }

    messageEl.textContent=
        "⬆️ Neues Zeitalter: "+
        ages[age].name;

    updateButtons();
    updateHUD();
}

/* =========================================================
   GOLD
========================================================= */

function generateGold(delta){

    goldTimer+=delta;

    if(goldTimer>=1000){

        const seconds=
            Math.floor(
                goldTimer/1000
            );

        const d=
            difficulties[difficulty];

        gold+=
            ages[age].income*
            d.incomeMultiplier*
            seconds;

        goldTimer-=
            seconds*1000;
    }
}

    const data=
        localStorage.getItem(
            "battleAgesSave"
        );

    if(!data){

        messageEl.textContent=
            "Kein gespeichertes Spiel gefunden.";

        return;
    }

    const save=
        JSON.parse(data);

    difficulty=
        save.difficulty||
        "easy";

    gold=
        save.gold||
        1500;

    playerHP=
        save.playerHP||
        5000;

    enemyHP=
        save.enemyHP||
        5000;

    age=
        save.age||
        0;

    wave=
        save.wave||
        1;

    gameStarted=true;

    document
        .getElementById("startScreen")
        .style.display="none";

    updateEnvironment();
    updateButtons();
    updateHUD();

    messageEl.textContent=
        "📂 Spiel geladen.";
}

/* =========================================================
   GAME OVER
========================================================= */

function checkGameOver(){

    if(enemyHP<=0){

        enemyHP=0;
        gameOver=true;

        messageEl.textContent=
            "🏆 SIEG! Die feindliche Basis wurde zerstört!";
    }

    if(playerHP<=0){

        playerHP=0;
        gameOver=true;

        messageEl.textContent=
            "💀 NIEDERLAGE! Deine Basis wurde zerstört.";
    }
}

/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    location.reload();
}

/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

    const delta=
        time-lastTime;

    lastTime=time;

    if(gameStarted && !gameOver){

        generateGold(delta);

        waveTimer-=delta/1000;

        if(waveTimer<=0){

            if(!waveRunning)
                startWave();
        }

        if(waveRunning){

            enemySpawnTimer-=delta;

            if(
                enemySpawnTimer<=0 &&
                spawnedWaveEnemies<
                currentWaveEnemies
            ){

                spawnEnemy();

                enemySpawnTimer=
                    Math.max(
                        700,
                        1250-wave*12
                    );
            }

            if(
                spawnedWaveEnemies>=
                currentWaveEnemies
            ){

                waveRunning=false;

                if(wave%10===0)
                    spawnBoss();

                wave++;

                waveTimer=
                    Math.max(
                        18,
                        31-wave*.30
                    );

                messageEl.textContent=
                    "Welle abgeschlossen! "+
                    "Nächste Welle in "+
                    Math.ceil(waveTimer)+
                    " Sekunden.";
            }
        }

        updateUnits();
        updateProjectiles();
        baseDefense();
        removeDeadUnits();
        checkGameOver();
        updateHUD();
    }

    requestAnimationFrame(gameLoop);
}

/* =========================================================
   TASTATUR
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(!gameStarted)
            return;

        if(e.key==="1")
            buyUnit("warrior");

        if(e.key==="2")
            buyUnit("archer");

        if(e.key==="3")
            buyUnit("heavy");

        if(e.key==="4")
            startWave();

        if(e.key==="5")
            artillery();
    }
);

/* =========================================================
   INITIAL
========================================================= */

updateButtons();
updateHUD();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
