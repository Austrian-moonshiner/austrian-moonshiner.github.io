<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot Automat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&amp;family=Roboto:wght@400;700&amp;display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Roboto', sans-serif;
    color: #fff;
    padding: 20px;
  }

  .machine {
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 0 40px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0,0,0,0.5);
    border: 3px solid #00ffff;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    color: #00ffff;
    text-shadow: 0 0 15px #00ffff;
    margin-bottom: 20px;
  }

  .info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 25px;
    font-size: 1.2rem;
  }

  .info span {
    background: rgba(0,0,0,0.4);
    padding: 8px 15px;
    border-radius: 10px;
    border: 1px solid #00ffff55;
  }

  .reels {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 30px;
    background: #000;
    padding: 20px;
    border-radius: 15px;
    border: 4px solid #ffd700;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
  }

  .reel {
    width: 90px;
    height: 110px;
    background: linear-gradient(to bottom, #222, #111);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    overflow: hidden;
    position: relative;
    border: 2px solid #555;
  }

  .reel.spinning {
    animation: spin 0.1s linear infinite;
  }

  @keyframes spin {
    0% { transform: translateY(0); }
    100% { transform: translateY(-20px); }
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .bet-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .bet-btn {
    background: #333;
    color: #fff;
    border: 2px solid #00ffff;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
  }

  .bet-btn:hover, .bet-btn.active {
    background: #00ffff;
    color: #000;
    box-shadow: 0 0 15px #00ffff;
  }

  .spin-btn {
    background: linear-gradient(45deg, #ff00cc, #3333ff);
    color: white;
    border: none;
    padding: 18px;
    font-size: 1.4rem;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    transition: all 0.3s;
    box-shadow: 0 5px 20px rgba(255, 0, 204, 0.4);
  }

  .spin-btn:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 8px 25px rgba(255, 0, 204, 0.6);
  }

  .spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .message {
    margin-top: 20px;
    min-height: 30px;
    font-size: 1.3rem;
    font-weight: bold;
  }

  .win {
    color: #00ff88;
    text-shadow: 0 0 10px #00ff88;
  }

  .lose {
    color: #ff5555;
  }

  .footer {
    margin-top: 20px;
    font-size: 0.85rem;
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="machine">
  <h1>LUCKY SLOTS</h1>

  <div class="info">
    <span>Punkte: <strong id="points">1000</strong></span>
    <span>Einsatz: <strong id="currentBet">10</strong></span>
  </div>

  <div class="reels">
    <div class="reel" id="reel1">🍒</div>
    <div class="reel" id="reel2">🍋</div>
    <div class="reel" id="reel3">🍊</div>
  </div>

  <div class="controls">
    <div class="bet-buttons">
      <button class="bet-btn active" data-bet="10">10</button>
      <button class="bet-btn" data-bet="25">25</button>
      <button class="bet-btn" data-bet="50">50</button>
      <button class="bet-btn" data-bet="100">100</button>
    </div>

    <button class="spin-btn" id="spinBtn">DREHEN</button>
  </div>

  <div class="message" id="message"></div>

  <div class="footer">
    3 gleiche = 10× • 2 gleiche = 2× • 🍒🍒🍒 = 50×
  </div>
</div>

<script>

    '🍉🍉🍉': 12,
    '🍇🍇🍇': 10,
    '🍊🍊🍊': 8,

  };

  const pointsEl = document.getElementById('points');
  const betEl = document.getElementById('currentBet');
  const messageEl = document.getElementById('message');
  const spinBtn = document.getElementById('spinBtn');
  const reels = [
    document.getElementById('reel1'),
    document.getElementById('reel2'),
    document.getElementById('reel3')
  ];

  document.querySelectorAll('.bet-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (isSpinning) return;
      document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentBet = parseInt(btn.dataset.bet);
      betEl.textContent = currentBet;
    });
  });
