<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Military Side Defense</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #080d12;
    color: #e8eadf;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

#page {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 8px;
}

h1 {
    text-align: center;
    margin: 6px 0 10px;
    font-size: 27px;
    letter-spacing: 2px;
    color: #d6d9c5;
}

#hud {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 8px;
}

.stat {
    min-width: 92px;
    padding: 7px 12px;
    text-align: center;

    background: #151d20;
    border: 2px solid #596153;
    border-radius: 8px;
}

.stat span {
    display: block;
    font-size: 11px;
    color: #aab09e;
}

.stat strong {
    font-size: 18px;
    color: #e3e6d5;
}

#gameBox {
    position: relative;
    width: 100%;
    border: 3px solid #555e51;
    border-radius: 12px;
    overflow: hidden;
    background: #172017;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #202b20;
    touch-action: none;
}

#message {
    min-height: 42px;
    margin-top: 8px;
    padding: 11px;

    text-align: center;

    background: #12191b;
    border: 2px solid #414b43;
    border-radius: 8px;

    color: #c9cfbd;
    font-size: 14px;
}

#controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
    margin-top: 9px;
}

button {
    min-width: 105px;

    padding: 11px 13px;

    border-radius: 8px;
    border: 2px solid #566052;

    background: #202923;

    color: #e4e7d9;

    font-size: 13px;
    font-weight: bold;

    cursor: pointer;
}

button:active {
    transform: scale(.96);
}

button.active {
    background: #4b603d;
    border-color: #8b9b68;
}

button.start {
    background: #3e5638;
}

button.special {
    background: #4c4930;
}

button:disabled {
    opacity: .45;
}

/* GAME OVER */

#overlay {
    position: absolute;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(5,8,7,.84);

    z-index: 50;
}

#overlayBox {
    width: 85%;
    max-width: 400px;

    padding: 25px;

    text-align: center;

    background: #151d19;

    border: 3px solid #68735f;
    border-radius: 12px;
}

#overlayBox h2 {
    margin-top: 0;
}

#overlayBox button {
    margin-top: 12px;
}

/* MOBILE */

@media(max-width:600px) {

    #page {
        padding: 5px;
    }

    h1 {
        font-size: 21px;
    }

    .stat {
        min-width: 75px;
        padding: 6px 8px;
    }

    .stat strong {
        font-size: 16px;
    }

    button {
        min-width: 92px;
        font-size: 12px;
        padding: 10px 8px;
    }

    #message {
        font-size: 13px;
    }
}

</style>
</head>

<body>

<div id="page">

<h1>🎖️ MILITARY SIDE DEFENSE</h1>

<div id="hud">

    <div class="stat">
        <span>💰 GELD</span>
        <strong id="money">300</strong>
    </div>

    <div class="stat">
        <span>❤️ HAUS</span>
        <strong id="hp">100</strong>
    </div>

    <div class="stat">
        <span>🌊 WELLE</span>
        <strong id="wave">0</strong>
    </div>

    <div class="stat">
        <span>👾 FEINDE</span>
        <strong id="enemies">0</strong>
    </div>

</div>

<div id="gameBox">

    <canvas id="canvas"
            width="1000"
            height="560">
    </canvas>

    <div id="overlay">

        <div id="overlayBox">

            <h2>🏚️ VERTEIDIGUNG GESCHLAGEN</h2>

            <p id="gameOverText"></p>

            <button onclick="restartGame()">
                🔄 NEUES SPIEL
            </button>

        </div>

    </div>

</div>

<div id="message">
    Wähle eine Einheit und tippe anschließend auf das Spielfeld.
</div>

<div id="controls">

    <button id="soldierBtn"
            onclick="selectBuild('soldier')">
        🔫 SOLDAT<br>
        75 €
    </button>

    <button id="heavyBtn"
            onclick="selectBuild('heavy')">
        💣 SCHWERER<br>
        150 €
    </button>

    <button id="rapidBtn"
            onclick="selectBuild('rapid')">
        ⚡ MG-SOLDAT<br>
        120 €
    </button>

    <button onclick="buildWall()">
        🧱 SANDBAGS<br>
        60 €
    </button>

    <button onclick="upgradeSelected()">
        ⬆️ UPGRADE
    </button>

    <button id="specialBtn"
            class="special"
            onclick="specialAttack()">
        💥 ARTILLERIE
    </button>

    <button class="start"
            onclick="startWave()">
        ▶️ WELLE STARTEN
    </button>

</div>

</div>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/* =====================================================
   SPIELDATEN
===================================================== */

let money = 300;
let houseHP = 100;
let wave = 0;

let enemies = [];
let towers = [];
let bullets = [];
let walls = [];
let effects = [];

let selectedBuild = null;
let selectedTower = null;

let waveRunning = false;
let enemiesRemaining = 0;

let spawnTimer = 0;

let lastTime = 0;

let artilleryReady = true;

let gameOver = false;


/* =====================================================
   TOWER DATEN
===================================================== */

const towerTypes = {

    soldier: {
        cost: 75,
        damage: 12,
        range: 250,
        cooldown: 850
    },

    heavy: {
        cost: 150,
        damage: 32,
        range: 290,
        cooldown: 1600
    },

    rapid: {
        cost: 120,
        damage: 6,
        range: 220,
        cooldown: 300
    }

};


/* =====================================================
   HILFSFUNKTION
===================================================== */

function setMessage(text) {

    document.getElementById(
        "message"
    ).textContent = text;

}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    document.getElementById(
        "money"
    ).textContent = money;

    document.getElementById(
        "hp"
    ).textContent = Math.max(
        0,
        Math.floor(houseHP)
    );

    document.getElementById(
        "wave"
    ).textContent = wave;

    document.getElementById(
        "enemies"
    ).textContent = enemies.length;

}


/* =====================================================
   AUSWAHL
===================================================== */

function selectBuild(type) {

    selectedBuild = type;
    selectedTower = null;

    document
        .querySelectorAll("#controls button")
        .forEach(b =>
            b.classList.remove("active")
        );

    if(type === "soldier") {

        document
            .getElementById("soldierBtn")
            .classList.add("active");

    }

    if(type === "heavy") {

        document
            .getElementById("heavyBtn")
            .classList.add("active");

    }

    if(type === "rapid") {

        document
            .getElementById("rapidBtn")
            .classList.add("active");

    }

    setMessage(
        "📍 Tippe auf eine freie Position zwischen den Häusern."
    );

}

   CANVAS KOORDINATEN
