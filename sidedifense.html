<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Battle Ages</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
}

body{
    margin:0;
    background:#090d12;
    color:#e8edf2;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

#game{
    max-width:1500px;
    margin:auto;
}

/* =========================================================
   START SCREEN
   ========================================================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at 50% 35%,rgba(70,110,140,.18),transparent 35%),
        linear-gradient(135deg,#05080b,#101820,#05080b);

    padding:20px;
}

.startBox{
    width:min(700px,100%);
    padding:35px 25px;

    text-align:center;

    background:
        linear-gradient(145deg,#18232c,#0b1116);

    border:2px solid #43535f;
    border-radius:14px;

    box-shadow:
        0 0 30px rgba(0,0,0,.8),
        inset 0 0 25px rgba(0,0,0,.5);
}

.startTitle{
    font-size:42px;
    font-weight:bold;
    letter-spacing:3px;

    color:#e9f1f5;

    text-shadow:
        0 0 10px rgba(100,180,220,.4);
}

.startSubtitle{
    margin-top:8px;
    margin-bottom:30px;

    color:#9daab3;
    font-size:15px;
}

.difficultyTitle{
    font-size:18px;
    margin-bottom:15px;
    color:#dce5ea;
}

.difficultyButtons{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
}

.difficultyButton{
    width:180px;
    min-height:125px;

    border-radius:10px;

    background:linear-gradient(#27343d,#151d23);
    border:2px solid #465660;

    color:white;

    cursor:pointer;

    transition:.2s;

    padding:15px;
}

.difficultyButton:hover{
    transform:translateY(-4px);
    background:linear-gradient(#344650,#1a252c);
}

.difficultyButton .icon{
    font-size:30px;
    display:block;
    margin-bottom:8px;
}

.difficultyButton strong{
    display:block;
    font-size:18px;
    margin-bottom:7px;
}

.difficultyButton small{
    display:block;
    color:#aeb8be;
    line-height:1.35;
}

.easy:hover{
    border-color:#58c878;
    box-shadow:0 0 18px rgba(88,200,120,.25);
}

.medium:hover{
    border-color:#d4b94f;
    box-shadow:0 0 18px rgba(212,185,79,.25);
}

.hard:hover{
    border-color:#d75a4e;
    box-shadow:0 0 18px rgba(215,90,78,.25);
}

.hidden{
    display:none !important;
}

/* =========================================================
   HUD
   ========================================================= */

#hud{
    background:linear-gradient(#171e26,#0c1117);
    border-bottom:2px solid #394652;
    padding:10px;

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;

    position:relative;
    z-index:10;
}

.stat{
    background:#111820;
    border:1px solid #3d4a55;
    border-radius:6px;
    padding:8px 12px;
    min-width:105px;
    text-align:center;

    box-shadow:inset 0 0 10px #000;
}

.stat small{
    display:block;
    color:#8e9aa5;
    font-size:11px;
}

.stat b{
    font-size:17px;
}

/* =========================================================
   BATTLEFIELD
   ========================================================= */

#battlefield{
    position:relative;
    height:540px;
    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            #596b78 0%,
            #34434d 58%,
            #28342d 58%,
            #1e2921 100%
        );

    border-bottom:4px solid #111;
}

.sky{
    position:absolute;
    inset:0 0 42% 0;

    background:
        radial-gradient(
            circle at 75% 20%,
            rgba(255,255,255,.08),
            transparent 20%
        ),
        linear-gradient(#26343e,#53616b);
}

.ground{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:43%;

    background:
        repeating-linear-gradient(
            0deg,
            #263229 0,
            #263229 7px,
            #202a23 8px,
            #202a23 15px
        );
}

.road{
    position:absolute;
    left:0;
    right:0;
    bottom:65px;
    height:105px;

    background:#4a4c48;

    border-top:3px solid #262925;
    border-bottom:3px solid #242723;
}

.roadLine{
    position:absolute;
    left:0;
    right:0;
    top:48px;
    height:4px;

    background:
        repeating-linear-gradient(
            90deg,
            #b9aa63 0,
            #b9aa63 50px,
            transparent 50px,
            transparent 100px
        );
}

/* =========================================================
   BUILDINGS
   ========================================================= */

.building{
    position:absolute;
    bottom:170px;

    width:105px;
    height:130px;

    background:#333b40;
    border:3px solid #20272b;

    box-shadow:7px 8px 0 rgba(0,0,0,.25);
}

.building:before{
    content:"";

    position:absolute;
    left:-8px;
    right:-8px;
    top:-17px;
    height:20px;

    background:#252c30;

    transform:skewX(-25deg);
}

.window{
    position:absolute;

    width:20px;
    height:25px;

    background:#1b2429;
    border:2px solid #56616a;
}

.window:nth-child(1){
    left:15px;
    top:20px;
}

.window:nth-child(2){
    right:15px;
    top:20px;
}

.window:nth-child(3){
    left:15px;
    top:65px;
}

.window:nth-child(4){
    right:15px;
    top:65px;
}

.b1{
    left:22%;
    height:120px;
}

.b2{
    left:31%;
    height:95px;
}

.b3{
    right:28%;
    height:115px;
}

.b4{
    right:19%;
    height:140px;
}

/* =========================================================
   BASES
   ========================================================= */

.base{
    position:absolute;
    bottom:145px;

    width:105px;
    height:185px;

    z-index:5;
}

.playerBase{
    left:15px;
}

.enemyBase{
    right:15px;
}

.baseWall{
    position:absolute;

    bottom:0;
    left:0;

    width:100%;
    height:145px;

    background:
        repeating-linear-gradient(
            90deg,
            #59636a 0,
            #59636a 25px,
            #343c42 25px,
            #343c42 29px
        );

    border:4px solid #20272c;
}

.baseRoof{
    position:absolute;

    bottom:138px;
    left:-12px;

    width:129px;
    height:30px;

    background:#252d32;
    border:4px solid #171d21;

    transform:skewX(-25deg);
}

.baseFlag{
    position:absolute;

    top:-45px;
    left:48px;

    width:4px;
    height:48px;

    background:#171c20;
}

.baseFlag:after{
    content:"";

    position:absolute;

    top:0;
    left:4px;

    width:32px;
    height:18px;

    background:#667b85;

    clip-path:polygon(
        0 0,
        100% 20%,
        70% 100%,
        0 80%
    );
}

.enemyBase .baseFlag:after{
    background:#8a493d;
}

.baseGun{
    position:absolute;

    bottom:105px;
    left:35px;

    width:38px;
    height:18px;

    background:#151b1f;
    border:3px solid #39444b;

    border-radius:50%;
}

.baseGun:after{
    content:"";

    position:absolute;

    width:42px;
    height:8px;

    right:-32px;
    top:2px;

    background:#11161a;
}

.enemyBase .baseGun{
    transform:scaleX(-1);
}

/* =========================================================
   UNITS
   ========================================================= */

.unit{
    position:absolute;

    width:46px;
    height:70px;

    z-index:7;

    transform:
        translate(-50%,-100%);
}

.unit .head{
    position:absolute;

    left:13px;
    top:2px;

    width:21px;
    height:21px;

    background:#c58e68;

    border-radius:50%;
    border:2px solid #20262b;
}

.unit .body{
    position:absolute;

    left:10px;
    top:22px;

    width:27px;
    height:31px;

    background:#56656d;

    border:2px solid #20262b;
    border-radius:4px;
}

.unit .leg{
    position:absolute;

    top:51px;

    width:8px;
    height:18px;

    background:#22292d;
    border-radius:3px;
}

.unit .leg.l{
    left:12px;
}

.unit .leg.r{
    right:12px;
}

.unit .shield{
    position:absolute;

    left:-1px;
    top:26px;

    width:17px;
    height:25px;

    background:#4d6875;
    border:2px solid #172027;

    border-radius:4px;
}

.unit .sword{
    position:absolute;

    right:-8px;
    top:20px;

    width:7px;
    height:32px;

    background:#ccd4d8;

    transform:rotate(30deg);

    border:1px solid #24292d;
}

.unit .bow{
    position:absolute;

    right:-5px;
    top:22px;

    width:23px;
    height:31px;

    border:3px solid #8d6239;
    border-left:0;

    border-radius:50%;
}

.unit .arrowHeld{
    position:absolute;

    right:-12px;
    top:35px;

    width:28px;
    height:2px;

    background:#d9d0b0;

    transform:rotate(-12deg);
}

.unit .hammer{
    position:absolute;

    right:-12px;
    top:20px;

    width:8px;
    height:38px;

    background:#765338;

    transform:rotate(25deg);
}

.unit .hammer:after{
    content:"";

    position:absolute;

    left:-8px;
    top:-4px;

    width:24px;
    height:13px;

    background:#60676c;

    border:2px solid #24292d;
    border-radius:3px;
}

.archer .body{
    background:#3d6551;
}

.heavy .body{
    background:#51545a;
}

.heavy .head{
    background:#9a9b91;
}

.heavy .head:after{
    content:"";

    position:absolute;

    left:-3px;
    top:-5px;

    width:23px;
    height:8px;

    background:#565c61;

    border:2px solid #20262b;
}

/* =========================================================
   PROJECTILES
   ========================================================= */

.projectile{
    position:absolute;

    width:30px;
    height:3px;

    background:#d7c79e;

    transform-origin:left center;

    z-index:9;

    box-shadow:
        0 0 5px rgba(255,220,120,.5);
}

.projectile:after{
    content:"";

    position:absolute;

    right:-3px;
    top:-3px;

    border-left:7px solid #d7c79e;
    border-top:4px solid transparent;
    border-bottom:4px solid transparent;
}

.cannonProjectile{
    position:absolute;

    width:12px;
    height:12px;

    background:#111;

    border-radius:50%;

    z-index:10;

    box-shadow:
        0 0 7px #ffb45d;
}

/* =========================================================
   CONTROLS
   ========================================================= */

#controls{
    background:#11171c;

    border-bottom:2px solid #303b43;

    padding:12px;

    display:flex;
    flex-wrap:wrap;

    gap:8px;

    justify-content:center;
}

button{
    border:1px solid #586873;

    background:
        linear-gradient(#303d46,#1c252b);

    color:#e9eef1;

    padding:10px 13px;

    border-radius:5px;

    cursor:pointer;

    font-weight:bold;

    min-width:115px;
}

button:hover{
    background:
        linear-gradient(#45555f,#27333b);
}

button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

#message{
    min-height:36px;

    padding:10px;

    text-align:center;

    background:#0b1014;

    color:#c6d0d6;

    font-weight:bold;
}

.explosion{
    position:absolute;

    width:30px;
    height:30px;

    border-radius:50%;

    background:#ff9d3c;

    box-shadow:
        0 0 10px #ffcc66,
        0 0 25px #ff5e32;

    z-index:20;

    animation:explode .35s forwards;
}

.hit{
    position:absolute;

    width:18px;
    height:18px;

    border-radius:50%;

    background:#eee;

    box-shadow:
        0 0 10px #fff;

    z-index:20;

    animation:hit .25s forwards;
}

@keyframes explode{

    from{
        transform:scale(.4);
        opacity:1;
    }

    to{
        transform:scale(2.5);
        opacity:0;
    }
}

@keyframes hit{

    from{
        transform:scale(.5);
        opacity:1;
    }

    to{
        transform:scale(1.8);
        opacity:0;
    }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

    #battlefield{
        height:460px;
    }

    .building{
        transform:scale(.75);
        transform-origin:bottom;
    }

    .base{
        transform:scale(.8);
        transform-origin:bottom;
    }

    button{
        min-width:100px;
        font-size:12px;
        padding:9px 7px;
    }

    .stat{
        min-width:85px;
        padding:6px;
    }

    .stat b{
        font-size:14px;
    }

    .startTitle{
        font-size:32px;
    }

    .difficultyButton{
        width:150px;
    }
}

</style>
</head>

</div>


<div id="game" class="hidden">

</div>


<!-- =========================================================
     BATTLEFIELD
     ========================================================= -->

<div id="battlefield">

    <div class="sky"></div>


    <div class="building b1">

        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>

    </div>


    <div class="building b2">

        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>

    </div>


    <div class="building b3">

        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>

    </div>


    <div class="building b4">

        <div class="window"></div>
        <div class="window"></div>

        <div class="window"></div>

    </div>


    <div class="ground"></div>


    <div class="road">

        <div class="roadLine"></div>

    </div>


    <!-- SPIELERBASIS -->

    <div
        class="base playerBase"

        <div class="baseFlag"></div>

        <div class="baseRoof"></div>

        <div class="baseWall"></div>

        <div class="baseGun"></div>

    </div>


    <!-- FEINDBASIS -->

    <div
        class="base enemyBase"
        id="enemyBase">

        <div class="baseFlag"></div>

        <div class="baseRoof"></div>

        <div class="baseWall"></div>

        <div class="baseGun"></div>

    </div>

</div>


<!-- =========================================================
     CONTROLS
     ========================================================= -->

<div id="controls">

    <button
        id="warriorBtn"
        onclick="buyUnit('warrior')">
        ⚔️ Krieger
    </button>

    <button
        id="archerBtn"
        onclick="buyUnit('archer')">
        🏹 Bogenschütze
    </button>

    <button
        id="heavyBtn"
        onclick="buyUnit('heavy')">
        🔨 Schwerer
    </button>

    <button onclick="startWave()">
        🚨 WELLE STARTEN
    </button>

    <button onclick="artillery()">
        💥 ARTILLERIE
    </button>

    <button onclick="upgradeAge()">
        ⬆️ ZEITALTER
    </button>

    <button onclick="saveGame()">
        💾 SPEICHERN
    </button>

    <button onclick="loadGame()">
        📂 LADEN
    </button>

    <button onclick="restartGame()">
        🔄 NEUSTART
    </button>

</div>


<div id="message">
    Verteidige deine Basis und zerstöre die feindliche Basis!
</div>

</div>

            cooldown:1000,
            reward:320
        }

    }

}

];

    },

   GAME VARIABLES

let difficulty = null;

let gold = 1200;

let playerHP = 5000;

let enemyHP = 5000;

let age = 0;

let wave = 1;

let waveTimer = 30;

let waveRunning = false;

let gameOver = false;

let units = [];

let projectiles = [];

let lastTime = performance.now();

let goldTimer = 0;

let enemySpawnTimer = 0;

let enemyBaseTimer = 0;

let playerBaseTimer = 0;

let currentWaveEnemies = 0;

let spawnedWaveEnemies = 0;


/* =========================================================
   ELEMENTS

const battlefield =
    document.getElementById("battlefield");

const goldEl =

const incomeEl =

/* =========================================================

function startGame(selectedDifficulty){

/* =========================================================
   HELPERS
   ========================================================= */

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


function updateHUD(){

    if(!difficulty)
        return;

    const effectiveIncome =
        ages[age].income *
        difficulty.incomeMultiplier;

    goldEl.textContent =
        Math.floor(gold);

    incomeEl.textContent =
        "+" +
        effectiveIncome.toFixed(1) +
        "/s";

    playerHPEl.textContent =
        Math.max(
            0,
            Math.floor(playerHP)
        );

    enemyHPEl.textContent =
        Math.max(
            0,
            Math.floor(enemyHP)
        );

    waveEl.textContent =
        wave;

    ageEl.textContent =
        ages[age].name;

    timerEl.textContent =
        Math.max(
            0,
            Math.ceil(waveTimer)
        );

}


/* =========================================================
   BUTTONS
   ========================================================= */

function updateButtons(){

    if(!difficulty)
        return;

    const data =
        ages[age].units;

    document.getElementById("warriorBtn").textContent =
        "⚔️ " +
        data.warrior.name +
        " (" +
        data.warrior.cost +
        ")";

    document.getElementById("archerBtn").textContent =
        "🏹 " +
        data.archer.name +
        " (" +
        data.archer.cost +
        ")";

    document.getElementById("heavyBtn").textContent =
        "🔨 " +
        data.heavy.name +
        " (" +
        data.heavy.cost +
        ")";

}


/* =========================================================
   CREATE UNIT
   ========================================================= */

function createUnit(type,player=true){

    const data =
        ages[age].units[type];

    const unit = {

        id:Math.random(),

        type:type,

        player:player,

        hp:data.hp,

        maxHP:data.hp,

        x:
            player
            ? 115
            : battlefield.clientWidth-115,

        y:350,

        target:null,

        lastAttack:0,

        dead:false

    };

    units.push(unit);

    renderUnit(unit);

}


/* =========================================================
   RENDER UNIT
   ========================================================= */

function renderUnit(unit){

    if(unit.el)
        return;

    const el =
        document.createElement("div");

    el.className =
        "unit " +
        unit.type;

    el.innerHTML = `
        <div class="head"></div>
        <div class="body"></div>
        <div class="leg l"></div>
        <div class="leg r"></div>

        ${
            unit.type==="warrior"
            ? '<div class="shield"></div><div class="sword"></div>'
            : ''
        }

        ${
            unit.type==="archer"
            ? '<div class="bow"></div><div class="arrowHeld"></div>'
            : ''
        }

        ${
            unit.type==="heavy"
            ? '<div class="hammer"></div>'
            : ''
        }
    `;

    battlefield.appendChild(el);

    unit.el = el;

    updateUnitVisual(unit);

}


/* =========================================================
   UNIT VISUAL
   ========================================================= */

function updateUnitVisual(unit){

    if(!unit.el)
        return;

    unit.el.style.left =
        unit.x + "px";

    unit.el.style.top =
        unit.y + "px";

    if(unit.player){

        unit.el.style.transform =
            "translate(-50%,-100%) scaleX(1)";

    }else{

        unit.el.style.transform =
            "translate(-50%,-100%) scaleX(-1)";

    }

}


/* =========================================================
   BUY UNIT
   ========================================================= */

function buyUnit(type){

    if(gameOver || !gameStarted)
        return;

    const data =
        ages[age].units[type];

    if(gold < data.cost){

        messageEl.textContent =
            "Nicht genug Gold für diese Einheit!";

        return;
    }

    gold -= data.cost;

    createUnit(
        type,
        true
    );

    messageEl.textContent =
        data.name +
        " wurde eingesetzt.";

    updateHUD();

}


/* =========================================================
   FIND TARGET
   ========================================================= */

function findTarget(unit){

    let best = null;

    let bestDistance = Infinity;

    for(const other of units){

        if(other.dead)
            continue;

        if(other.player === unit.player)
            continue;

        const distance =
            Math.abs(
                other.x-unit.x
            );

        if(distance < bestDistance){

            bestDistance =
                distance;

            best = other;

        }

    }

    return best;

}


/* =========================================================
   ATTACK UNIT
   ========================================================= */

function attackUnit(attacker,target){

    const now =
        performance.now();

    const data =
        ages[age].units[attacker.type];

    if(
        now-attacker.lastAttack
        <
        data.cooldown
    )
        return;

    attacker.lastAttack =
        now;

    if(attacker.type==="archer"){

        createArrow(
            attacker,
            target
        );

    }else{

        target.hp -=
            data.damage;

        createHit(
            target.x,
            target.y
        );

        if(target.hp <= 0){

            killUnit(
                target,
                attacker
            );

        }

    }

}


/* =========================================================
   KILL UNIT
   ========================================================= */

function killUnit(target,killer){

    if(target.dead)
        return;

    target.dead =
        true;

    if(target.el)
        target.el.remove();

    if(killer.player){

        let reward;

        if(target.type==="warrior")
            reward=50;

        else if(target.type==="archer")
            reward=65;

        else
            reward=110;

        /*
           Auf höheren Schwierigkeiten
           gibt es etwas mehr Belohnung,
           damit der Spieler trotz stärkerer Gegner
           nicht wirtschaftlich erstickt.
        */

        if(difficulty){

            if(difficulty === difficulties.easy)
                reward *= 1.15;

            if(difficulty === difficulties.hard)
                reward *= 1.25;

        }

        gold += reward;

        messageEl.textContent =
            "Feind besiegt! +" +
            Math.floor(reward) +
            " Gold";

    }

}


/* =========================================================
   ARROW
   ========================================================= */

function createArrow(attacker,target){

    const arrow = {

        x:attacker.x,

        y:attacker.y-38,

        target:target,

        damage:
            ages[age].units.archer.damage,

        speed:8,

        player:attacker.player,

        el:
            document.createElement("div")

    };

    arrow.el.className =
        "projectile";

    battlefield.appendChild(
        arrow.el
    );

    projectiles.push(
        arrow
    );

}


/* =========================================================
   CANNON PROJECTILE
   ========================================================= */

function createCannonProjectile(
    x,
    y,
    target,
    damage
){

    const p = {

        x:x,

        y:y,

        target:target,

        damage:damage,

        speed:9,

        el:
            document.createElement("div")

    };

    p.el.className =
        "cannonProjectile";

    battlefield.appendChild(
        p.el
    );

    projectiles.push(p);

}


/* =========================================================
   UPDATE PROJECTILES
   ========================================================= */

function updateProjectiles(){

    for(
        let i=projectiles.length-1;
        i>=0;
        i--
    ){

        const p =
            projectiles[i];

        if(
            !p.target ||
            p.target.dead
        ){

            p.el.remove();

            projectiles.splice(
                i,
                1
            );

            continue;
        }

        const dx =
            p.target.x-p.x;

        const dy =
            (p.target.y-35)-p.y;

        const distance =
            Math.sqrt(
                dx*dx+
                dy*dy
            );

        if(
            distance <
            p.speed+4
        ){

            if(
                p.target.hp !==
                undefined
            ){

                p.target.hp -=
                    p.damage;

                createHit(
                    p.target.x,
                    p.target.y
                );

                if(
                    p.target.hp <= 0
                ){

                    killUnit(
                        p.target,
                        {
                            player:
                                !p.target.player
                        }
                    );

                }

            }

            p.el.remove();

            projectiles.splice(
                i,
                1
            );

            continue;
        }

        p.x +=
            dx/distance*p.speed;

        p.y +=
            dy/distance*p.speed;

        p.el.style.left =
            p.x+"px";

        p.el.style.top =
            p.y+"px";

        if(
            p.el.classList.contains(
                "projectile"
            )
        ){

            p.el.style.transform =
                "rotate(" +
                Math.atan2(
                    dy,
                    dx
                ) +
                "rad)";

        }

    }

}


/* =========================================================
   HIT EFFECT
   ========================================================= */

function createHit(x,y){

    const hit =
        document.createElement("div");

    hit.className =
        "hit";

    hit.style.left =
        (x-9)+"px";

    hit.style.top =
        (y-45)+"px";

    battlefield.appendChild(
        hit
    );

    setTimeout(
        ()=>{
            hit.remove();
        },
        250
    );

}


/* =========================================================
   BASE DEFENSE
   ========================================================= */

function baseDefense(){

    const now =
        performance.now();


    /* FEINDBASIS */

    if(
        now-enemyBaseTimer >
        1450
    ){

        enemyBaseTimer =
            now;

        let target=null;

        let closest=Infinity;

        for(const u of units){

            if(
                u.dead ||
                !u.player
            )
                continue;

            const d =
                Math.abs(
                    u.x -
                    (
                        battlefield.clientWidth-80
                    )
                );

            if(d < closest){

                closest=d;
                target=u;

            }

        }

        if(target){

            const damage =
                (
                    32+
                    age*7+
                    Math.floor(wave/8)*4
                )
                *
                difficulty.enemyDamage;

            createCannonProjectile(
                battlefield.clientWidth-70,
                330,
                target,
                damage
            );

        }

    }


    /* SPIELERBASIS */

    if(
        now-playerBaseTimer >
        1250
    ){

        playerBaseTimer =
            now;

        let target=null;

        let closest=Infinity;

        for(const u of units){

            if(
                u.dead ||
                u.player
            )
                continue;

            const d =
                u.x;

            if(d < closest){

                closest=d;
                target=u;

            }

        }

        if(target){

            createCannonProjectile(
                75,
                330,
                target,
                ages[age].baseDamage
            );

        }

    }

}


/* =========================================================
   UPDATE UNITS
   ========================================================= */

function updateUnits(){

    const now =
        performance.now();

    const playerBaseX =
        95;

    const enemyBaseX =
        battlefield.clientWidth-95;

    for(const unit of units){

        if(unit.dead)
            continue;

        const data =
            ages[age].units[unit.type];

        unit.target =
            findTarget(unit);

        if(unit.target){

            const distance =
                Math.abs(
                    unit.target.x-unit.x
                );

            if(
                distance <=
                data.range
            ){

                attackUnit(
                    unit,
                    unit.target
                );

            }else{

                moveUnit(unit);

            }

        }else{

            const baseDistance =
                unit.player
                ? enemyBaseX-unit.x
                : unit.x-playerBaseX;

            if(
                baseDistance <=
                data.range+20
            ){

                if(
                    now-unit.lastAttack >
                    data.cooldown
                ){

                    unit.lastAttack =
                        now;

                    if(unit.player){

                        enemyHP -=
                            data.baseDamage;

                    }else{

                        playerHP -=
                            data.baseDamage *
                            .7 *
                            difficulty.enemyDamage;

                    }

                    createHit(
                        unit.player
                        ? enemyBaseX
                        : playerBaseX,
                        330
                    );

                }

            }else{

                moveUnit(unit);

            }

        }

        updateUnitVisual(unit);

    }

}


/* =========================================================
   MOVE UNIT
   ========================================================= */

function moveUnit(unit){

    const speed =
        ages[age].units[
            unit.type
        ].speed;

    if(unit.player){

        unit.x += speed;

        unit.x =
            Math.min(
                unit.x,
                battlefield.clientWidth-120
            );

    }else{

        unit.x -= speed;

        unit.x =
            Math.max(
                unit.x,
                120
            );

    }

}


/* =========================================================
   REMOVE DEAD
   ========================================================= */

function removeDeadUnits(){

    units =
        units.filter(
            u=>!u.dead
        );

}


/* =========================================================
   START WAVE
   ========================================================= */

function startWave(){

    if(
        gameOver ||
        !gameStarted
    )
        return;

    if(waveRunning){

        messageEl.textContent =
            "Diese Welle läuft bereits!";

        return;

    }

    waveRunning =
        true;

    spawnedWaveEnemies =
        0;


    let baseCount;

    if(wave <= 3){

        baseCount =
            3+wave;

    }else if(wave <= 8){

        baseCount =
            5+
            Math.floor(
                wave*.5
            );

    }else{

        baseCount =
            6+
            Math.floor(
                wave*.65
            );

    }


    currentWaveEnemies =
        Math.max(
            2,
            Math.round(
                baseCount *
                difficulty.enemyCount
            )
        );


    enemySpawnTimer =
        0;

    messageEl.textContent =
        "Welle " +
        wave +
        " beginnt!";

}


/* =========================================================
   SPAWN ENEMY
   ========================================================= */

function spawnEnemy(){

    let type;

    const r =
        Math.random();


    if(wave < 4){

        type =
            r < .65
            ? "warrior"
            : "archer";

    }else if(wave < 10){

        type =
            r < .55
            ? "warrior"
            : r < .85
            ? "archer"
            : "heavy";

    }else{

        type =
            r < .45
            ? "warrior"
            : r < .75
            ? "archer"
            : "heavy";

    }


    const base =
        ages[age].units[type];


    const scaling =
        (
            1+
            Math.max(
                0,
                wave-5
            )*.045
        )
        *
        difficulty.enemyHP;


    const unit = {

        id:Math.random(),

        type:type,

        player:false,

        hp:base.hp*scaling,

        maxHP:base.hp*scaling,

        x:
            battlefield.clientWidth-115,

        y:350,

        target:null,

        lastAttack:0,

        dead:false

    };


    units.push(unit);

    renderUnit(unit);

    spawnedWaveEnemies++;

}


/* =========================================================
   BOSS
   ========================================================= */

function spawnBoss(){

    const base =
        ages[age].units.heavy;


    const boss = {

        id:Math.random(),

        type:"heavy",

        player:false,

        hp:
            base.hp *
            5 *
            difficulty.enemyHP,

        maxHP:
            base.hp *
            5 *
            difficulty.enemyHP,

        x:
            battlefield.clientWidth-115,

        y:350,

        target:null,

        lastAttack:0,

        dead:false

    };


    units.push(boss);

    renderUnit(boss);


    messageEl.textContent =
        "⚠️ BOSS-EINHEIT ANGRIFF!";

}


/* =========================================================
   ARTILLERY
   ========================================================= */

function artillery(){

    if(
        gameOver ||
        !gameStarted
    )
        return;

    const cost =
        250;


    if(gold < cost){

        messageEl.textContent =
            "Artillerie kostet " +
            cost +
            " Gold.";

        return;

    }


    gold -= cost;


    const targets =
        units.filter(
            u=>
                !u.player &&
                !u.dead
        );


    for(
        const enemy of targets
    ){

        enemy.hp -=
            (
                180+
                age*55
            )
            *
            difficulty.artilleryDamage;


        createExplosion(
            enemy.x,
            enemy.y
        );


        if(enemy.hp <= 0){

            killUnit(
                enemy,
                {
                    player:true
                }
            );

        }

    }


    messageEl.textContent =
        "💥 Artillerieschlag ausgeführt!";

    updateHUD();

}


/* =========================================================
   EXPLOSION
   ========================================================= */

function createExplosion(x,y){

    const explosion =
        document.createElement("div");

    explosion.className =
        "explosion";

    explosion.style.left =
        (x-15)+"px";

    explosion.style.top =
        (y-45)+"px";

    battlefield.appendChild(
        explosion
    );

    setTimeout(
        ()=>{
            explosion.remove();
        },
        350
    );

}


/* =========================================================
   AGE UPGRADE
   ========================================================= */

function upgradeAge(){

    if(
        !gameStarted ||
        gameOver
    )
        return;


    if(
        age >=
        ages.length-1
    ){

        messageEl.textContent =
            "Du bist bereits im höchsten Zeitalter!";

        return;

    }


    const nextAge =
        age+1;


    let cost;


    if(nextAge===1)
        cost=1300;

    else if(nextAge===2)
        cost=3200;

    else if(nextAge===3)
        cost=6500;

    else
        cost=11000;


    const requirements = {

        1:5,

        2:12,

        3:20,

        4:45

    };


    const requiredWave =
        requirements[nextAge];


    if(
        wave <
        requiredWave
    ){

        messageEl.textContent =
            "Zeitalter noch gesperrt! " +
            "Benötigt: Welle " +
            requiredWave;

        return;

    }


    if(gold < cost){

        messageEl.textContent =
            "Du brauchst " +
            cost +
            " Gold für " +
            ages[nextAge].name;

        return;

    }


    gold -= cost;

    age =
        nextAge;


    messageEl.textContent =
        "⬆️ Neues Zeitalter: " +
        ages[age].name;


    updateButtons();

    updateHUD();

}


/* =========================================================
   GOLD GENERATION
   ========================================================= */

function generateGold(delta){

    if(!difficulty)
        return;


    goldTimer +=
        delta;


    if(
        goldTimer >=
        1000
    ){

        const seconds =
            Math.floor(
                goldTimer/1000
            );


        const income =
            ages[age].income *
            difficulty.incomeMultiplier;


        gold +=
            income *
            seconds;


        goldTimer -=
            seconds*1000;

    }

}


/* =========================================================
   SAVE GAME
   ========================================================= */

function saveGame(){

    if(!gameStarted)
        return;


    const save = {

        gold:gold,

        playerHP:playerHP,

        enemyHP:enemyHP,

        age:age,

        wave:wave,

        difficulty:
            Object.keys(
                difficulties
            ).find(
                key =>
                    difficulties[key] ===
                    difficulty
            )

    };


    localStorage.setItem(
        "battleAgesSave",
        JSON.stringify(save)
    );


    messageEl.textContent =
        "💾 Spiel gespeichert.";

}


/* =========================================================
   LOAD GAME
   ========================================================= */

function loadGame(){

    const data =
        localStorage.getItem(
            "battleAgesSave"
        );


    if(!data){

        messageEl.textContent =
            "Kein gespeichertes Spiel gefunden.";

        return;

    }


    const save =
        JSON.parse(data);


    gold =
        save.gold ??
        1200;


    playerHP =
        save.playerHP ??
        5000;


    enemyHP =
        save.enemyHP ??
        5000;


    age =
        save.age ??
        0;


    wave =
        save.wave ??
        1;


    const savedDifficulty =
        save.difficulty ??
        "medium";


    difficulty =
        difficulties[
            savedDifficulty
        ];


    gameStarted =
        true;


    startScreen.classList.add(
        "hidden"
    );


    gameEl.classList.remove(
        "hidden"
    );


    messageEl.textContent =
        "📂 Spiel geladen: " +
        difficulty.name;


    updateButtons();

    updateHUD();

}


/* =========================================================
   GAME OVER
   ========================================================= */

function checkGameOver(){

    if(enemyHP <= 0){

        enemyHP=0;

        gameOver=true;

        messageEl.textContent =
            "🏆 SIEG! Die feindliche Basis wurde zerstört!";

    }


    if(playerHP <= 0){

        playerHP=0;

        gameOver=true;

        messageEl.textContent =
            "💀 NIEDERLAGE! Deine Basis wurde zerstört.";

    }

}


/* =========================================================
   RESTART
   ========================================================= */

function restartGame(){

    location.reload();

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function gameLoop(time){

    const delta =
        time-lastTime;

    lastTime =
        time;


    if(
        !gameOver &&
        gameStarted
    ){

        generateGold(delta);


        waveTimer -=
            delta/1000;


        if(
            waveTimer <= 0
        ){

            if(!waveRunning){

                startWave();

            }

        }


        if(waveRunning){

            enemySpawnTimer -=
                delta;


            if(
                enemySpawnTimer <= 0 &&
                spawnedWaveEnemies <
                currentWaveEnemies
            ){

                spawnEnemy();


                const baseSpawn =
                    Math.max(
                        700,
                        1250-
                        wave*12
                    );


                enemySpawnTimer =
                    baseSpawn /
                    difficulty.spawnSpeed;

            }


            if(
                spawnedWaveEnemies >=
                currentWaveEnemies
            ){

                waveRunning =
                    false;


                if(
                    wave % 10 === 0
                ){

                    spawnBoss();

                }


                wave++;


                /*
                   Zeit zwischen den Wellen
                   abhängig vom Schwierigkeitsgrad.
                */

                const normalTime =
                    Math.max(
                        18,
                        31-
                        wave*.30
                    );


                waveTimer =
                    normalTime *
                    difficulty.waveTime;


                messageEl.textContent =
                    "Welle abgeschlossen! " +
                    "Nächste Welle in " +
                    Math.ceil(
                        waveTimer
                    ) +
                    " Sekunden.";

            }

        }


        updateUnits();

        updateProjectiles();

        baseDefense();

        removeDeadUnits();

        checkGameOver();

        updateHUD();

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            !gameStarted ||
            gameOver
        )
            return;


        if(e.key==="1")
            buyUnit("warrior");


        if(e.key==="2")
            buyUnit("archer");


        if(e.key==="3")
            buyUnit("heavy");


        if(e.key==="4")
            startWave();


        if(e.key==="5")
            artillery();

    }
);


/* =========================================================
   START
   ========================================================= */

requestAnimationFrame(
    gameLoop
);

</script>
