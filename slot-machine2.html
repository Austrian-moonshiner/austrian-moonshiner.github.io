<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Moonshiner Reels</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 20%, #35106b 0%, transparent 35%),
        radial-gradient(circle at 20% 80%, #003b52 0%, transparent 35%),
        linear-gradient(135deg,#05030c,#09051a 50%,#02040b);

    color:white;
    font-family:Arial,Helvetica,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            90deg,
            transparent 49%,
            rgba(255,255,255,.025) 50%,
            transparent 51%
        ),
        linear-gradient(
            transparent 49%,
            rgba(255,255,255,.025) 50%,
            transparent 51%
        );

    background-size:40px 40px;
    pointer-events:none;
}

.game{
    width:min(1100px,96vw);
    padding:20px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(30,10,55,.96),
            rgba(4,10,28,.97)
        );

    box-shadow:
        0 0 30px rgba(150,0,255,.35),
        0 0 90px rgba(0,170,255,.12),
        inset 0 0 30px rgba(255,255,255,.025);

    position:relative;
    overflow:hidden;
}

.game::before{
    content:"";
    position:absolute;
    inset:0;

    border-radius:25px;

    box-shadow:
        inset 0 0 0 1px rgba(255,0,255,.08),
        inset 0 0 50px rgba(0,200,255,.05);

    pointer-events:none;
}

.title{
    text-align:center;
    margin:5px 0 3px;

    font-size:clamp(30px,6vw,58px);
    font-weight:900;
    letter-spacing:3px;

    background:
        linear-gradient(
            90deg,
            #ff2cff,
            #7c5cff,
            #00eaff,
            #44ffb0,
            #ff2cff
        );

    background-size:300% 100%;

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    animation:titleGlow 5s linear infinite;

    text-shadow:
        0 0 25px rgba(0,230,255,.25);
}

@keyframes titleGlow{
    0%{background-position:0%}
    100%{background-position:300%}
}

.subtitle{
    text-align:center;
    color:#aaa7c9;
    font-size:13px;
    margin-bottom:18px;
}

/* =========================
   INFO
========================= */

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.infoBox{
    padding:12px;

    text-align:center;

    border-radius:15px;

    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        inset 0 0 20px rgba(255,255,255,.015);
}

.infoLabel{
    display:block;
    color:#8e8ba8;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-bottom:5px;
}

.infoValue{
    font-size:25px;
    font-weight:900;
}

.points{
    color:#44ffb0;
    text-shadow:0 0 15px rgba(68,255,176,.7);
}

.highscore{
    color:#ffd84a;
    text-shadow:0 0 15px rgba(255,216,74,.55);
}

.level{
    color:#61c8ff;
}

/* =========================
   MACHINE
========================= */

.machine{
    position:relative;

    padding:16px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #171329,
            #080914
        );

    border:2px solid rgba(166,77,255,.45);

    box-shadow:
        0 0 30px rgba(140,40,255,.2),
        inset 0 0 30px rgba(0,0,0,.8);
}

/* Gewinnlinien */

.winLine{
    position:absolute;
    left:5px;
    right:5px;

    height:3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00f6ff,
            #ff2cff,
            #00f6ff,
            transparent
        );

    box-shadow:
        0 0 12px #00eaff,
        0 0 25px #ff2cff;

    opacity:.25;
    z-index:5;
    pointer-events:none;
}

.lineTop{
    top:calc(16px + (100% - 32px) / 6);
}

.lineMiddle{
    top:50%;
}

.lineBottom{
    top:calc(16px + (100% - 32px) * 5 / 6);
}

/* =========================
   REELS
========================= */

.reels{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;

    position:relative;
    z-index:2;
}

.reel{
    min-width:0;

    background:
        linear-gradient(
            180deg,
            #10101c,
            #05060d
        );

    border-radius:15px;

    border:1px solid rgba(255,255,255,.1);

    padding:5px;

    box-shadow:
        inset 0 0 20px rgba(0,0,0,.8),
        0 0 10px rgba(0,0,0,.5);

    overflow:hidden;
}

.symbol{
    aspect-ratio:1/1;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:clamp(30px,7vw,62px);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.08),
            transparent 70%
        );

    border-radius:10px;

    margin:3px;

    transition:
        transform .2s,
        filter .2s,
        background .2s;
}

.symbol.win{
    animation:winSymbol .7s ease-in-out infinite alternate;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.3),
            rgba(0,255,220,.08) 55%,
            transparent 75%
        );

    box-shadow:
        inset 0 0 20px rgba(0,255,220,.25),
        0 0 18px rgba(0,255,220,.45);
}

@keyframes winSymbol{
    from{
        transform:scale(1);
        filter:brightness(1);
    }

    to{
        transform:scale(1.08);
        filter:brightness(1.5);
    }
}

.reel.spinning .symbol{
    filter:blur(4px);
    transform:scaleY(.92);
}

/* =========================
   RESULT
========================= */

.result{
    min-height:80px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    margin-top:18px;
    padding:12px;

    border-radius:16px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
}

.resultMain{
    font-size:clamp(19px,4vw,30px);
    font-weight:900;
}

.resultSub{
    color:#aaa7c9;
    font-size:13px;
    margin-top:5px;
}

/* =========================
   BUTTON
========================= */

.controls{
    display:flex;
    justify-content:center;
    margin-top:18px;
}

.spinButton{
    border:0;
    outline:0;

    min-width:250px;

    padding:16px 35px;

    border-radius:999px;

    font-size:20px;
    font-weight:900;

    color:white;

    cursor:pointer;

    background:
        linear-gradient(
            90deg,
            #ff1493,
            #7b2cff,
            #00c8ff
        );

    background-size:200% 100%;

    box-shadow:
        0 0 20px rgba(0,200,255,.35),
        0 0 45px rgba(255,0,200,.2);

    transition:
        transform .15s,
        filter .15s,
        box-shadow .15s;
}

.spinButton:hover{
    filter:brightness(1.2);
    transform:translateY(-2px);

    box-shadow:
        0 0 30px rgba(0,200,255,.55),
        0 0 60px rgba(255,0,200,.3);
}

.spinButton:active{
    transform:scale(.96);
}

.spinButton:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

/* =========================
   RESET
========================= */

.reset{
    display:block;
    margin:13px auto 0;

    border:0;
    background:transparent;

    color:#77748f;

    cursor:pointer;

    font-size:12px;
}

.reset:hover{
    color:white;
}

/* =========================
   PARTICLES
========================= */

.particle{
    position:fixed;

    width:7px;
    height:7px;

    border-radius:50%;

    pointer-events:none;

    animation:
        particleFly 1.2s ease-out forwards;
}

@keyframes particleFly{
    from{
        opacity:1;
        transform:translate(0,0) scale(1);
    }

    to{
        opacity:0;
        transform:
            translate(
                calc((var(--x) - .5) * 500px),
                calc((var(--y) - .5) * 500px)
            )
            scale(.1);
    }
}

/* =========================
   GAME OVER
========================= */

.overlay{
    position:absolute;
    inset:0;

    background:rgba(3,3,10,.9);

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    z-index:20;

    backdrop-filter:blur(5px);
}

.overlay.show{
    display:flex;
}

.gameOverTitle{
    font-size:42px;
    font-weight:900;

    color:#ff3c88;

    text-shadow:
        0 0 20px rgba(255,0,100,.8);
}

.gameOverText{
    margin-top:10px;
    color:#bbb8cf;
}

.restartButton{
    margin-top:20px;

    padding:13px 28px;

    border:0;
    border-radius:999px;

    color:white;
    font-weight:bold;

    background:linear-gradient(
        90deg,
        #ff1493,
        #792cff
    );

    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .game{
        width:98vw;
        padding:10px;
        border-radius:18px;
    }

    .machine{
        padding:8px;
    }

    .reels{
        gap:4px;
    }

    .symbol{
        margin:2px;
        border-radius:7px;
    }

    .info{
        gap:5px;
    }

    .infoBox{
        padding:8px 4px;
    }

    .infoValue{
        font-size:19px;
    }

    .spinButton{
        width:100%;
        min-width:0;
    }
}

</style>
</head>

<body>

<div class="game">

    <h1 class="title">MOONSHINER REELS</h1>

    <div class="subtitle">
        Arcade Reel Challenge
    </div>

    <div class="info">

        <div class="infoBox">
            <span class="infoLabel">Punkte</span>
            <span
                id="points"
                class="infoValue points">
                1000
            </span>
        </div>

        <div class="infoBox">
            <span class="infoLabel">Highscore</span>
            <span
                id="highscore"
                class="infoValue highscore">
                1000
            </span>
        </div>

        <div class="infoBox">
            <span class="infoLabel">Level</span>
            <span
                id="level"
                class="infoValue level">
                1
            </span>
        </div>

    </div>

    <div class="machine">

        <div class="winLine lineTop"></div>
        <div class="winLine lineMiddle"></div>
        <div class="winLine lineBottom"></div>

        <div class="reels" id="reels">

            <div class="reel">
                <div class="symbol"></div>
                <div class="symbol"></div>
                <div class="symbol"></div>
            </div>

            <div class="reel">
                <div class="symbol"></div>
                <div class="symbol"></div>
                <div class="symbol"></div>
            </div>

            <div class="reel">
                <div class="symbol"></div>
                <div class="symbol"></div>
                <div class="symbol"></div>
            </div>

            <div class="reel">
                <div class="symbol"></div>
                <div class="symbol"></div>
                <div class="symbol"></div>
            </div>

            <div class="reel">
                <div class="symbol"></div>
                <div class="symbol"></div>
                <div class="symbol"></div>
            </div>

        </div>

        <div class="result">

            <div
                id="resultMain"
                class="resultMain">
                Bereit?
            </div>

            <div
                id="resultSub"
                class="resultSub">
                Drehe die Walzen!
            </div>

        </div>

        <div class="controls">

            <button
                id="spinButton"
                class="spinButton"
                onclick="spin()">

                🎰 DREHEN

            </button>

        </div>

        <button
            class="reset"
            onclick="resetGame()">

            Fortschritt zurücksetzen

        </button>

        <div
            id="overlay"
            class="overlay">

            <div class="gameOverTitle">
                GAME OVER
            </div>

            <div class="gameOverText">
                Deine Punkte sind auf 0 gefallen.
            </div>

            <button
                class="restartButton"
                onclick="restartGame()">

                NEUSTART

            </button>

        </div>

    </div>

</div>

<script>

/* =========================================================
   SYMBOLE
========================================================= */

const symbols = [
    "🍒",
    "🍋",
    "⭐",
    "🍀",
    "🔔",
    "💎",
    "🍇",
    "🍉"
];

/*
   Seltenere Symbole können etwas mehr wert sein.
*/

const values = {

    "🍒": {
        2:10,
        3:30,
        4:75,
        5:200
    },

    "🍋": {
        2:10,
        3:30,
        4:75,
        5:200
    },

    "⭐": {
        2:12,
        3:35,
        4:85,
        5:225
    },

    "🍀": {
        2:12,
        3:35,
        4:85,
        5:225
    },

    "🔔": {
        2:15,
        3:40,
        4:100,
        5:250
    },

    "🍇": {
        2:15,
        3:40,
        4:100,
        5:250
    },

    "🍉": {
        2:18,
        3:45,
        4:110,
        5:275
    },

    "💎": {
        2:25,
        3:60,
        4:150,
        5:500
    }

};

/* =========================================================
   GAME STATE
========================================================= */

let points =
    Number(localStorage.getItem("moon_points")) || 1000;

let highscore =
    Number(localStorage.getItem("moon_highscore")) || 1000;

let combo =
    Number(localStorage.getItem("moon_combo")) || 0;

let level =
    Number(localStorage.getItem("moon_level")) || 1;

let spinning = false;

/* =========================================================
   ELEMENTE
========================================================= */

const pointsElement =
    document.getElementById("points");

const highscoreElement =
    document.getElementById("highscore");

const levelElement =
    document.getElementById("level");

const resultMain =
    document.getElementById("resultMain");

const resultSub =
    document.getElementById("resultSub");

const spinButton =
    document.getElementById("spinButton");

const overlay =
    document.getElementById("overlay");

const reels =
    [...document.querySelectorAll(".reel")];

/* =========================================================
   START
========================================================= */

function updateUI(){

    pointsElement.textContent =
        Math.max(0, points);

    highscoreElement.textContent =
        highscore;

    levelElement.textContent =
        level;

    localStorage.setItem(
        "moon_points",
        points
    );

    localStorage.setItem(
        "moon_highscore",
        highscore
    );

    localStorage.setItem(
        "moon_combo",
        combo
    );

    localStorage.setItem(
        "moon_level",
        level
    );
}

/* =========================================================
   RANDOM SYMBOL
========================================================= */

function randomSymbol(){

    return symbols[
        Math.floor(
            Math.random() * symbols.length
        )
    ];

}

/* =========================================================
   INITIAL DISPLAY
========================================================= */

function initialize(){

    reels.forEach(reel => {

        reel.querySelectorAll(".symbol")
            .forEach(symbol => {

                symbol.textContent =
                    randomSymbol();

            });

    });

    updateUI();

}

initialize();

/* =========================================================
   SPIN
========================================================= */

async function spin(){

    if(spinning)
        return;

    if(points <= 0){

        showGameOver();
        return;

    }

    spinning = true;

    spinButton.disabled = true;

    clearWinEffects();

    resultMain.textContent =
        "🎰 DIE WALZEN DREHEN...";

    resultSub.textContent =
        "";

    reels.forEach(reel => {

        reel.classList.add("spinning");

    });

    /*
       Jede Walze stoppt etwas später.
    */

    const finalValues = [];

    for(let i = 0; i < 5; i++){

        await sleep(250);

        const reel =
            reels[i];

        const result = [];

        reel.querySelectorAll(".symbol")
            .forEach(symbol => {

                const value =
                    randomSymbol();

                symbol.textContent =
                    value;

                result.push(value);

            });

        finalValues.push(result);

        reel.classList.remove("spinning");

    }

    /*
       Matrix:

       finalValues[walze][reihe]
    */

    await sleep(250);

    evaluate(finalValues);

    spinning = false;

    if(points > 0){

        spinButton.disabled = false;

    }

}

/* =========================================================
   AUSWERTUNG
========================================================= */

function evaluate(matrix){

    let totalReward = 0;

    let combinations = [];

    /*
       Jede horizontale Reihe wird geprüft.
    */

    for(let row = 0; row < 3; row++){

        const line = [];

        for(let reel = 0; reel < 5; reel++){

            line.push(
                matrix[reel][row]
            );

        }

        const result =
            evaluateLine(line);

        if(result.reward > 0){

            totalReward +=
                result.reward;

            combinations.push({
                row:row,
                symbol:result.symbol,
                count:result.count,
                reward:result.reward
            });

        }

    }

    /*
       Zusätzlich werden auch Spalten geprüft.
       Dadurch können zwei gleiche Symbole
       auch außerhalb einer normalen Gewinnlinie
       belohnt werden.
    */

    for(let reel = 0; reel < 5; reel++){

        const column = [];

        for(let row = 0; row < 3; row++){

            column.push(
                matrix[reel][row]
            );

        }

        const result =
            evaluateLine(column);

        if(result.reward > 0){

            totalReward +=
                result.reward;

            combinations.push({
                row:null,
                symbol:result.symbol,
                count:result.count,
                reward:result.reward,
                column:reel
            });

        }

    }

    /*
       Verhindert, dass eine einzelne
       2er-Kombination durch mehrere
       Prüfungen unendlich oft zählt.
       Deshalb werden identische Kombinationen
       zusammengeführt.
    */

    combinations =
        removeDuplicateCombinations(
            combinations
        );

    /*
       Noch einmal sauber summieren.
    */

    totalReward = 0;

    combinations.forEach(c => {

        totalReward += c.reward;

    });

    if(combinations.length === 0){

        combo = 0;

        points -= 25;

        if(points < 0)
            points = 0;

        resultMain.textContent =
            "💥 Keine Kombination";

        resultSub.textContent =
            "−25 Punkte";

        updateUI();

        if(points <= 0){

            showGameOver();

        }

        return;

    }

    /*
       Erfolgreiche Runde
    */

    combo++;

    /*
       Combo-Bonus ab dem zweiten
       erfolgreichen Dreh.
    */

    let comboBonus = 0;

    if(combo >= 2){

        comboBonus =
            Math.min(
                combo * 5,
                100
            );

    }

    const finalReward =
        totalReward + comboBonus;

    points += finalReward;

    /*
       Level steigt alle 500 Punkte.
    */

    level =
        Math.max(
            1,
            Math.floor(points / 500) + 1
        );

    if(points > highscore){

        highscore = points;

    }

    /*
       Anzeige
    */

    if(
        combinations.some(
            c => c.count === 5 &&
                 c.symbol === "💎"
        )
    ){

        resultMain.textContent =
            "💎💎💎 DIAMANT-JACKPOT! 💎💎💎";

        resultSub.textContent =
            "+" + finalReward + " Punkte";

        createParticles(80);

    }
    else if(
        combinations.some(
            c => c.count === 5
        )
    ){

        resultMain.textContent =
            "🔥 FÜNFER-TREFFER!";

        resultSub.textContent =
            "+" + finalReward + " Punkte";

        createParticles(45);

    }
    else{

        resultMain.textContent =
            "✨ TREFFER!";

        resultSub.textContent =
            "+" + finalReward + " Punkte";

    }

    if(comboBonus > 0){

        resultSub.textContent +=
            "  |  Combo +" + comboBonus;

    }

    highlightWins(
        matrix,
        combinations
    );

    updateUI();

}

/* =========================================================
   LINIE AUSWERTEN
========================================================= */

function evaluateLine(line){

    const counts = {};

    line.forEach(symbol => {

        counts[symbol] =
            (counts[symbol] || 0) + 1;

    });

    let bestSymbol = null;
    let bestCount = 0;

    Object.keys(counts).forEach(symbol => {

        if(counts[symbol] > bestCount){

            bestCount =
                counts[symbol];

            bestSymbol =
                symbol;

        }

    });

    if(bestCount < 2){

        return {
            reward:0,
            symbol:null,
            count:0
        };

    }

    return {

        reward:
            values[bestSymbol][bestCount],

        symbol:
            bestSymbol,

        count:
            bestCount

    };

}

/* =========================================================
   DUPLIKATE ENTFERNEN
========================================================= */

function removeDuplicateCombinations(list){

    const seen = new Set();
    const result = [];

    list.forEach(item => {

        const key =
            [
                item.symbol,
                item.count,
                item.row,
                item.column
            ].join("|");

        if(!seen.has(key)){

            seen.add(key);
            result.push(item);

        }

    });

    return result;

}

/* =========================================================
   GEWINNE HIGHLIGHTEN
========================================================= */

function highlightWins(
    matrix,
    combinations
){

    combinations.forEach(c => {

        if(c.row !== null){

            for(
                let reel = 0;
                reel < 5;
                reel++
            ){

                const symbol =
                    reels[reel]
                    .querySelectorAll(".symbol")
                    [c.row];

                if(
                    symbol.textContent ===
                    c.symbol
                ){

                    symbol.classList.add(
                        "win"
                    );

                }

            }

        }
        else{

            const reel =
                reels[c.column];

            reel.querySelectorAll(
                ".symbol"
            ).forEach(symbol => {

                if(
                    symbol.textContent ===
                    c.symbol
                ){

                    symbol.classList.add(
                        "win"
                    );

                }

            });

        }

    });

}

/* =========================================================
   WIN EFFECTS LÖSCHEN
========================================================= */

function clearWinEffects(){

    document
        .querySelectorAll(".symbol.win")
        .forEach(symbol => {

            symbol.classList.remove(
                "win"
            );

        });

}

/* =========================================================
   GAME OVER
========================================================= */

function showGameOver(){

    overlay.classList.add("show");

    spinButton.disabled = true;

}

/* =========================================================
   NEUSTART
========================================================= */

function restartGame(){

    points = 1000;
    combo = 0;
    level = 1;

    overlay.classList.remove(
        "show"
    );

    spinButton.disabled = false;

    resultMain.textContent =
        "Bereit?";

    resultSub.textContent =
        "Drehe die Walzen!";

    clearWinEffects();

    initialize();

}

/* =========================================================
   RESET
========================================================= */

function resetGame(){

    const confirmation =
        confirm(
            "Möchtest du wirklich Punkte, Level und Highscore zurücksetzen?"
        );

    if(!confirmation)
        return;

    localStorage.removeItem(
        "moon_points"
    );

    localStorage.removeItem(
        "moon_highscore"
    );

    localStorage.removeItem(
        "moon_combo"
    );

    localStorage.removeItem(
        "moon_level"
    );

    points = 1000;
    highscore = 1000;
    combo = 0;
    level = 1;

    overlay.classList.remove(
        "show"
    );

    spinButton.disabled = false;

    resultMain.textContent =
        "Neuer Start!";

    resultSub.textContent =
        "1000 Punkte";

    initialize();

}

/* =========================================================
   PARTICLES
========================================================= */

function createParticles(amount){

    for(let i = 0; i < amount; i++){

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "particle";

        particle.style.left =
            "50vw";

        particle.style.top =
            "45vh";

        particle.style.setProperty(
            "--x",
            Math.random()
        );

        particle.style.setProperty(
            "--y",
            Math.random()
        );

        particle.style.background =
            [
                "#ff2cff",
                "#00eaff",
                "#44ffb0",
                "#ffd84a",
                "#ffffff"
            ][
                Math.floor(
                    Math.random() * 5
                )
            ];

        document.body.appendChild(
            particle
        );

        setTimeout(() => {

            particle.remove();

        },1300);

    }

}

/* =========================================================
   SLEEP
========================================================= */

function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(resolve,ms)
    );

}

/* =========================================================
   TASTATUR
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.code ===
            "Space"
        ){

            event.preventDefault();

            spin();

        }

    }
);
