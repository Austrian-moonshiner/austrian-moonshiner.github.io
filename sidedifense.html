<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Battle Ages</title>

<style>
*{box-sizing:border-box;user-select:none}

body{
    margin:0;
    background:#10151a;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

header{
    background:linear-gradient(90deg,#17232d,#263746,#17232d);
    border-bottom:3px solid #596a74;
    padding:10px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
    letter-spacing:3px;
    text-shadow:2px 2px 4px #000;
}

#hud{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    padding:8px;
    background:#0b1014;
    border-bottom:2px solid #394954;
}

.info{
    background:#1b2730;
    border:1px solid #52616b;
    padding:7px 11px;
    border-radius:5px;
    min-width:90px;
    text-align:center;
    font-weight:bold;
}

.hpbar{
    width:130px;
    height:13px;
    background:#351919;
    border:1px solid #777;
    border-radius:3px;
    overflow:hidden;
    margin-top:4px;
}

.hpfill{
    height:100%;
    width:100%;
    background:#42a85f;
    transition:width:.2s;
}

#battlefield{
    position:relative;
    width:100%;
    height:540px;
    overflow:hidden;
    background:linear-gradient(to bottom,#3e4a50 0%,#313c42 38%,#273238 39%,#20282d 100%);
}

#sky{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:210px;
    background:
        radial-gradient(circle at 20% 30%,rgba(255,255,255,.1),transparent 20%),
        radial-gradient(circle at 75% 25%,rgba(255,255,255,.08),transparent 25%),
        linear-gradient(#53636d,#39484f);
}

#ground{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:230px;
    background:repeating-linear-gradient(
        0deg,
        #293238 0,
        #293238 12px,
        #252d32 13px,
        #252d32 25px
    );
    border-top:4px solid #59666d;
}

#road{
    position:absolute;
    left:0;
    right:0;
    bottom:92px;
    height:82px;
    background:repeating-linear-gradient(
        0deg,
        #4b4e4e 0,
        #4b4e4e 18px,
        #414444 19px,
        #414444 37px
    );
    border-top:3px solid #777;
    border-bottom:3px solid #777;
}

.roadLine{
    position:absolute;
    left:0;
    right:0;
    top:37px;
    height:5px;
    background:repeating-linear-gradient(
        90deg,
        #d2c46b 0,
        #d2c46b 55px,
        transparent 55px,
        transparent 100px
    );
    opacity:.55;
}

.building{
    position:absolute;
    bottom:180px;
    width:105px;
    height:110px;
    background:#505b60;
    border:4px solid #252c30;
    box-shadow:0 8px 15px rgba(0,0,0,.4);
}

.building:before{
    content:"";
    position:absolute;
    left:-10px;
    top:-33px;
    width:112px;
    height:38px;
    background:#333c40;
    border:4px solid #252c30;
    transform:skewX(-20deg);
}

.building:after{
    content:"";
    position:absolute;
    left:18px;
    top:35px;
    width:22px;
    height:32px;
    background:#20282c;
    box-shadow:
        38px 0 #20282c,
        0 48px #20282c,
        38px 48px #20282c;
}

.building.left{left:20%}
.building.right{right:20%}

.base{
    position:absolute;
    bottom:92px;
    width:105px;
    height:185px;
    z-index:5;
}

#playerBase{left:12px}
#enemyBase{right:12px}

.baseWall{
    position:absolute;
    bottom:0;
    left:15px;
    width:75px;
    height:145px;
    background:linear-gradient(90deg,#566066,#8a9599,#4e585d);
    border:5px solid #20272b;
    box-shadow:0 7px 14px rgba(0,0,0,.5);
}

.baseWall:before{
    content:"";
    position:absolute;
    top:-35px;
    left:-8px;
    width:86px;
    height:38px;
    background:#3e494e;
    border:5px solid #20272b;
}

.baseWall:after{
    content:"";
    position:absolute;
    bottom:0;
    left:25px;
    width:25px;
    height:58px;
    background:#252c30;
    border:3px solid #111;
}

.baseFlag{
    position:absolute;
    top:-70px;
    left:51px;
    width:5px;
    height:50px;
    background:#1a2023;
}

.baseFlag:after{
    content:"";
    position:absolute;
    left:4px;
    top:0;
    width:34px;
    height:21px;
    background:#69767b;
    clip-path:polygon(0 0,100% 0,80% 50%,100% 100%,0 100%);
}

#enemyBase .baseFlag:after{
    background:#9b4545;
}

.baseGun{
    position:absolute;
    bottom:108px;
    left:47px;
    width:50px;
    height:18px;
    background:#242b2e;
    border:3px solid #111;
    transform-origin:left center;
    border-radius:4px;
}

.baseGun:before{
    content:"";
    position:absolute;
    left:-13px;
    top:3px;
    width:18px;
    height:12px;
    background:#111;
    border-radius:50%;
}

.unit{
    position:absolute;
    width:58px;
    height:80px;
    bottom:145px;
    z-index:20;
    transform:translateX(-50%);
    pointer-events:none;
}

.unit .head{
    position:absolute;
    width:25px;
    height:25px;
    left:17px;
    top:0;
    border-radius:50%;
    background:#c58d69;
    border:3px solid #171b1d;
    z-index:4;
}

.unit .body{
    position:absolute;
    left:12px;
    top:24px;
    width:35px;
    height:31px;
    background:#596b75;
    border:3px solid #171b1d;
    border-radius:5px;
}

.unit .leg{
    position:absolute;
    top:53px;
    width:10px;
    height:25px;
    background:#252b2e;
    border:2px solid #111;
}

.unit .leg.one{left:15px}
.unit .leg.two{left:33px}

.unit .shield{
    position:absolute;
    left:-1px;
    top:27px;
    width:19px;
    height:29px;
    background:#65737a;
    border:3px solid #171b1d;
    border-radius:4px;
    z-index:5;
}

.unit .sword{
    position:absolute;
    right:-8px;
    top:25px;
    width:7px;
    height:36px;
    background:#d3d8d9;
    border:2px solid #222;
    transform:rotate(28deg);
    z-index:5;
}

.unit .sword:after{
    content:"";
    position:absolute;
    width:16px;
    height:4px;
    background:#654b32;
    bottom:1px;
    left:-5px;
}

.unit .bow{
    position:absolute;
    right:-8px;
    top:24px;
    width:25px;
    height:40px;
    border:4px solid #9b7043;
    border-left:0;
    border-radius:50%;
    transform:rotate(5deg);
    z-index:5;
}

.unit .bow:after{
    content:"";
    position:absolute;
    left:0;
    top:15px;
    width:22px;
    height:2px;
    background:#ddd;
}

.unit .arrowHeld{
    position:absolute;
    right:-9px;
    top:38px;
    width:30px;
    height:3px;
    background:#d8d8d8;
    transform:rotate(-15deg);
    z-index:6;
}

.unit .arrowHeld:after{
    content:"";
    position:absolute;
    right:-1px;
    top:-4px;
    border-left:8px solid #ddd;
    border-top:5px solid transparent;
    border-bottom:5px solid transparent;
}

.unit.heavy .head:after{
    content:"";
    position:absolute;
    left:-3px;
    top:-4px;
    width:25px;
    height:9px;
    background:#69747a;
    border:3px solid #1b2023;
    border-radius:8px 8px 2px 2px;
}

.unit .hammer{
    position:absolute;
    right:-12px;
    top:22px;
    width:8px;
    height:43px;
    background:#6d5034;
    transform:rotate(25deg);
    z-index:5;
}

.unit .hammer:after{
    content:"";
    position:absolute;
    left:-7px;
    top:-4px;
    width:22px;
    height:16px;
    background:#555e62;
    border:3px solid #191e21;
}

.unit .unitbar{
    position:absolute;
    left:2px;
    top:-10px;
    width:54px;
    height:5px;
    background:#2a1717;
    border:1px solid #111;
}

.unit .unitfill{
    width:100%;
    height:100%;
    background:#52b86b;
}

.unit.player .body{background:#536f7e}
.unit.enemy .body{background:#7d4747}

.projectile{
    position:absolute;
    width:34px;
    height:4px;
    background:#ddd;
    z-index:50;
    transform-origin:left center;
    pointer-events:none;
}

.projectile:after{
    content:"";
    position:absolute;
    right:-3px;
    top:-4px;
    border-left:9px solid #ddd;
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
}

.cannonProjectile{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#202020;
    border:2px solid #aaa;
    transform-origin:center;
}

.hit{
    position:absolute;
    width:28px;
    height:28px;
    border:4px solid #eee;
    border-radius:50%;
    z-index:60;
    pointer-events:none;
    animation:hit .35s forwards;
}

@keyframes hit{
    from{transform:scale(.3);opacity:1}
    to{transform:scale(1.8);opacity:0}
}

.explosion{
    position:absolute;
    width:65px;
    height:65px;
    border-radius:50%;
    background:radial-gradient(circle,#fff 0,#e8bd53 20%,#a84e31 50%,transparent 72%);
    z-index:100;
    pointer-events:none;
    animation:boom .5s forwards;
}

@keyframes boom{
    from{transform:scale(.3);opacity:1}
    to{transform:scale(1.8);opacity:0}
}

#controls{
    background:#11171b;
    border-top:2px solid #4a5962;
    padding:12px;
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

button{
    border:2px solid #53636b;
    background:linear-gradient(#34434b,#202a30);
    color:white;
    padding:11px 14px;
    border-radius:5px;
    font-weight:bold;
    cursor:pointer;
    min-width:145px;
    box-shadow:0 3px 5px #000;
}

button:hover{
    background:linear-gradient(#465963,#28353c);
}

button:active{
    transform:translateY(2px);
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

#message{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:rgba(8,12,15,.96);
    border:3px solid #69777e;
    padding:25px;
    width:min(90%,450px);
    text-align:center;
    z-index:500;
    display:none;
    box-shadow:0 10px 35px #000;
}

#message h2{margin-top:0}

#message button{margin-top:15px}

#waveWarning{
    position:absolute;
    left:50%;
    top:30px;
    transform:translateX(-50%);
    background:rgba(20,25,29,.92);
    border:2px solid #7e8b91;
    padding:10px 18px;
    border-radius:4px;
    font-weight:bold;
    z-index:400;
    display:none;
}

@media(max-width:700px){

    #battlefield{height:470px}

    .building{
        transform:scale(.78);
        transform-origin:bottom;
    }

    .base{
        transform:scale(.8);
        transform-origin:bottom;
    }

    .unit{
        transform:translateX(-50%) scale(.78);
        transform-origin:bottom;
    }

    button{
        min-width:120px;
        padding:10px 8px;
        font-size:12px;
    }

    .info{
        min-width:75px;
        font-size:12px;
        padding:6px;
    }

    .hpbar{width:100px}
}
</style>
</head>

<body>

<header>
    <h1>⚔ BATTLE AGES ⚔</h1>
</header>

<div id="hud">

    <div class="info">
        💰 GOLD
        <div id="gold">700</div>
    </div>

    <div class="info">
        🌊 WELLE
        <div id="wave">1</div>
    </div>

    <div class="info">
        🏛 ZEITALTER
        <div id="age">Steinzeit</div>
    </div>

    <div class="info">
        ❤️ DEINE BASIS
        <div id="playerHPText">5000 / 5000</div>
        <div class="hpbar">
            <div id="playerHPBar" class="hpfill"></div>
        </div>
    </div>

    <div class="info">
        ❤️ FEIND
        <div id="enemyHPText">5000 / 5000</div>
        <div class="hpbar">
            <div id="enemyHPBar" class="hpfill"></div>
        </div>
    </div>

    <div class="info">
        ⏱ NÄCHSTE WELLE
        <div id="waveTimer">24</div>
    </div>

</div>

<div id="battlefield">

    <div id="sky"></div>

    <div class="building left"></div>
    <div class="building right"></div>

    <div id="ground"></div>

    <div id="road">
        <div class="roadLine"></div>
    </div>

    <div id="playerBase" class="base">
        <div class="baseFlag"></div>
        <div class="baseWall"></div>
        <div id="playerGun" class="baseGun"></div>
    </div>

    <div id="enemyBase" class="base">
        <div class="baseFlag"></div>
        <div class="baseWall"></div>
        <div id="enemyGun" class="baseGun"></div>
    </div>

    <div id="waveWarning"></div>

</div>

<div id="controls">

    <button id="unit1"></button>
    <button id="unit2"></button>
    <button id="unit3"></button>

    <button id="specialBtn">
        💥 ARTILLERIE
        <br>
        <small>BEREIT</small>
    </button>

    <button id="ageBtn">
        ⬆ ZEITALTER
    </button>

    <button id="saveBtn">
        💾 SPEICHERN
    </button>

    <button id="loadBtn">
        📂 LADEN
    </button>

</div>

<div id="message">
    <h2 id="messageTitle"></h2>
    <p id="messageText"></p>
    <button onclick="restartGame()">🔄 NEUES SPIEL</button>
</div>

<script>

/* =========================
   GRUNDWERTE
========================= */

let gold=700;

let playerHP=5000;
let enemyHP=5000;

const maxBaseHP=5000;

let age=0;
let wave=1;

let waveTimer=24;

let gameOver=false;

let lastTime=performance.now();

let specialCooldown=0;

let playerBaseTimer=1;
let enemyBaseTimer=1;

let units=[];
let projectiles=[];


/* =========================

========================= */

const ages=[

/* =========================
   HUD
========================= */

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}

function updateHUD(){

    document.getElementById("gold").textContent=
        Math.floor(gold);

    document.getElementById("wave").textContent=
        wave;

    document.getElementById("age").textContent=
        ages[age].name;

    document.getElementById("playerHPText").textContent=
        `${Math.ceil(Math.max(0,playerHP))} / ${maxBaseHP}`;

    document.getElementById("enemyHPText").textContent=
        `${Math.ceil(Math.max(0,enemyHP))} / ${maxBaseHP}`;

    document.getElementById("playerHPBar").style.width=
        clamp(playerHP/maxBaseHP*100,0,100)+"%";

    document.getElementById("enemyHPBar").style.width=
        clamp(enemyHP/maxBaseHP*100,0,100)+"%";

    document.getElementById("waveTimer").textContent=
        Math.ceil(waveTimer);

    updateButtons();
}


/* =========================
   BUTTONS
========================= */

function updateButtons(){

    for(let i=0;i<3;i++){

        const button=
            document.getElementById("unit"+(i+1));

        const unit=
            ages[age].units[i];

        button.innerHTML=
            `${unit.icon} ${unit.name}<br>
             <small>${unit.cost} Gold</small>`;

        button.disabled=
            gameOver ||
            gold<unit.cost;
    }

    const ageButton=
        document.getElementById("ageBtn");

    if(age>=ages.length-1){

        ageButton.innerHTML=
            "🏆 MAXIMALES ZEITALTER";

        ageButton.disabled=true;

    }else{

        const next=
            ages[age+1];

        ageButton.innerHTML=
            `⬆ ${next.name}<br>
             <small>${next.upgradeCost} Gold | Welle ${next.requiredWave}</small>`;

        ageButton.disabled=
            gameOver ||
            gold<next.upgradeCost ||
            wave<next.requiredWave;
    }

    const special=
        document.getElementById("specialBtn");

    if(specialCooldown<=0){

        special.innerHTML=
            `💥 ARTILLERIE<br>
             <small>BEREIT</small>`;

        special.disabled=gameOver;

    }else{

        special.innerHTML=
            `💥 ARTILLERIE<br>
             <small>${specialCooldown.toFixed(1)} s</small>`;

        special.disabled=true;
    }
}


/* =========================
   EINHEIT ERSTELLEN
========================= */

function createUnit(player,index){

    const data=
        ages[age].units[index];

    if(player && gold<data.cost)
        return;

    if(player)
        gold-=data.cost;

    const unit={

        id:Date.now()+Math.random(),

        player,

        x:player
            ?120
            :window.innerWidth-120,

        hp:data.hp,
        maxHp:data.hp,

        damage:data.damage,
        speed:data.speed,
        range:data.range,

        attackCooldown:data.attack,
        attackTimer:0,

        baseDamage:data.baseDamage,

        type:data.type,

        target:null,

        element:null
    };

    const el=
        document.createElement("div");

    el.className=
        `unit ${player?"player":"enemy"} ${data.type}`;

    el.innerHTML=`

        <div class="unitbar">
            <div class="unitfill"></div>
        </div>

        <div class="head"></div>
        <div class="body"></div>

        <div class="leg one"></div>
        <div class="leg two"></div>

        ${data.type==="warrior"?`
            <div class="shield"></div>
            <div class="sword"></div>
        `:""}

        ${data.type==="archer"?`
            <div class="bow"></div>
            <div class="arrowHeld"></div>
        `:""}

        ${data.type==="heavy"?`
            <div class="hammer"></div>
        `:""}
    `;

    battlefield.appendChild(el);

    unit.element=el;

    units.push(unit);

    updateUnitVisual(unit);
}


/* =========================
   KAUF
========================= */

function buyUnit(index){

    if(gameOver)
        return;

    createUnit(true,index);

    updateHUD();
}

document.getElementById("unit1").onclick=
    ()=>buyUnit(0);

document.getElementById("unit2").onclick=
    ()=>buyUnit(1);

document.getElementById("unit3").onclick=
    ()=>buyUnit(2);


/* =========================
   VISUAL
========================= */

function updateUnitVisual(unit){

    if(!unit.element)
        return;

    unit.element.style.left=
        unit.x+"px";

    const fill=
        unit.element.querySelector(".unitfill");

    if(fill){

        fill.style.width=
            clamp(
                unit.hp/unit.maxHp*100,
                0,
                100
            )+"%";
    }
}


/* =========================
   ZIEL
========================= */

function findTarget(unit){

    let closest=null;
    let best=Infinity;

    for(const other of units){

        if(other.player===unit.player)
            continue;

        if(other.hp<=0)
            continue;

        const d=
            Math.abs(unit.x-other.x);

        if(
            d<=unit.range &&
            d<best
        ){

            best=d;
            closest=other;
        }
    }

    return closest;
}


/* =========================
   KAMPF
========================= */

function attackUnit(unit,target){

    if(unit.attackTimer>0)
        return;

    unit.attackTimer=
        unit.attackCooldown;

    if(unit.type==="archer"){

        createArrow(
            unit,
            target,
            unit.damage
        );

    }else{

        target.hp-=unit.damage;

        createHit(
            target.x,
            145
        );
    }
}


/* =========================
   PFEILE
========================= */

function createArrow(attacker,target,damage){

    const projectile={

        x:attacker.x,
        y:145,

        target,

        speed:440,
        damage,

        type:"arrow",
        element:null
    };

    const el=
        document.createElement("div");

    el.className="projectile";

    battlefield.appendChild(el);

    projectile.element=el;

    projectiles.push(projectile);
}

function createCannonProjectile(
    x,y,target,damage
){

    const projectile={

        x,y,

        target,

        speed:330,
        damage,

        type:"cannon",
        element:null
    };

    const el=
        document.createElement("div");

    el.className=
        "projectile cannonProjectile";

    battlefield.appendChild(el);

    projectile.element=el;

    projectiles.push(projectile);
}


/* =========================
   PROJEKTILE
========================= */

function updateProjectiles(dt){

    for(
        let i=projectiles.length-1;
        i>=0;
        i--
    ){

        const p=
            projectiles[i];

        if(
            !p.target ||
            p.target.hp<=0
        ){

            p.element.remove();

            projectiles.splice(i,1);

            continue;
        }

        const dx=
            p.target.x-p.x;

        const dy=
            145-p.y;

        const dist=
            Math.sqrt(dx*dx+dy*dy);

        if(dist<16){

            p.target.hp-=p.damage;

            createHit(
                p.target.x,
                145
            );

            p.element.remove();

            projectiles.splice(i,1);

            continue;
        }

        p.x+=
            dx/dist*p.speed*dt;

        p.y+=
            dy/dist*p.speed*dt;

        p.element.style.left=
            p.x+"px";

        p.element.style.top=
            p.y+"px";

        p.element.style.transform=
            `rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)`;
    }
}


/* =========================
   TREFFER
========================= */

function createHit(x,y){

    const hit=
        document.createElement("div");

    hit.className="hit";

    hit.style.left=
        (x-14)+"px";

    hit.style.top=
        (y-14)+"px";

    battlefield.appendChild(hit);

    setTimeout(
        ()=>hit.remove(),
        350
    );
}


/* =========================
   BASISVERTEIDIGUNG
========================= */

function baseDefense(dt){

    playerBaseTimer-=dt;
    enemyBaseTimer-=dt;

    if(playerBaseTimer<=0){

        let target=null;
        let best=Infinity;

        for(const u of units){

            if(!u.player && u.hp>0){

                const d=
                    Math.abs(u.x-70);

                if(
                    d<ages[age].baseRange &&
                    d<best
                ){

                    best=d;
                    target=u;
                }
            }
        }

        if(target){

            createCannonProjectile(
                70,
                360,
                target,
                ages[age].baseDamage
            );

            playerBaseTimer=1.45;

            rotateGun(
                document.getElementById("playerGun"),
                target.x-70
            );
        }
    }

    if(enemyBaseTimer<=0){

        let target=null;
        let best=Infinity;

        for(const u of units){

            if(u.player && u.hp>0){

                const d=
                    Math.abs(
                        u.x-
                        (window.innerWidth-70)
                    );

                if(
                    d<360 &&
                    d<best
                ){

                    best=d;
                    target=u;
                }
            }
        }

        if(target){

            const enemyDamage=
                38+
                age*7+
                Math.floor(wave/10)*5;

            createCannonProjectile(
                window.innerWidth-70,
                360,
                target,
                enemyDamage
            );

            enemyBaseTimer=1.75;

            rotateGun(
                document.getElementById("enemyGun"),
                target.x-
                (window.innerWidth-70)
            );
        }
    }
}

function rotateGun(gun,difference){

    const angle=
        clamp(
            difference/8,
            -45,
            45
        );

    gun.style.transform=
        `rotate(${angle}deg)`;
}


/* =========================
   EINHEITEN UPDATE
========================= */

function updateUnits(dt){

    for(const unit of units){

        if(unit.hp<=0)
            continue;

        unit.attackTimer-=dt;

        const target=
            findTarget(unit);

        unit.target=target;

        if(target){

            const d=
                Math.abs(
                    unit.x-target.x
                );

            if(d<=unit.range){

                attackUnit(
                    unit,
                    target
                );

            }else{

                moveUnit(
                    unit,
                    dt
                );
            }

        }else{

            const baseX=
                unit.player
                ?window.innerWidth-75
                :75;

            const direction=
                unit.player
                ?1
                :-1;

            if(
                Math.abs(
                    unit.x-baseX
                )>55
            ){

                unit.x+=
                    direction*
                    unit.speed*
                    dt;

            }else{

                if(unit.attackTimer<=0){

                    if(unit.player){

                        enemyHP-=
                            unit.baseDamage;

                    }else{

                        playerHP-=
                            unit.baseDamage;
                    }

                    unit.attackTimer=.65;
                }
            }
        }

        unit.x=
            clamp(
                unit.x,
                45,
                window.innerWidth-45
            );

        updateUnitVisual(unit);
    }
}


/* =========================
   BEWEGUNG
========================= */

function moveUnit(unit,dt){

    const direction=
        unit.player
        ?1
        :-1;

    unit.x+=
        direction*
        unit.speed*
        dt;
}


/* =========================
   GEFALLENE
========================= */

function removeDeadUnits(){

    for(
        let i=units.length-1;
        i>=0;
        i--
    ){

        const unit=
            units[i];

        if(unit.hp<=0){

            createHit(
                unit.x,
                145
            );

            if(!unit.player){

                let reward=28;

                if(unit.type==="archer")
                    reward=42;

                if(unit.type==="heavy")
                    reward=75;

                gold+=reward;
            }

            if(unit.element)
                unit.element.remove();

            units.splice(i,1);
        }
    }
}


/* =========================
   FEINDWELLE
========================= */

function startWave(){

    if(gameOver)
        return;

    showWaveWarning(
        `⚠ FEINDWELLE ${wave}`
    );

    /*
       Frühere Wellen sind bewusst
       etwas kleiner.
    */

    let amount;

    if(wave<=3){

        amount=3+wave;

    }else if(wave<=8){

        amount=5+Math.floor(wave*.5);

    }else{

        amount=
            8+
            Math.floor(wave*.7);
    }

    const delay=
        wave<4
        ?4.8
        :wave<9
        ?3.8
        :wave<16
        ?3.0
        :2.5;

    for(let i=0;i<amount;i++){

        setTimeout(
            ()=>{
                if(!gameOver)
                    spawnEnemy();
            },
            i*delay*1000
        );
    }

    if(wave%10===0){

        setTimeout(
            ()=>{
                if(!gameOver)
                    spawnBoss();
            },
            amount*delay*1000+700
        );
    }
}


/* =========================
   FEINDE
========================= */

function spawnEnemy(){

    let type="warrior";

    const roll=
        Math.random();

    if(
        wave>=3 &&
        roll>.70
    )
        type="archer";

    if(
        wave>=7 &&
        roll>.86
    )
        type="heavy";

    if(
        wave>=12 &&
        roll>.95
    )
        type="siege";

    const scale=
        1+
        (wave-1)*.085;

    const data={

        warrior:{
            hp:120,
            damage:14,
            speed:22,
            range:45,
            attack:1.1,
            baseDamage:.7
        },

        archer:{
            hp:88,
            damage:22,
            speed:18,
            range:210,
            attack:1.7,
            baseDamage:.4
        },

        heavy:{
            hp:320,
            damage:36,
            speed:10,
            range:50,
            attack:1.8,
            baseDamage:1.7
        },

        siege:{
            hp:620,
            damage:60,
            speed:7,
            range:330,
            attack:2.8,
            baseDamage:4
        }

    }[type];

    const unit={

        id:Date.now()+Math.random(),

        player:false,

        x:window.innerWidth-120,

        hp:data.hp*scale,
        maxHp:data.hp*scale,

        damage:
            data.damage*
            (1+(wave-1)*.04),

        speed:data.speed,
        range:data.range,

        attackCooldown:data.attack,
        attackTimer:0,

        baseDamage:
            data.baseDamage*
            (1+(wave-1)*.022),

        type:
            type==="siege"
            ?"heavy"
            :type,

        target:null,
        element:null
    };

    const el=
        document.createElement("div");

    el.className=
        `unit enemy ${unit.type}`;

    el.innerHTML=`

        <div class="unitbar">
            <div class="unitfill"></div>
        </div>

        <div class="head"></div>
        <div class="body"></div>

        <div class="leg one"></div>
        <div class="leg two"></div>

        ${unit.type==="warrior"?`
            <div class="shield"></div>
            <div class="sword"></div>
        `:""}

        ${unit.type==="archer"?`
            <div class="bow"></div>
            <div class="arrowHeld"></div>
        `:""}

        ${unit.type==="heavy"?`
            <div class="hammer"></div>
        `:""}
    `;

    battlefield.appendChild(el);

    unit.element=el;

    units.push(unit);

    updateUnitVisual(unit);
}


/* =========================
   BOSS
========================= */

function spawnBoss(){

    const hp=
        1700+
        wave*115;

    const boss={

        id:Date.now()+Math.random(),

        player:false,

        x:window.innerWidth-120,

        hp,
        maxHp:hp,

        damage:90+wave*3,

        speed:6,
        range:60,

        attackCooldown:2.1,
        attackTimer:0,

        baseDamage:8+wave*.2,

        type:"heavy",

        target:null,
        element:null
    };

    const el=
        document.createElement("div");

    el.className=
        "unit enemy heavy";

    el.innerHTML=`

        <div class="unitbar">
            <div class="unitfill"></div>
        </div>

        <div class="head"></div>
        <div class="body"></div>

        <div class="leg one"></div>
        <div class="leg two"></div>

        <div class="hammer"></div>
    `;

    battlefield.appendChild(el);

    boss.element=el;

    units.push(boss);

    showWaveWarning(
        "👑 BOSS-ANGRIFF!"
    );

    updateUnitVisual(boss);
}


/* =========================
   ARTILLERIE
========================= */

function artillery(){

    if(
        gameOver ||
        specialCooldown>0
    )
        return;

    specialCooldown=15;

    const enemies=
        units.filter(
            u=>!u.player && u.hp>0
        );

    for(const enemy of enemies){

        enemy.hp-=240;

        createExplosion(
            enemy.x,
            145
        );
    }

    updateHUD();
}

document.getElementById("specialBtn")
    .onclick=artillery;

function createExplosion(x,y){

    const el=
        document.createElement("div");

    el.className="explosion";

    el.style.left=
        (x-32)+"px";

    el.style.top=
        (y-32)+"px";

    battlefield.appendChild(el);

    setTimeout(
        ()=>el.remove(),
        500
    );
}


/* =========================
   ZEITALTER
========================= */

function upgradeAge(){

    if(gameOver)
        return;

    if(age>=ages.length-1)
        return;

    const next=
        ages[age+1];

    if(wave<next.requiredWave){

        showMessage(
            "ZEITALTER GESPERRT",
            `Du brauchst mindestens Welle ${next.requiredWave}.`
        );

        return;
    }

    if(gold<next.upgradeCost){

        showMessage(
            "NICHT GENUG GOLD",
            `Du brauchst ${next.upgradeCost} Gold.`
        );

        return;
    }

    gold-=next.upgradeCost;

    age++;

    playerBaseTimer=.3;

    showWaveWarning(
        `⬆ ${ages[age].name} ERREICHT!`
    );

    updateHUD();
}

document.getElementById("ageBtn")
    .onclick=upgradeAge;


/* =========================
   SPEICHERN
========================= */

function saveGame(){

    const save={
        gold,
        playerHP,
        enemyHP,
        age,
        wave
    };

    localStorage.setItem(
        "battleAgesSave",
        JSON.stringify(save)
    );

    showMessage(
        "GESPEICHERT",
        "Dein Spielstand wurde gespeichert."
    );
}

document.getElementById("saveBtn")
    .onclick=saveGame;


/* =========================
   LADEN
========================= */

function loadGame(){

    const saved=
        localStorage.getItem(
            "battleAgesSave"
        );

    if(!saved){

        showMessage(
            "KEIN SPIELSTAND",
            "Es wurde noch kein Spielstand gespeichert."
        );

        return;
    }

    const data=
        JSON.parse(saved);

    gold=data.gold;
    playerHP=data.playerHP;
    enemyHP=data.enemyHP;
    age=data.age;
    wave=data.wave;

    updateHUD();

    showMessage(
        "GELADEN",
        "Der Spielstand wurde geladen."
    );
}

document.getElementById("loadBtn")
    .onclick=loadGame;


/* =========================
   GOLD-SYSTEM
========================= */

function generateGold(dt){

    /*
       Deutlich höheres Einkommen als vorher.
       Dadurch kann der Spieler mehrere
       Einheiten gleichzeitig aufbauen.
    */

    let income=8;

    if(age===1)
        income=11;

    if(age===2)
        income=15;

    if(age===3)
        income=20;

    if(age===4)
        income=27;

    gold+=income*dt;

    gold=
        Math.min(
            gold,
            99999
        );
}


/* =========================
   SPIELENDE
========================= */

function checkGameOver(){

    if(enemyHP<=0){

        enemyHP=0;

        gameOver=true;

        showMessage(
            "🏆 SIEG!",
            `Die feindliche Basis wurde in Welle ${wave} zerstört.`
        );
    }

    if(playerHP<=0){

        playerHP=0;

        gameOver=true;

        showMessage(
            "💀 NIEDERLAGE",
            `Deine Basis wurde in Welle ${wave} zerstört.`
        );
    }
}


/* =========================
   NEUSTART
========================= */

function restartGame(){

    location.reload();
}


/* =========================
   HAUPTSCHLEIFE
========================= */

function gameLoop(now){

    const dt=
        Math.min(
            (now-lastTime)/1000,
            .05
        );

    lastTime=now;

    if(!gameOver){

        generateGold(dt);

        specialCooldown=
            Math.max(
                0,
                specialCooldown-dt
            );

        waveTimer-=dt;

        if(waveTimer<=0){

            startWave();

            wave++;

            /*
               Die Wellen kommen später
               etwas schneller.
            */

            waveTimer=
                Math.max(
                    18,
                    30-wave*.28
                );
        }

        updateUnits(dt);

        updateProjectiles(dt);

        baseDefense(dt);

        removeDeadUnits();

        checkGameOver();

        updateHUD();
    }

    requestAnimationFrame(gameLoop);
}


/* =========================
   TASTATUR
========================= */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="1")
            buyUnit(0);

        if(e.key==="2")
            buyUnit(1);

        if(e.key==="3")
            buyUnit(2);

        if(e.key.toLowerCase()==="q")
            artillery();

        if(e.key.toLowerCase()==="e")
            upgradeAge();
    }
);


/* =========================
   START
========================= */

updateHUD();

startWave();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
