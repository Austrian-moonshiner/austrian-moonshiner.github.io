<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snake</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .game-container {
        width: 100%;
        max-width: 500px;
        text-align: center;
    }

    h1 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 36px;
    }

    .score {
        font-size: 20px;
        margin-bottom: 15px;
    }

    canvas {
        width: 100%;
        max-width: 500px;
        height: auto;
        background: #1b1b1b;
        border: 4px solid #fff;
        border-radius: 10px;
        display: block;
        margin: auto;
    }

    #message {
        margin-top: 15px;
        font-size: 20px;
        min-height: 28px;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        margin: 6px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        background: #fff;
        color: #111;
    }

    button:hover {
        transform: scale(1.05);
    }

    .controls {
        margin-top: 15px;
        display: grid;
        grid-template-columns: repeat(3, 60px);
        justify-content: center;
        gap: 6px;
    }

    .controls button {
        width: 60px;
        height: 55px;
        margin: 0;
        padding: 0;
        font-size: 24px;
    }

    .empty {
        visibility: hidden;
    }

    .instructions {
        margin-top: 15px;
        font-size: 14px;
        color: #bbb;
        line-height: 1.5;
    }
</style>
</head>

<body>

<div class="game-container">

    <h1>🐍 Snake</h1>

    <div class="score">
        Punkte: <span id="score">0</span>
        &nbsp; | &nbsp;
        Rekord: <span id="highscore">0</span>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="message">
        Drücke Start zum Spielen!
    </div>

    <button onclick="startGame()">Start / Neustart</button>

    <div class="controls">
        <button class="empty"></button>
        <button onclick="changeDirection('up')">⬆️</button>
        <button class="empty"></button>

        <button onclick="changeDirection('left')">⬅️</button>
        <button onclick="changeDirection('down')">⬇️</button>
        <button onclick="changeDirection('right')">➡️</button>
    </div>

    <div class="instructions">
        Steuerung am PC: Pfeiltasten<br>
        Auf dem Handy: Buttons verwenden
    </div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const highscoreElement = document.getElementById("highscore");
const messageElement = document.getElementById("message");

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake;
let food;
let direction;
let nextDirection;
let score = 0;
let gameRunning = false;
let gameLoop;

let highscore = localStorage.getItem("snakeHighscore") || 0;
highscoreElement.textContent = highscore;


// Spiel starten
function startGame() {

    clearInterval(gameLoop);

    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    direction = "right";
    nextDirection = "right";

    score = 0;
    scoreElement.textContent = score;

    messageElement.textContent = "Viel Glück!";

    createFood();

    gameRunning = true;

    gameLoop = setInterval(updateGame, 110);
}


// Spiel aktualisieren
function updateGame() {

    direction = nextDirection;

    const head = {
        x: snake[0].x,
        y: snake[0].y
    };


    // Bewegung
    if (direction === "up") {
        head.y--;
    }

    if (direction === "down") {
        head.y++;
    }

    if (direction === "left") {
        head.x--;
    }

    if (direction === "right") {
        head.x++;
    }


    // Wand-Kollision
    if (
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount
    ) {
        gameOver();
        return;
    }


    // Körper-Kollision
    for (let i = 0; i < snake.length; i++) {

        if (
            head.x === snake[i].x &&
            head.y === snake[i].y
        ) {
            gameOver();
            return;
        }
    }


    snake.unshift(head);


    // Essen gegessen
    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;
        scoreElement.textContent = score;

        if (score > highscore) {
            highscore = score;
            localStorage.setItem("snakeHighscore", highscore);
            highscoreElement.textContent = highscore;
        }

        createFood();

    } else {

        snake.pop();

    }


    drawGame();
}


// Spielfeld zeichnen
function drawGame() {

    // Hintergrund
    ctx.fillStyle = "#1b1b1b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);


    // Raster
    ctx.strokeStyle = "#252525";
    ctx.lineWidth = 1;

    for (let i = 0; i <= canvas.width; i += gridSize) {

        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
    }


    // Snake
    snake.forEach((part, index) => {

        if (index === 0) {
            ctx.fillStyle = "#7CFC00";
        } else {
            ctx.fillStyle = "#32CD32";
        }

        ctx.fillRect(
            part.x * gridSize + 1,
            part.y * gridSize + 1,
            gridSize - 2,
            gridSize - 2
        );
    });


    // Augen des Kopfes
    const head = snake[0];

    ctx.fillStyle = "#111";

    let eye1;
    let eye2;

    if (direction === "right") {
        eye1 = { x: 14, y: 5 };
        eye2 = { x: 14, y: 14 };
    }

    if (direction === "left") {
        eye1 = { x: 5, y: 5 };
        eye2 = { x: 5, y: 14 };
    }

    if (direction === "up") {
        eye1 = { x: 5, y: 5 };
        eye2 = { x: 14, y: 5 };
    }

    if (direction === "down") {
        eye1 = { x: 5, y: 14 };
        eye2 = { x: 14, y: 14 };
    }

    ctx.fillRect(
        head.x * gridSize + eye1.x,
        head.y * gridSize + eye1.y,
        3,
        3
    );

    ctx.fillRect(
        head.x * gridSize + eye2.x,
        head.y * gridSize + eye2.y,
        3,
        3
    );


    // Apfel
    ctx.fillStyle = "#ff3333";

    ctx.beginPath();

    ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Apfelstiel
    ctx.fillStyle = "#8B4513";

    ctx.fillRect(
        food.x * gridSize + 9,
        food.y * gridSize + 2,
        3,
        5
    );
}


// Neues Essen erzeugen
function createFood() {

    let validPosition = false;

    while (!validPosition) {

        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };

        validPosition = true;

        for (let part of snake) {

            if (
                part.x === food.x &&
                part.y === food.y
            ) {
                validPosition = false;
                break;
            }
        }
    }
}


// Richtung ändern
function changeDirection(newDirection) {

    if (!gameRunning) {
        return;
    }

    if (
        newDirection === "up" &&
        direction !== "down"
    ) {
        nextDirection = "up";
    }

    if (
        newDirection === "down" &&
        direction !== "up"
    ) {
        nextDirection = "down";
    }

    if (
        newDirection === "left" &&
        direction !== "right"
    ) {
        nextDirection = "left";
    }

    if (
        newDirection === "right" &&
        direction !== "left"
    ) {
        nextDirection = "right";
    }
}


// Tastatursteuerung
document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp") {
        event.preventDefault();
        changeDirection("up");
    }

    if (event.key === "ArrowDown") {
        event.preventDefault();
        changeDirection("down");
    }

    if (event.key === "ArrowLeft") {
        event.preventDefault();
        changeDirection("left");
    }

    if (event.key === "ArrowRight") {
        event.preventDefault();
        changeDirection("right");
    }

});


// Game Over
function gameOver() {

    gameRunning = false;

    clearInterval(gameLoop);

    messageElement.textContent =
        "Game Over! Punkte: " + score;

    drawGame();
}


// Startbildschirm
ctx.fillStyle = "#1b1b1b";
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.fillStyle = "white";
ctx.font = "bold 28px Arial";
ctx.textAlign = "center";

ctx.fillText(
    "🐍 SNAKE",
    canvas.width / 2,
    canvas.height / 2 - 10
);

ctx.font = "16px Arial";

ctx.fillText(
    "Drücke Start",
    canvas.width / 2,
    canvas.height / 2 + 25
);

</script>

</body>
</html>
